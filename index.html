            <div style={{height:'100%',width:((step+1)/steps.length*100)+'%',background:'var(--accent)',borderRadius:4,transition:'width .25s'}} />
          </div>
          <span style={{fontSize:fsr(11),fontWeight:800,color:'var(--muted)',letterSpacing:'.05em',whiteSpace:'nowrap'}}>
            {t.tutStepWord} {step+1} {t.tutOfWord} {steps.length}
          </span>
        </div>

        <p style={{fontSize:fsr(19),fontWeight:800,color:'var(--ink)',marginBottom:6,lineHeight:1.25}}>{cur.title}</p>
        {cur.body && <p style={{fontSize:fsr(15),color:'var(--ink2)',marginBottom:11,lineHeight:1.5}}>{cur.body}</p>}

        {cur.action && (
          <div style={{display:'flex',alignItems:'center',gap:9,background:'var(--surface2)',borderRadius:12,
            padding:'9px 11px',marginBottom:11}}>
            <span style={{animation:'tutNudge 1.1s ease-in-out infinite',display:'flex'}}><Icon name="chevronDown" size={19} strokeWidth={2.6} /></span>
            <span style={{fontSize:fsr(14),fontWeight:700,color:'var(--accent)',lineHeight:1.35}}>{cur.hint||t.tutActionHint}</span>
          </div>
        )}

        <div className="flex gap-3" style={{alignItems:'center'}}>
          {step>0 && <button onClick={back} className="btn btn-ghost" style={{flex:1}}>{t.tutBack}</button>}
          {!cur.action && <button onClick={next} className="btn btn-accent" style={{flex:2}}>{last?t.tutDone:t.tutNext}</button>}
        </div>

        <button onClick={onDone} style={{width:'100%',marginTop:6,padding:'6px',background:'none',border:'none',
          color:'var(--muted)',fontSize:fsr(13),fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',
          textDecoration:'underline'}}>
          {t.tutSkip}
        </button>
      </div>
    </div>
  );
}

/* ── SIMPLE LAYOUT: MONEY ───────────────────────────────────────
   Everything that moved, in one place. The classic layout splits this across
   a Pay tab and a Records tab, which asks the user to know that an advance is
   filed under Records rather than Pay — a distinction the app understands and
   nobody else does. Both screens are reused unchanged behind one switch. */
function MoneyTab({lang,homeId,homes,workingDays,syncKey,refreshKey,defaultStaffId}){
  var t=T[lang];
  var [view,setView]=useState(defaultStaffId?'pay':'records');
  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <div className="flex gap-2 px-4 pt-3 shrink-0">
        {[['records','records',t.moneyRecords],['pay','card',t.moneyPay]].map(function(o){
          var on=view===o[0];
          return (
            <button key={o[0]} onClick={function(){setView(o[0]);}}
              style={{flex:1,padding:'11px',borderRadius:12,cursor:'pointer',fontFamily:'Nunito,sans-serif',
                fontWeight:800,fontSize:fsr(14),minHeight:46,
                display:'flex',alignItems:'center',justifyContent:'center',gap:8,
                border:on?'2px solid var(--accent)':'2px solid var(--border)',
                background:on?'var(--accent)':'var(--surface)',color:on?'#fff':'var(--ink2)'}}>
              <Icon name={o[1]} size={20} />{o[2]}
            </button>
          );
        })}
      </div>
      {view==='records'
        ? <AdvancesTab key={homeId} lang={lang} homeId={homeId} homes={homes} workingDays={workingDays} syncKey={syncKey} />
        : <SalaryTab key={homeId+'-'+refreshKey+'-'+defaultStaffId} lang={lang} homeId={homeId} homes={homes}
            refreshKey={refreshKey} workingDays={workingDays} syncKey={syncKey} defaultStaffId={defaultStaffId} />
      }
    </div>
  );
}

/* ── SIMPLE LAYOUT: REPORTS ─────────────────────────────────────
   The payoff for all that recording, which the classic layout files in the
   menu next to Feedback. Annual and the export belong together: both answer
   "what did the year come to". */
function ReportsTab({lang,homeId,workingDays,syncKey}){
  var t=T[lang];
  var mc=React.useContext(MembersCtx);
  var [busy,setBusy]=useState('');
  function run(period){
    setBusy(period);
    exportReport(homeId,period,lang,mc.members,workingDays,function(){setBusy('');});
  }
  return (

/* ── VOICE ENTRY, REACHABLE FROM ANYWHERE ───────────────────────
   Speaking an entry is the fastest way into this app and the one least
   dependent on eyesight, yet it sat as a line in the menu, two taps deep and
   behind an icon most people never open. It now has a button of its own on
   every working screen.

   It opens a sheet rather than switching tabs: whoever taps it is in the
   middle of something, and a tab change would lose their place. The sheet
   holds the same VoiceTab the menu opens, not a second copy of it — two
   implementations of the same flow would drift apart within a month.

   It does not start listening on tap. A microphone that opens already
   recording turns every mis-tap into a recording nobody asked for. */
function VoiceSheet({open,onClose,lang,homeId,homes,workingDays,syncKey,onSaved}){
  var t=T[lang];
  if(!open) return null;
  return (
    <div onClick={onClose}
      style={{position:'fixed',inset:0,zIndex:60,background:'rgba(26,46,42,.45)',
        display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
      <div onClick={function(e){e.stopPropagation();}}
        className="fade-in"
        style={{width:'100%',maxWidth:480,background:'var(--surface)',
          borderTopLeftRadius:22,borderTopRightRadius:22,
          maxHeight:'88vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div className="shrink-0" style={{padding:'10px 16px 8px',borderBottom:'1px solid var(--border)'}}>
          <div style={{width:44,height:5,borderRadius:3,background:'var(--border)',margin:'0 auto 10px'}} />
          <div className="flex items-center gap-2">
            <span style={{color:'var(--accent)',display:'flex'}}><Icon name="mic" size={22} /></span>
            <p style={{flex:1,fontSize:fsr(17),fontWeight:800,color:'var(--ink)',margin:0}}>{t.voiceTitle}</p>
            <button onClick={onClose} aria-label={t.cancel}
              className="rounded-full flex items-center justify-center"
              style={{minWidth:40,minHeight:40,background:'var(--surface2)',border:'none',
                cursor:'pointer',color:'var(--ink2)'}}>
              <Icon name="close" size={20} />
            </button>
          </div>
        </div>
        <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column'}}>
          <VoiceTab lang={lang} homeId={homeId} homes={homes} workingDays={workingDays}
            syncKey={syncKey} compact={true} onSaved={onSaved} />
        </div>
      </div>
    </div>
  );
}

/* Anchored inside the nav bar, floating just above it. The page scrolls at
   document level here rather than inside an inner pane, so a button placed in
   the content area simply scrolled off the bottom; the nav is the one thing
   already pinned to the bottom of the screen. Riding on it also keeps the
   button with the 480px app column on a wide screen instead of flying out to
   the edge of the window, and lifts it correctly when the font size grows. */

function AuthScreen({lang,onGuest,onAuth}){
  var t=T[lang];

  var [phone,setPhone]=useState('');
  var [otp,setOtp]=useState('');
  var [loading,setLoading]=useState(false);
  var [error,setError]=useState('');
  var [confirmResult,setConfirmResult]=useState(null);
  var rcRef=useRef(null);

  function sendOTP(){
    setError(''); setLoading(true);
    var num=phone.startsWith('+')?phone:'+91'+phone;
    if(!rcRef.current){
      rcRef.current=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'invisible'});
    }
    firebase.auth().signInWithPhoneNumber(num,rcRef.current)
      .then(function(res){setConfirmResult(res);setMode('otp');setLoading(false);})
      .catch(function(){
        setError(t.authError);setLoading(false);
        if(rcRef.current){rcRef.current.clear();rcRef.current=null;}
      });
  }
  function verifyOTP(){
    setError(''); setLoading(true);
    confirmResult.confirm(otp)
      .then(function(res){onAuth(res.user);})
      .catch(function(){setError(t.authError);setLoading(false);});
  }
  function signInGoogle(){
    setLoading(true);
    firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .then(function(res){onAuth(res.user);})
      .catch(function(){setError(t.authError);setLoading(false);});
  }

  return (
    <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',flexDirection:'column'}}>

              <FLabel label={t.phoneNum}>
                <FInput type="tel" value={phone} onChange={setPhone} placeholder="10-digit mobile number" />
              </FLabel>
              <div id="recaptcha-container" />
              <button className="btn btn-accent btn-full" disabled={phone.replace(/\D/g,'').length<10||loading}

                style={{width:'100%',marginTop:8,padding:'10px',background:'none',border:'none',color:'var(--ink2)',cursor:'pointer',fontSize:fsr(14),fontWeight:700,fontFamily:'Nunito,sans-serif'}}>

        <div style={{textAlign:'center',margin:'0 0 16px',color:'var(--muted)',fontSize:fsr(13)}}>— or —</div>

function InviteCard({lang,homeId,homes}){

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(e){return {err:e};}
  render(){
    if(this.state.err){
      return (
        <div style={{padding:20}}>
          <h2 style={{color:'#dc2626',fontSize:fsr(18),fontWeight:700}}>Something went wrong / कुछ गलत हो गया</h2>
          <p style={{color:'#991b1b',fontSize:fsr(14),marginTop:8}}>{this.state.err.message}</p>
          <button onClick={function(){window.location.reload();}} style={{marginTop:16,padding:'8px 16px',background:'var(--accent)',color:'#fff',border:'none',borderRadius:8,fontSize:fsr(14),cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
            Reload App / फिर लोड करें
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function App(){
  var [ready,setReady]=useState(false);
  var [lang,setLang]=useState('en');
  var [homes,setHomes]=useState([]);
  var [homeId,setHomeId]=useState('');
  var [tab,setTab]=useState('home');
  var [layout,setLayout]=useState(function(){return getSettings().layout||'classic';});
  var [voiceOpen,setVoiceOpen]=useState(false);
  var micSupported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  /* The simple layout has fewer, broader destinations, so several classic tab
     keys have no bar of their own there. Everything still routes — the keys
     are mapped to whichever tab now contains them, rather than each caller
     having to know the current layout. */
  function goTab(key,staffId){
    var k=key;
    if(layout==='simple'){
      if(k==='salary'||k==='adv') k='money';
      else if(k==='annual') k='reports';
    }
    setTab(k);
    if(staffId!==undefined) setPreselectSalaryStaff(staffId||'');
  }
  var [staffKey,setStaffKey]=useState(0);
  var [preselectSalaryStaff,setPreselectSalaryStaff]=useState('');
  var [workingDays,setWorkingDays]=useState(30);
  var [fontSz,setFontSz]=useState('normal');
  var [menuOpen,setMenuOpen]=useState(false);
  var [showTutorial,setShowTutorial]=useState(false);
  /* cloud state */
  var [user,setUser]=useState(undefined);   /* undefined=checking, null=no user */
  var [guestMode,setGuestMode]=useState(false);
  var [syncKey,setSyncKey]=useState(0);
  var [needsHome,setNeedsHome]=useState(false);
  var [migrating,setMigrating]=useState(false);
  var [members,setMembers]=useState({});

  useEffect(function(){ applyFontSz(fontSz); },[fontSz]);

  /* Keep the untouched sample records in step with the interface language.
     Catches both language toggles and installs seeded by an older build.
     Guest only — a cloud household is shared, so one member switching
     language must not rewrite the names everyone else sees. */
  useEffect(function(){
    if(!guestMode) return;
    if(localizeDemoData(lang)){
      setHomes(getHomes());
      setSyncKey(function(k){return k+1;});
    }
  },[lang,guestMode]);

  /* ── primary init ── */
  useEffect(function(){
    if(!FIREBASE_ENABLED){
      setGuestMode(true); setUser(null);
      var settings=getSettings();
      seedIfNeeded(settings.lang||'en');
      localizeDemoData(settings.lang||'en');   /* heal samples seeded in the wrong language */
      if(!settings.tutorialDone){ setShowTutorial(true); setTab('staff'); }
      setLang(settings.lang||'en');
      setWorkingDays(settings.workingDays||30);
      var sz=settings.fontSz||'normal'; setFontSz(sz); applyFontSz(sz);
      var h=getHomes(); setHomes(h);
      var lid=settings.lastHomeId;
      var hid=(lid&&h.find(function(x){return x.id===lid;}))?lid:(h[0]?h[0].id:'');
      setHomeId(hid); _activeHomeId=hid;
      setReady(true);
      return;
    }
    var unsubAuth=fbAuth.onAuthStateChanged(function(u){
      setUser(u);
      if(!u){
        var settings=getSettings();
        setLang(settings.lang||'en');
        var sz=settings.fontSz||'normal'; setFontSz(sz); applyFontSz(sz);
        setReady(true); return;
      }
      fbDb.collection('users').doc(u.uid).get().then(function(doc){
        var settings=getSettings();
        setLang(settings.lang||'en');
        setWorkingDays(settings.workingDays||26);
        var sz=settings.fontSz||'normal'; setFontSz(sz); applyFontSz(sz);
        if(!doc.exists||(doc.data().homeIds||[]).length===0){
          setNeedsHome(true); setReady(true); return;
        }
        var ud=doc.data();
        Promise.all((ud.homeIds||[]).map(function(id){ return fbDb.collection('homes').doc(id).get(); }))
          .then(function(docs){
            var live=docs.filter(function(d){return d.exists;});
            var userHomes=live.map(function(d){ return {id:d.id,name:d.data().name}; });
            var lid=ud.currentHomeId;
            var hid=(lid&&userHomes.find(function(x){return x.id===lid;}))?lid:(userHomes[0]?userHomes[0].id:'');
            setHomes(userHomes); setHomeId(hid); _activeHomeId=hid;
            /* Self-heal: households created before member names existed have no
               members map, so register ours (and refresh it if the name changed). */
            live.forEach(function(d){
              var data=d.data();
              var mem=data.members||{};
              var mine=mem[u.uid], nm=displayNameOf(u);
              if(!mine||mine.name!==nm){
                var patch={}; patch['members.'+u.uid]={name:nm,color:memberColor(u.uid)};
                d.ref.update(patch).catch(function(){});
              }
              /* Households created before the invites lookup existed have no
                 /invites document, so their code would never resolve. */
              if(data.inviteCode){
                var ref=fbDb.collection('invites').doc(data.inviteCode);
                ref.get().then(function(s){
                  if(!s.exists) return ref.set({homeId:d.id});
                }).catch(function(){});
              }
            });
            if(lsGet(SK.homes,[]).length>0) setMigrating(true);
            setReady(true);
          }).catch(function(){ setReady(true); });
      }).catch(function(){ setReady(true); });
    });
    return function(){ unsubAuth(); };
  },[]);

  /* ── household member registry (names for "paid by") ── */
  useEffect(function(){
    if(!FIREBASE_ENABLED||!fbDb||!homeId||guestMode){ setMembers({}); return; }
    var un=fbDb.collection('homes').doc(homeId).onSnapshot(function(d){
      setMembers((d.exists&&d.data().members)||{});
    },function(){});
    return function(){ un(); };
  },[homeId,guestMode]);

  /* declared with the other hooks — the auth gating below returns early */
  var memberCtx=useMemo(function(){
    return {uid:(user&&user.uid)||'',members:members,guestMode:guestMode};
  },[user,members,guestMode]);

  /* ── Firestore real-time listeners ── */
  useEffect(function(){
    if(!FIREBASE_ENABLED||!fbDb||!homeId||guestMode) return;
    var db=fbDb, timer=null;
    function bump(){
      clearTimeout(timer);
      timer=setTimeout(function(){ setSyncKey(function(k){return k+1;}); },250);
    }
    var unsubs=[
      db.collection('homes/'+homeId+'/staff').onSnapshot(function(snap){
        saveStaff(homeId,snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});})); bump();
      }),
      db.collection('homes/'+homeId+'/ledger').onSnapshot(function(snap){
        saveLedger(homeId,snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});})); bump();
      }),
      db.collection('homes/'+homeId+'/payments').onSnapshot(function(snap){
        savePayments(homeId,snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});})); bump();
      }),
      db.collection('homes/'+homeId+'/leaves').onSnapshot(function(snap){
        snap.docs.forEach(function(d){
          var p=d.id.split('_');
          if(p.length>=2) saveLeaves(p[0],p.slice(1).join('_'),d.data().dates||{});
        }); bump();
      }),
      db.collection('homes/'+homeId+'/waivers').onSnapshot(function(snap){
        var w={}; snap.docs.forEach(function(d){ w[d.id]=d.data().items||[]; });
        saveWaivers(homeId,w); bump();
      }),
      db.collection('homes/'+homeId+'/undos').onSnapshot(function(snap){
        saveUndos(homeId,snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});})); bump();
      }),
    ];
    return function(){ clearTimeout(timer); unsubs.forEach(function(u){u();}); };
  },[homeId,guestMode]);

  function toggleLang(){
    var nl=lang==='en'?'hi':'en'; setLang(nl);
    saveSettings(Object.assign({},getSettings(),{lang:nl}));
  }
  function cycleFontSz(){
    var next=fontSz==='normal'?'large':fontSz==='large'?'xlarge':'normal';
    setFontSz(next); saveSettings(Object.assign({},getSettings(),{fontSz:next}));
  }
  function changeHome(id){
    setHomeId(id); _activeHomeId=id;
    saveSettings(Object.assign({},getSettings(),{lastHomeId:id}));
    setTab('home');
    if(FIREBASE_ENABLED&&fbDb&&user&&!guestMode)
      fbDb.collection('users').doc(user.uid).update({currentHomeId:id}).catch(function(){});
  }
  function updateHomes(h){
    saveHomes(h); setHomes(h);
    if(h.length>0&&!h.find(function(x){return x.id===homeId;})) changeHome(h[0].id);
  }
  /* A household created or joined from Settings: append it and switch to it.
     Joining one already in the list is not an error — just go there. */
  function cloudHomeAdded(entry){
    var known=homes.find(function(x){return x.id===entry.id;});
    var next=known?homes:homes.concat([{id:entry.id,name:entry.name}]);
    if(!known){ saveHomes(next); setHomes(next); }
    if(entry.workingDays) setWorkingDays(entry.workingDays);
    changeHome(entry.id);
  }
  function signOut(){
    if(fbAuth) fbAuth.signOut().then(function(){ window.location.reload(); });
  }
  function doMigrate(){
    migrateFromLocalStorage(homeId,user,lang).then(function(created){
      /* households imported into their own new cloud household join the
         switcher right away; on later sign-ins they come back from the
         user's homeIds like any other */
      if(created&&created.length) setHomes(homes.concat(created));
      /* Clear the local household list either way once the user has answered —
         otherwise this same leftover data trips the check on every future
         load and the prompt never stops reappearing. */
      saveHomes([]); setMigrating(false);
    });
  }
  function skipMigrate(){
    saveHomes([]); setMigrating(false);
  }
  function enterGuestMode(){
    setGuestMode(true);
    var settings=getSettings();
    seedIfNeeded(settings.lang||'en');
    localizeDemoData(settings.lang||'en');
    if(!settings.tutorialDone){ setShowTutorial(true); setTab('staff'); }
    setLang(settings.lang||'en');
    setWorkingDays(settings.workingDays||30);
    var sz=settings.fontSz||'normal'; setFontSz(sz); applyFontSz(sz);
    var h=getHomes(); setHomes(h);
    var hid=h.length?h[0].id:''; setHomeId(hid); _activeHomeId=hid;
  }

  /* ── auth gating ── */
  if(!ready||user===undefined) return null;
  if(!guestMode&&user===null){
    return <AuthScreen lang={lang}
      onAuth={function(){ window.location.reload(); }}
      onGuest={enterGuestMode} />;
  }
  if(!guestMode&&needsHome){
    return <HomeSetupScreen lang={lang} user={user}
      onHomeReady={function(homesList,hid,isNew){
        setHomes(homesList); setHomeId(hid); _activeHomeId=hid; setNeedsHome(false);
        if(isNew&&!getSettings().tutorialDone){ setShowTutorial(true); setTab('staff'); }
      }} />;
  }

  var t=T[lang];

  function finishTutorial(){
    saveSettings(Object.assign({},getSettings(),{tutorialDone:true}));
    setShowTutorial(false);
  }

  if(migrating){
    return (
      <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
        <div className="card" style={{maxWidth:380,width:'100%',textAlign:'center'}}>
          <div style={{display:'flex',justifyContent:'center',color:'var(--accent)',marginBottom:12}}><Icon name="folder" size={34} /></div>
          <h2 style={{fontSize:fsr(18),fontWeight:800,color:'var(--ink)',marginBottom:8}}>{t.migrateTitle}</h2>
          <p style={{fontSize:fsr(14),color:'var(--ink2)',marginBottom:20}}>{t.migratePrompt}</p>
          <div className="flex gap-3">
            <button className="btn btn-accent flex-1" onClick={doMigrate}>{t.migrateYes}</button>
            <button className="btn btn-ghost flex-1" onClick={skipMigrate}>{t.migrateSkip}</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <SyncCtx.Provider value={syncKey}>
    <MembersCtx.Provider value={memberCtx}>
    <div className="flex flex-col" style={{minHeight:'100vh'}}>
      <header className="shrink-0" style={{background:'var(--accent)',color:'#fff',padding:'12px 16px 10px'}}>
        <div className="flex items-center justify-between mb-2">
          {/* The wordmark goes home, the way a masthead does on any site — it
              is the thing people already try to tap when they are lost. */}
          <button onClick={function(){setTab('home');}} aria-label={t.app+' — '+t.navHome}
            className="flex items-center gap-2.5"
            style={{background:'none',border:'none',padding:0,margin:0,cursor:'pointer',
              textAlign:'left',fontFamily:'Nunito,sans-serif',minHeight:44}}>
            <Logo size={34} tone="light" />
            <span>
              <h1 style={{fontSize:fsr(20),fontWeight:800,lineHeight:1,margin:0,color:'#fff'}}>{t.app}</h1>
              <p style={{fontSize:fsr(11),opacity:.6,margin:'2px 0 0',color:'#fff'}}>
                {FIREBASE_ENABLED&&!guestMode?t.syncLive:t.tag}
              </p>
            </span>
          </button>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            {/* Home has its own place in the bar under the simple layout, and
                language is a set-once choice that lives in Settings, so the
                header drops from four icons to two. Font size stays: it is the
                one control a reader may want at any moment. */}
            {layout!=='simple'&&tab!=='home'&&<button onClick={function(){setTab('home');}} title="Home" aria-label="Home"
              style={{background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',borderRadius:12,padding:'8px 11px',color:'#fff',cursor:'pointer',fontFamily:'Nunito,sans-serif',minWidth:44,minHeight:40,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <Icon name="home" size={22} />
            </button>}
            <button onClick={cycleFontSz} title="Font size"
              style={{background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',borderRadius:12,padding:'6px 10px',fontWeight:800,fontSize:fsr(13),color:'#fff',cursor:'pointer',fontFamily:'Nunito,sans-serif',minWidth:44,lineHeight:1}}>
              {fontSz==='normal'?'Aa':fontSz==='large'?'A+':'A++'}
            </button>
            {layout!=='simple'&&<button onClick={toggleLang}
              style={{background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',borderRadius:12,padding:'6px 14px',fontWeight:700,fontSize:fsr(13),color:'#fff',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
              {lang==='en'?'हिं':'EN'}
            </button>}
            <button onClick={function(){setMenuOpen(true);}} title="Menu" aria-label="Menu" data-tut="menu"
              style={{background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',borderRadius:12,padding:'8px 11px',color:'#fff',cursor:'pointer',fontFamily:'Nunito,sans-serif',minWidth:44,minHeight:40,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <Icon name="menu" size={22} />
            </button>
          </div>
        </div>
        <div style={{position:'relative'}}>
          <select value={homeId} onChange={function(e){changeHome(e.target.value);}}
            style={{background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',borderRadius:12,padding:'8px 36px 8px 12px',fontWeight:600,fontSize:fsr(14),color:'#fff',width:'100%',appearance:'none',WebkitAppearance:'none',fontFamily:'Nunito,sans-serif',outline:'none'}}>
            {homes.map(function(h){return <option key={h.id} value={h.id} style={{background:'#1A2E2A',color:'#fff'}}>{h.name}</option>;})}
          </select>
          {/* This is a dropdown, so it says so — a house here only repeated
              the word already printed inside it. */}
          <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'rgba(255,255,255,0.75)',display:'flex'}}><Icon name="chevronDown" size={18} /></span>
        </div>
      </header>

      <div className="flex-1 flex flex-col overflow-hidden" style={{position:'relative'}}>
        {tab==='home'     && <DashboardTab key={homeId} lang={lang} homeId={homeId} homes={homes} workingDays={workingDays} syncKey={syncKey} onNavigate={goTab} />}
        {tab==='staff'    && <StaffTab  key={homeId} lang={lang} homeId={homeId} homes={homes} workingDays={workingDays} syncKey={syncKey} onStaffChange={function(){setStaffKey(function(k){return k+1;});}} />}
        {tab==='salary'   && <SalaryTab key={homeId+'-'+staffKey+'-'+preselectSalaryStaff} lang={lang} homeId={homeId} homes={homes} refreshKey={staffKey} workingDays={workingDays} syncKey={syncKey} defaultStaffId={preselectSalaryStaff} />}
        {tab==='leaves'   && <LeavesTab key={homeId} lang={lang} homeId={homeId} workingDays={workingDays} syncKey={syncKey} />}
        {tab==='adv'      && <AdvancesTab key={homeId} lang={lang} homeId={homeId} homes={homes} workingDays={workingDays} syncKey={syncKey} />}
        {tab==='annual'   && <AnnualTab key={homeId} lang={lang} homeId={homeId} workingDays={workingDays} syncKey={syncKey} />}
        {tab==='money'    && <MoneyTab key={homeId} lang={lang} homeId={homeId} homes={homes} workingDays={workingDays} syncKey={syncKey} refreshKey={staffKey} defaultStaffId={preselectSalaryStaff} />}
        {tab==='reports'  && <ReportsTab key={homeId} lang={lang} homeId={homeId} workingDays={workingDays} syncKey={syncKey} />}
        {tab==='voice'    && <VoiceTab  key={homeId} lang={lang} homeId={homeId} homes={homes} workingDays={workingDays} syncKey={syncKey} />}
        {tab==='feedback' && <FeedbackTab lang={lang} guestMode={guestMode} user={user} />}
        {tab==='settings' && <SettingsTab lang={lang} setLang={setLang} homes={homes} onHomesChange={updateHomes} workingDays={workingDays} onWorkingDaysChange={function(n){setWorkingDays(n);}} homeId={homeId} guestMode={guestMode} user={user} onSignOut={signOut}
          onCloudHomeAdded={cloudHomeAdded}
          onLayoutChange={function(next){
            saveSettings(Object.assign({},getSettings(),{layout:next}));
            setLayout(next);
          }}
          onReplayTutorial={function(){
            saveSettings(Object.assign({},getSettings(),{tutorialDone:false}));
            setTab('staff'); setShowTutorial(true);
          }} />}

      </div>

      <VoiceSheet open={voiceOpen} onClose={function(){setVoiceOpen(false);}}
        lang={lang} homeId={homeId} homes={homes} workingDays={workingDays} syncKey={syncKey}
        onSaved={function(){ setStaffKey(function(k){return k+1;}); setSyncKey(function(k){return k+1;}); }} />

      {/* Only on the screens where speaking an entry makes sense. Settings,
          feedback and the voice screen itself have nothing to add by voice, and
          the tutorial owns the screen while it runs. Hidden outright where the
          browser has no speech recognition — a button that can never work is
          worse than no button at all. */}
      <BottomNav tab={tab} setTab={setTab} lang={lang} layout={layout}
        fab={micSupported&&!showTutorial&&['home','staff','money','reports','salary','leaves','adv','annual'].indexOf(tab)>-1
          ? <MicFab lang={lang} onClick={function(){setVoiceOpen(true);}} /> : null} />
      <HamburgerMenu open={menuOpen} onClose={function(){setMenuOpen(false);}} setTab={goTab} lang={lang} homeId={homeId} workingDays={workingDays} layout={layout} />
      {showTutorial && <TutorialOverlay lang={lang} tab={tab} onNavigate={setTab} onDone={finishTutorial} />}
    </div>
    </MembersCtx.Provider>
    </SyncCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(ErrorBoundary, null, React.createElement(App))
);
</script>
</body>
</html>
