<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GharSeva — Staff Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <!-- pinned versions on jsDelivr for reliability; no crossorigin attr for file:// compat -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase v9-compat SDK — global window.firebase.* API, no build step needed -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- Firebase project config. Generated at deploy time by generate-config.js
       from environment variables. Absent locally → app runs in guest mode. -->
  <script src="config.js"></script>
  <style>
    :root {
      /* Soft sage-white backgrounds */
      --bg:#EDF2EE; --surface:#FFFFFF; --surface2:#E5EDE6;
      --border:#C4D4C6; --muted:#7A998C;
      /* Deep forest charcoal text */
      --ink:#1A2E2A; --ink2:#3D5E55;
      /* Forest teal actions */
      --accent:#1A6E5E; --accent2:#3EA08A;
      /* Status */
      --ok:#1C7A48; --danger:#C0393B; --warn:#B45309; --purple:#5B4A9B;
    }
    html{font-size:16px;}
    /* Body sits at 500, headings and figures at 700-800. Everything used to be
       600 against 800, which is close enough that nothing looked emphasised —
       when it is all bold, none of it is. 500 rather than the usual 400
       because this is read by older eyes and thin strokes vanish first;
       Nunito already sets its digits on a fixed width, so money lines up in a
       column without any further help. */
    html,body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);font-size:1rem;font-weight:500;}
    #root{background:var(--bg);}
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box;}
    body{margin:0;}
    input,select,textarea{font-size:1.0625rem!important;font-weight:600;}
    #root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
    .scroll-area{overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .fade-in{animation:fi .2s ease;}
    @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .mic-pulse::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(26,110,94,0.4);animation:pulse-ring 1.2s ease-out infinite;}
    .mic-pulse-danger::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(192,57,59,0.5);animation:pulse-ring 0.8s ease-out infinite;}
    @keyframes pulse-ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.35);opacity:0}}
    @keyframes tutPulse{0%,100%{box-shadow:0 0 0 3px rgba(62,160,138,.35)}50%{box-shadow:0 0 0 9px rgba(62,160,138,.12)}}
    @keyframes tutNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
    .cal-btn{min-height:44px;min-width:44px;}
    ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
    /* Chip rows scroll sideways. The bar under them was being read as part of
       the interface — a grey slab between two filters — so it is hidden while
       the row still scrolls. */
    .chip-row{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
    .chip-row::-webkit-scrollbar{display:none;height:0;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(26,46,42,.06);}
    .inp{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Nunito',sans-serif;font-size:1.0625rem!important;font-weight:600;outline:none;width:100%;color:var(--ink);}
    .inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,110,94,.15);}
    .sel{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Nunito',sans-serif;font-size:1.0625rem!important;font-weight:600;outline:none;width:100%;color:var(--ink);appearance:none;-webkit-appearance:none;}
    .sel:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,110,94,.15);}
    .ta{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Nunito',sans-serif;font-size:1.0625rem!important;font-weight:600;outline:none;width:100%;color:var(--ink);resize:none;}
    .ta:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,110,94,.15);}
    .btn{border-radius:12px;font-weight:800;font-family:'Nunito',sans-serif;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;font-size:1rem;transition:all .15s;line-height:1.2;}
    .btn:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px);}
    .btn:not(:disabled):active{transform:translateY(0);filter:brightness(.96);}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .btn-accent{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(26,110,94,.30);}
    .btn-ok{background:var(--ok);color:#fff;box-shadow:0 2px 6px rgba(28,122,72,.28);}
    .btn-danger{background:var(--danger);color:#fff;}
    .btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--ink2);}
    .btn-sm{padding:9px 14px;font-size:0.875rem;min-height:44px;}
    .btn-full{width:100%;}
    .pill{border-radius:20px;font-size:0.8125rem;font-weight:800;padding:5px 13px;display:inline-block;}
    .pill-warn{background:#F5E8CC;color:#8B5E08;}
    .pill-ok{background:#CCEADC;color:#1A5E35;}
    .pill-accent{background:#D0EBE5;color:#1A5045;}
    .pill-purple{background:#E0D8F0;color:#3A2E7A;}
    .pill-muted{background:var(--surface2);color:var(--ink2);}
  </style>
</head>
<body>

<!-- Shown while Babel/React initialise; React replaces it -->
<div id="root">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:12px;">
    <!-- Same mark as the Logo component, written out by hand because this
         screen is shown before React has parsed anything. -->
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="#1A6E5E"/>
      <path d="M10 31.5 32 14l22 17.5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 34.5V50h32V34.5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="37.4" r="4.1" fill="#fff"/>
      <path d="M24.6 50c0-4.4 3.3-7 7.4-7s7.4 2.6 7.4 7" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
    </svg>
    <div style="font-size:1.4rem;font-weight:800;color:#1A2E2A;font-family:'Nunito',sans-serif;">GharSeva</div>
    <div style="font-size:.95rem;color:#7A998C;font-family:'Nunito',sans-serif;">Loading… / लोड हो रहा है…</div>
    <div style="width:40px;height:4px;background:#C4D4C6;border-radius:4px;overflow:hidden;margin-top:8px;">
      <div style="width:40%;height:100%;background:#1A6E5E;border-radius:4px;animation:lb 1s ease-in-out infinite alternate;"></div>
    </div>
    <style>@keyframes lb{from{transform:translateX(0)}to{transform:translateX(150%)}}</style>
  </div>
</div>

<!-- Error display (hidden unless window.onerror fires before React mounts) -->
<div id="err" style="display:none;padding:20px;color:#dc2626;font-size:14px;background:#fef2f2;border:1px solid #fca5a5;margin:16px;border-radius:12px;"></div>

<script>
window.onerror = function(msg,_,line){
  var el=document.getElementById('err');
  if(el){el.style.display='block';el.textContent='JS Error at line '+line+': '+msg;}
};
</script>

<script type="text/babel">
const {useState,useEffect,useRef,useMemo} = React;

/* ── FIREBASE INIT ──────────────────────────────────────────── */
/* Config comes from config.js (see config.example.js). On Netlify it is
   generated at build time from environment variables; locally you create
   it by hand. No config.js → app runs in guest mode, localStorage only. */
const FIREBASE_CONFIG = window.GHARSEVA_CONFIG || { apiKey: 'YOUR_API_KEY' };
var fbAuth = null, fbDb = null, FIREBASE_ENABLED = false;
(function(){
  try {
    if (typeof firebase === 'undefined') return;
    if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') return;
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb   = firebase.firestore();
    fbDb.enablePersistence({synchronizeTabs:true}).catch(function(){});
    FIREBASE_ENABLED = true;
  } catch(e){ console.warn('Firebase init skipped:', e.message); }
})();

/* Shared sync counter — tabs subscribe via React.useContext(SyncCtx)
   and add it to their useEffect deps so remote writes trigger re-fetch. */
var SyncCtx = React.createContext(0);

/* Household members, for attributing who actually paid for something.
   {uid, members:{uid:{name,color}}, guestMode}. Names live on the home doc
   because Firestore rules keep /users/{uid} readable only by that user, so
   one member can never look another's display name up directly. */
var MembersCtx = React.createContext({uid:'',members:{},guestMode:true});
var MEMBER_COLORS=['#1A6E5E','#5B4A9B','#B45309','#1C7A48','#C0393B','#3EA08A'];
function memberColor(uid){
  var h=0; for(var i=0;i<(uid||'').length;i++) h=(h*31+uid.charCodeAt(i))>>>0;
  return MEMBER_COLORS[h%MEMBER_COLORS.length];
}
function memberLabel(uid,members,t){
  if(!uid) return t?t.notRecorded:'—';
  var m=members&&members[uid];
  return (m&&m.name)||(t?t.memberUnknown:'Member');
}
/* Resolves who paid, including someone outside the household's member list
   (paidBy:'other' + a free-text paidByName). Prefer this over memberLabel
   directly wherever the full record (not just a uid) is available. */
function payerLabel(rec,members,t){
  if(!rec||!rec.paidBy) return t?t.notRecorded:'—';
  if(rec.paidBy==='other') return (rec.paidByName&&rec.paidByName.trim())||(t?t.paidBySomeoneElse:'Someone else');
  return memberLabel(rec.paidBy,members,t);
}
function displayNameOf(user){
  if(!user) return '';
  return user.displayName||user.phoneNumber||user.email||'Member';
}

/* Phone numbers pasted from a contacts app carry a country code, spaces,
   dashes or a leading +. Strip everything but digits as the user types
   (native maxLength would otherwise truncate a paste before this ever runs),
   then collapse the common Indian prefixes down to a bare 10-digit number
   at save time so the rest of the app (WhatsApp links, display) stays
   consistent with what it already assumes. Anything that doesn't match
   is kept as typed rather than mangled. */
function cleanPhoneDigits(raw){ return (raw||'').replace(/\D/g,'').slice(0,15); }
function normalizePhone(digits){
  if(digits.length===12&&digits.slice(0,2)==='91') return digits.slice(2);
  if(digits.length===11&&digits.charAt(0)==='0') return digits.slice(1);
  return digits;
}

/* Names typed for "someone else" paid this, offered back as suggestions so
   the same person doesn't end up spelled three different ways. */
function getExternalPayerNames(homeId){
  var names={};
  getLedger(homeId).forEach(function(e){ if(e.paidBy==='other'&&e.paidByName) names[e.paidByName.trim()]=true; });
  getPayments(homeId).forEach(function(p){ if(p.paidBy==='other'&&p.paidByName) names[p.paidByName.trim()]=true; });
  return Object.keys(names).sort();
}

/* Current home for write helpers that don't receive homeId in scope */
var _activeHomeId = '';

/* ── FONT SCALE HELPER ──────────────────────────────────────── */
/* fsr(px): convert a design-px value to a rem string so all text
   scales when html font-size changes (Normal 16→Large 20→XL 24). */
function fsr(n){ return (n/16).toFixed(4)+'rem'; }
function applyFontSz(sz){
  document.documentElement.style.fontSize=sz==='xlarge'?'24px':sz==='large'?'20px':'16px';
}

/* ── ROLES & COLORS ─────────────────────────────────────────── */
const ROLE_AVATAR = {
  maid:'#2E6E8E', cook:'#3A6E50', driver:'#3A4E8E', watchman:'#2E4E6E',
  sweeper:'#4E6030', gardener:'#1A6050', nanny:'#6E3A8E', other:'#3E6060',
};
function avatarBg(role){ return ROLE_AVATAR[role]||'#3E6060'; }

/* ── ICONS ──────────────────────────────────────────────────────
   Emoji were standing in for an icon set. They render differently on every
   phone — the calendar is blue on one and grey on another — sit at different
   optical weights beside each other, and cannot take the colour of the thing
   they belong to, so a row of them never lines up.

   These are one set: a 24-unit grid, a single 2px stroke, round ends. The
   stroke is deliberately heavy rather than the hairline that is fashionable —
   this app is read by people with older eyes, and a thin line is the first
   thing to disappear. Everything inherits currentColor, so an icon is always
   exactly as dark as the text beside it. */
const ICONS={
  home:'<path d="M3.5 10.6 12 4l8.5 6.6V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/>',
  staff:'<circle cx="9" cy="8" r="3.2"/><path d="M2.8 20c0-3.4 2.8-5.4 6.2-5.4s6.2 2 6.2 5.4"/><circle cx="17.5" cy="9.2" r="2.3"/><path d="M17 14.8c2.6.1 4.4 1.9 4.4 4.4"/>',
  money:'<rect x="2.5" y="6" width="19" height="12" rx="2.2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',

  records:'<rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 3h6v3H9z"/><path d="M8.5 11h7M8.5 15h4"/>',

  loan:'<path d="M3 10 12 4.5l9 5.5"/><path d="M5.5 10.5v8M9.5 10.5v8M14.5 10.5v8M18.5 10.5v8M3 20.5h18"/>',
  expense:'<path d="M2.5 4.5h2.2l2.4 9.5h9.6l2.3-7H6.4"/><circle cx="10" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/>',
  bonus:'<path d="M12 3.6l2.5 5.3 5.8.8-4.2 4 1 5.7-5.1-2.8-5.1 2.8 1-5.7-4.2-4 5.8-.8z"/>',
  overtime:'<circle cx="12" cy="12.5" r="7.8"/><path d="M12 8v4.8l3.2 2M12 2.2v1.6"/>',
  halfday:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/>',
  extrahelp:'<circle cx="9" cy="8" r="3.2"/><path d="M2.8 20c0-3.4 2.8-5.4 6.2-5.4s6.2 2 6.2 5.4"/><path d="M18.5 7.5v6M15.5 10.5h6"/>',
  /* A wallet, not another banknote — salary sits beside the money tab and the
     card icon, and three rectangles with a circle in them are one idea. */
  salary:'<path d="M3 8V7a2 2 0 0 1 2-2h11.5a1.5 1.5 0 0 1 1.5 1.5V8"/><rect x="3" y="8" width="18" height="11.5" rx="2"/><path d="M21.2 12.2h-3.4a1.9 1.9 0 0 0 0 3.8h3.4"/>',
  /* Holiday is a day off, so the sun says it more plainly than a parasol. */
  holiday:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4 7 7M17 17l1.6 1.6M5.4 18.6 7 17M17 7l1.6-1.6"/>',
  chat:'<path d="M20.5 12.5c0 4-3.8 7.2-8.5 7.2a10 10 0 0 1-2.6-.33L4.5 21l1.2-3.4A6.9 6.9 0 0 1 3.5 12.5C3.5 8.5 7.3 5.3 12 5.3s8.5 3.2 8.5 7.2z"/>',
  /* Sliders rather than a cog: a cog at this size is a ring of specks, and it
     would be indistinguishable from the sun used for holiday. */
  settings:'<path d="M3.5 7h9M18.5 7h2M3.5 12h4M11.5 12h9M3.5 17h9M18.5 17h2"/><circle cx="15" cy="7" r="2.2"/><circle cx="9.2" cy="12" r="2.2"/><circle cx="15" cy="17" r="2.2"/>',
  menu:'<path d="M3.5 7h17M3.5 12h17M3.5 17h17"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  check:'<path d="M4.5 12.5l5 5L20 6.5"/>',

  undo:'<path d="M4 8.5h10a5.5 5.5 0 0 1 0 11h-6"/><path d="M7.5 5 4 8.5 7.5 12"/>',

  edit:'<path d="M4 20l.9-4.2L15.6 5.1a2 2 0 0 1 2.8 0l1.5 1.5a2 2 0 0 1 0 2.8L9.2 20.1z"/><path d="M14 6.7l3.3 3.3"/>',
  phone:'<path d="M8.2 3.5 10 7.6l-2 1.6a11 11 0 0 0 5.8 5.8l1.6-2 4.1 1.8v3.4a1.7 1.7 0 0 1-1.9 1.7C10.4 19.4 4.6 13.6 3.9 5.4A1.7 1.7 0 0 1 5.6 3.5z"/>',

  upload:'<path d="M12 15.5v-11M8 8.3l4-4 4 4"/><path d="M4 17.5v1.7a1.8 1.8 0 0 0 1.8 1.8h12.4a1.8 1.8 0 0 0 1.8-1.8v-1.7"/>',

  bulb:'<path d="M9 17.5h6M10 20.5h4"/><path d="M8 13.4A5.5 5.5 0 1 1 16 13.4c-.8.9-1.2 1.6-1.3 2.6H9.3c-.1-1-.5-1.7-1.3-2.6z"/>',

  person:'<circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.5c0-3.8 3.2-6.1 7.2-6.1s7.2 2.3 7.2 6.1"/>',
  chevronRight:'<path d="M9 4.5 16.5 12 9 19.5"/>',
  chevronLeft:'<path d="M15 4.5 7.5 12 15 19.5"/>',
  chevronDown:'<path d="M4.5 9 12 16.5 19.5 9"/>',
  chevronUp:'<path d="M4.5 15 12 7.5 19.5 15"/>',

  sync:'<path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M17.5 2.5v4h-4M6.5 21.5v-4h4"/>',
};

/* The mark. A house whose roof reaches wider than its walls — the shelter a
   household extends to the people who work in it — with two figures standing
   inside it. Ghar is the house, seva the people; the logo is both or it is
   just another house icon. Drawn rather than lettered so it survives being
   16px on a browser tab and 72px on the sign-in screen.

   `tone` picks the palette: on the deep green header it draws in white, and
   on a pale screen it draws the badge in green with the mark knocked out. */
function Logo({size,tone}){
  var px=size||56, onDark=tone==='light';
  var badge=onDark?'rgba(255,255,255,0.16)':'var(--accent)';
  var mark=onDark?'#FFFFFF':'#FFFFFF';
  var stroke=onDark?'rgba(255,255,255,0.5)':'transparent';
  return (
    <svg width={px} height={px} viewBox="0 0 64 64" aria-hidden="true" style={{display:'block',flexShrink:0}}>
      <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill={badge} stroke={stroke} strokeWidth="2"/>
      {/* Roof, overhanging the walls on both sides. One figure beneath, not
          two: a second one turns to a smudge below about forty pixels, and the
          mark has to hold together on a browser tab as well as a title bar. */}
      <path d="M10 31.5 32 14l22 17.5" fill="none" stroke={mark} strokeWidth="5"
        strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M16 34.5V50h32V34.5" fill="none" stroke={mark} strokeWidth="5"
        strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx="32" cy="37.4" r="4.1" fill={mark}/>
      <path d="M24.6 50c0-4.4 3.3-7 7.4-7s7.4 2.6 7.4 7" fill="none" stroke={mark}
        strokeWidth="4.4" strokeLinecap="round"/>
    </svg>
  );
}

/* A card's heading: one icon, one line, always the same size and spacing.
   These were previously an emoji glued to the front of a string, which meant
   each heading sat at a slightly different height from the last. */
function CardTitle({icon,children,size}){
  return (
    <p className="flex items-center gap-2" style={{fontSize:fsr(size||16),fontWeight:800,color:'var(--ink)',marginBottom:12}}>
      <span style={{color:'var(--accent)'}}><Icon name={icon} size={(size||16)+4} /></span>
      <span>{children}</span>
    </p>
  );
}

/* Size defaults to 22 — bigger than the 16-18 most interfaces use, because
   the people this is for should not have to look twice. */
function Icon({name,size,style,strokeWidth}){
  /* Sized in rem, not pixels, so icons grow with the Aa control alongside the
     text they label. Fixed pixels meant that at the largest setting the words
     doubled while the icon beside them stayed put, which is backwards — the
     reader who enlarged the text is the one who needs the bigger icon. */
  var rem=fsr(size||22);
  return (
    <svg width={rem} height={rem} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={strokeWidth||2}
      strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"
      style={Object.assign({flexShrink:0,display:'block'},style||{})}
      dangerouslySetInnerHTML={{__html:ICONS[name]||''}} />
  );
}

/* A staff member's face wherever they are named. Photos were only ever drawn
   on the edit form, the staff card and the profile header; every other list
   fell back to an initial, which is the hardest thing to scan quickly — a
   household with a Kamala and a Kaki gets two identical Ks. One component now
   shows the photo when there is one and the initial when there is not, so
   adding a photo makes the person recognisable everywhere at once. */
function Avatar({staff,size,ring}){
  var px=size||40;
  var common={width:px,height:px,borderRadius:'50%',flexShrink:0,
    border:ring||'2px solid var(--border)'};
  if(staff&&staff.photo) return <img src={staff.photo} alt="" style={Object.assign({objectFit:'cover'},common)} />;
  var initials=((staff&&staff.name)||'?').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  return (
    <div style={Object.assign({background:avatarBg(staff&&staff.role),color:'#fff',fontWeight:800,
      display:'flex',alignItems:'center',justifyContent:'center',
      fontSize:(px*0.38)/16+'rem',lineHeight:1},common)}>{initials}</div>
  );
}

/* ExcelJS is only needed when someone actually exports, and it is far bigger
   than anything else here — so it is fetched on first use rather than on
   every app load. Resolves to window.ExcelJS. */
var _exceljsPromise=null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(_exceljsPromise) return _exceljsPromise;
  _exceljsPromise=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload=function(){ window.ExcelJS?resolve(window.ExcelJS):reject(new Error('ExcelJS did not load')); };
    s.onerror=function(){ _exceljsPromise=null; reject(new Error('offline')); };
    document.head.appendChild(s);
  });
  return _exceljsPromise;
}

function downloadBlob(content,mime,filename){
  var blob=content instanceof Blob?content:new Blob([content],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},200);
}
/* Quotes on comma, quote, OR newline — the old inline version only checked
   for comma/quote, so a reason containing a line break silently corrupted
   the row structure. */
function csvCell(v){
  var s=String(v==null?'':v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
/* A single CSV, five sections separated by a blank line, covering
   everything the old flat ledger dump left out: staff details, actual
   salary payments, attendance, and who paid for what — not just raw
   ledger rows. Headers and type labels run through T[lang] so the export
   matches whatever language the app is currently in. */
/* Everything the report needs, gathered once so the spreadsheet and the
   plain-text fallback can never disagree about the numbers. */
function buildReportData(homeId,period,lang,members,workingDays){
  var t=T[lang]||T.en;
  var staff=getStaff(homeId);
  var ledger=getLedger(homeId);
  var payments=getPayments(homeId);
  var home=getHomes().find(function(h){return h.id===homeId;})||{name:''};
  var now=new Date();
  var year=now.getFullYear(), month=now.getMonth()+1;
  function inPeriod(dateStr){
    if(!dateStr) return false;
    return period==='month' ? dateStr.startsWith(year+'-'+String(month).padStart(2,'0'))
                            : dateStr.startsWith(String(year));
  }
  /* months that have actually happened — padding the rest with zeroes just
     filled the old report with meaningless rows */
  var allMonths = period==='month' ? [month] : Array.from({length:12},function(_,i){return i+1;});
  var monthsInPeriod=allMonths.filter(function(m){ return new Date(year,m-1,1)<=now; });
  var label = period==='month' ? (year+'-'+String(month).padStart(2,'0')) : String(year);
  var typeLabels={advance:t.tAdv,loan:t.tLoan,expense:t.tExp,bonus:t.tBonus,loan_repay:t.tLoanRepay,
    extra_work:t.tExtraWork,short_hours:t.tShortHours,extra_help:t.tExtraHelp};
  function toDate(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }

  var periodLedger=ledger.filter(function(e){return inPeriod(e.date);});
  var periodPayments=payments.filter(function(p){
    return period==='year' ? p.year===year : (p.year===year&&p.month===month);
  });
  var CASH_OUT=['advance','loan','expense','bonus','extra_work','extra_help'];
  var totalSpend=periodPayments.reduce(function(a,p){return a+(p.amount||0);},0)
    +periodLedger.filter(function(e){return CASH_OUT.indexOf(e.type)>-1;}).reduce(function(a,e){return a+(e.amount||0);},0);

  function monthSalary(s,m){
    var real=payments.filter(function(p){return p.staffId===s.id&&p.year===year&&p.month===m;})
                      .reduce(function(a,p){return a+(p.amount||0);},0);
    if(real>0) return real;
    return new Date(year,m-1,1)>now ? 0 : calcSalary(s,year,m,ledger,workingDays,homeId).netPayable;
  }
  function monthAttendance(staffId,m){
    var lv=getLeaves(staffId,padYM(year,m));
    var vals=Object.keys(lv).map(function(k){return lv[k];});
    var leaveD=vals.filter(function(v){return v==='leave';}).length;
    var holidayD=vals.filter(function(v){return v==='holiday';}).length;
    var daysInMonth=new Date(year,m,0).getDate();
    var considered = year===now.getFullYear()&&m===now.getMonth()+1 ? now.getDate() : daysInMonth;
    return {present:Math.max(0,considered-leaveD-holidayD),leave:leaveD,holiday:holidayD};
  }

  var staffRows=staff.map(function(s){
    var paidSum=0,present=0,leave=0,holiday=0;
    monthsInPeriod.forEach(function(m){
      paidSum+=monthSalary(s,m);
      var att=monthAttendance(s.id,m);
      present+=att.present; leave+=att.leave; holiday+=att.holiday;
    });
    var sLed=ledger.filter(function(e){return e.staffId===s.id&&inPeriod(e.date);});
    function sum(type){return sLed.filter(function(e){return e.type===type;}).reduce(function(a,e){return a+(e.amount||0);},0);}
    var spend=paidSum+sum('advance')+sum('expense')+sum('bonus')+sum('extra_work');
    return {name:s.name,role:roleLabel(s.role,lang),salary:paidSum,advances:sum('advance'),
      expenses:sum('expense'),bonuses:sum('bonus'),overtime:sum('extra_work'),halfDays:sum('short_hours'),
      loanBal:getLoanBal(s.id,ledger),present:present,leave:leave,holiday:holiday,spend:spend};
  });

  var payRows=periodPayments.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');})
    .map(function(p){
      var s=staff.find(function(x){return x.id===p.staffId;});
      return {date:toDate(p.date),name:s?s.name:t.generalNoStaff,amount:p.amount||0,paidBy:payerLabel(p,members,t)};
    });

  var entryRows=periodLedger.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');})
    .map(function(e){
      var s=staff.find(function(x){return x.id===e.staffId;});
      var name=s?s.name:(e.type==='extra_help'?t.generalNoStaff:'—');
      if(e.type==='extra_help'&&e.helperName) name+=' ('+e.helperName+')';
      return {date:toDate(e.date),name:name,typeKey:e.type,type:typeLabels[e.type]||e.type,
        amount:e.amount||0,paidBy:payerLabel(e,members,t),reason:e.reason||''};
    });

  var attRows=[];
  staff.forEach(function(s){
    monthsInPeriod.forEach(function(m){
      var att=monthAttendance(s.id,m);
      attRows.push({name:s.name,month:t.months[m-1]+' '+year,present:att.present,leave:att.leave,holiday:att.holiday});
    });
  });

  /* Totals across everyone, so the report can lead with the few numbers
     someone actually opens it for rather than making them add up a column. */
  function col(k){ return staffRows.reduce(function(a,r){return a+(r[k]||0);},0); }
  var totals={salary:col('salary'),advances:col('advances'),expenses:col('expenses'),
    bonuses:col('bonuses'),overtime:col('overtime'),halfDays:col('halfDays'),
    loanBal:col('loanBal'),present:col('present'),leave:col('leave'),holiday:col('holiday')};

  return {t:t,lang:lang,home:home,label:label,period:period,year:year,
    generatedOn:todayStr(),staffCount:staff.length,totalSpend:totalSpend,totals:totals,
    staffRows:staffRows,payRows:payRows,entryRows:entryRows,attRows:attRows};
}

/* ── Styled Excel workbook ───────────────────────────────────── */
function exportExcel(homeId,period,lang,members,workingDays){
  var d=buildReportData(homeId,period,lang,members,workingDays);
  var t=d.t;
  return loadExcelJS().then(function(ExcelJS){
    var wb=new ExcelJS.Workbook();
    wb.creator='GharSeva'; wb.created=new Date();

    var GREEN='FF1A6E5E', ACCENT='FF2F8F7A', MINT='FFE5EDE6', LINE='FFC4D4C6', INK='FF1A2E2A';
    var MONEY='"₹"#,##0';

    /* In-cell proportional bars. cfvo (the min/max bounds) is required —
       without it ExcelJS throws while writing the rule, and because the export
       falls back to plain text on any error, that failure is silent. */
    function dataBar(ws,ref,argb,priority){
      ws.addConditionalFormatting({ref:ref,rules:[{
        type:'dataBar',cfvo:[{type:'min'},{type:'max'}],color:{argb:argb},priority:priority
      }]});
    }
    /* One sheet. Five sheets meant the answer to any question sat on a tab you
       were not looking at, and the summary — the part anybody actually opens —
       was the one you had to navigate away from. Everything now reads top to
       bottom on a single page: the totals first, then per person, then the two
       ledgers that produced them. */
    var ws=wb.addWorksheet('GharSeva',{views:[{state:'frozen',ySplit:2}],
      pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,
        margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}}});
    ws.columns=[{width:26},{width:16},{width:11},{width:11},{width:14},{width:14},{width:14},{width:18}];
    var LAST='H', NCOL=8, row=0;
    function at(n){ return ws.getRow(n); }
    function span(n){ ws.mergeCells('A'+n+':'+LAST+n); return ws.getCell('A'+n); }

    /* A coloured band naming what follows, so a section can be found without
       counting rows. */
    function band(text){
      row++; var c=span(row);
      c.value=text;
      c.font={bold:true,size:12,color:{argb:'FFFFFFFF'},name:'Calibri'};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:GREEN}};
      c.alignment={vertical:'middle',horizontal:'left',indent:1};
      at(row).height=26;
    }
    function spacer(){ row++; at(row).height=7; }
    function headings(labels){
      row++; var r=at(row); r.height=20;
      labels.forEach(function(v,i){
        var c=r.getCell(i+1);
        c.value=v;
        c.font={bold:true,size:10,color:{argb:INK},name:'Calibri'};
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:MINT}};
        c.alignment={vertical:'middle',horizontal:i===0?'left':'right',wrapText:true};
        c.border={bottom:{style:'thin',color:{argb:GREEN}}};
      });
    }
    /* money lists the column indexes to format as rupees. */
    function line(values,opts){
      opts=opts||{};
      row++; var r=at(row); r.height=opts.tall?20:18;
      values.forEach(function(v,i){
        var c=r.getCell(i+1);
        c.value=v;
        if(opts.money&&opts.money.indexOf(i)>-1) c.numFmt=MONEY;
        c.font={size:10,bold:!!opts.bold,color:{argb:opts.color||INK},name:'Calibri'};
        c.alignment={vertical:'middle',horizontal:i===0||i===1?'left':'right'};
        c.border={bottom:{style:'hair',color:{argb:LINE}}};
        if(opts.fill) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:opts.fill}};
        else if(opts.zebra) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:MINT}};
      });
    }
    function noneRow(){
      row++; var c=span(row);
      c.value=t.exportNone;
      c.font={italic:true,size:10,color:{argb:'FF7A998C'},name:'Calibri'};
      c.alignment={vertical:'middle',indent:1};
      at(row).height=18;
    }
    function isoOf(dt){ return dt?toISODate(dt):''; }

    /* Title */
    row++; var title=span(row);
    title.value='GharSeva — '+d.home.name;
    title.font={bold:true,size:18,color:{argb:'FFFFFFFF'},name:'Calibri'};
    title.fill={type:'pattern',pattern:'solid',fgColor:{argb:GREEN}};
    title.alignment={vertical:'middle',horizontal:'center'};
    at(row).height=34;

    row++; var sub=span(row);
    sub.value=d.label+'   ·   '+t.exportGeneratedOn+' '+fmtD(d.generatedOn)+'   ·   '+t.exportStaffCount+': '+d.staffCount;
    sub.font={size:10,color:{argb:'FFFFFFFF'},name:'Calibri'};
    sub.fill={type:'pattern',pattern:'solid',fgColor:{argb:ACCENT}};
    sub.alignment={vertical:'middle',horizontal:'center'};
    at(row).height=20;

    spacer();

    /* The figures worth leading with */
    band(t.exportKeyFigures);
    /* The first figure is money that actually left the house; the second
       includes an estimate for any month not yet settled, so it can legitimately
       be the larger of the two. Labelled to say so rather than leaving two
       similar-looking totals to contradict each other. */
    [[t.annTotal,d.totalSpend,true],
     [t.exportSalaryLine,d.totals.salary,false],
     [t.aTotAdv,d.totals.advances,false],
     [t.aTotExp,d.totals.expenses,false],
     [t.aTotBon,d.totals.bonuses+d.totals.overtime,false],
     [t.aTotLoan,d.totals.loanBal,false]].forEach(function(k,i){
      row++; at(row).height=k[2]?24:19;
      ws.mergeCells('A'+row+':D'+row); ws.mergeCells('E'+row+':'+LAST+row);
      var lab=ws.getCell('A'+row), val=ws.getCell('E'+row);
      lab.value=k[0];
      lab.font={bold:k[2],size:k[2]?12:10,color:{argb:INK},name:'Calibri'};
      lab.alignment={vertical:'middle',indent:1};
      val.value=k[1]; val.numFmt=MONEY;
      val.font={bold:true,size:k[2]?14:11,color:{argb:k[2]?GREEN:INK},name:'Calibri'};
      val.alignment={vertical:'middle',horizontal:'right',indent:1};
      [lab,val].forEach(function(c){
        c.border={bottom:{style:'hair',color:{argb:LINE}}};
        if(k[2]) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD8EEE2'}};
        else if(i%2===0) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:MINT}};
      });
    });

    spacer();

    /* Per person */
    band(t.annPer);
    headings([t.fname,t.frole,t.tPresent,t.tLeave,t.aTotSal,t.aTotAdv,t.aTotExp,t.aTotLoan]);
    var stFirst=row+1;
    d.staffRows.forEach(function(r,i){
      line([r.name,r.role,r.present,r.leave,r.salary,r.advances,r.expenses,r.loanBal],
        {money:[4,5,6,7],zebra:i%2===1});
    });
    if(!d.staffRows.length) noneRow();
    else {
      line([t.exportTotal,'',d.totals.present,d.totals.leave,d.totals.salary,d.totals.advances,d.totals.expenses,d.totals.loanBal],
        {money:[4,5,6,7],bold:true,fill:'FFD8EEE2',tall:true});
      /* Proportional bars carry what the chart used to, in the cells themselves. */
      dataBar(ws,'E'+stFirst+':E'+(stFirst+d.staffRows.length-1),'FF3EA08A',1);
      dataBar(ws,'H'+stFirst+':H'+(stFirst+d.staffRows.length-1),'FF5B4A9B',2);
    }

    spacer();

    /* Salary payments */
    band(t.exportSheetPayments);
    headings([t.fdate,t.fname,t.famount,t.paidBy,'','','','']);
    if(!d.payRows.length) noneRow();
    else {
      d.payRows.forEach(function(r,i){
        row++; var rr=at(row); rr.height=18;
        [isoOf(r.date)?fmtD(isoOf(r.date)):'',r.name,r.amount,r.paidBy,'','','',''].forEach(function(v,ci){
          var c=rr.getCell(ci+1);
          c.value=v;
          if(ci===2) c.numFmt=MONEY;
          c.font={size:10,color:{argb:INK},name:'Calibri'};
          c.alignment={vertical:'middle',horizontal:ci===2?'right':'left'};
          c.border={bottom:{style:'hair',color:{argb:LINE}}};
          if(i%2===1) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:MINT}};
        });
      });
      line([t.exportTotal,'',d.payRows.reduce(function(a,r){return a+(r.amount||0);},0),'','','','',''],
        {money:[2],bold:true,fill:'FFD8EEE2',tall:true});
    }

    spacer();

    /* Everything else */
    band(t.exportSheetEntries);
    headings([t.fdate,t.fname,t.tType,t.famount,t.paidBy,t.freason,'','']);
    var TYPE_TINT={advance:'FFFDF3DC',loan:'FFEAE4F5',expense:'FFD8EEE8',bonus:'FFD8EEE2',
      loan_repay:'FFD8EEE2',extra_work:'FFD8EEE2',short_hours:'FFFDF3DC',extra_help:'FFEAE4F5'};
    if(!d.entryRows.length) noneRow();
    else d.entryRows.forEach(function(r,i){
      row++; var rr=at(row); rr.height=18;
      /* the reason is the only free text here, so it takes the tail of the row */
      ws.mergeCells('F'+row+':'+LAST+row);
      [isoOf(r.date)?fmtD(isoOf(r.date)):'',r.name,r.type,r.amount,r.paidBy,r.reason].forEach(function(v,ci){
        var c=rr.getCell(ci+1);
        c.value=v;
        if(ci===3) c.numFmt=MONEY;
        c.font={size:10,color:{argb:INK},name:'Calibri'};
        c.alignment={vertical:'middle',horizontal:ci===3?'right':'left',wrapText:ci===5};
        c.border={bottom:{style:'hair',color:{argb:LINE}}};
        if(i%2===1) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:MINT}};
      });
      /* each type keeps the colour the app gives it, so the eye can group */
      var tint=TYPE_TINT[r.typeKey];
      if(tint) rr.getCell(3).fill={type:'pattern',pattern:'solid',fgColor:{argb:tint}};
      for(var mc=7;mc<=NCOL;mc++){
        var c2=rr.getCell(mc);
        c2.border={bottom:{style:'hair',color:{argb:LINE}}};
        if(i%2===1) c2.fill={type:'pattern',pattern:'solid',fgColor:{argb:MINT}};
      }
    });

    return wb.xlsx.writeBuffer();
  }).then(function(buf){
    downloadBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
      null,'GharSeva_'+d.label+'.xlsx');
  });
}

/* Plain-text fallback, used when the spreadsheet library can't be fetched
   (offline). Same numbers, just without any of the presentation. */
function exportCSV(homeId,period,lang,members,workingDays){
  var d=buildReportData(homeId,period,lang,members,workingDays), t=d.t;
  var out=[];
  function section(title,rows){
    out.push([[title]].concat(rows).map(function(r){return r.map(csvCell).join(',');}).join('\n'));
  }
  section(t.exportSummaryTitle,[
    [t.homeName,d.home.name],[t.annYear,d.label],[t.exportGeneratedOn,d.generatedOn],
    [t.exportStaffCount,d.staffCount],[t.annTotal,d.totalSpend]
  ]);
  section(t.annPer,[[t.fname,t.frole,t.aTotSal,t.aTotAdv,t.aTotExp,t.aTotBon,t.aTotExtra,t.aTotShort,
    t.aTotLoan,t.tPresent,t.tLeave,t.tHoliday]].concat(
    d.staffRows.map(function(r){return [r.name,r.role,r.salary,r.advances,r.expenses,r.bonuses,
      r.overtime,r.halfDays,r.loanBal,r.present,r.leave,r.holiday];})));
  section(t.exportSheetPayments,[[t.fdate,t.fname,t.famount,t.paidBy]].concat(
    d.payRows.length?d.payRows.map(function(r){return [fmtD(r.date?toISODate(r.date):''),r.name,r.amount,r.paidBy];})
                    :[[t.exportNone]]));
  section(t.exportSheetEntries,[[t.fdate,t.fname,t.tType,t.famount,t.paidBy,t.freason]].concat(
    d.entryRows.length?d.entryRows.map(function(r){return [fmtD(r.date?toISODate(r.date):''),r.name,r.type,r.amount,r.paidBy,r.reason];})
                      :[[t.exportNone]]));
  section(t.profAttend,[[t.fname,t.exportMonthCol,t.tPresent,t.tLeave,t.tHoliday]].concat(
    d.attRows.length?d.attRows.map(function(r){return [r.name,r.month,r.present,r.leave,r.holiday];})
                    :[[t.exportNone]]));
  /* UTF-8 BOM so Hindi text opens correctly in Excel */
  downloadBlob('﻿'+out.join('\n\n'),'text/csv;charset=utf-8','GharSeva_'+d.label+'.csv');
}

/* Excel by default; quietly fall back to CSV if the library can't be
   fetched, so exporting still works with no connection. */
function exportReport(homeId,period,lang,members,workingDays,onState){
  onState&&onState('working');
  return exportExcel(homeId,period,lang,members,workingDays)
    .then(function(){ onState&&onState('done'); })
    .catch(function(e){
      console.warn('Excel export unavailable, falling back to CSV:',e);
      exportCSV(homeId,period,lang,members,workingDays);
      onState&&onState('csv');
    });
}
function downloadBackup(){
  var data={};
  lsKeys().forEach(function(k){if(k.startsWith('gs_'))data[k]=lsGet(k,null);});
  downloadBlob(JSON.stringify(data,null,2),'application/json','GharSeva_Backup_'+todayStr()+'.json');
}

/* ── WAIVED CHARGES ───────────────────────────────────────────
   A charge the employer has cancelled for one staff member for one month —
   "don't cut the loan this month". Keyed by staff+month, holding the names of
   the deduction lines to skip. Waiving is a decision about the household, not
   about one phone, so it syncs like everything else. */
function waiveKey(staffId,year,month){ return staffId+'_'+year+'_'+month; }
function getWaived(homeId,staffId,year,month){
  return getWaivers(homeId)[waiveKey(staffId,year,month)]||[];
}
function setWaived(homeId,staffId,year,month,list){
  var all=getWaivers(homeId), k=waiveKey(staffId,year,month);
  if(list&&list.length) all[k]=list; else delete all[k];
  fbSaveWaivers(homeId,all);
}

/* ── FIRESTORE WRITE WRAPPERS ─────────────────────────────────
   Each wrapper writes to localStorage first (instant UI update),
   then syncs to Firestore. Guest mode (FIREBASE_ENABLED=false)
   just does the localStorage write — no Firestore calls.         */
function fbSaveStaff(homeId, newStaff){
  var old=getStaff(homeId);
  saveStaff(homeId,newStaff);
  if(!FIREBASE_ENABLED||!fbDb) return;
  var batch=fbDb.batch();
  newStaff.forEach(function(s){ batch.set(fbDb.doc('homes/'+homeId+'/staff/'+s.id),s); });
  var newIds=newStaff.map(function(s){return s.id;});
  old.forEach(function(s){ if(!newIds.includes(s.id)) batch.delete(fbDb.doc('homes/'+homeId+'/staff/'+s.id)); });
  batch.commit().catch(function(e){console.warn('fbSaveStaff:',e);});
}
function fbDeleteStaffCascade(homeId, staffId){
  /* called after fbSaveStaff when a staff member is deleted */
  if(!FIREBASE_ENABLED||!fbDb) return;
  fbDb.collection('homes/'+homeId+'/leaves').get().then(function(snap){
    var b=fbDb.batch();
    snap.docs.forEach(function(d){ if(d.id.startsWith(staffId+'_')) b.delete(d.ref); });
    return b.commit();
  }).catch(function(){});
}

/* Migration: move existing localStorage data into the cloud household */
/* Households on this device must stay separate in the cloud. The previous
   version looped over every local household and wrote all of them into the
   single target household, so unrelated staff ended up merged together —
   and because leaves are keyed by staff member rather than by household,
   they were dumped in the same way.

   Now the household that was open goes into the one just set up, and every
   other local household carrying data gets a cloud household of its own.
   Resolves to the list of households newly created, so the caller can add
   them to the switcher. */
function migrateFromLocalStorage(targetHomeId, user, lang){
  if(!FIREBASE_ENABLED||!fbDb) return Promise.resolve([]);
  function hasData(h){
    return lsGet(SK.staff(h.id),[]).length>0
        || lsGet(SK.ledger(h.id),[]).length>0
        || lsGet(SK.payments(h.id),[]).length>0;
  }
  /* an empty household is not worth recreating in the cloud */
  var source=lsGet(SK.homes,[]).filter(hasData);
  if(source.length===0) return Promise.resolve([]);

  var active=getSettings().lastHomeId;
  var primary=source.find(function(h){return h.id===active;})||source[0];

  function copyInto(localId, cloudId){
    var batch=fbDb.batch();
    var staff=lsGet(SK.staff(localId),[]);
    staff.forEach(function(s){ batch.set(fbDb.doc('homes/'+cloudId+'/staff/'+s.id),s); });
    lsGet(SK.ledger(localId),[]).forEach(function(e){ batch.set(fbDb.doc('homes/'+cloudId+'/ledger/'+e.id),e); });
    lsGet(SK.payments(localId),[]).forEach(function(p){ batch.set(fbDb.doc('homes/'+cloudId+'/payments/'+p.key),p); });
    /* leaves carry no household of their own, so route each by its owner */
    staff.forEach(function(s){
      lsKeys().filter(function(k){return k.indexOf('gs_lv_'+s.id+'_')===0;}).forEach(function(k){
        batch.set(fbDb.doc('homes/'+cloudId+'/leaves/'+k.slice(6)),{dates:lsGet(k,{})});
      });
    });
    return batch.commit();
  }

  var created=[];
  return copyInto(primary.id,targetHomeId)
    .then(function(){
      return source.filter(function(h){return h.id!==primary.id;})
        .reduce(function(chain,h){
          return chain.then(function(){
            return cloudCreateHome(user,h.name,lang).then(function(entry){
              created.push({id:entry.id,name:entry.name});
              return copyInto(h.id,entry.id);
            });
          });
        },Promise.resolve());
    })
    .then(function(){
      /* creating those moved currentHomeId onto the last one; put it back
         on the household the user actually signed in to */
      if(created.length&&user){
        return fbDb.collection('users').doc(user.uid)
          .set({currentHomeId:targetHomeId},{merge:true}).catch(function(){});
      }
    })
    .then(function(){ return created; })
    .catch(function(e){ console.warn('Migration error:',e); return created; });
}

/* The sample records seeded above are demo content, so they should follow the
   interface language. Older builds seeded them in Hindi regardless of the
   chosen language, which left English users looking at Hindi names.
   A field is rewritten only when it still exactly matches the other
   language's seeded value — the moment the user edits anything, it stops
   matching and is left alone. Local data only: a cloud household is shared,
   and one member's language must not rewrite what the others see. */
function localizeDemoData(lang){
  var want=buildDemoData(lang), other=buildDemoData(lang==='hi'?'en':'hi');
  function relocalize(list, otherList, wantList, fields){
    var changed=false;
    list.forEach(function(rec){
      var o=otherList.find(function(x){return x.id===rec.id;});
      var w=wantList.find(function(x){return x.id===rec.id;});
      if(!o||!w) return;                       /* not a seeded record */
      fields.forEach(function(f){
        if(o[f]!==undefined && rec[f]===o[f] && rec[f]!==w[f]){ rec[f]=w[f]; changed=true; }
      });
    });
    return changed;
  }
  var homes=getHomes(), staff=getStaff(SH1), ledger=getLedger(SH1);
  var hDone=relocalize(homes, other.homes, want.homes, ['name']);
  var sDone=relocalize(staff, other.staff, want.staff, ['name','nickname','notes']);
  var lDone=relocalize(ledger, other.ledger, want.ledger, ['reason']);
  if(hDone) saveHomes(homes);
  if(sDone) saveStaff(SH1,staff);
  if(lDone) saveLedger(SH1,ledger);
  return hDone||sDone||lDone;
}
function seedIfNeeded(lang){

  saveLeaves(demo.leaves.staffId,demo.leaves.ym,demo.leaves.dates);

}

  fbSaveLedger(homeId,demo.ledger);
  fbSaveLeaves(homeId,demo.leaves.staffId,demo.leaves.ym,demo.leaves.dates);
}

/* ── CLOUD HOUSEHOLD CREATE / JOIN ─────────────────────────────
   The Firestore half only — resolving to the new {id,name,workingDays}.
   Saving to localStorage and switching the active household is left to
   the caller, because first-time setup replaces the whole list while
   adding a second household from Settings appends to it.

   homeIds uses arrayUnion in both: a plain array with {merge:true} would
   overwrite, so creating a second household would drop the first. */
function cloudCreateHome(user, name, lang){
  var homeId='hm_'+uid();
  var inviteCode=Math.random().toString(36).slice(2,8).toUpperCase();
  var myName=displayNameOf(user);
  var homeDoc={name:name.trim(),ownerId:user.uid,memberIds:[user.uid],
    members:{[user.uid]:{name:myName,color:memberColor(user.uid)}},
    inviteCode:inviteCode,workingDays:26,roles:[],lang:lang};
  return fbDb.collection('homes').doc(homeId).set(homeDoc)
    .then(function(){
      /* Publish the code to its own lookup document. Joiners read this
         instead of searching /homes, which they have no permission to do
         until they are already a member. */
      return fbDb.collection('invites').doc(inviteCode).set({homeId:homeId});
    })
    .then(function(){
      return fbDb.collection('users').doc(user.uid).set(
        {displayName:myName,
         homeIds:firebase.firestore.FieldValue.arrayUnion(homeId),
         currentHomeId:homeId},{merge:true});
    })
    .then(function(){ return {id:homeId,name:homeDoc.name,workingDays:26}; });
}

/* Joining cannot search /homes: the rules only permit reading a household
   you already belong to, which is the very thing you are trying to become.
   So resolve the code through /invites/{CODE} — a single known document that
   reveals nothing but a household id — then append yourself. Reading the
   household itself is deferred until after that, when it is permitted. */
function cloudJoinHome(user, code){
  var CODE=(code||'').toUpperCase(), homeId='';
  return fbDb.collection('invites').doc(CODE).get()
    .then(function(inv){
      if(!inv.exists||!inv.data().homeId) throw new Error('__notfound');
      homeId=inv.data().homeId;
      /* arrayUnion so we never have to read memberIds first */
      var patch={memberIds:firebase.firestore.FieldValue.arrayUnion(user.uid)};
      patch['members.'+user.uid]={name:displayNameOf(user),color:memberColor(user.uid)};
      return fbDb.collection('homes').doc(homeId).update(patch);
    })
    .then(function(){
      return fbDb.collection('homes').doc(homeId).get();   /* now a member */
    })
    .then(function(doc){
      var hd=(doc.exists&&doc.data())||{};
      return fbDb.collection('users').doc(user.uid).set(
        {displayName:displayNameOf(user),
         homeIds:firebase.firestore.FieldValue.arrayUnion(homeId),
         currentHomeId:homeId},{merge:true}).then(function(){ return hd; });
    })
    .then(function(hd){ return {id:homeId,name:hd.name||'',workingDays:hd.workingDays||26}; });
}

/* ── UTILS ──────────────────────────────────────────────────── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function fmt(n){return '₹'+Number(n||0).toLocaleString('en-IN');}
function fmtD(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
/* Local calendar date, not UTC. toISOString() converts to UTC first, so in
   India (UTC+5:30) every moment before 5:30am reported yesterday's date —
   a payment or an entry recorded early in the morning was filed a day back,
   and an exported ledger showed every row one day early. */
function toISODate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return toISODate(new Date()); }
function padYM(y,m){return y+'-'+String(m).padStart(2,'0');}
function maskAadhaar(n){if(!n)return '—';var c=n.replace(/\D/g,'');return c.length>=4?'****-****-'+c.slice(-4):'****';}
function maskAccount(n){if(!n)return '—';return n.length<=4?n:'*'.repeat(Math.max(0,n.length-4))+n.slice(-4);}
function roleLabel(key,lang){var r=getRoles().find(function(r){return r.key===key;});return r?(lang==='hi'?r.hi:r.en):key;}

/* What is genuinely still owed on one loan entry. */
function loanRemaining(e){
  return Math.max(0,(e.amount||0)-(e.paidInstallments||0)*(e.installment||0)-(e.manualRepaid||0));
}

/* What this loan may take from this month's salary. Never more than is still
   owed: a ₹5,000 loan repaid at ₹2,000 has only ₹1,000 left on the third
   month, and deducting the full instalment there overcharged the staff
   member by ₹1,000 every time a loan did not divide evenly. */
function loanDue(e){
  return Math.min(e.installment||0,loanRemaining(e));
}

function listActiveLoans(staffId,ledger){
  return (ledger||[]).filter(function(e){
    return e.staffId===staffId&&e.type==='loan'&&e.status==='active';
  });
}

function getLoanBal(staffId,ledger){
  return listActiveLoans(staffId,ledger).reduce(function(s,e){return s+loanRemaining(e);},0);
}

/* What this staff member was paid per month at a given point in time.
   staff.salary is only ever the CURRENT figure, so using it to work out an
   older month silently rewrote history: give someone a raise in July and
   every earlier unpaid month, and every estimate in the Annual view, would
   claim they had always been on the new rate. salaryHistory records each rate
   with the month it took effect; months before the earliest entry fall back
   to it, since that is the rate they joined on. */
function salaryFor(staff,year,month){
  var h=staff&&staff.salaryHistory;
  if(!h||!h.length) return (staff&&staff.salary)||0;
  var ym=padYM(year,month), best=null, earliest=null;
  h.forEach(function(e){
    if(!earliest||e.ym<earliest.ym) earliest=e;
    if(e.ym<=ym&&(!best||e.ym>best.ym)) best=e;
  });
  return (best||earliest).amount||0;
}

/* ISO date -> local Date. Built from parts rather than new Date(string),
   which parses a bare date as UTC midnight and can land on the previous day
   in a positive-offset zone such as IST. */
function parseISO(s){
  var p=String(s||'').split('-');
  return p.length<3?null:new Date(+p[0],+p[1]-1,+p[2]);
}

/* How much of a month a staff member was actually employed for. Joining on the
   20th earns twenty-days-fewer than a full month, and joiningDate was until
   now recorded and displayed but never used in any calculation, so a new
   starter was shown a full month's pay for their first part-month. */
function employedDays(staff,year,month){
  var monthDays=new Date(year,month,0).getDate();
  var first=new Date(year,month-1,1), last=new Date(year,month-1,monthDays);
  var join=parseISO(staff&&staff.joiningDate), left=parseISO(staff&&staff.leavingDate);
  var start=join&&join>first?join:first;
  var end=left&&left<last?left:last;
  if(end<start) return {days:0,monthDays:monthDays,partial:true};
  var days=Math.round((end-start)/86400000)+1;
  return {days:days,monthDays:monthDays,partial:days<monthDays};
}

/* Someone who has left. Their records stay for reporting, but they no longer
   appear where the app is asking what to do next. */
function hasLeft(staff){
  var d=parseISO(staff&&staff.leavingDate);
  return !!d&&d<=new Date();
}

/* Record a rate change. The rate in force until now has to be captured first,
   or the months before the change would inherit the new figure — the very bug
   this exists to stop. */
function withSalaryChange(staff,newAmount,fromYm){
  var h=(staff.salaryHistory||[]).slice();
  if(!h.length){
    var joinYm=(staff.joiningDate||'').slice(0,7)||'0000-01';
    h.push({ym:joinYm<fromYm?joinYm:'0000-01',amount:staff.salary||0});
  }
  h=h.filter(function(e){return e.ym!==fromYm;}).concat([{ym:fromYm,amount:newAmount}]);
  h.sort(function(a,b){return a.ym<b.ym?-1:a.ym>b.ym?1:0;});
  return h;
}

/* Every line that reduces the salary, in one place. The net is summed from
   this list alone, so a line cannot be waived in the display yet still
   deducted, and a new charge cannot be added to the total without also being
   waivable. Bonus and overtime are deliberately absent: they pay the staff
   member, so there is nothing to cancel. */
const DEDUCTION_KEYS=['leave','advances','expenses','loan','shortHours','carry'];

/* What last month could not recover, now due this month. Only a month that
   was actually paid carries anything: an unsettled month is still open, so
   its shortfall is not yet a debt. */
function getCarryIn(homeId,staffId,year,month){
  if(!homeId) return 0;
  var py=month===1?year-1:year, pm=month===1?12:month-1;
  var rec=getPayments(homeId).find(function(p){return p.key===staffId+'_'+py+'_'+pm;});
  return rec?(rec.unrecovered||0):0;
}

function calcSalary(staff,year,month,ledger,workingDays,homeId){
  var ym=padYM(year,month);
  var lv=getLeaves(staff.id,ym);
  var leaveDays=0;
  Object.entries(lv).forEach(function(e){
    if(e[1]==='leave') leaveDays++;
  });
  /* The rate in force in THIS month, not whatever the staff member earns now,
     scaled down if they joined or left partway through it. */
  var fullRate=salaryFor(staff,year,month);
  var emp=employedDays(staff,year,month);
  var monthlyRate=emp.partial?Math.round(fullRate*emp.days/emp.monthDays):fullRate;
  /* A day off costs a normal day's pay, so leave is always docked at the full
     rate — it is not scaled a second time by a part-month. */
  var daily=fullRate/(workingDays||30);
  var items=(ledger||[]).filter(function(e){return e.staffId===staff.id && e.date && e.date.startsWith(ym);});
  function sum(type){ return items.filter(function(e){return e.type===type;}).reduce(function(s,e){return s+(e.amount||0);},0); }
  var bonuses=sum('bonus'), extraWork=sum('extra_work');

  /* Raw amounts — what each charge would be if nothing were waived. Shown in
     the breakdown (struck through when waived) so the employer can always see
     what was cancelled rather than the line silently disappearing. */
  var raw={
    leave:      Math.round(daily*leaveDays),
    advances:   sum('advance'),
    expenses:   sum('expense'),
    loan:       listActiveLoans(staff.id,ledger).reduce(function(s,e){return s+loanDue(e);},0),
    shortHours: sum('short_hours'),
    carry:      getCarryIn(homeId,staff.id,year,month)
  };
  var waived=homeId?getWaived(homeId,staff.id,year,month):[];
  var eff={}, totalDeduct=0;
  DEDUCTION_KEYS.forEach(function(k){
    eff[k]=waived.indexOf(k)>=0?0:raw[k];
    totalDeduct+=eff[k];
  });

  var net=monthlyRate-totalDeduct+bonuses+extraWork;
  /* Deductions can still exceed the salary — a ₹10,000 advance against ₹8,000
     of pay. You cannot hand over a negative amount, so netPayable stays
     clamped at zero and the remainder is reported as unrecovered, which the
     next month picks up as its carry-in. */
  return {baseSalary:monthlyRate,leaveDays:leaveDays,
          leaveDeduction:raw.leave,advances:raw.advances,expenses:raw.expenses,
          loanInst:raw.loan,shortHours:raw.shortHours,carryIn:raw.carry,
          bonuses:bonuses,extraWork:extraWork,
          loanBal:getLoanBal(staff.id,ledger),
          fullRate:fullRate,partMonth:emp.partial,partDays:emp.days,monthDays:emp.monthDays,
          raw:raw,eff:eff,waived:waived,totalDeduct:totalDeduct,
          netPayable:Math.max(0,net),unrecovered:Math.max(0,-net)};
}

/* What the staff member still owes the household.
   This is the latest settled month's shortfall, NOT a sum across months. Each
   month charges the previous month's shortfall as its carry-in, so that figure
   already contains everything still outstanding — adding the months together
   would count the same debt once per month it survived. */
function getOutstandingDues(staffId,payments){
  var latest=null;
  (payments||[]).forEach(function(p){
    if(p.staffId!==staffId) return;
    if(!latest||(p.year*12+p.month)>(latest.year*12+latest.month)) latest=p;
  });
  return latest?(latest.unrecovered||0):0;
}

/* Advance each active loan by the instalment that was actually deducted, and
   close any that are now fully repaid. Shared by both salary-payment paths so
   the two cannot drift apart. A loan closes once nothing is left owing, not
   merely once the instalment count is reached, so an uneven final instalment
   settles the loan instead of leaving a stray active balance. */
function applyLoanInstalments(ledger,staffId,waived){
  /* If the instalment was waived for this month, no money changed hands, so
     the loan must not move at all — advancing it here would pay the loan down
     out of nothing and quietly rob the staff member of an instalment. */
  if((waived||[]).indexOf('loan')>=0) return {ledger:ledger||[],advanced:[]};
  /* Which loans this payment actually moved is recorded on the payment, so an
     undo can put back exactly those and nothing else — loans taken out later,
     or closed by a cash repayment in the meantime, must not be disturbed. */
  var advanced=[];
  var next=(ledger||[]).map(function(e){
    if(e.staffId!==staffId||e.type!=='loan'||e.status!=='active') return e;
    var due=loanDue(e);
    /* Nothing left owing: tidy the status, but no instalment was taken, so
       this is not something an undo should reverse. */
    if(due<=0) return Object.assign({},e,{status:'closed'});
    var p=(e.paidInstallments||0)+1;
    var settled=(loanRemaining(e)-due)<=0||p>=(e.totalInstallments||Infinity);
    advanced.push(e.id);
    return Object.assign({},e,{paidInstallments:p,status:settled?'closed':'active'});
  });
  return {ledger:next,advanced:advanced};
}

/* The exact inverse: step back the instalment each named loan was advanced by,
   then let the outstanding balance decide whether it is open again, rather
   than assuming — a loan may since have been closed by a cash repayment, and
   that closure is not this payment's to undo. */
function revertLoanInstalments(ledger,staffId,loanIds){
  var ids=loanIds||[];
  if(!ids.length) return ledger||[];
  return (ledger||[]).map(function(e){
    if(e.staffId!==staffId||e.type!=='loan'||ids.indexOf(e.id)<0) return e;
    var upd=Object.assign({},e,{paidInstallments:Math.max(0,(e.paidInstallments||0)-1)});
    upd.status=loanRemaining(upd)>0?'active':'closed';
    return upd;
  });
}

/* A month may only be reopened if no later month has been settled. Undoing an
   earlier month would otherwise strand the later one: its carry-in came from
   this month's shortfall, and that shortfall is about to stop existing. */
function laterPaidMonth(payments,staffId,year,month){
  var after=(payments||[]).filter(function(p){
    return p.staffId===staffId&&(p.year*12+p.month)>(year*12+month);
  }).sort(function(a,b){return (a.year*12+a.month)-(b.year*12+b.month);});
  return after.length?after[0]:null;
}

/* Reopen a settled month: remove the payment, step the loans it advanced back,
   and note who reversed it. Written once and shared by every screen that
   offers an undo, so a reversal cannot mean two different things depending on
   where it was pressed. Returns false if the month may not be reopened. */
function undoSalaryPayment(homeId,rec,actorUid,actorName){
  var payments=getPayments(homeId);
  if(!rec||laterPaidMonth(payments,rec.staffId,rec.year,rec.month)) return false;
  fbSaveLedger(homeId,revertLoanInstalments(getLedger(homeId),rec.staffId,rec.loanAdvances));
  fbSavePayments(homeId,payments.filter(function(p){return p.key!==rec.key;}));
  fbSaveUndos(homeId,getUndos(homeId).concat([{
    id:uid(),key:rec.key,staffId:rec.staffId,year:rec.year,month:rec.month,
    amount:rec.amount||0,paidOn:rec.date||'',undoneOn:todayStr(),
    byUid:actorUid||'',byName:actorName||''
  }]));
  return true;
}

/* An older payment predates loanAdvances being recorded, so there is no way to
   know which loans it moved. The undo still works, but the loans must be put
   right by hand — better to say so than to guess and quietly corrupt one. */
function undoLoansUnknown(rec,ledger){
  return !!rec&&!rec.loanAdvances&&(ledger||[]).some(function(e){
    return e.staffId===rec.staffId&&e.type==='loan'&&(e.paidInstallments||0)>0;
  });
}

/* True when a recorded payment no longer matches what the month now works out
   to — an entry was added, edited or deleted after the salary was paid. */
function paymentIsStale(paidRec,calc){
  return !!(paidRec&&calc&&Number(paidRec.amount)!==Number(calc.netPayable));
}

/* The message goes to the staff member, so its language is about THEM — not
   about which language the employer happens to run the app in. It used to

    short_hours:n+' के कम घंटों की '+amt+' कटौती '+d+' को दर्ज हुई।',
    extra_help: (n?n+' की ':'')+'अतिरिक्त मदद का '+amt+' '+d+' को दर्ज हुआ।'
  };
  var en={
    advance:    'Advance of '+amt+' given to '+n+' on '+d+'.',
    loan:       'Loan of '+amt+' given to '+n+' on '+d+'.',
    leave:      'Leave recorded for '+n+' on '+d+'.',
    bonus:      'Bonus of '+amt+' given to '+n+' on '+d+'. 🎉',
    expense:    'Expense of '+amt+' recorded for '+n+' on '+d+'.',
    salary:     'Salary of '+amt+' paid to '+n+' on '+d+'. ✅',
    loan_repay: 'Loan repayment of '+amt+' received from '+n+' on '+d+'.',
    extra_work: 'Extra work pay of '+amt+' recorded for '+n+' on '+d+'.',
    short_hours:'Short hours deduction of '+amt+' recorded for '+n+' on '+d+'.',
    extra_help: 'Extra help of '+amt+(n?' by '+n:'')+' recorded on '+d+'.'
  };
  if(!hi[type]&&!en[type]) return '';

  var lines=[];
  if(mode!=='en') lines.push('नमस्ते! 🙏\n'+hi[type]);
  if(mode!=='hi') lines.push((mode==='en'?'Hello! 🙏\n':'')+en[type]);
  var sign=mode==='hi'?'— घरसेवा':mode==='en'?'— GharSeva':'— घरसेवा · GharSeva';
  return lines.join('\n\n')+'\n\n'+sign+(h?' · '+h:'');
}

function parseVoice(transcript,staffList){
  var t=transcript.toLowerCase();
  var foundStaff=null;
  for(var i=0;i<staffList.length;i++){
    var s=staffList[i];
    var terms=[];
    (s.name||'').split(' ').forEach(function(p){if(p.length>1) terms.push(p.toLowerCase());});
    if(s.nickname){s.nickname.split(' ').forEach(function(p){if(p.length>0) terms.push(p.toLowerCase());});}
    if(terms.some(function(p){return t.includes(p);})){foundStaff=s;break;}
  }

  var WORD_NUMS=[
    ['panch sau',500],['paanch sau',500],['पाँच सौ',500],['पांच सौ',500],
    ['ek hazaar',1000],['ek hazar',1000],['एक हज़ार',1000],['एक हजार',1000],
    ['do hazaar',2000],['दो हज़ार',2000],
    ['teen hazaar',3000],['तीन हज़ार',3000],
    ['char hazaar',4000],['चार हज़ार',4000],
    ['paanch hazaar',5000],['panch hazaar',5000],['पाँच हज़ार',5000],
    ['das hazaar',10000],['dus hazaar',10000],['दस हज़ार',10000],
    ['bees hazaar',20000],['बीस हज़ार',20000],
  ];
  var amount=null;
  for(var w=0;w<WORD_NUMS.length;w++){
    if(t.includes(WORD_NUMS[w][0])){amount=WORD_NUMS[w][1];break;}
  }
  if(amount===null){var amtM=t.match(/(\d+)/);if(amtM)amount=parseInt(amtM[1]);}

  var action=null;
  if(/took leave|was absent|absent|chutti|छुट्टी|nahi aayi|nahi aaya|chhutti|गैरहाज़िर|अनुपस्थित|नहीं आई|नहीं आया/.test(t)) action='leave';
  else if(/half.?day|half day|adha din|aadha din|आधा दिन|अधा दिन/.test(t)) action='short_hours';
  else if(/overtime|over.?time|extra.*(hours?|kaam|work)|ओवरटाइम|अतिरिक्त/.test(t)) action='extra_work';
  else if(/advance|peshgi|agrim|अग्रिम|पेशगी|एडवांस/.test(t)) action='advance';
  else if(/\bloan\b|udhar diya|udhaar|कर्ज़|उधार|लोन/.test(t)) action='loan';
  else if(/bonus|inaam|बोनस|इनाम/.test(t)) action='bonus';
  else if(/expense|kharcha|खर्च|खर्चा/.test(t)) action='expense';

  var hours=null;
  var hoursM=t.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|घंटे?)/);
  if(hoursM) hours=parseFloat(hoursM[1]);

  return {foundStaff:foundStaff,action:action,amount:amount,hours:hours,transcript:transcript};
}

/* ── MIC BUTTON ─────────────────────────────────────────────── */
function MicButton({lang,onResult,style}){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var [listening,setListening]=useState(false);
  var recRef=useRef(null);
  var t=T[lang];
  if(!SR) return null;
  function toggle(){
    if(listening){
      recRef.current&&recRef.current.stop();
      setListening(false);
    } else {
      var rec=new SR();
      rec.lang=lang==='hi'?'hi-IN':'en-IN';
      rec.interimResults=false;
      rec.onresult=function(e){
        var tr=e.results[0][0].transcript;
        setListening(false);
        onResult(tr);
      };
      rec.onerror=function(){setListening(false);};
      rec.onend=function(){setListening(false);};
      rec.start(); recRef.current=rec; setListening(true);
    }
  }
  return (
    <button onClick={toggle} title={t.micSpeak}
      style={Object.assign({},{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:12,border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:fsr(13),
        background:listening?'var(--danger)':'var(--accent)',color:'#fff',transition:'all .15s',whiteSpace:'nowrap'},style||{})}>
      {listening?<span style={{fontSize:fsr(15),lineHeight:1}}>■</span>:<Icon name="mic" size={18} />}
      <span>{listening?t.micStop:t.micSpeak}</span>
      {listening&&<span style={{fontSize:fsr(11),opacity:.85}}>{t.micListening}</span>}
    </button>
  );
}

/* Shared by every "who paid this" picker (entries, salary payments): a
   household member, or "Someone else" with a free-text name suggested from

function PaidBySelector({t,mc,memberIds,value,nameValue,onChange,onNameChange,suggestions,idSuffix}){
  var listId='ext-payer-names-'+(idSuffix||'x');
  /* Native <datalist> barely works on the phones this app targets — iOS
     Safari doesn't show it at all, mobile Chrome shows at most one inline

     the datalist stays too, harmless for anyone typing on a desktop. */
  var filtered=useMemo(function(){
    var q=(nameValue||'').trim().toLowerCase();

}

function WACard({message,phone,t}){
  var [copied,setCopied]=useState(false);
  function doCopy(){
    try{
      navigator.clipboard.writeText(message).then(function(){setCopied(true);setTimeout(function(){setCopied(false);},2000);});
    }catch(e){
      var ta=document.createElement('textarea');
      ta.value=message; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); setCopied(true); setTimeout(function(){setCopied(false);},2000);
    }
  }
  function doWA(){
    /* phone is stored normalized to a bare 10-digit number where possible
       (see normalizePhone), but older records or a foreign number may still
       be longer — don't blindly prepend 91 on top of an existing code. */
    var digits=(phone||'').replace(/\D/g,'');
    var ph=digits.length===10?'91'+digits:digits.length>10?digits:'';
    window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(message),'_blank');
  }
  return (
    <div className="mt-4 rounded-2xl p-3" style={{border:'2px solid #A8D4C4',background:'#D5EEE8'}}>
      <p style={{fontSize:fsr(12),fontWeight:700,color:'#1A6E5E',marginBottom:8}}>{t.waTitle}</p>
      <pre style={{fontSize:fsr(12),color:'var(--ink)',whiteSpace:'pre-wrap',fontFamily:'inherit',marginBottom:12,lineHeight:1.6}}>{message}</pre>
      <div className="flex gap-2">
        <button onClick={doCopy} className="flex-1 rounded-xl font-bold text-sm" style={{padding:'10px',border:'2px solid #1A6E5E',color:'#1A6E5E',background:'#fff',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
          {copied?t.waCopied:t.waCopy}
        </button>
        <button onClick={doWA} className="flex-1 rounded-xl text-sm font-bold" style={{padding:'10px',background:'#1A6E5E',color:'#fff',border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
          {t.waOpen}
        </button>
      </div>
    </div>
  );
}

    setAllRoles(updated);
    set('role',key);
    setNewRoleName('');
    setAddingRole(false);
  }

  function handlePhoto(e){
    var file=e.target.files[0]; if(!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){set('photo',ev.target.result);};
    reader.readAsDataURL(file);
  }
  var [errMsg,setErrMsg]=useState('');
  var [raiseFrom,setRaiseFrom]=useState(todayStr().slice(0,7));
  /* Only an edit that actually moves the number is a rate change; retyping the
     same figure, or filling in a brand-new staff member, is not. */
  var salaryChanged=!!existing&&Number(form.salary||0)!==Number(existing.salary||0);

  function handleSave(){
    if(!form.name.trim()){setErrMsg(t.errName);return;}
    var amount=Number(form.salary)||0;
    var next=Object.assign({},form,{id:existing?existing.id:uid(),salary:amount,phone:normalizePhone(form.phone||'')});
    if(salaryChanged) next.salaryHistory=withSalaryChange(existing,amount,raiseFrom);
    onSave(next);
  }

  return (
    <Modal onClose={onClose} title={existing?t.editStaff:t.addStaff}>
      {errMsg&&<Toast msg={errMsg} onDone={function(){setErrMsg('');}} />}
      <div className="flex justify-center mb-5">
        <label className="cursor-pointer flex flex-col items-center">
          {form.photo
            ? <img src={form.photo} className="w-24 h-24 rounded-full object-cover" style={{border:'4px solid var(--accent2)'}} />
            : <div className="w-24 h-24 rounded-full flex flex-col items-center justify-center" style={{background:'var(--surface2)',border:'2px dashed var(--border)',color:'var(--muted)'}}>
                <span style={{color:'var(--muted)'}}><Icon name="camera" size={30} /></span>
                <span style={{fontSize:fsr(11),marginTop:4}}>{t.addPhoto}</span>
              </div>
          }
          {form.photo && <span style={{fontSize:fsr(12),color:'var(--accent)',marginTop:4,fontWeight:700}}>{t.changePhoto}</span>}
          <input type="file" accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" ref={fileRef} />
        </label>
      </div>

      <FLabel label={t.fname} req={true}><FInput tut="staff-name" value={form.name} onChange={function(v){set('name',v);}} placeholder={t.fnamePh} /></FLabel>
      <FLabel label={t.nickname}><FInput value={form.nickname} onChange={function(v){set('nickname',v);}} placeholder={t.nicknamePh} /></FLabel>
      <FLabel label={t.frole}>
        <select className="sel" data-tut="staff-role" value={addingRole?'__add__':form.role} onChange={function(e){handleRoleChange(e.target.value);}}>
          {allRoles.map(function(r){return <option key={r.key} value={r.key}>{lang==='hi'?r.hi:r.en}</option>;})}
          <option value="__add__">+ {t.addRole}</option>
        </select>
        {addingRole && (
          <div className="flex gap-2 mt-2">
            <input value={newRoleName} onChange={function(e){setNewRoleName(e.target.value);}}
              onKeyDown={function(e){if(e.key==='Enter')addNewRole();}}
              placeholder={t.addRolePh} className="inp" style={{flex:1}} />
            <button onClick={addNewRole} className="btn btn-accent btn-sm">{t.addRoleBtn}</button>
            <button onClick={function(){setAddingRole(false);setNewRoleName('');}} aria-label="Cancel" className="btn btn-ghost btn-sm"><Icon name="close" size={16} /></button>
          </div>
        )}
      </FLabel>
      <FLabel label={t.fsalary}><FInput tut="staff-salary" type="number" value={form.salary} onChange={function(v){set('salary',v);}} placeholder={t.salaryPh} /></FLabel>
      {salaryChanged&&(
        <div className="rounded-2xl mb-4" style={{background:'#FDF3DC',border:'2px solid var(--warn)',padding:'12px 14px'}}>
          <p style={{fontSize:fsr(13),fontWeight:800,color:'#8B5E08',margin:'0 0 4px'}}>
            {t.raiseFromLabel.replace('{old}',fmt(existing.salary||0)).replace('{new}',fmt(Number(form.salary)||0))}
          </p>
          <div className="flex items-center gap-2" style={{margin:'0 0 8px'}}><p style={{fontSize:fsr(12),color:'#8B5E08',margin:0,flex:1}}>{t.raiseFromHint}</p><Help text={t.raiseFromHelp} label={t.raiseFromHint} /></div>
          <input type="month" value={raiseFrom} onChange={function(e){setRaiseFrom(e.target.value);}}
            className="inp" style={{width:'100%'}} />
        </div>
      )}
      <FLabel label={t.fphone} hint={t.fphoneHint} help={t.fphoneHelp}><FInput type="tel" value={form.phone} onChange={function(v){set('phone',cleanPhoneDigits(v));}} placeholder={t.fphonePh} maxLength={20} /></FLabel>
      <FLabel label={t.fjoining}><FInput type="date" value={form.joiningDate} onChange={function(v){set('joiningDate',v);}} /></FLabel>
      {existing&&(
        <FLabel label={t.fleaving} hint={t.fleavingHint} help={t.fleavingHelp}>
          <FInput type="date" value={form.leavingDate||''} onChange={function(v){set('leavingDate',v);}} />
        </FLabel>
      )}
      <FLabel label={t.fpay} hint={t.hintPayDay}><FInput type="number" value={form.payDay} onChange={function(v){set('payDay',v);}} placeholder="1" /></FLabel>
      <FLabel label={t.fnotes}>
        <textarea value={form.notes||''} onChange={function(e){set('notes',e.target.value);}} placeholder={t.fnotesPh} className="ta" style={{height:80}} />
      </FLabel>

      <button onClick={function(){setShowVault(function(v){return !v;});}}
        className="w-full text-left py-3 px-4 rounded-xl mb-3 font-bold flex justify-between items-center"
        style={{background:'var(--surface2)',color:'var(--ink)',border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontSize:fsr(15)}}>
        <span>{t.vault}</span>
        <span style={{color:'var(--muted)',fontSize:fsr(13)}}>{showVault?'▲':'▼'}</span>
      </button>
      {showVault && (
        <div className="rounded-xl p-3 mb-4" style={{border:'1px solid var(--border)'}}>
          <FLabel label={t.vaadhaar} hint={t.vaadhaarH}><FInput type="number" value={form.aadhaar} onChange={function(v){set('aadhaar',v);}} placeholder="12-digit number" maxLength={12} /></FLabel>
          <FLabel label={t.vbank}><FInput value={form.bankName} onChange={function(v){set('bankName',v);}} placeholder={t.vbankPh} /></FLabel>
          <FLabel label={t.vaccount}><FInput value={form.accountNo} onChange={function(v){set('accountNo',v);}} placeholder="Account number" /></FLabel>
          <FLabel label={t.vifsc} hint={t.hintIFSC}><FInput value={form.ifsc} onChange={function(v){set('ifsc',v);}} placeholder="e.g. SBIN0001234" /></FLabel>
        </div>

      <div className="flex gap-3 mt-2">
        <PrimaryBtn onClick={onClose} color="gray" full={true}>{t.cancel}</PrimaryBtn>

/* ── QUICK LEAVE MODAL ──────────────────────────────────────── */
