/* Shown when a month's recorded payment no longer matches what it now works
   out to, so the two figures are never left contradicting each other in
   silence. Says plainly which way the difference went. */
function StaleNotice({paidRec,calc,t}){
  if(!paymentIsStale(paidRec,calc)) return null;
  var diff=Number(paidRec.amount)-Number(calc.netPayable);
  var line=(diff>0?t.staleMore:t.staleLess).replace('{amt}',fmt(Math.abs(diff)));
  return (
    <div className="rounded-2xl mb-4" style={{background:'#FDF3DC',border:'2px solid var(--warn)',padding:'12px 14px'}}>
      <p className="flex items-center gap-2" style={{fontSize:fsr(14),fontWeight:800,color:'#8B5E08',margin:0}}><Icon name="warning" size={16} />{t.staleTitle}</p>
      <div className="flex justify-between" style={{marginTop:8}}>
        <span style={{fontSize:fsr(13),color:'#8B5E08'}}>{t.staleRecorded}</span>
        <span style={{fontSize:fsr(13),fontWeight:800,color:'#8B5E08'}}>{fmt(paidRec.amount)}</span>
      </div>
      <div className="flex justify-between" style={{marginTop:2}}>
        <span style={{fontSize:fsr(13),color:'#8B5E08'}}>{t.staleNow}</span>
        <span style={{fontSize:fsr(13),fontWeight:800,color:'#8B5E08'}}>{fmt(calc.netPayable)}</span>
      </div>
      <p style={{fontSize:fsr(13),fontWeight:800,color:'#8B5E08',margin:'8px 0 0'}}>{line}</p>
    </div>
  );
}

/* Reopens a settled month. Two-step by design — reversing a payment moves loan
   instalments as well as the payment itself, so it should not be one stray tap
   on a phone. Refuses outright when a later month is already settled, naming
   the month that has to be undone first. */
function UndoPayment({rec,homeId,ledger,payments,t,mc,onDone}){
  var [ask,setAsk]=useState(false);
  if(!rec) return null;
  var blocker=laterPaidMonth(payments,rec.staffId,rec.year,rec.month);
  var loansUnknown=undoLoansUnknown(rec,ledger);
  var nLoans=(rec.loanAdvances||[]).length;

  if(blocker) return (
    <p style={{fontSize:fsr(12),color:'var(--muted)',marginTop:10,lineHeight:1.5}}>
      {t.undoBlocked.replace('{m}',t.mFull[blocker.month-1]+' '+blocker.year)}
    </p>
  );

  if(!ask) return (
    <button onClick={function(){setAsk(true);}}
      style={{marginTop:12,padding:'9px 16px',borderRadius:12,cursor:'pointer',
        border:'2px solid var(--border)',background:'var(--surface)',color:'var(--ink2)',
        fontWeight:800,fontSize:fsr(13),fontFamily:'Nunito,sans-serif'}}>
      <Icon name="undo" size={17} style={{display:'inline-block',verticalAlign:'-3px',marginRight:6}} />{t.undoPay}
    </button>
  );

  return (
    <div className="rounded-2xl" style={{marginTop:12,background:'#FDF3DC',border:'2px solid var(--warn)',padding:'12px 14px',textAlign:'left'}}>
      <p style={{fontSize:fsr(14),fontWeight:800,color:'#8B5E08',margin:0}}>{t.undoConfirm}</p>
      <ul style={{margin:'8px 0 0',paddingLeft:18,color:'#8B5E08',fontSize:fsr(13),lineHeight:1.6}}>
        <li>{t.undoWillRemove.replace('{amt}',fmt(rec.amount||0))}</li>
        {nLoans>0&&<li>{t.undoWillRestore.replace('{n}',nLoans)}</li>}
        {loansUnknown&&<li style={{fontWeight:800}}>{t.undoLoanUnknown}</li>}
      </ul>
      <div className="flex gap-2" style={{marginTop:12}}>
        <button onClick={function(){setAsk(false);}}
          style={{flex:1,padding:'10px',borderRadius:12,border:'2px solid var(--border)',background:'var(--surface)',
            color:'var(--ink2)',fontWeight:800,fontSize:fsr(14),cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
          {t.cancel}
        </button>
        <button onClick={function(){
            /* On a single-device household there is nobody to attribute this
               to, so the log records no name rather than a placeholder. */
            var named=mc&&!mc.guestMode&&mc.uid;
            var ok=undoSalaryPayment(homeId,rec,named?mc.uid:'',named?memberLabel(mc.uid,mc.members,t):'');
            setAsk(false);
            if(ok) onDone&&onDone();
          }}
          style={{flex:1,padding:'10px',borderRadius:12,border:'none',background:'var(--danger)',
            color:'#fff',fontWeight:800,fontSize:fsr(14),cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
          {t.undoYes}
        </button>
      </div>
    </div>
  );
}

/* The part of this month's deductions the salary could not cover. */
function UnrecoveredNotice({calc,t}){

}

/* ── SALARY PAY MODAL ───────────────────────────────────────── */
function SalaryPayModal({staff,lang,homeId,homes,workingDays,onClose,onPaid}){
  var t=T[lang];
  var now=new Date();
  /* Salary in an Indian household is usually handed over at the start of the
     following month, so this was fixed to today and quietly recorded July's
     pay against August. The month is now chosen, defaulting to today's. */
  var [month,setMonth]=useState(now.getMonth()+1);
  var [year,setYear]=useState(now.getFullYear());
  var [ledger,setLedger]=useState(function(){return getLedger(homeId);});
  var [payments,setPayments]=useState(function(){return getPayments(homeId);});
  var [done,setDone]=useState(false);
  var [waMsg,setWAMsg]=useState('');
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showPaidBy=!mc.guestMode&&memberIds.length>0;
  var [payer,setPayer]=useState(mc.uid||'');
  var [payerName,setPayerName]=useState('');
  var payerSuggestions=useMemo(function(){ return showPaidBy?getExternalPayerNames(homeId):[]; },[showPaidBy,homeId]);
  var [payerErr,setPayerErr]=useState('');
  var payKey=staff.id+'_'+year+'_'+month;
  var paidRec=payments.find(function(p){return p.key===payKey;});
  var calc=calcSalary(staff,year,month,ledger,workingDays,homeId);
  /* Built from the effective amounts, not the raw ones: a charge cancelled in
     the Pay tab falls to zero here and drops out of the list, so this modal
     can never show a deduction the net has already excluded. */
  var rows=[{label:t.rBase,val:calc.baseSalary,color:'var(--ink)'}];
  if(calc.eff.leave>0) rows.push({label:t.rLeave+' ('+calc.leaveDays+' '+t.tDays+')',val:-calc.eff.leave,color:'var(--danger)'});
  if(calc.eff.advances>0) rows.push({label:t.rAdv,val:-calc.eff.advances,color:'var(--warn)'});
  if(calc.eff.expenses>0) rows.push({label:t.rExp,val:-calc.eff.expenses,color:'var(--warn)'});
  if(calc.eff.loan>0) rows.push({label:t.rLoan,val:-calc.eff.loan,color:'var(--purple)'});
  if(calc.eff.carry>0) rows.push({label:t.rCarry,val:-calc.eff.carry,color:'var(--danger)'});
  if(calc.bonuses>0) rows.push({label:t.rBonus,val:calc.bonuses,color:'var(--ok)'});
  if(calc.extraWork>0) rows.push({label:t.rExtraWork,val:calc.extraWork,color:'var(--ok)'});
  if(calc.eff.shortHours>0) rows.push({label:t.rShortHours,val:-calc.eff.shortHours,color:'var(--warn)'});
  function doConfirm(){
    if(paidRec||done) return;
    if(showPaidBy&&payer==='other'&&!payerName.trim()){setPayerErr(t.errPayerName);return;}
    setPayerErr('');
    var pDate=todayStr();
    var home=homes.find(function(h){return h.id===homeId;})||{name:''};
    var rec={key:payKey,staffId:staff.id,year:year,month:month,amount:calc.netPayable,date:pDate};
    if(calc.unrecovered>0) rec.unrecovered=calc.unrecovered;
    if(showPaidBy&&payer){
      rec.paidBy=payer;
      if(payer==='other'&&payerName.trim()) rec.paidByName=payerName.trim();
    }
    var loans=applyLoanInstalments(ledger,staff.id,calc.waived);
    rec.loanAdvances=loans.advanced;
    var newPays=payments.concat([rec]);
    fbSavePayments(homeId,newPays); fbSaveLedger(homeId,loans.ledger);
    setPayments(newPays); setLedger(loans.ledger);
    setDone(true);
    setWAMsg(waTemplate('salary',staff,calc.netPayable,pDate,home.name,lang));
    onPaid&&onPaid();
  }
  return (
    <Modal onClose={onClose} title={t.profPaySalary}>
      <div className="flex items-center gap-3 mb-4 p-3 rounded-2xl" style={{background:'var(--surface2)'}}>
        <Avatar staff={staff} size={48} />
        <div>
          <p style={{fontWeight:800,fontSize:fsr(17),color:'var(--ink)',margin:0}}>{staff.name}</p>
          <p style={{fontSize:fsr(13),color:'var(--ink2)',margin:0}}>{t.mFull[month-1]} {year}</p>
        </div>
      </div>
      {!(done||paidRec)&&(
        <div className="flex gap-3 mb-4">
          <div style={{flex:2}}>
            <FLabel label={t.selMonth}>
              <FSelect value={String(month)} onChange={function(v){setMonth(Number(v));setDone(false);setWAMsg('');}}>
                {t.mFull.map(function(m,i){return <option key={i} value={i+1}>{m}</option>;})}
              </FSelect>
            </FLabel>
          </div>
          <div style={{flex:1}}>
            <FLabel label={t.selYear}>
              <FSelect value={String(year)} onChange={function(v){setYear(Number(v));setDone(false);setWAMsg('');}}>
                {[now.getFullYear()-1,now.getFullYear()].map(function(y){return <option key={y} value={y}>{y}</option>;})}
              </FSelect>
            </FLabel>
          </div>
        </div>
      )}
      <div className="rounded-2xl overflow-hidden mb-4" style={{border:'1px solid var(--border)'}}>
        {rows.map(function(row,i){
          return (
            <div key={i} className="flex items-center justify-between px-4 py-3" style={{borderBottom:'1px solid var(--border)',background:i%2===0?'var(--surface)':'var(--surface2)'}}>
              <span style={{fontSize:fsr(15),color:'var(--ink2)'}}>{row.label}</span>
              <span style={{fontSize:fsr(15),fontWeight:700,color:row.color}}>{row.val>0?'+':''}{fmt(Math.abs(row.val))}</span>
            </div>
          );
        })}
        <div className="flex items-center justify-between px-4 py-4" style={{background:'var(--accent)'}}>
          <span style={{color:'#fff',fontWeight:700,fontSize:fsr(18)}}>{t.rNet}</span>
          <span style={{color:'#fff',fontWeight:800,fontSize:fsr(24)}}>{fmt(calc.netPayable)}</span>
        </div>
      </div>
      <UnrecoveredNotice calc={calc} t={t} />
      <StaleNotice paidRec={paidRec} calc={calc} t={t} />
      {!(done||paidRec)&&showPaidBy&&(
        <div>
          {payerErr&&<p style={{fontSize:fsr(13),color:'var(--danger)',fontWeight:700,marginBottom:8}}>{payerErr}</p>}
          <PaidBySelector t={t} mc={mc} memberIds={memberIds} idSuffix="salarypay"
            value={payer} nameValue={payerName} suggestions={payerSuggestions}
            onChange={setPayer} onNameChange={setPayerName} />
        </div>
      )}
      {(done||paidRec)
        ? <div className="text-center">
            <p style={{color:'var(--ok)',fontSize:fsr(18),fontWeight:800,padding:'8px 0'}} className="flex items-center justify-center gap-2"><Icon name="check" size={19} strokeWidth={2.6} />{t.paidOk}</p>
            {paidRec&&paidRec.paidBy&&(
              <p style={{fontSize:fsr(13),color:'var(--ink2)',marginBottom:8}}>
                {t.paidBy}: <b>{payerLabel(paidRec,mc.members,t)}</b>
              </p>
            )}
            {waMsg&&<WACard message={waMsg} phone={staff.phone} t={t} />}
            <UndoPayment rec={paidRec||payments.find(function(p){return p.key===payKey;})}
              homeId={homeId} ledger={ledger} payments={payments} t={t} mc={mc}
              onDone={function(){
                setPayments(getPayments(homeId)); setLedger(getLedger(homeId));
                setDone(false); setWAMsg('');
                onPaid&&onPaid();
              }} />
          </div>
        : <PrimaryBtn onClick={doConfirm} color="green" full={true}>{t.profConfirmPay}</PrimaryBtn>
      }
    </Modal>
  );
}

/* ── STAFF PROFILE PAGE ─────────────────────────────────────── */
function StaffProfile({staff,lang,homeId,homes,workingDays,onBack,onStaffChange}){
  var t=T[lang];
  var now=new Date();
  var month=now.getMonth()+1;
  var year=now.getFullYear();
  var ym=padYM(year,month);
  var [ledger,setLedger]=useState(function(){return getLedger(homeId);});
  var [payments,setPayments]=useState(function(){return getPayments(homeId);});
  var [showPayModal,setShowPayModal]=useState(false);
  var [showEntryModal,setShowEntryModal]=useState(null);
  var [showLeaveModal,setShowLeaveModal]=useState(false);
  var [toast,setToast]=useState('');
  var calc=useMemo(function(){return calcSalary(staff,year,month,ledger,workingDays,homeId);},[ledger,workingDays,staff,homeId,payments]);
  var leaveMap=getLeaves(staff.id,ym);
  var leaveCount=0,holidayCount=0;
  Object.values(leaveMap).forEach(function(v){if(v==='leave')leaveCount++;else if(v==='holiday')holidayCount++;});
  var thisMonthAdv=ledger.filter(function(e){return e.staffId===staff.id&&e.date&&e.date.startsWith(ym)&&e.type==='advance';});
  var thisMonthHalf=ledger.filter(function(e){return e.staffId===staff.id&&e.date&&e.date.startsWith(ym)&&e.type==='short_hours';});
  var activeLoans=ledger.filter(function(e){return e.staffId===staff.id&&e.type==='loan'&&e.status==='active';});
  var payKey=staff.id+'_'+year+'_'+month;
  var paidRec=payments.find(function(p){return p.key===payKey;});
  var duesTotal=getOutstandingDues(staff.id,payments);
  var [txnPeriod,setTxnPeriod]=useState('month');

  /* One list per person, drawn from both books: the ledger holds advances,
     loans and the rest, while salary payments live separately. Shown together
     because from the staff member's side there is no such distinction — it is
     all money that changed hands. */
  var txns=useMemo(function(){
    var from='', to='9999-99';
    if(txnPeriod==='month'){ from=padYM(year,month); to=from; }
    else if(txnPeriod==='last'){ var ly=month===1?year-1:year, lm=month===1?12:month-1; from=padYM(ly,lm); to=from; }
    else if(txnPeriod==='year'){ from=year+'-01'; to=year+'-12'; }
    function inRange(d){ var ym=(d||'').slice(0,7); return txnPeriod==='all'||(ym>=from&&ym<=to); }

    var typeLabels={advance:t.tAdv,loan:t.tLoan,expense:t.tExp,bonus:t.tBonus,loan_repay:t.tLoanRepay,
                    extra_work:t.tExtraWork,short_hours:t.tShortHours,extra_help:t.tExtraHelp};
    var rows=[], paid=0, given=0;
    ledger.forEach(function(e){
      if(e.staffId!==staff.id||!inRange(e.date)) return;
      rows.push({id:'l'+e.id,date:e.date,kind:e.type,label:typeLabels[e.type]||e.type,
                 amount:e.amount||0,note:e.reason||''});
      /* Advances and expenses are money handed over on top of salary; the rest
         are adjustments that land inside it, so they are not counted here. */
      if(e.type==='advance'||e.type==='expense') given+=e.amount||0;
    });
    payments.forEach(function(p){
      if(p.staffId!==staff.id) return;
      var ym=padYM(p.year,p.month);
      if(!(txnPeriod==='all'||(ym>=from&&ym<=to))) return;
      rows.push({id:'p'+p.key,date:p.date||ym+'-01',kind:'salary',
                 label:t.profTxnSalary+' · '+t.months[p.month-1]+' '+p.year,
                 amount:p.amount||0,note:''});
      paid+=p.amount||0;
    });
    rows.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
    return {rows:rows,paid:paid,given:given};
  },[ledger,payments,staff.id,txnPeriod,year,month,lang]);
  var undoneHere=useMemo(function(){
    return getUndos(homeId).filter(function(u){return u.staffId===staff.id;})
      .sort(function(a,b){return (b.year*12+b.month)-(a.year*12+a.month);}).slice(0,4);
  },[homeId,staff.id,payments]);
  var halfDayCount=thisMonthHalf.length;
  var presentDays=Math.max(0,workingDays-leaveCount-halfDayCount*0.5);
  var initials=(staff.name||'?').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  function refreshData(){setLedger(getLedger(homeId));setPayments(getPayments(homeId));onStaffChange&&onStaffChange();}
  function onSaveEntry(entry){
    var next=ledger.concat([entry]);
    if(entry.type==='loan_repay'&&entry.targetLoanId){
      next=next.map(function(e){
        if(e.id===entry.targetLoanId){
          var nr=(e.manualRepaid||0)+entry.amount;
          var tp=(e.paidInstallments||0)*(e.installment||0)+nr;
          return Object.assign({},e,{manualRepaid:nr,status:tp>=e.amount?'closed':'active'});
        }
        return e;
      });
    }
    fbSaveLedger(homeId,next); setLedger(next); setShowEntryModal(null); setToast(t.savedOk);
  }
  var allStaff=getStaff(homeId);
  var actions=[
    {icon:'salary', label:paidRec?t.profAlreadyPaid:t.profPaySalary,onClick:function(){setShowPayModal(true);},color:paidRec?'var(--muted)':'var(--ok)',disabled:!!paidRec},
    {icon:'advance',label:t.profRecAdv,onClick:function(){setShowEntryModal('advance');},color:'var(--warn)',disabled:false},
    {icon:'loan',   label:t.profRecLoan,onClick:function(){setShowEntryModal('loan_repay');},color:'var(--purple)',disabled:false},
    {icon:'calendar',label:t.profMarkLeave,onClick:function(){setShowLeaveModal(true);},color:'var(--danger)',disabled:false},
  ];
  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      {toast&&<Toast msg={toast} onDone={function(){setToast('');}} />}
      {/* Back bar */}
      <div className="shrink-0 flex items-center gap-3 px-4 py-3" style={{background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
        <button onClick={onBack}
          style={{background:'var(--surface2)',border:'none',cursor:'pointer',borderRadius:10,padding:'8px 14px',fontWeight:800,fontSize:fsr(14),color:'var(--ink)',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'}}>
          <Icon name="chevronLeft" size={18} style={{display:'inline-block',verticalAlign:'-3px',marginRight:4}} />{t.profBack}
        </button>
        <p style={{flex:1,fontWeight:800,fontSize:fsr(17),color:'var(--ink)',margin:0}} className="truncate">{staff.name}</p>
      </div>
      <div className="scroll-area flex-1 p-4" style={{display:'flex',flexDirection:'column',gap:16}}>

        {/* ① Personal Info */}
        <div className="card fade-in">
          <div className="flex items-center gap-4 mb-4">
            <Avatar staff={staff} size={72} />
            <div>
              <p style={{fontSize:fsr(22),fontWeight:800,color:'var(--ink)',margin:0}}>{staff.name}</p>
              {staff.nickname&&<p style={{fontSize:fsr(13),color:'var(--muted)',margin:'2px 0 0'}}>{staff.nickname}</p>}
              <span className="pill pill-muted" style={{marginTop:6,display:'inline-block'}}>{roleLabel(staff.role,lang)}</span>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2 mb-3">
            {staff.joiningDate&&(
              <div className="rounded-xl p-3" style={{background:'var(--surface2)',border:'1px solid var(--border)'}}>
                <p style={{fontSize:fsr(11),color:'var(--muted)',fontWeight:700,marginBottom:2}} className="flex items-center gap-1"><Icon name="calendar" size={13} />{t.profJoined}</p>
                <p style={{fontSize:fsr(14),color:'var(--ink)',fontWeight:700,margin:0}}>{fmtD(staff.joiningDate)}</p>
              </div>
            )}
            <div className="rounded-xl p-3" style={{background:'var(--surface2)',border:'1px solid var(--border)'}}>
              <p style={{fontSize:fsr(11),color:'var(--muted)',fontWeight:700,marginBottom:2}} className="flex items-center gap-1"><Icon name="salary" size={13} />{t.fsalary}</p>
              <p style={{fontSize:fsr(14),color:'var(--accent)',fontWeight:800,margin:0}}>{fmt(staff.salary)}</p>
              {(staff.salaryHistory||[]).length>1&&(
                <p style={{fontSize:fsr(10),color:'var(--muted)',margin:'4px 0 0',lineHeight:1.5}}>
                  {staff.salaryHistory.slice().reverse().slice(0,3).map(function(e){
                    return fmt(e.amount)+' '+t.raiseSince+' '+(e.ym==='0000-01'?'—':t.months[Number(e.ym.slice(5,7))-1]+' '+e.ym.slice(0,4));
                  }).join(' · ')}
                </p>
              )}
            </div>
            {staff.payDay&&(
              <div className="rounded-xl p-3" style={{background:'var(--surface2)',border:'1px solid var(--border)'}}>
                <p style={{fontSize:fsr(11),color:'var(--muted)',fontWeight:700,marginBottom:2}} className="flex items-center gap-1"><Icon name="calendar" size={13} />{t.profPayDay}</p>
                <p style={{fontSize:fsr(14),color:'var(--ink)',fontWeight:700,margin:0}}>{staff.payDay}</p>
              </div>
            )}
            {staff.phone&&(
              <div className="rounded-xl p-3" style={{background:'var(--surface2)',border:'1px solid var(--border)'}}>
                <p style={{fontSize:fsr(11),color:'var(--muted)',fontWeight:700,marginBottom:2}} className="flex items-center gap-1"><Icon name="phone" size={13} />{t.fphone}</p>
                <p style={{fontSize:fsr(14),color:'var(--ink)',fontWeight:700,margin:0}}>{staff.phone}</p>
              </div>
            )}
          </div>
          {staff.notes&&(
            <div className="p-3 rounded-xl" style={{background:'var(--surface2)'}}>
              <p style={{fontSize:fsr(11),color:'var(--muted)',fontWeight:700,marginBottom:4}} className="flex items-center gap-1"><Icon name="note" size={13} />{t.fnotes}</p>
              <p style={{fontSize:fsr(14),color:'var(--ink)',lineHeight:1.5,margin:0}}>{staff.notes}</p>
            </div>
          )}
        </div>

        {/* ② Financial Summary */}
        <div className="card fade-in">
          <CardTitle icon="money">{t.profFinancials} — {t.mFull[month-1]} {year}</CardTitle>
          <div className="grid grid-cols-2 gap-3 mb-4">
            <div className="rounded-xl p-3 text-center" style={{background:'var(--surface2)',border:'1px solid var(--border)'}}>
              <p style={{fontSize:fsr(11),color:'var(--muted)',fontWeight:700,marginBottom:4}}>{t.profGross}</p>
              <p style={{fontSize:fsr(22),fontWeight:800,color:'var(--accent)',margin:0}}>{fmt(calc.baseSalary)}</p>
            </div>
            <div className="rounded-xl p-3 text-center" style={{background:paidRec?'#D8EEE2':'var(--accent)',border:'1px solid var(--border)'}}>
              <p style={{fontSize:fsr(11),color:paidRec?'var(--ok)':'rgba(255,255,255,0.7)',fontWeight:700,marginBottom:4}}>
                {paidRec?t.profAlreadyPaid:t.rNet}
              </p>
              {/* Once paid, this tile is a record of what was handed over, so it
                  must show the recorded figure — not a live recalculation that
                  later entries would quietly change underneath the label. */}
              <p style={{fontSize:fsr(22),fontWeight:800,color:paidRec?'var(--ok)':'#fff',margin:0}}>{fmt(paidRec?paidRec.amount:calc.netPayable)}</p>
            </div>
          </div>
          {/* Before payment this is a warning about what is about to happen;
              afterwards the same amount is already counted in the dues total
              below, so showing both would print the figure twice. */}
          {!paidRec&&<UnrecoveredNotice calc={calc} t={t} />}
          <StaleNotice paidRec={paidRec} calc={calc} t={t} />
          {undoneHere.length>0&&(
            <div className="rounded-2xl mb-4" style={{background:'var(--surface2)',border:'1px solid var(--border)',padding:'10px 14px'}}>
              <p style={{fontSize:fsr(12),fontWeight:800,color:'var(--muted)',margin:'0 0 6px'}} className="flex items-center gap-1"><Icon name="undo" size={14} />{t.undoHistory}</p>
              {undoneHere.map(function(u){
                return (
                  <p key={u.id} style={{fontSize:fsr(12),color:'var(--ink2)',margin:'2px 0'}}>
                    {t.mFull[u.month-1]} {u.year} · {fmt(u.amount)} · {t.undoneOn} {fmtD(u.undoneOn)}{u.byName?' · '+u.byName:''}
                  </p>
                );
              })}
            </div>
          )}
          {duesTotal>0&&(
            <div className="rounded-2xl mb-4" style={{background:'#FCE8E8',border:'1px solid var(--danger)',padding:'10px 14px'}}>
              <div className="flex justify-between items-center">
                <span style={{fontSize:fsr(13),fontWeight:800,color:'var(--danger)'}} className="inline-flex items-center gap-2"><Icon name="warning" size={15} />{t.duesTitle}</span>
                <span style={{fontSize:fsr(15),fontWeight:800,color:'var(--danger)'}}>{fmt(duesTotal)}</span>
              </div>
              <p style={{fontSize:fsr(12),color:'var(--danger)',margin:'4px 0 0'}}>{t.duesHint}</p>
            </div>
          )}
          <p className="flex items-center gap-2" style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:6}}><Icon name="advance" size={16} />{t.rAdv}</p>
          {thisMonthAdv.length===0
            ? <p style={{fontSize:fsr(13),color:'var(--muted)',marginBottom:12}}>{t.profNoAdv}</p>
            : <div className="mb-3">{thisMonthAdv.map(function(e){return (
                <div key={e.id} className="flex justify-between items-center py-2 px-3 rounded-xl mb-1" style={{background:'#FDF3DC'}}>
                  <div>
                    <p style={{fontSize:fsr(13),color:'var(--ink)',fontWeight:700,margin:0}}>{fmtD(e.date)}</p>
                    {e.reason&&<p style={{fontSize:fsr(11),color:'var(--ink2)',margin:0}}>{e.reason}</p>}
                  </div>
                  <span style={{fontSize:fsr(15),fontWeight:800,color:'var(--warn)'}}>{fmt(e.amount)}</span>
                </div>
              );})}</div>
          }
          <p className="flex items-center gap-2" style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:6}}><Icon name="loan" size={16} />{t.profLoans}</p>
          {activeLoans.length===0
            ? <p style={{fontSize:fsr(13),color:'var(--muted)'}}>{t.profNoLoans}</p>
            : activeLoans.map(function(loan){
                var rem=Math.max(0,loan.amount-(loan.paidInstallments||0)*(loan.installment||0)-(loan.manualRepaid||0));
                return (
                  <div key={loan.id} className="rounded-xl p-3 mb-2" style={{background:'#EAE4F5',border:'1px solid var(--border)'}}>
                    <div className="flex justify-between items-center mb-2">
                      <span style={{fontSize:fsr(13),color:'var(--ink2)'}}>{t.loanBal}</span>
                      <span style={{fontSize:fsr(18),fontWeight:800,color:'var(--purple)'}}>{fmt(rem)}</span>
                    </div>
                    <div className="flex gap-2 flex-wrap">
                      <span className="pill pill-muted" style={{fontSize:fsr(11)}}>{t.profLoanEMI}: {fmt(loan.installment)}</span>
                      <span className="pill pill-purple" style={{fontSize:fsr(11)}}>{(loan.paidInstallments||0)}/{loan.totalInstallments||'?'} {t.tDays}</span>
                    </div>
                    {loan.reason&&<p style={{fontSize:fsr(12),color:'var(--ink2)',marginTop:6,fontStyle:'italic',margin:'6px 0 0'}}>"{loan.reason}"</p>}
                  </div>
                );
              })
          }
        </div>

        {/* ③ This person's own record of money.
            Everything here was previously only visible in the household-wide
            Records list, mixed in with everyone else's and filtered by type
            rather than by person — so answering "what has Kamala had this
            year" meant scrolling past everybody. */}
        <div className="card fade-in">
          <CardTitle icon="records">{t.profTxns}</CardTitle>
          <div className="flex gap-2 mb-3" style={{flexWrap:'wrap'}}>
            {[['month',t.perThisMonth],['last',t.perLastMonth],['year',t.perThisYear],['all',t.perAll]].map(function(o){
              var on=txnPeriod===o[0];
              return (
                <button key={o[0]} onClick={function(){setTxnPeriod(o[0]);}}
                  style={{padding:'7px 12px',borderRadius:999,cursor:'pointer',fontFamily:'Nunito,sans-serif',
                    fontWeight:800,fontSize:fsr(12),
                    border:'2px solid '+(on?'var(--accent)':'var(--border)'),
                    background:on?'var(--accent)':'var(--surface)',color:on?'#fff':'var(--ink2)'}}>
                  {o[1]}
                </button>
              );
            })}
          </div>
          {txns.rows.length===0
            ? <p style={{fontSize:fsr(13),color:'var(--muted)',margin:'8px 0'}}>{t.profNoTxns}</p>
            : <div>
                <div className="flex gap-2 mb-3">
                  <div className="flex-1 rounded-xl p-2 text-center" style={{background:'#D8EEE2'}}>
                    <p style={{fontSize:fsr(10),color:'var(--ok)',fontWeight:700,margin:0}}>{t.profTxnPaid}</p>
                    <p style={{fontSize:fsr(16),fontWeight:800,color:'var(--ok)',margin:0}}>{fmt(txns.paid)}</p>
                  </div>
                  <div className="flex-1 rounded-xl p-2 text-center" style={{background:'#FDF3DC'}}>
                    <p style={{fontSize:fsr(10),color:'#8B5E08',fontWeight:700,margin:0}}>{t.profTxnGiven}</p>
                    <p style={{fontSize:fsr(16),fontWeight:800,color:'#8B5E08',margin:0}}>{fmt(txns.given)}</p>
                  </div>
                </div>
                {txns.rows.map(function(r){
                  var tc=TC[r.kind]||{icon:'salary',bg:'#D8EEE2',ink:'#1A5E35'};
                  return (
                    <div key={r.id} className="flex items-center gap-2" style={{padding:'8px 10px',borderRadius:12,background:tc.bg,marginBottom:6}}>
                      <span style={{color:tc.ink||'var(--ink2)'}}><Icon name={tc.icon} size={20} /></span>
                      <div className="flex-1 min-w-0">
                        <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink)',margin:0}}>{r.label}</p>
                        <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}} className="truncate">
                          {fmtD(r.date)}{r.note?' · '+r.note:''}
                        </p>
                      </div>
                      <span style={{fontSize:fsr(14),fontWeight:800,color:'var(--ink)',flexShrink:0}}>{fmt(r.amount)}</span>
                    </div>
                  );
                })}
              </div>
          }
        </div>

        {/* ④ Attendance */}
        <div className="card fade-in">
          <CardTitle icon="calendar">{t.profAttend} — {t.mFull[month-1]}</CardTitle>
          <div className="grid grid-cols-3 gap-2 mb-3">
            {[
              {v:Math.floor(presentDays),label:t.tPresent,color:'var(--ok)',bg:'#D8EEE2'},
              {v:leaveCount,label:t.tLeave,color:'var(--danger)',bg:'#FCE8E8'},
              {v:holidayCount,label:t.tHoliday,color:'var(--warn)',bg:'#FDF3DC'},
            ].map(function(box){return (
              <div key={box.label} className="rounded-xl p-3 text-center" style={{background:box.bg}}>
                <p style={{fontSize:fsr(28),fontWeight:800,color:box.color,margin:0,lineHeight:1.1}}>{box.v}</p>
                <p style={{fontSize:fsr(11),color:box.color,fontWeight:700,margin:'4px 0 0'}}>{box.label}</p>
              </div>
            );})}

              <span style={{fontSize:fsr(14),color:'var(--ink)',fontWeight:700}} className="flex items-center gap-2"><Icon name="halfday" size={15} />{t.tShortHours}</span>
              <span style={{fontSize:fsr(17),fontWeight:800,color:'var(--warn)'}}>{halfDayCount}</span>
            </div>
          )}

            <div className="flex justify-between px-1 mt-2">
              <span style={{fontSize:fsr(13),color:'var(--muted)'}}>{t.rLeave}</span>
              <span style={{fontSize:fsr(14),fontWeight:700,color:'var(--danger)'}}>–{fmt(calc.leaveDeduction)}</span>

      {showLeaveModal&&<QuickLeaveModal staff={staff} lang={lang} ym={ym} homeId={homeId} onClose={function(){setShowLeaveModal(false);}} onSaved={function(){setShowLeaveModal(false);setToast(t.savedOk);refreshData();}} />}

/* ── DASHBOARD TAB ──────────────────────────────────────────── */
function DashboardTab({lang,homeId,homes,workingDays,onNavigate,syncKey}){
  var t=T[lang];
  var [staff,setStaff]=useState(function(){return getStaff(homeId);});
  var [ledger,setLedger]=useState(function(){return getLedger(homeId);});
  var [payments,setPayments]=useState(function(){return getPayments(homeId);});

  useEffect(function(){
    setStaff(getStaff(homeId));
    setLedger(getLedger(homeId));
    setPayments(getPayments(homeId));
  },[homeId,syncKey]);

  var now=new Date();
  var today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var curYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var curYear=now.getFullYear(),curMonth=now.getMonth()+1,todayDate=now.getDate();

  /* attendance — only people still working; a former staff member is neither
     present nor absent today. */
  var [attTick,setAttTick]=useState(0);
  var onStaff=staff.filter(function(s){return !hasLeft(s);});
  var presentCount=0,absentCount=0,holidayCount=0;
  onStaff.forEach(function(s){
    var st=getLeaves(s.id,curYM)[today];
    if(st==='leave') absentCount++;
    else if(st==='holiday') holidayCount++;
    else presentCount++;
  });

  function markTodayFor(staffId,status){
    var lv=Object.assign({},getLeaves(staffId,curYM));
    if(status==='present') delete lv[today]; else lv[today]=status;
    fbSaveLeaves(homeId,staffId,curYM,lv);
    setAttTick(function(n){return n+1;});
  }

  /* upcoming pay days sorted by closeness — nobody who has left is still due */
  var payList=staff.filter(function(s){return !hasLeft(s);}).map(function(s){
    var pd=Number(s.payDay)||1;
    var daysUntil=pd>=todayDate?pd-todayDate:(30-todayDate+pd);
    var isPaid=payments.some(function(p){return p.staffId===s.id&&Number(p.year)===curYear&&Number(p.month)===curMonth;});
    return {s:s,daysUntil:daysUntil,isPaid:isPaid,pd:pd};
  }).sort(function(a,b){return a.daysUntil-b.daysUntil;});

  /* recent ledger entries */
  var recent=[...ledger].sort(function(a,b){return b.date>a.date?1:-1;}).slice(0,3);

  /* monthly spend */
  var totalSal=staff.filter(function(x){return !hasLeft(x);}).reduce(function(s,x){return s+(x.salary||0);},0);
  var paidAmt=payments.filter(function(p){return Number(p.year)===curYear&&Number(p.month)===curMonth;}).reduce(function(s,p){return s+(p.amount||0);},0);
  var paidPct=totalSal>0?Math.min(100,Math.round(paidAmt/totalSal*100)):0;

  var dayLabel=t.days[now.getDay()]+', '+now.getDate()+' '+t.mFull[now.getMonth()];

  return (
    <div className="flex-1 scroll-area p-4">
      <p style={{fontSize:fsr(12),fontWeight:800,color:'var(--muted)',marginBottom:14,textTransform:'uppercase',letterSpacing:'0.07em'}}>
        {t.dash} · {dayLabel}
      </p>

      {/* Attendance */}
      {staff.length===0
        ? <div className="card mb-4 text-center"><p style={{color:'var(--muted)',fontSize:fsr(14)}}>{t.dashNoStaff}</p></div>
        : <div className="grid grid-cols-3 gap-3 mb-3">
            {[{n:presentCount,lbl:t.dashPresent,c:'var(--ok)'},{n:absentCount,lbl:t.dashAbsent,c:'var(--danger)'},{n:holidayCount,lbl:t.dashHoliday,c:'var(--warn)'}].map(function(tile){
              return (
                <div key={tile.lbl} className="card text-center" style={{padding:'14px 8px'}}>
                  <p style={{fontSize:fsr(30),fontWeight:800,color:tile.c,margin:0,lineHeight:1}}>{tile.n}</p>
                  <p style={{fontSize:fsr(11),fontWeight:700,color:'var(--muted)',margin:'4px 0 0'}}>{tile.lbl}</p>
                </div>
              );
            })}
          </div>
      }

      {/* Marking today's attendance is a daily job, so it belongs on the screen
          opened daily rather than behind a tab or a menu. The full calendar
          stays a tap away for corrections and for planning ahead. */}
      {onStaff.length>0&&(
        <div className="card mb-4">
          {onStaff.map(function(s,i){
            var cur=(getLeaves(s.id,curYM)||{})[today]||'present';
            return (
              /* Name above, buttons below at full width. Squeezing all three
                 onto one row truncated the very thing being identified — on a
                 narrow phone "Kamala B…" beside two buttons helps nobody. */
              <div key={s.id} style={{padding:'12px 0',borderTop:i?'1px solid var(--border)':'none'}}>
                <div className="flex items-center gap-3 mb-2">
                  <Avatar staff={s} size={42} />
                  <p className="flex-1 truncate" style={{fontSize:fsr(16),fontWeight:800,color:'var(--ink)',margin:0}}>{s.name}</p>
                  {/* Holiday is set in the calendar, so neither button below
                      would be lit — say so rather than showing a blank pair. */}
                  {cur==='holiday'&&(
                    <span className="pill" style={{background:'#F5EBC0',color:'var(--warn)',fontSize:fsr(11),padding:'3px 8px',flexShrink:0}} className="inline-flex items-center gap-1"><Icon name="holiday" size={12} />{t.tHoliday}</span>
                  )}
                </div>
                {/* Named and colour-coded rather than pictographic: a tick and a
                    calendar glyph look alike at a glance. Green for here, red
                    for away — nothing to learn. */}
                <div className="flex gap-2">
                  {[{v:'present',lbl:t.tPresent,c:'#1A5E35',bg:'#D8EEE2'},
                    {v:'leave',  lbl:t.tLeave,  c:'#B3282B',bg:'#FCE8E8'}].map(function(o){
                    var on=cur===o.v;
                    return (
                      <button key={o.v} onClick={function(){markTodayFor(s.id,o.v);}}
                        aria-label={s.name+' — '+o.lbl} aria-pressed={on}
                        style={{flex:1,minHeight:46,padding:'10px',borderRadius:12,cursor:'pointer',
                          fontSize:fsr(15),fontWeight:800,fontFamily:'Nunito,sans-serif',lineHeight:1,
                          border:'2px solid '+(on?o.c:'var(--border)'),
                          background:on?o.bg:'var(--surface)',
                          color:on?o.c:'var(--muted)',
                          display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
                        {on&&<Icon name="check" size={17} strokeWidth={2.6} />}{o.lbl}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
          <button onClick={function(){onNavigate&&onNavigate('leaves');}}
            className="btn btn-ghost btn-full" style={{marginTop:10,gap:8}}>
            <Icon name="calendar" size={18} />{t.dashFullCalendar}
          </button>
        </div>
      )}

      {/* Pay Days */}
      <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:8}}>{t.dashPay}</p>
      <div className="rounded-2xl mb-4 overflow-hidden" style={{background:'var(--surface)',border:'1px solid var(--border)',boxShadow:'0 1px 4px rgba(26,46,42,.06)'}}>
        {payList.length===0
          ? <p className="p-4 text-center" style={{color:'var(--muted)',fontSize:fsr(13)}}>{t.dashNoStaff}</p>
          : payList.map(function(item,i){
              var dueTxt=item.daysUntil===0?t.dashToday:item.daysUntil===1?t.dashTomorrow:item.pd+' '+t.tDays;
              return (
                <div key={item.s.id} className="flex items-center gap-3 px-4 py-3"
                  style={{borderBottom:i<payList.length-1?'1px solid var(--border)':'none'}}>
                  <Avatar staff={item.s} size={40} />
                  <div className="flex-1 min-w-0">
                    <p style={{fontSize:fsr(14),fontWeight:800,color:'var(--ink)',margin:0}} className="truncate">{item.s.name}</p>
                    <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}}>{dueTxt}</p>
                  </div>
                  {item.isPaid
                    ? <span className="pill pill-ok" style={{fontSize:fsr(10)}}>{t.tPaidBadge}</span>
                    : <button onClick={function(){onNavigate('salary',item.s.id);}}
                        style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:10,padding:'9px 14px',fontSize:fsr(13),fontWeight:800,cursor:'pointer',fontFamily:'Nunito,sans-serif',minHeight:40,whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:6}}>
                        {t.dashPayBtn}<Icon name="arrowRight" size={15} />
                      </button>
                  }
                </div>
              );
            })
        }
      </div>

      {/* Recent Entries */}
      <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:8}}>{t.dashRecent}</p>
      <div className="rounded-2xl mb-4 overflow-hidden" style={{background:'var(--surface)',border:'1px solid var(--border)',boxShadow:'0 1px 4px rgba(26,46,42,.06)'}}>
        {recent.length===0
          ? <p className="p-4 text-center" style={{color:'var(--muted)',fontSize:fsr(13)}}>{t.dashNoRecent}</p>
          : recent.map(function(e,i){
              var s=staff.find(function(x){return x.id===e.staffId;})||{name:'?'};
              var tc=TC[e.type]||{icon:'•',bg:'var(--surface2)'};
              return (
                <div key={e.id} className="flex items-center gap-3 px-4 py-3"
                  style={{background:tc.bg,borderBottom:i<recent.length-1?'1px solid var(--border)':'none'}}>
                  <span style={{color:tc.ink||'var(--ink2)'}}><Icon name={tc.icon} size={22} /></span>
                  <div className="flex-1 min-w-0">
                    <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink)',margin:0}} className="truncate">{s.name}</p>
                    <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}}>{e.reason||''} · {fmtD(e.date)}</p>
                  </div>
                  <p style={{fontSize:fsr(14),fontWeight:800,color:'var(--ink)',margin:0,flexShrink:0}}>{fmt(e.amount)}</p>
                </div>
              );
            })
        }
      </div>

      {/* Monthly Spend */}
      <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:8}}>{t.dashSpend}</p>
      <div className="card">
        <div className="flex justify-between items-center mb-3">
          <span style={{fontSize:fsr(13),color:'var(--muted)',fontWeight:700}}>{t.dashPaid}</span>
          <span style={{fontSize:fsr(20),fontWeight:800,color:'var(--ok)'}}>{fmt(paidAmt)}</span>
        </div>
        <div style={{height:10,background:'var(--surface2)',borderRadius:6,overflow:'hidden'}}>
          <div style={{height:'100%',width:paidPct+'%',background:'var(--ok)',borderRadius:6,transition:'width .5s ease'}} />
        </div>
        <div className="flex justify-between items-center mt-2">
          <span style={{fontSize:fsr(11),color:'var(--muted)'}}>{t.dashOf} {fmt(totalSal)}</span>
          <span style={{fontSize:fsr(11),fontWeight:800,color:paidPct===100?'var(--ok)':'var(--muted)'}}>{paidPct}%</span>
        </div>
      </div>

      <div style={{height:16}} />
    </div>
  );
}

/* ── STAFF TAB ──────────────────────────────────────────────── */
function StaffTab({lang,homeId,homes,workingDays,onStaffChange,syncKey}){
  var t=T[lang];
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [payments,setPayments]=useState([]);
  var [showAdd,setShowAdd]=useState(false);
  var [editing,setEditing]=useState(null);
  var [selectedStaff,setSelectedStaff]=useState(null);
  var now=new Date();
  var curYear=now.getFullYear(), curMonth=now.getMonth()+1;

  useEffect(function(){
    setStaff(getStaff(homeId));setLedger(getLedger(homeId));
    setPayments(getPayments(homeId));
    setShowAdd(false);setEditing(null);setSelectedStaff(null);
  },[homeId,syncKey]);

  function save(s){
    var idx=staff.findIndex(function(x){return x.id===s.id;});
    var next=idx>=0?staff.map(function(x,i){return i===idx?s:x;}):[...staff,s];
    setStaff(next); fbSaveStaff(homeId,next);
    setShowAdd(false); setEditing(null);
    onStaffChange && onStaffChange();
  }
  function del(id){
    var next=staff.filter(function(x){return x.id!==id;});
    setStaff(next); fbSaveStaff(homeId,next);
    lsKeys().filter(function(k){return k.startsWith('gs_lv_'+id+'_');}).forEach(lsDel);
    fbDeleteStaffCascade(homeId,id);
    var nextLedger=getLedger(homeId).filter(function(e){return e.staffId!==id;});
    fbSaveLedger(homeId,nextLedger);
    /* salary payment history for this staff member, so no trace of them
       lingers in Annual Summary totals after deletion */
    var nextPayments=getPayments(homeId).filter(function(p){return p.staffId!==id;});
    fbSavePayments(homeId,nextPayments);
    var w=getWaivers(homeId), nextW={};
    Object.keys(w).forEach(function(k){ if(!k.startsWith(id+'_')) nextW[k]=w[k]; });
    fbSaveWaivers(homeId,nextW);
    setSelectedStaff(null);
    onStaffChange && onStaffChange();
  }

  if(selectedStaff){
    return <StaffProfile
      staff={selectedStaff} lang={lang} homeId={homeId} homes={homes||[]} workingDays={workingDays||30}
      onBack={function(){setSelectedStaff(null);setStaff(getStaff(homeId));setLedger(getLedger(homeId));}}
      onStaffChange={function(){
        setStaff(getStaff(homeId));setLedger(getLedger(homeId));
        onStaffChange&&onStaffChange();
      }}
    />;
  }

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <div className="p-4 shrink-0" style={{background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
        <PrimaryBtn onClick={function(){setShowAdd(true);}} full={true} tut="add-staff">{t.addStaff}</PrimaryBtn>
      </div>
      <div className="p-4 scroll-area flex-1">
        {staff.length===0
          ? <p className="text-center mt-16 text-base whitespace-pre-line" style={{color:'var(--muted)'}}>{t.noStaff}</p>
          : staff.map(function(s){
              var isPaid=payments.some(function(p){return p.staffId===s.id&&Number(p.year)===curYear&&Number(p.month)===curMonth;});
              return (
                <StaffCard key={s.id} staff={s} lang={lang}
                  loanBal={getLoanBal(s.id,ledger)}
                  isPaid={isPaid}
                  onView={function(){setSelectedStaff(s);}}
                  onEdit={function(){setEditing(s);}}
                  onDelete={function(){del(s.id);}} />
              );
            })
        }
      </div>
      {showAdd && <StaffModal lang={lang} onClose={function(){setShowAdd(false);}} onSave={save} />}
      {editing && <StaffModal lang={lang} onClose={function(){setEditing(null);}} onSave={save} existing={editing} />}
    </div>
  );
}

/* ── SALARY TAB ─────────────────────────────────────────────── */
function SalaryTab({lang,homeId,homes,refreshKey,workingDays,defaultStaffId,syncKey}){
  var t=T[lang];
  var now=new Date();
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showPaidBy=!mc.guestMode&&memberIds.length>0;
  var [payer,setPayer]=useState(mc.uid||'');
  var [payerName,setPayerName]=useState('');
  var [payerErr,setPayerErr]=useState('');
  var payerSuggestions=useMemo(function(){ return showPaidBy?getExternalPayerNames(homeId):[]; },[showPaidBy,homeId]);
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [payments,setPayments]=useState([]);
  var [selStaff,setSelStaff]=useState(defaultStaffId||'');
  var [selMonth,setSelMonth]=useState(now.getMonth()+1);
  var [selYear,setSelYear]=useState(now.getFullYear());
  var [calc,setCalc]=useState(null);
  var [waMsg,setWAMsg]=useState('');
  var [toast,setToast]=useState('');

  useEffect(function(){
    var s=getStaff(homeId);
    setStaff(s); setLedger(getLedger(homeId)); setPayments(getPayments(homeId));
    setSelStaff(defaultStaffId||''); setCalc(null); setWAMsg('');
  },[homeId,refreshKey,syncKey]);

  function doCalc(){
    var s=staff.find(function(x){return x.id===selStaff;});
    if(!s) return;
    setCalc(calcSalary(s,selYear,selMonth,ledger,workingDays,homeId));
    setWAMsg('');
  }

  /* Cancel or restore one charge for this staff member for this month. The
     figures are always re-derived from calcSalary rather than adjusted by
     hand, so the breakdown and the net can never disagree. */
  function toggleWaive(k){
    var s=staff.find(function(x){return x.id===selStaff;});
    if(!s) return;
    var cur=getWaived(homeId,selStaff,selYear,selMonth);
    setWaived(homeId,selStaff,selYear,selMonth,
      cur.indexOf(k)>=0?cur.filter(function(x){return x!==k;}):cur.concat([k]));
    setCalc(calcSalary(s,selYear,selMonth,ledger,workingDays,homeId));
  }

  function doMarkPaid(){
    var s=staff.find(function(x){return x.id===selStaff;});
    if(!s||!calc) return;
    if(showPaidBy&&payer==='other'&&!payerName.trim()){setPayerErr(t.errPayerName);return;}
    setPayerErr('');
    var key=selStaff+'_'+selYear+'_'+selMonth;
    if(payments.find(function(p){return p.key===key;})) return;
    var pDate=todayStr();
    var home=homes.find(function(h){return h.id===homeId;})||{name:''};
    var rec={key:key,staffId:selStaff,year:selYear,month:selMonth,amount:calc.netPayable,date:pDate};
    if(calc.unrecovered>0) rec.unrecovered=calc.unrecovered;
    if(showPaidBy&&payer){
      rec.paidBy=payer;
      if(payer==='other'&&payerName.trim()) rec.paidByName=payerName.trim();
    }
    var loans=applyLoanInstalments(ledger,selStaff,calc.waived);
    rec.loanAdvances=loans.advanced;
    var newPays=[...payments,rec];
    fbSavePayments(homeId,newPays); setPayments(newPays);
    fbSaveLedger(homeId,loans.ledger); setLedger(loans.ledger);
    setToast(t.paidOk);
    setWAMsg(waTemplate('salary',s,calc.netPayable,pDate,home.name,lang));
  }

  var s=staff.find(function(x){return x.id===selStaff;});
  var payKey=selStaff+'_'+selYear+'_'+selMonth;
  var paidRec=payments.find(function(p){return p.key===payKey;});
  var years=[now.getFullYear()-1,now.getFullYear()];

  return (
    <div className="p-4 scroll-area flex-1">
      {toast && <Toast msg={toast} onDone={function(){setToast('');}} />}

      <div className="rounded-2xl p-4 mb-4" style={{background:'var(--surface2)'}}>
        <FLabel label={t.selStaff} req={true}>
          <FSelect tut="salary-staff" value={selStaff} onChange={function(v){setSelStaff(v);setCalc(null);setWAMsg('');}}>
            <option value="">{t.selStaffPh}</option>
            {staff.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
          </FSelect>
        </FLabel>
        <div className="flex gap-3">
          <FLabel label={t.selMonth}>
            <FSelect value={selMonth} onChange={function(v){setSelMonth(Number(v));}}>
              {t.mFull.map(function(m,i){return <option key={i} value={i+1}>{m}</option>;})}
            </FSelect>
          </FLabel>
          <FLabel label={t.selYear}>
            <FSelect value={selYear} onChange={function(v){setSelYear(Number(v));}}>
              {years.map(function(y){return <option key={y} value={y}>{y}</option>;})}
            </FSelect>
          </FLabel>
        </div>
        <PrimaryBtn onClick={doCalc} full={true} disabled={!selStaff} tut="salary-calc">{t.calcBtn}</PrimaryBtn>
      </div>

      {!calc && <p className="text-center text-base mt-8" style={{color:'var(--muted)'}}>{t.noCalc}</p>}

      {calc && s && (
        <div className="fade-in">
          <div className="flex items-center gap-3 mb-3">
            <Avatar staff={s} size={44} />
            <div>
              <p style={{fontWeight:800,color:'var(--ink)',fontSize:fsr(18),margin:0}}>{s.name}</p>
              <p style={{fontSize:fsr(12),color:'var(--muted)',margin:0}}>{t.mFull[selMonth-1]} {selYear}</p>
            </div>
          </div>

          <div className="rounded-2xl overflow-hidden mb-4" style={{border:'1px solid var(--border)'}}>
            {[
              {label:calc.partMonth?t.rBase+' ('+calc.partDays+'/'+calc.monthDays+' '+t.tDays+')':t.rBase, val:calc.baseSalary, sign:0},
              {label:t.rLeave+' ('+calc.leaveDays+' '+t.tDays+')', val:calc.leaveDeduction, sign:-1, k:'leave'},
              {label:t.rAdv, val:calc.advances, sign:-1, k:'advances'},
              {label:t.rLoan, val:calc.loanInst, sign:-1, k:'loan'},
              {label:t.rExp, val:calc.expenses, sign:-1, k:'expenses'},

              <p style={{fontSize:fsr(13),color:'var(--ok)',fontWeight:700,margin:0}}>
                {t.waiveNote.replace('{n}',calc.waived.length)}

              <span style={{fontSize:fsr(13),fontWeight:700,color:'var(--purple)'}} className="flex items-center gap-2"><Icon name="loan" size={15} />{t.rLoanBal}</span>
              <span style={{fontSize:fsr(15),fontWeight:800,color:'var(--purple)'}}>{fmt(calc.loanBal)}</span>

                <p style={{color:'var(--ok)',fontSize:fsr(13),marginTop:4}}>{fmt(paidRec.amount)}</p>

/* ── LEAVE CALENDAR ─────────────────────────────────────────── */
/* Apply one status across a span of days, in a single action. Marking a
   fortnight away used to be a fortnight of separate taps. The span may cross a
   month boundary, and leaves are stored a month at a time, so the days are
   grouped into their months and each month written once. */
function applyLeaveRange(homeId,staffId,fromISO,toISO,status){
  var a=parseISO(fromISO), b=parseISO(toISO);
  if(!a||!b) return 0;
  if(b<a){ var swap=a; a=b; b=swap; }
  var buckets={}, n=0, cur=new Date(a);
  while(cur<=b&&n<400){
    var ym=padYM(cur.getFullYear(),cur.getMonth()+1);
    var key=ym+'-'+String(cur.getDate()).padStart(2,'0');
    if(!buckets[ym]) buckets[ym]=Object.assign({},getLeaves(staffId,ym));
    if(status) buckets[ym][key]=status; else delete buckets[ym][key];
    n++; cur.setDate(cur.getDate()+1);
  }
  Object.keys(buckets).forEach(function(k){ fbSaveLeaves(homeId,staffId,k,buckets[k]); });
  return n;
}

function LeaveCalendar({staffId,staffSalary,lang,year,month,workingDays,homeId,syncKey}){
  var t=T[lang];
  var ym=padYM(year,month);
  var [lv,setLv]=useState({});
  var [flash,setFlash]=useState('');
  var [rangeOpen,setRangeOpen]=useState(false);
  var [rFrom,setRFrom]=useState(todayStr());
  var [rTo,setRTo]=useState(todayStr());
  var [rMsg,setRMsg]=useState('');
  var today=new Date();

  useEffect(function(){setLv(getLeaves(staffId,ym));},[staffId,ym,syncKey]);

  function doRange(status){
    var n=applyLeaveRange(homeId||_activeHomeId,staffId,rFrom,rTo,status);
    setLv(getLeaves(staffId,ym));
    setRMsg(t.markManyDone.replace('{n}',n));
    setTimeout(function(){setRMsg('');},2500);
  }

  function toggle(day){
    /* Future days are markable: telling the app about leave already agreed for
       next week is the point. They are drawn differently so a plan is never
       mistaken for something that has already happened. */
    var key=ym+'-'+String(day).padStart(2,'0');
    var cur=lv[key];
    var next=cur==='leave'?'holiday':cur==='holiday'?null:'leave';
    var updated=Object.assign({},lv);
    if(next) updated[key]=next; else delete updated[key];
    setLv(updated); fbSaveLeaves(homeId||_activeHomeId,staffId,ym,updated);
  }

  function markToday(status){
    var isCurrentMonth=year===today.getFullYear()&&month===today.getMonth()+1;
    if(!isCurrentMonth) return;
    var key=ym+'-'+String(today.getDate()).padStart(2,'0');
    var updated=Object.assign({},lv);
    if(status===null) delete updated[key]; else updated[key]=status;
    setLv(updated); fbSaveLeaves(homeId||_activeHomeId,staffId,ym,updated);
    setFlash(status||'present');
    setTimeout(function(){setFlash('');},1200);
  }

  var isCurrentMonth=year===today.getFullYear()&&month===today.getMonth()+1;

  var firstDay=new Date(year,month-1,1).getDay();
  var daysInMonth=new Date(year,month,0).getDate();
  var leaveDays=Object.values(lv).filter(function(v){return v==='leave';}).length;
  var deduction=Math.round((staffSalary/(workingDays||30))*leaveDays);

  var cells=[];
  for(var i=0;i<firstDay;i++) cells.push(null);
  for(var d=1;d<=daysInMonth;d++) cells.push(d);

  function dayStatus(day){
    if(!day) return null;
    var k=ym+'-'+String(day).padStart(2,'0');
    return lv[k]||'present';
  }

  function dayCls(st){
    if(st==='leave')   return {background:'#FCE8E8',color:'var(--danger)',fontWeight:700};
    if(st==='holiday') return {background:'#F5EBC0',color:'var(--warn)',fontWeight:700};
    return {background:'var(--surface2)',color:'var(--ink2)'};
  }
  function dayLbl(st){
    if(st==='leave')   return t.Ls;
    if(st==='holiday') return t.Hs;
    return t.Ps;
  }

  return (
    <div>
      {isCurrentMonth && (
        <div className="mb-4" data-tut="mark-today">
          <p style={{fontSize:fsr(11),fontWeight:800,color:'var(--muted)',textAlign:'center',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.06em'}}>{t.markToday}</p>
          <div className="flex gap-2">
            {[
              {status:null,      icon:'check',    label:t.tPresent, bg:'#CCEADC', c:'#1A5E35'},
              {status:'leave',   icon:'calendar', label:t.tLeave,   bg:'#FCE8E8', c:'var(--danger)'},
              {status:'holiday', icon:'holiday',  label:t.tHoliday, bg:'#F5EBC0', c:'var(--warn)'},
            ].map(function(item){
              var active=flash===( item.status||'present');
              return (
                <button key={item.label} onClick={function(){markToday(item.status);}}
                  style={{flex:1,padding:'10px 4px',borderRadius:14,border:'2px solid '+(active?item.c:'transparent'),
                    background:active?item.bg:item.bg+'99',color:item.c,fontWeight:800,
                    fontSize:fsr(13),cursor:'pointer',fontFamily:'Nunito,sans-serif',
                    display:'flex',flexDirection:'column',alignItems:'center',gap:2,
                    transition:'all .15s',minHeight:60}}>
                  <Icon name={active?'check':item.icon} size={20} strokeWidth={active?2.6:2} />
                  <span style={{fontSize:fsr(11)}}>{active?t.markTodayDone:item.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
      <button onClick={function(){setRangeOpen(function(v){return !v;});}}
        className="btn btn-ghost btn-full" style={{marginBottom:12}}>
        <Icon name="calendar" size={18} /><span style={{margin:'0 8px'}}>{t.markMany}</span><Icon name={rangeOpen?'chevronUp':'chevronDown'} size={16} />
      </button>
      {rangeOpen&&(
        <div className="rounded-2xl mb-3" style={{background:'var(--surface2)',border:'1px solid var(--border)',padding:'12px 14px'}}>
          <div className="flex items-center gap-2 flex-wrap" style={{margin:'0 0 10px'}}><p style={{fontSize:fsr(13),color:'var(--ink2)',margin:0,flex:1}}>{t.markManyHint}</p><Help text={t.markManyHelp} label={t.markMany} /></div>
          <div className="flex gap-3 mb-3">
            <div style={{flex:1}}>
              <label style={{display:'block',fontSize:fsr(12),fontWeight:700,color:'var(--ink2)',marginBottom:4}}>{t.markFrom}</label>
              <input type="date" value={rFrom} onChange={function(e){setRFrom(e.target.value);}} className="inp" style={{width:'100%'}} />
            </div>
            <div style={{flex:1}}>
              <label style={{display:'block',fontSize:fsr(12),fontWeight:700,color:'var(--ink2)',marginBottom:4}}>{t.markTo}</label>
              <input type="date" value={rTo} onChange={function(e){setRTo(e.target.value);}} className="inp" style={{width:'100%'}} />
            </div>
          </div>
          <div className="flex gap-2">
            {[{s:'leave',label:t.tLeave,bg:'#FCE8E8',c:'var(--danger)'},
              {s:'holiday',label:t.tHoliday,bg:'#F5EBC0',c:'var(--warn)'},
              {s:null,label:t.tPresent,bg:'#CCEADC',c:'#1A5E35'}].map(function(o){
              return (
                <button key={o.label} onClick={function(){doRange(o.s);}}
                  style={{flex:1,padding:'11px 4px',borderRadius:12,border:'2px solid '+o.c,
                    background:o.bg,color:o.c,fontWeight:800,fontSize:fsr(13),
                    cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
                  {o.label}
                </button>
              );
            })}
          </div>
          {rMsg&&<p style={{fontSize:fsr(13),color:'var(--ok)',fontWeight:800,margin:'10px 0 0',textAlign:'center'}} className="flex items-center justify-center gap-2"><Icon name="check" size={15} strokeWidth={2.6} />{rMsg}</p>}
        </div>
      )}
      <p style={{fontSize:fsr(12),color:'var(--muted)',textAlign:'center',marginBottom:12}}>{t.calHint}</p>
      <div className="grid grid-cols-7 mb-1">
        {t.days.map(function(d,i){return <div key={i} style={{textAlign:'center',fontSize:fsr(11),fontWeight:700,paddingTop:4,paddingBottom:4,color:i===0?'var(--danger)':'var(--ink2)'}}>{d}</div>;})}
      </div>
      <div className="grid grid-cols-7 gap-0.5">
        {cells.map(function(day,idx){
          if(!day) return <div key={'e'+idx} />;
          var st=dayStatus(day);
          var td=new Date(year,month-1,day);
          var isToday=td.toDateString()===today.toDateString();
          var isFuture=td>today&&!isToday;
          var stStyle=dayCls(st);
          return (
            <button key={day} onClick={function(){toggle(day);}}
              className="cal-btn flex flex-col items-center justify-center rounded-lg text-xs transition-all"
              title={isFuture?t.plannedDay:undefined}
              /* A future day that has been marked is a plan, not a record, so it
                 is outlined rather than filled. An unmarked future day stays
                 faint: nothing has been said about it either way. */
              style={Object.assign({},stStyle,{outline:'none',cursor:'pointer',
                border:isToday?'2px solid var(--accent)':isFuture&&st!=='present'?'2px dashed '+stStyle.color:'none',
                background:isFuture&&st!=='present'?'transparent':stStyle.background,
                opacity:isFuture&&st==='present'?0.45:1})}>
              <span style={{fontSize:fsr(13),fontWeight:600,lineHeight:1}}>{day}</span>
              <span style={{fontSize:fsr(11),lineHeight:1,marginTop:2,opacity:.8}}>{dayLbl(st)}</span>
            </button>
          );
        })}
      </div>
      <div className="mt-4 flex gap-3">
        <div className="flex-1 rounded-2xl p-3 text-center" style={{background:'#FCE8E8',border:'1px solid #F5C6C6'}}>
          <p style={{fontSize:fsr(12),fontWeight:600,color:'var(--danger)'}}>{t.tlLeave}</p>
          <p style={{fontSize:fsr(28),fontWeight:800,color:'var(--danger)'}}>{leaveDays}</p>
        </div>
        <div className="flex-1 rounded-2xl p-3 text-center" style={{background:'var(--surface2)',border:'1px solid var(--border)'}}>
          <p style={{fontSize:fsr(12),fontWeight:600,color:'var(--ink2)'}}>{t.tlDed}</p>
          <p style={{fontSize:fsr(22),fontWeight:800,color:'var(--ink)'}}>{fmt(deduction)}</p>
        </div>
      </div>
      <div className="mt-3 flex flex-wrap gap-2 justify-center">
        {[[{background:'var(--surface2)',color:'var(--ink2)'},t.Ps,t.tPresent],[{background:'#FCE8E8',color:'var(--danger)'},t.Ls,t.tLeave],[{background:'#F5EBC0',color:'var(--warn)'},t.Hs,t.tHoliday]].map(function(item){
          return <span key={item[2]} className="rounded-lg px-2 py-1 text-xs font-bold" style={item[0]}>{item[1]} = {item[2]}</span>;
        })}
      </div>
    </div>
  );
}

function LeavesTab({lang,homeId,workingDays,syncKey}){
  var t=T[lang];
  var now=new Date();
  var [staff,setStaff]=useState([]);
  var [selStaff,setSelStaff]=useState('');
  var [month,setMonth]=useState(now.getMonth()+1);
  var [year,setYear]=useState(now.getFullYear());

  useEffect(function(){
    /* Attendance is about who is working now, so former staff drop out. Their
       past attendance is untouched and still reaches the reports. */
    var s=getStaff(homeId).filter(function(x){return !hasLeft(x);});
    setStaff(s); setSelStaff(s.length>0?s[0].id:'');
  },[homeId,syncKey]);

  function prevM(){if(month===1){setMonth(12);setYear(function(y){return y-1;});}else setMonth(function(m){return m-1;});}
  function nextM(){
    var nm=month===12?1:month+1, ny=month===12?year+1:year;
    if(ny>now.getFullYear()||(ny===now.getFullYear()&&nm>now.getMonth()+1)) return;
    setMonth(nm); if(month===12)setYear(function(y){return y+1;});
  }

  var s=staff.find(function(x){return x.id===selStaff;});

  return (
    <div className="p-4 scroll-area flex-1">
      <FLabel label={t.selStaff}>
        <FSelect value={selStaff} onChange={setSelStaff}>
          {staff.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
        </FSelect>
      </FLabel>

      {s ? (
        <div className="fade-in">
          <div className="flex items-center justify-between mb-4 rounded-2xl p-3" style={{background:'var(--surface2)'}}>
            <button onClick={prevM} className="w-10 h-10 rounded-full flex items-center justify-center text-xl" style={{background:'var(--surface)',border:'1px solid var(--border)',cursor:'pointer'}}>‹</button>
            <span style={{fontWeight:800,color:'var(--ink)',fontSize:fsr(15)}}>{t.mFull[month-1]} {year}</span>
            <button onClick={nextM} className="w-10 h-10 rounded-full flex items-center justify-center text-xl" style={{background:'var(--surface)',border:'1px solid var(--border)',cursor:'pointer'}}>›</button>
          </div>
          <LeaveCalendar staffId={s.id} staffSalary={salaryFor(s,year,month)} lang={lang} year={year} month={month} workingDays={workingDays} homeId={homeId} syncKey={syncKey} />
        </div>
      ) : <p className="text-center mt-16" style={{color:'var(--muted)'}}>{t.noStaff}</p>}
    </div>
  );
}

/* ── ADD ENTRY MODAL ────────────────────────────────────────── */
function EntryModal({lang,staffList,onClose,onSave,onDelete,ledger,workingDays,prefillStaffId,prefillType,existing}){
  var t=T[lang];
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  /* only for money actually leaving someone's hand, and only once signed in */
  var CASH_OUT=['advance','loan','expense','bonus','extra_work','extra_help'];
  var blank={staffId:prefillStaffId||'',type:prefillType||'advance',amount:'',date:todayStr(),reason:'',installment:'',totalInstallments:'',targetLoanId:'',hours:'',rate:'',paidBy:mc.uid||'',paidByName:'',helperName:''};
  var [form,setForm]=useState(existing?{
    staffId:existing.staffId||'',type:existing.type,amount:String(existing.amount||''),
    date:existing.date||todayStr(),reason:existing.reason||'',
    installment:String(existing.installment||''),totalInstallments:String(existing.totalInstallments||''),
    targetLoanId:existing.targetLoanId||'',hours:String(existing.hours||''),rate:String(existing.rate||''),
    paidBy:existing.paidBy||'',paidByName:existing.paidByName||'',helperName:existing.helperName||''
  }:blank);
  function set(k,v){setForm(function(f){return Object.assign({},f,{[k]:v});});}
  /* Once a loan has been repaid against — by instalment or by hand — its
     amount and instalment lock, so the principal can't be edited below what
     has already come back and leave the balance impossible to reconcile.
     Date and reason stay editable. */
  var loanLocked=!!(existing&&existing.type==='loan'
    &&((existing.paidInstallments||0)>0||(existing.manualRepaid||0)>0));
  var showPaidBy=!mc.guestMode&&memberIds.length>0&&CASH_OUT.indexOf(form.type)>-1;
  var payerSuggestions=useMemo(function(){ return showPaidBy?getExternalPayerNames(_activeHomeId):[]; },[showPaidBy]);

  var isTimeBased=form.type==='extra_work';
  var isHalfDay=form.type==='short_hours';
  var selStaff=staffList.find(function(x){return x.id===form.staffId;});
  var dailyRate=selStaff?Math.round(selStaff.salary/(workingDays||30)):0;
  var defaultRate=selStaff?Math.round(dailyRate/8):0;
  var halfDayAmt=selStaff?Math.round(dailyRate/2):0;
  var effectiveRate=Number(form.rate)||defaultRate;
  var computedAmount=isTimeBased&&form.hours?Math.round(Number(form.hours)*effectiveRate):0;

  /* Skip on the first pass when editing, otherwise opening a saved overtime
     or half-day entry would immediately overwrite its rate/amount with the
     defaults and quietly discard what was actually recorded. */
  var autoFillReady=useRef(!existing);
  useEffect(function(){
    if(!autoFillReady.current){ autoFillReady.current=true; return; }
    if(isTimeBased&&form.staffId&&defaultRate) set('rate',String(defaultRate));
    if(isHalfDay&&form.staffId&&halfDayAmt) set('amount',String(halfDayAmt));
  },[form.staffId,form.type]);

  var activeLoans=(ledger||[]).filter(function(e){return e.staffId===form.staffId&&e.type==='loan'&&e.status==='active';});

  var [errMsg,setErrMsg]=useState('');
  var [confirmEntry,setConfirmEntry]=useState(null);
  var [confirmDelete,setConfirmDelete]=useState(false);

  function buildEntry(){
    var finalAmount=isTimeBased?computedAmount:Number(form.amount);
    var entry={id:existing?existing.id:uid(),staffId:form.staffId,type:form.type,amount:finalAmount,date:form.date,reason:form.reason};
    if(form.type==='loan'){
      entry.installment=Number(form.installment)||0;
      entry.totalInstallments=Number(form.totalInstallments)||0;
      /* editing a loan must not wipe how much has already been repaid */
      var wasLoan=existing&&existing.type==='loan';
      entry.paidInstallments=(wasLoan&&existing.paidInstallments)||0;
      if(wasLoan&&existing.manualRepaid) entry.manualRepaid=existing.manualRepaid;
      var repaid=entry.paidInstallments*entry.installment+(entry.manualRepaid||0);
      entry.status=repaid>=entry.amount?'closed':'active';
    }
    if(form.type==='loan_repay') entry.targetLoanId=form.targetLoanId;
    if(isTimeBased){entry.hours=Number(form.hours);entry.rate=effectiveRate;}
    if(form.type==='extra_help'&&form.helperName.trim()) entry.helperName=form.helperName.trim();
    if(showPaidBy&&form.paidBy){
      entry.paidBy=form.paidBy;
      if(form.paidBy==='other'&&form.paidByName.trim()) entry.paidByName=form.paidByName.trim();
    }
    return entry;
  }

  function handleSave(){
    /* extra_help is the one type that isn't necessarily anyone's own —
       a substitute for someone absent, or extra hands beyond the regular
       staff — so it's the only type that can be saved with no staff picked */
    if(form.type!=='extra_help'&&!form.staffId){setErrMsg(t.errStaff);return;}
    if(!form.date) return;
    if(isTimeBased&&(!form.hours||computedAmount<=0)){setErrMsg(t.errAmount);return;}
    if(!isTimeBased&&form.type!=='loan_repay'&&!form.amount){setErrMsg(t.errAmount);return;}
    if(form.type==='loan_repay'&&(!form.amount||!form.targetLoanId)){setErrMsg(t.errAmount);return;}
    if(showPaidBy&&form.paidBy==='other'&&!form.paidByName.trim()){setErrMsg(t.errPayerName);return;}
    var finalAmount=isTimeBased?computedAmount:Number(form.amount);
    /* the large-amount check guards against a slip while entering something
       new; correcting an existing record is already a deliberate act */
    var needsConfirm=!existing&&(form.type==='advance'||form.type==='loan'||form.type==='extra_help')&&finalAmount>=1000;
    if(needsConfirm){
      var sName=(staffList.find(function(s){return s.id===form.staffId;})||{}).name||t.generalNoStaff;
      setConfirmEntry({type:typeLabels[form.type]||form.type,amount:finalAmount,name:sName});
      return;
    }
    onSave(buildEntry());
  }

  var inactive={border:'2px solid var(--border)',color:'var(--ink2)',background:'var(--surface2)'};
  var typeStyles={
    advance:    {active:{background:'#FDF3DC',border:'2px solid var(--warn)',color:'#8B5E08'},inactive:inactive},
    loan:       {active:{background:'#EAE4F5',border:'2px solid var(--purple)',color:'#3A2E7A'},inactive:inactive},
    expense:    {active:{background:'#D8EEE8',border:'2px solid var(--accent)',color:'var(--accent)'},inactive:inactive},
    bonus:      {active:{background:'#D8EEE2',border:'2px solid var(--ok)',color:'var(--ok)'},inactive:inactive},
    loan_repay: {active:{background:'#D8EEE2',border:'2px solid var(--ok)',color:'var(--ok)'},inactive:inactive},
    extra_work: {active:{background:'#D8EEE2',border:'2px solid var(--ok)',color:'var(--ok)'},inactive:inactive},
    short_hours:{active:{background:'#FDF3DC',border:'2px solid var(--warn)',color:'#8B5E08'},inactive:inactive},
    extra_help: {active:{background:'#EAE4F5',border:'2px solid var(--purple)',color:'#3A2E7A'},inactive:inactive},
  };
  /* extra_help renders as its own full-width row at the end (see JSX below),
     not in this grid, since it's the odd one out — not tied to a specific
     staff member's regular pay the way the rest of these are. */
  var otherTypes=['loan','expense','short_hours','bonus','extra_work','loan_repay'];
  var typeLabels={advance:t.tAdv,loan:t.tLoan,expense:t.tExp,bonus:t.tBonus,loan_repay:t.tLoanRepay,extra_work:t.tExtraWork,short_hours:t.tShortHours,extra_help:t.tExtraHelp};

  /* Loans and repayments are entangled — a repayment mutates the loan it
     points at — so when editing, the type can move freely among the simple
     types but never into or out of those two. */
  function typeChangeBlocked(key){
    if(!existing) return false;
    var tangled=['loan','loan_repay'];
    return tangled.indexOf(existing.type)>-1 || tangled.indexOf(key)>-1;
  }
  function typeBtn(key,full){
    var active=form.type===key;
    var blocked=typeChangeBlocked(key)&&!active;
    /* Fixed height with the icon above the label, so a two-word type like
       Loan Repayment wraps inside its own tile instead of making that row of
       the grid taller than the others. */
    var st=Object.assign({},active?typeStyles[key].active:typeStyles[key].inactive,
      {borderRadius:12,padding:'10px 6px',cursor:blocked?'not-allowed':'pointer',
       opacity:blocked?0.4:1,fontWeight:700,fontFamily:'Nunito,sans-serif',
       fontSize:fsr(full?14:12.5),transition:'all .15s',textAlign:'center',width:'100%',
       minHeight:full?64:70,display:'flex',flexDirection:full?'row':'column',
       alignItems:'center',justifyContent:'center',gap:full?8:5,lineHeight:1.2});
    return (
      <button key={key} disabled={blocked} onClick={function(){ if(!blocked) set('type',key); }} style={st}>
        {TC[key]&&<Icon name={TC[key].icon} size={full?22:24} />}
        <span>{typeLabels[key]}</span>
      </button>
    );
  }

  return (
    <Modal onClose={onClose} title={existing?t.editEntry:t.addEntry}>
      {errMsg&&<Toast msg={errMsg} onDone={function(){setErrMsg('');}} />}
      {loanLocked && (
        <div className="mb-4 px-3 py-2 rounded-xl" style={{background:'#EAE4F5',border:'1px solid var(--purple)'}}>
          <p style={{fontSize:fsr(13),color:'#3A2E7A',fontWeight:700}} className="flex items-center gap-2"><Icon name="lock" size={15} />{t.loanLockedHint}</p>
        </div>
      )}
      <FLabel label={t.selStaff} req={form.type!=='extra_help'}>
        <FSelect value={form.staffId} onChange={function(v){set('staffId',v);}}>
          <option value="">{form.type==='extra_help'?t.generalNoStaff:t.selStaffPh}</option>
          {staffList.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
        </FSelect>
      </FLabel>

      <div className="mb-4">
        <div className="mb-2">{typeBtn('advance',true)}</div>
        <div className="grid grid-cols-3 gap-2 mb-2">
          {otherTypes.map(function(key){return typeBtn(key,false);})}
        </div>
        <div>{typeBtn('extra_help',true)}</div>
      </div>

      {isTimeBased ? (
        <div>
          <div className="flex gap-3">
            <FLabel label={t.fhours} req={true} style={{flex:1}}><FInput type="number" value={form.hours} onChange={function(v){set('hours',v);}} placeholder="e.g. 2.5" /></FLabel>
            <FLabel label={t.frate} style={{flex:1}}><FInput type="number" value={form.rate} onChange={function(v){set('rate',v);}} placeholder={String(defaultRate)} /></FLabel>
          </div>
          {computedAmount>0 && (
            <div className="mb-4 px-3 py-2 rounded-xl flex justify-between items-center" style={{background:form.type==='extra_work'?'#D8EEE2':'#FDF3DC'}}>
              <span style={{fontSize:fsr(13),color:'var(--ink2)'}}>{t.famount}</span>
              <span style={{fontSize:fsr(18),fontWeight:800,color:form.type==='extra_work'?'var(--ok)':'var(--warn)'}}>{fmt(computedAmount)}</span>
            </div>
          )}
        </div>
      ) : (
        <div>
          <FLabel label={t.famount} req={true}><FInput type="number" value={form.amount} onChange={function(v){set('amount',v);}} placeholder={t.amountPh} disabled={loanLocked} /></FLabel>
          {isHalfDay&&dailyRate>0&&(
            <div className="mb-4 px-3 py-2 rounded-xl flex justify-between items-center" style={{background:'#FDF3DC',marginTop:-8}}>
              <span style={{fontSize:fsr(13),fontWeight:700,color:'#8B5E08'}}>{t.perDayCost}</span>
              <span style={{fontSize:fsr(16),fontWeight:800,color:'#8B5E08'}}>{fmt(dailyRate)}</span>
            </div>
          )}
        </div>
      )}
      <FLabel label={t.fdate}><FInput type="date" value={form.date} onChange={function(v){set('date',v);}} /></FLabel>
      {form.type==='extra_help' && (
        <FLabel label={t.fHelperName} hint={t.fHelperNameHint}>
          <FInput value={form.helperName} onChange={function(v){set('helperName',v);}} placeholder={t.fHelperNamePh} />
        </FLabel>
      )}
      {showPaidBy && (
        <PaidBySelector t={t} mc={mc} memberIds={memberIds} idSuffix="entry"
          value={form.paidBy} nameValue={form.paidByName} suggestions={payerSuggestions}
          onChange={function(v){set('paidBy',v);}} onNameChange={function(v){set('paidByName',v);}} />
      )}
      <FLabel label={t.freason}><FInput value={form.reason} onChange={function(v){set('reason',v);}} placeholder={t.freasonPh} /></FLabel>

      {form.type==='loan' && (
        <div>
          <FLabel label={t.finst} hint={t.hintEMI}><FInput type="number" value={form.installment} onChange={function(v){set('installment',v);}} placeholder={t.amountPh} disabled={loanLocked} /></FLabel>
          <FLabel label={t.ftotinst} hint={t.hintTotInst}><FInput type="number" value={form.totalInstallments} onChange={function(v){set('totalInstallments',v);}} placeholder="e.g. 5" disabled={loanLocked} /></FLabel>
        </div>
      )}

      {form.type==='loan_repay' && (
        <FLabel label={t.fApplyLoan}>
          {activeLoans.length===0
            ? <p style={{fontSize:fsr(13),color:'var(--muted)',padding:'8px 0'}}>{t.noActiveLoans}</p>
            : <FSelect value={form.targetLoanId} onChange={function(v){set('targetLoanId',v);}}>
                <option value="">{t.selStaffPh}</option>
                {activeLoans.map(function(ln){
                  var bal=Math.max(0,ln.amount-(ln.paidInstallments||0)*(ln.installment||0)-(ln.manualRepaid||0));
                  return <option key={ln.id} value={ln.id}>{fmtD(ln.date)} — {fmt(ln.amount)} (bal: {fmt(bal)})</option>;
                })}
              </FSelect>
          }
        </FLabel>
      )}

      {confirmEntry && (
        <div className="fade-in" style={{position:'fixed',inset:0,zIndex:60,display:'flex',alignItems:'flex-end',justifyContent:'center',background:'rgba(26,46,42,0.6)'}}>
          <div style={{background:'var(--surface)',borderRadius:'24px 24px 0 0',padding:24,width:'100%',maxWidth:480}}>
            <p style={{fontSize:fsr(18),fontWeight:800,color:'var(--ink)',marginBottom:6,textAlign:'center'}}>
              {confirmEntry.type} — {fmt(confirmEntry.amount)}
            </p>
            <p style={{fontSize:fsr(14),color:'var(--ink2)',textAlign:'center',marginBottom:20}}>
              {confirmEntry.name}
            </p>
            <div className="flex gap-3">
              <PrimaryBtn onClick={function(){setConfirmEntry(null);}} color="gray" full={true}>{t.confCancel}</PrimaryBtn>
              <PrimaryBtn onClick={function(){setConfirmEntry(null);onSave(buildEntry());}} full={true}>{t.confYes}</PrimaryBtn>
            </div>
