  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

       from environment variables. Absent locally → app runs in guest mode. -->
  <script src="config.js"></script>
  <style>
    :root {
      /* Soft sage-white backgrounds */
      --bg:#EDF2EE; --surface:#FFFFFF; --surface2:#E5EDE6;
      --border:#C4D4C6; --muted:#7A998C;
      /* Deep forest charcoal text */
      --ink:#1A2E2A; --ink2:#3D5E55;
      /* Forest teal actions */
      --accent:#1A6E5E; --accent2:#3EA08A;
      /* Status */
      --ok:#1C7A48; --danger:#C0393B; --warn:#B45309; --purple:#5B4A9B;
    }
    html{font-size:16px;}
    html,body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);font-size:1rem;font-weight:600;}
    #root{background:var(--bg);}
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box;}
    body{margin:0;}
    input,select,textarea{font-size:1.0625rem!important;font-weight:600;}
    #root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
    .scroll-area{overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .fade-in{animation:fi .2s ease;}
    @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .mic-pulse::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(26,110,94,0.4);animation:pulse-ring 1.2s ease-out infinite;}
    .mic-pulse-danger::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(192,57,59,0.5);animation:pulse-ring 0.8s ease-out infinite;}
    @keyframes pulse-ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.35);opacity:0}}
    @keyframes tutPulse{0%,100%{box-shadow:0 0 0 3px rgba(62,160,138,.35)}50%{box-shadow:0 0 0 9px rgba(62,160,138,.12)}}
    @keyframes tutNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
    .cal-btn{min-height:44px;min-width:44px;}
    ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(26,46,42,.06);}
    .inp{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Nunito',sans-serif;font-size:1.0625rem!important;font-weight:600;outline:none;width:100%;color:var(--ink);}
    .inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,110,94,.15);}
    .sel{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Nunito',sans-serif;font-size:1.0625rem!important;font-weight:600;outline:none;width:100%;color:var(--ink);appearance:none;-webkit-appearance:none;}
    .sel:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,110,94,.15);}
    .ta{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Nunito',sans-serif;font-size:1.0625rem!important;font-weight:600;outline:none;width:100%;color:var(--ink);resize:none;}
    .ta:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,110,94,.15);}
    .btn{border-radius:12px;font-weight:800;font-family:'Nunito',sans-serif;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;font-size:1rem;transition:all .15s;line-height:1.2;}
    .btn:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px);}
    .btn:not(:disabled):active{transform:translateY(0);filter:brightness(.96);}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .btn-accent{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(26,110,94,.30);}
    .btn-ok{background:var(--ok);color:#fff;box-shadow:0 2px 6px rgba(28,122,72,.28);}
    .btn-danger{background:var(--danger);color:#fff;}
    .btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--ink2);}
    .btn-sm{padding:9px 14px;font-size:0.875rem;min-height:44px;}
    .btn-full{width:100%;}
    .pill{border-radius:20px;font-size:0.8125rem;font-weight:800;padding:5px 13px;display:inline-block;}
    .pill-warn{background:#F5E8CC;color:#8B5E08;}
    .pill-ok{background:#CCEADC;color:#1A5E35;}
    .pill-accent{background:#D0EBE5;color:#1A5045;}
    .pill-purple{background:#E0D8F0;color:#3A2E7A;}
    .pill-muted{background:var(--surface2);color:var(--ink2);}

<!-- Shown while Babel/React initialise; React replaces it -->
<div id="root">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:12px;">
    <div style="font-size:3rem;">🏠</div>
    <div style="font-size:1.4rem;font-weight:800;color:#1A2E2A;font-family:'Nunito',sans-serif;">GharSeva</div>
    <div style="font-size:.95rem;color:#7A998C;font-family:'Nunito',sans-serif;">Loading… / लोड हो रहा है…</div>
    <div style="width:40px;height:4px;background:#C4D4C6;border-radius:4px;overflow:hidden;margin-top:8px;">
      <div style="width:40%;height:100%;background:#1A6E5E;border-radius:4px;animation:lb 1s ease-in-out infinite alternate;"></div>
    </div>
    <style>@keyframes lb{from{transform:translateX(0)}to{transform:translateX(150%)}}</style>
  </div>
</div>

<!-- Error display (hidden unless window.onerror fires before React mounts) -->
<div id="err" style="display:none;padding:20px;color:#dc2626;font-size:14px;background:#fef2f2;border:1px solid #fca5a5;margin:16px;border-radius:12px;"></div>

<script>
window.onerror = function(msg,_,line){
  var el=document.getElementById('err');
  if(el){el.style.display='block';el.textContent='JS Error at line '+line+': '+msg;}
};
</script>

const {useState,useEffect,useRef,useMemo} = React;

/* ── FIREBASE INIT ──────────────────────────────────────────── */
/* Config comes from config.js (see config.example.js). On Netlify it is
   generated at build time from environment variables; locally you create
   it by hand. No config.js → app runs in guest mode, localStorage only. */
const FIREBASE_CONFIG = window.GHARSEVA_CONFIG || { apiKey: 'YOUR_API_KEY' };
var fbAuth = null, fbDb = null, FIREBASE_ENABLED = false;
(function(){
  try {
    if (typeof firebase === 'undefined') return;
    if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') return;
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb   = firebase.firestore();
    fbDb.enablePersistence({synchronizeTabs:true}).catch(function(){});
    FIREBASE_ENABLED = true;
  } catch(e){ console.warn('Firebase init skipped:', e.message); }
})();

/* Shared sync counter — tabs subscribe via React.useContext(SyncCtx)
   and add it to their useEffect deps so remote writes trigger re-fetch. */
var SyncCtx = React.createContext(0);

/* Household members, for attributing who actually paid for something.
   {uid, members:{uid:{name,color}}, guestMode}. Names live on the home doc
   because Firestore rules keep /users/{uid} readable only by that user, so
   one member can never look another's display name up directly. */
var MembersCtx = React.createContext({uid:'',members:{},guestMode:true});
var MEMBER_COLORS=['#1A6E5E','#5B4A9B','#B45309','#1C7A48','#C0393B','#3EA08A'];
function memberColor(uid){
  var h=0; for(var i=0;i<(uid||'').length;i++) h=(h*31+uid.charCodeAt(i))>>>0;
  return MEMBER_COLORS[h%MEMBER_COLORS.length];
}
function memberLabel(uid,members,t){
  if(!uid) return t?t.notRecorded:'—';
  var m=members&&members[uid];
  return (m&&m.name)||(t?t.memberUnknown:'Member');
}
function displayNameOf(user){
  if(!user) return '';
  return user.displayName||user.phoneNumber||user.email||'Member';
}

/* ── FONT SCALE HELPER ──────────────────────────────────────── */
/* fsr(px): convert a design-px value to a rem string so all text
   scales when html font-size changes (Normal 16→Large 20→XL 24). */
function fsr(n){ return (n/16).toFixed(4)+'rem'; }
function applyFontSz(sz){
  document.documentElement.style.fontSize=sz==='xlarge'?'24px':sz==='large'?'20px':'16px';
}

const SK={
  homes:'gs_homes',settings:'gs_settings',
  staff:h=>'gs_staff_'+h,
  ledger:h=>'gs_ledger_'+h,
  payments:h=>'gs_pay_'+h,
  leaves:(s,ym)=>'gs_lv_'+s+'_'+ym,
};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function lsKeys(){try{return Object.keys(localStorage);}catch(e){return [];}}

function downloadBlob(content,mime,filename){
  var blob=new Blob([content],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},200);
}
function exportCSV(homeId,period){
  var staff=getStaff(homeId);
  var ledger=getLedger(homeId);
  var now=new Date();
  var entries=ledger.filter(function(e){
    if(!e.date) return false;
    if(period==='month') return e.date.startsWith(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
    if(period==='year')  return e.date.startsWith(String(now.getFullYear()));
    return true;
  });
  var rows=[['Date','Staff','Type','Amount','Reason']];
  entries.forEach(function(e){
    var name=(staff.find(function(s){return s.id===e.staffId;})||{name:''}).name;
    var cell=function(v){var s=String(v||'');return (s.includes(',')||s.includes('"'))?'"'+s.replace(/"/g,'""')+'"':s;};
    rows.push([cell(e.date),cell(name),cell(e.type),cell(e.amount||0),cell(e.reason)]);
  });
  var label=period==='month'?(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')):String(now.getFullYear());
  downloadBlob(rows.map(function(r){return r.join(',');}).join('\n'),'text/csv','GharSeva_'+label+'.csv');
}
function downloadBackup(){
  var data={};
  lsKeys().forEach(function(k){if(k.startsWith('gs_'))data[k]=lsGet(k,null);});
  downloadBlob(JSON.stringify(data,null,2),'application/json','GharSeva_Backup_'+todayStr()+'.json');
}
function applyBackup(json){
  var data=JSON.parse(json);
  Object.keys(data).forEach(function(k){if(k.startsWith('gs_'))lsSet(k,data[k]);});
}

/* ── FIRESTORE WRITE WRAPPERS ─────────────────────────────────
   Each wrapper writes to localStorage first (instant UI update),
   then syncs to Firestore. Guest mode (FIREBASE_ENABLED=false)
   just does the localStorage write — no Firestore calls.         */
function fbSaveStaff(homeId, newStaff){
  var old=getStaff(homeId);
  saveStaff(homeId,newStaff);
  if(!FIREBASE_ENABLED||!fbDb) return;
  var batch=fbDb.batch();
  newStaff.forEach(function(s){ batch.set(fbDb.doc('homes/'+homeId+'/staff/'+s.id),s); });
  var newIds=newStaff.map(function(s){return s.id;});
  old.forEach(function(s){ if(!newIds.includes(s.id)) batch.delete(fbDb.doc('homes/'+homeId+'/staff/'+s.id)); });
  batch.commit().catch(function(e){console.warn('fbSaveStaff:',e);});
}
function fbDeleteStaffCascade(homeId, staffId){
  /* called after fbSaveStaff when a staff member is deleted */
  if(!FIREBASE_ENABLED||!fbDb) return;
  fbDb.collection('homes/'+homeId+'/leaves').get().then(function(snap){
    var b=fbDb.batch();
    snap.docs.forEach(function(d){ if(d.id.startsWith(staffId+'_')) b.delete(d.ref); });
    return b.commit();
  }).catch(function(){});
}
function fbSaveLedger(homeId, newLedger){
  var old=getLedger(homeId);
  saveLedger(homeId,newLedger);
  if(!FIREBASE_ENABLED||!fbDb) return;
  var batch=fbDb.batch();
  newLedger.forEach(function(e){ batch.set(fbDb.doc('homes/'+homeId+'/ledger/'+e.id),e); });
  var newIds=newLedger.map(function(e){return e.id;});
  old.forEach(function(e){ if(!newIds.includes(e.id)) batch.delete(fbDb.doc('homes/'+homeId+'/ledger/'+e.id)); });
  batch.commit().catch(function(e){console.warn('fbSaveLedger:',e);});
}
function fbSavePayments(homeId, newPays){
  savePayments(homeId,newPays);
  if(!FIREBASE_ENABLED||!fbDb) return;
  var batch=fbDb.batch();
  newPays.forEach(function(p){ batch.set(fbDb.doc('homes/'+homeId+'/payments/'+p.key),p); });
  batch.commit().catch(function(e){console.warn('fbSavePayments:',e);});
}
function fbSaveLeaves(homeId, staffId, ym, dates){
  saveLeaves(staffId,ym,dates);
  if(!FIREBASE_ENABLED||!fbDb) return;
  fbDb.doc('homes/'+homeId+'/leaves/'+staffId+'_'+ym).set({dates:dates})
    .catch(function(e){console.warn('fbSaveLeaves:',e);});
}

/* Migration: move existing localStorage data into the cloud household */
function migrateFromLocalStorage(homeId){
  if(!FIREBASE_ENABLED||!fbDb) return Promise.resolve();
  var batch=fbDb.batch();
  var existingHomes=lsGet(SK.homes,[]);
  existingHomes.forEach(function(home){
    lsGet(SK.staff(home.id),[]).forEach(function(s){
      batch.set(fbDb.doc('homes/'+homeId+'/staff/'+s.id),s);
    });
    lsGet(SK.ledger(home.id),[]).forEach(function(e){
      batch.set(fbDb.doc('homes/'+homeId+'/ledger/'+e.id),e);
    });
    lsGet(SK.payments(home.id),[]).forEach(function(p){
      batch.set(fbDb.doc('homes/'+homeId+'/payments/'+p.key),p);
    });
  });
  lsKeys().filter(function(k){return k.startsWith('gs_lv_');}).forEach(function(k){
    var ref=k.slice(6); /* strip gs_lv_ → staffId_YYYY-MM */
    batch.set(fbDb.doc('homes/'+homeId+'/leaves/'+ref),{dates:lsGet(k,{})});
  });
  return batch.commit().catch(function(e){console.warn('Migration error:',e);});
}

/* ── UTILS ──────────────────────────────────────────────────── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function fmt(n){return '₹'+Number(n||0).toLocaleString('en-IN');}
function fmtD(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function todayStr(){return new Date().toISOString().slice(0,10);}
function padYM(y,m){return y+'-'+String(m).padStart(2,'0');}
function maskAadhaar(n){if(!n)return '—';var c=n.replace(/\D/g,'');return c.length>=4?'****-****-'+c.slice(-4):'****';}
function maskAccount(n){if(!n)return '—';return n.length<=4?n:'*'.repeat(Math.max(0,n.length-4))+n.slice(-4);}
function roleLabel(key,lang){var r=getRoles().find(function(r){return r.key===key;});return r?(lang==='hi'?r.hi:r.en):key;}

function getLoanBal(staffId,ledger){
  return (ledger||[])
    .filter(function(e){return e.staffId===staffId&&e.type==='loan'&&e.status==='active';})
    .reduce(function(s,e){
      return s+Math.max(0,e.amount-(e.paidInstallments||0)*(e.installment||0)-(e.manualRepaid||0));
    },0);
}

function calcSalary(staff,year,month,ledger,workingDays){
  var ym=padYM(year,month);
  var lv=getLeaves(staff.id,ym);
  var leaveDays=0;
  Object.entries(lv).forEach(function(e){
    if(e[1]==='leave') leaveDays++;
  });
  var daily=staff.salary/(workingDays||30);
  var leaveDeduction=Math.round(daily*leaveDays);
  var items=(ledger||[]).filter(function(e){return e.staffId===staff.id && e.date && e.date.startsWith(ym);});
  var advances  =items.filter(function(e){return e.type==='advance';   }).reduce(function(s,e){return s+(e.amount||0);},0);
  var expenses  =items.filter(function(e){return e.type==='expense';   }).reduce(function(s,e){return s+(e.amount||0);},0);
  var bonuses   =items.filter(function(e){return e.type==='bonus';     }).reduce(function(s,e){return s+(e.amount||0);},0);
  var extraWork =items.filter(function(e){return e.type==='extra_work';}).reduce(function(s,e){return s+(e.amount||0);},0);
  var shortHours=items.filter(function(e){return e.type==='short_hours';}).reduce(function(s,e){return s+(e.amount||0);},0);
  var loanInst=(ledger||[]).filter(function(e){return e.staffId===staff.id&&e.type==='loan'&&e.status==='active';})
               .reduce(function(s,e){return s+(e.installment||0);},0);
  var loanBal=getLoanBal(staff.id,ledger);
  var net=staff.salary-leaveDeduction-advances-expenses-loanInst+bonuses+extraWork-shortHours;
  return {baseSalary:staff.salary,leaveDays:leaveDays,leaveDeduction:leaveDeduction,
          advances:advances,expenses:expenses,loanInst:loanInst,bonuses:bonuses,
          extraWork:extraWork,shortHours:shortHours,loanBal:loanBal,netPayable:Math.max(0,net)};
}

function parseVoice(transcript,staffList){
  var t=transcript.toLowerCase();
  var foundStaff=null;
  for(var i=0;i<staffList.length;i++){
    var s=staffList[i];
    var terms=[];
    (s.name||'').split(' ').forEach(function(p){if(p.length>1) terms.push(p.toLowerCase());});
    if(s.nickname){s.nickname.split(' ').forEach(function(p){if(p.length>0) terms.push(p.toLowerCase());});}
    if(terms.some(function(p){return t.includes(p);})){foundStaff=s;break;}
  }

  var WORD_NUMS=[
    ['panch sau',500],['paanch sau',500],['पाँच सौ',500],['पांच सौ',500],
    ['ek hazaar',1000],['ek hazar',1000],['एक हज़ार',1000],['एक हजार',1000],
    ['do hazaar',2000],['दो हज़ार',2000],
    ['teen hazaar',3000],['तीन हज़ार',3000],
    ['char hazaar',4000],['चार हज़ार',4000],
    ['paanch hazaar',5000],['panch hazaar',5000],['पाँच हज़ार',5000],
    ['das hazaar',10000],['dus hazaar',10000],['दस हज़ार',10000],
    ['bees hazaar',20000],['बीस हज़ार',20000],
  ];
  var amount=null;
  for(var w=0;w<WORD_NUMS.length;w++){
    if(t.includes(WORD_NUMS[w][0])){amount=WORD_NUMS[w][1];break;}
  }
  if(amount===null){var amtM=t.match(/(\d+)/);if(amtM)amount=parseInt(amtM[1]);}

  var action=null;
  if(/took leave|was absent|absent|chutti|छुट्टी|nahi aayi|nahi aaya|chhutti|गैरहाज़िर|अनुपस्थित|नहीं आई|नहीं आया/.test(t)) action='leave';
  else if(/half.?day|half day|adha din|aadha din|आधा दिन|अधा दिन/.test(t)) action='short_hours';
  else if(/overtime|over.?time|extra.*(hours?|kaam|work)|ओवरटाइम|अतिरिक्त/.test(t)) action='extra_work';
  else if(/advance|peshgi|agrim|अग्रिम|पेशगी|एडवांस/.test(t)) action='advance';
  else if(/\bloan\b|udhar diya|udhaar|कर्ज़|उधार|लोन/.test(t)) action='loan';
  else if(/bonus|inaam|बोनस|इनाम/.test(t)) action='bonus';
  else if(/expense|kharcha|खर्च|खर्चा/.test(t)) action='expense';

  var hours=null;
  var hoursM=t.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|घंटे?)/);
  if(hoursM) hours=parseFloat(hoursM[1]);

  return {foundStaff:foundStaff,action:action,amount:amount,hours:hours,transcript:transcript};
}

/* ── MIC BUTTON ─────────────────────────────────────────────── */
function MicButton({lang,onResult,style}){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var [listening,setListening]=useState(false);
  var recRef=useRef(null);
  var t=T[lang];
  if(!SR) return null;
  function toggle(){
    if(listening){
      recRef.current&&recRef.current.stop();
      setListening(false);
    } else {
      var rec=new SR();
      rec.lang=lang==='hi'?'hi-IN':'en-IN';
      rec.interimResults=false;
      rec.onresult=function(e){
        var tr=e.results[0][0].transcript;
        setListening(false);
        onResult(tr);
      };
      rec.onerror=function(){setListening(false);};
      rec.onend=function(){setListening(false);};
      rec.start(); recRef.current=rec; setListening(true);
    }
  }
  return (
    <button onClick={toggle} title={t.micSpeak}
      style={Object.assign({},{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:12,border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:fsr(13),
        background:listening?'var(--danger)':'var(--accent)',color:'#fff',transition:'all .15s',whiteSpace:'nowrap'},style||{})}>
      <span style={{fontSize:fsr(17),lineHeight:1}}>{listening?'■':'🎤'}</span>
      <span>{listening?t.micStop:t.micSpeak}</span>
      {listening&&<span style={{fontSize:fsr(11),opacity:.85}}>{t.micListening}</span>}
    </button>
  );
}

function WACard({message,phone,t}){
  var [copied,setCopied]=useState(false);
  function doCopy(){
    try{
      navigator.clipboard.writeText(message).then(function(){setCopied(true);setTimeout(function(){setCopied(false);},2000);});
    }catch(e){
      var ta=document.createElement('textarea');
      ta.value=message; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); setCopied(true); setTimeout(function(){setCopied(false);},2000);
    }
  }
  function doWA(){
    var ph=phone&&phone.length===10?'91'+phone:'';
    window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(message),'_blank');

  return (

  );
}

/* ── QUICK LEAVE MODAL ──────────────────────────────────────── */
function QuickLeaveModal({staff,lang,ym,homeId,onClose,onSaved}){

/* ── SALARY PAY MODAL ───────────────────────────────────────── */
function SalaryPayModal({staff,lang,homeId,homes,workingDays,onClose,onPaid}){
  var t=T[lang];
  var now=new Date();
  var month=now.getMonth()+1;
  var year=now.getFullYear();
  var [ledger,setLedger]=useState(function(){return getLedger(homeId);});
  var [payments,setPayments]=useState(function(){return getPayments(homeId);});
  var [done,setDone]=useState(false);
  var [waMsg,setWAMsg]=useState('');
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showPaidBy=!mc.guestMode&&memberIds.length>0;
  var [payer,setPayer]=useState(mc.uid||'');
  var payKey=staff.id+'_'+year+'_'+month;
  var paidRec=payments.find(function(p){return p.key===payKey;});
  var calc=calcSalary(staff,year,month,ledger,workingDays);
  var rows=[{label:t.rBase,val:calc.baseSalary,color:'var(--ink)'}];
  if(calc.leaveDays>0) rows.push({label:t.rLeave+' ('+calc.leaveDays+' '+t.tDays+')',val:-calc.leaveDeduction,color:'var(--danger)'});
  if(calc.advances>0) rows.push({label:t.rAdv,val:-calc.advances,color:'var(--warn)'});
  if(calc.expenses>0) rows.push({label:t.rExp,val:-calc.expenses,color:'var(--warn)'});
  if(calc.loanInst>0) rows.push({label:t.rLoan,val:-calc.loanInst,color:'var(--purple)'});
  if(calc.bonuses>0) rows.push({label:t.rBonus,val:calc.bonuses,color:'var(--ok)'});
  if(calc.extraWork>0) rows.push({label:t.rExtraWork,val:calc.extraWork,color:'var(--ok)'});
  if(calc.shortHours>0) rows.push({label:t.rShortHours,val:-calc.shortHours,color:'var(--warn)'});
  function doConfirm(){
    if(paidRec||done) return;
    var pDate=todayStr();
    var home=homes.find(function(h){return h.id===homeId;})||{name:''};
    var rec={key:payKey,staffId:staff.id,year:year,month:month,amount:calc.netPayable,date:pDate};
    if(showPaidBy&&payer) rec.paidBy=payer;
    var newPays=payments.concat([rec]);
    var newLed=ledger.map(function(e){
      if(e.staffId===staff.id&&e.type==='loan'&&e.status==='active'){
        var p=(e.paidInstallments||0)+1;
        return Object.assign({},e,{paidInstallments:p,status:p>=(e.totalInstallments||Infinity)?'closed':'active'});
      }
      return e;
    });
    fbSavePayments(homeId,newPays); fbSaveLedger(homeId,newLed);
    setDone(true);
    setWAMsg(waTemplate('salary',staff,calc.netPayable,pDate,home.name,lang));
    onPaid&&onPaid();
  }
  return (
    <Modal onClose={onClose} title={t.profPaySalary}>
      <div className="flex items-center gap-3 mb-4 p-3 rounded-2xl" style={{background:'var(--surface2)'}}>
        <div className="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-lg shrink-0" style={{background:avatarBg(staff.role)}}>{(staff.name[0]||'?').toUpperCase()}</div>
        <div>
          <p style={{fontWeight:800,fontSize:fsr(17),color:'var(--ink)',margin:0}}>{staff.name}</p>
          <p style={{fontSize:fsr(13),color:'var(--ink2)',margin:0}}>{t.mFull[month-1]} {year}</p>
        </div>
      </div>
      <div className="rounded-2xl overflow-hidden mb-4" style={{border:'1px solid var(--border)'}}>
        {rows.map(function(row,i){
          return (
            <div key={i} className="flex items-center justify-between px-4 py-3" style={{borderBottom:'1px solid var(--border)',background:i%2===0?'var(--surface)':'var(--surface2)'}}>
              <span style={{fontSize:fsr(15),color:'var(--ink2)'}}>{row.label}</span>
              <span style={{fontSize:fsr(15),fontWeight:700,color:row.color}}>{row.val>0?'+':''}{fmt(Math.abs(row.val))}</span>
            </div>
          );
        })}
        <div className="flex items-center justify-between px-4 py-4" style={{background:'var(--accent)'}}>
          <span style={{color:'#fff',fontWeight:700,fontSize:fsr(18)}}>{t.rNet}</span>
          <span style={{color:'#fff',fontWeight:800,fontSize:fsr(24)}}>{fmt(calc.netPayable)}</span>
        </div>
      </div>
      {!(done||paidRec)&&showPaidBy&&(
        <FLabel label={t.paidBy} hint={t.paidByHint}>
          <FSelect value={payer} onChange={setPayer}>
            {memberIds.map(function(id){
              return <option key={id} value={id}>{mc.members[id].name}{id===mc.uid?' ('+t.paidByYou+')':''}</option>;
            })}
          </FSelect>
        </FLabel>
      )}
      {(done||paidRec)
        ? <div className="text-center">
            <p style={{color:'var(--ok)',fontSize:fsr(18),fontWeight:800,padding:'8px 0'}}>✅ {t.paidOk}</p>
            {paidRec&&paidRec.paidBy&&(
              <p style={{fontSize:fsr(13),color:'var(--ink2)',marginBottom:8}}>
                {t.paidBy}: <b>{memberLabel(paidRec.paidBy,mc.members,t)}</b>
              </p>
            )}
            {waMsg&&<WACard message={waMsg} phone={staff.phone} t={t} />}
          </div>
        : <PrimaryBtn onClick={doConfirm} color="green" full={true}>{t.profConfirmPay}</PrimaryBtn>
      }
    </Modal>
  );
}

/* ── STAFF PROFILE PAGE ─────────────────────────────────────── */
function StaffProfile({staff,lang,homeId,homes,workingDays,onBack,onStaffChange}){
  var t=T[lang];
  var now=new Date();
  var month=now.getMonth()+1;
  var year=now.getFullYear();
  var ym=padYM(year,month);
  var [ledger,setLedger]=useState(function(){return getLedger(homeId);});
  var [payments,setPayments]=useState(function(){return getPayments(homeId);});
  var [showPayModal,setShowPayModal]=useState(false);
  var [showEntryModal,setShowEntryModal]=useState(null);
  var [showLeaveModal,setShowLeaveModal]=useState(false);
  var [toast,setToast]=useState('');
  var calc=useMemo(function(){return calcSalary(staff,year,month,ledger,workingDays);},[ledger,workingDays,staff]);
  var leaveMap=getLeaves(staff.id,ym);
  var leaveCount=0,holidayCount=0;
  Object.values(leaveMap).forEach(function(v){if(v==='leave')leaveCount++;else if(v==='holiday')holidayCount++;});
  var thisMonthAdv=ledger.filter(function(e){return e.staffId===staff.id&&e.date&&e.date.startsWith(ym)&&e.type==='advance';});
  var thisMonthHalf=ledger.filter(function(e){return e.staffId===staff.id&&e.date&&e.date.startsWith(ym)&&e.type==='short_hours';});
  var activeLoans=ledger.filter(function(e){return e.staffId===staff.id&&e.type==='loan'&&e.status==='active';});
  var payKey=staff.id+'_'+year+'_'+month;
  var paidRec=payments.find(function(p){return p.key===payKey;});
  var halfDayCount=thisMonthHalf.length;
  var presentDays=Math.max(0,workingDays-leaveCount-halfDayCount*0.5);
  var initials=(staff.name||'?').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  function refreshData(){setLedger(getLedger(homeId));setPayments(getPayments(homeId));onStaffChange&&onStaffChange();}
  function onSaveEntry(entry){
    var next=ledger.concat([entry]);
    if(entry.type==='loan_repay'&&entry.targetLoanId){
      next=next.map(function(e){
        if(e.id===entry.targetLoanId){
          var nr=(e.manualRepaid||0)+entry.amount;
          var tp=(e.paidInstallments||0)*(e.installment||0)+nr;
          return Object.assign({},e,{manualRepaid:nr,status:tp>=e.amount?'closed':'active'});
        }
        return e;
      });
    }
    fbSaveLedger(homeId,next); setLedger(next); setShowEntryModal(null); setToast(t.savedOk);
  }
  var allStaff=getStaff(homeId);
  var actions=[
    {icon:'💵',label:paidRec?t.profAlreadyPaid:t.profPaySalary,onClick:function(){setShowPayModal(true);},color:paidRec?'var(--muted)':'var(--ok)',disabled:!!paidRec},
    {icon:'💸',label:t.profRecAdv,onClick:function(){setShowEntryModal('advance');},color:'var(--warn)',disabled:false},
    {icon:'💰',label:t.profRecLoan,onClick:function(){setShowEntryModal('loan_repay');},color:'var(--purple)',disabled:false},
    {icon:'🗓️',label:t.profMarkLeave,onClick:function(){setShowLeaveModal(true);},color:'var(--danger)',disabled:false},
  ];
  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      {toast&&<Toast msg={toast} onDone={function(){setToast('');}} />}

        <button onClick={onBack}
          style={{background:'var(--surface2)',border:'none',cursor:'pointer',borderRadius:10,padding:'8px 14px',fontWeight:800,fontSize:fsr(14),color:'var(--ink)',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'}}>
          ← {t.profBack}
        </button>
        <p style={{flex:1,fontWeight:800,fontSize:fsr(17),color:'var(--ink)',margin:0}} className="truncate">{staff.name}</p>

      <div className="scroll-area flex-1 p-4" style={{display:'flex',flexDirection:'column',gap:16}}>

          <div className="flex items-center gap-4 mb-4">

              {staff.nickname&&<p style={{fontSize:fsr(13),color:'var(--muted)',margin:'2px 0 0'}}>{staff.nickname}</p>}
              <span className="pill pill-muted" style={{marginTop:6,display:'inline-block'}}>{roleLabel(staff.role,lang)}</span>
            </div>

          <div className="grid grid-cols-2 gap-2 mb-3">

                <p style={{fontSize:fsr(11),color:'var(--muted)',fontWeight:700,marginBottom:2}}>📅 {t.profJoined}</p>

/* ── DASHBOARD TAB ──────────────────────────────────────────── */
function DashboardTab({lang,homeId,homes,workingDays,onNavigate,syncKey}){
  var t=T[lang];
  var [staff,setStaff]=useState(function(){return getStaff(homeId);});
  var [ledger,setLedger]=useState(function(){return getLedger(homeId);});
  var [payments,setPayments]=useState(function(){return getPayments(homeId);});

  useEffect(function(){
    setStaff(getStaff(homeId));
    setLedger(getLedger(homeId));
    setPayments(getPayments(homeId));
  },[homeId,syncKey]);

  var now=new Date();
  var today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var curYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var curYear=now.getFullYear(),curMonth=now.getMonth()+1,todayDate=now.getDate();

  /* attendance */
  var presentCount=0,absentCount=0,holidayCount=0;
  staff.forEach(function(s){
    var st=getLeaves(s.id,curYM)[today];
    if(st==='leave') absentCount++;
    else if(st==='holiday') holidayCount++;
    else presentCount++;
  });

  /* upcoming pay days sorted by closeness */
  var payList=staff.map(function(s){
    var pd=Number(s.payDay)||1;
    var daysUntil=pd>=todayDate?pd-todayDate:(30-todayDate+pd);
    var isPaid=payments.some(function(p){return p.staffId===s.id&&Number(p.year)===curYear&&Number(p.month)===curMonth;});
    return {s:s,daysUntil:daysUntil,isPaid:isPaid,pd:pd};
  }).sort(function(a,b){return a.daysUntil-b.daysUntil;});

  /* recent ledger entries */
  var recent=[...ledger].sort(function(a,b){return b.date>a.date?1:-1;}).slice(0,3);

  /* monthly spend */
  var totalSal=staff.reduce(function(s,x){return s+(x.salary||0);},0);
  var paidAmt=payments.filter(function(p){return Number(p.year)===curYear&&Number(p.month)===curMonth;}).reduce(function(s,p){return s+(p.amount||0);},0);
  var paidPct=totalSal>0?Math.min(100,Math.round(paidAmt/totalSal*100)):0;

  var dayLabel=t.days[now.getDay()]+', '+now.getDate()+' '+t.mFull[now.getMonth()];

  return (
    <div className="flex-1 scroll-area p-4">
      <p style={{fontSize:fsr(12),fontWeight:800,color:'var(--muted)',marginBottom:14,textTransform:'uppercase',letterSpacing:'0.07em'}}>
        {t.dash} · {dayLabel}
      </p>

      {/* Attendance */}
      {staff.length===0
        ? <div className="card mb-4 text-center"><p style={{color:'var(--muted)',fontSize:fsr(14)}}>{t.dashNoStaff}</p></div>
        : <div className="grid grid-cols-3 gap-3 mb-4">
            {[{n:presentCount,lbl:t.dashPresent,c:'var(--ok)'},{n:absentCount,lbl:t.dashAbsent,c:'var(--danger)'},{n:holidayCount,lbl:t.dashHoliday,c:'var(--warn)'}].map(function(tile){
              return (
                <div key={tile.lbl} className="card text-center" style={{padding:'14px 8px'}}>
                  <p style={{fontSize:fsr(30),fontWeight:800,color:tile.c,margin:0,lineHeight:1}}>{tile.n}</p>
                  <p style={{fontSize:fsr(11),fontWeight:700,color:'var(--muted)',margin:'4px 0 0'}}>{tile.lbl}</p>
                </div>
              );
            })}
          </div>
      }

      {/* Pay Days */}
      <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:8}}>{t.dashPay}</p>
      <div className="rounded-2xl mb-4 overflow-hidden" style={{background:'var(--surface)',border:'1px solid var(--border)',boxShadow:'0 1px 4px rgba(26,46,42,.06)'}}>
        {payList.length===0
          ? <p className="p-4 text-center" style={{color:'var(--muted)',fontSize:fsr(13)}}>{t.dashNoStaff}</p>
          : payList.map(function(item,i){
              var dueTxt=item.daysUntil===0?t.dashToday:item.daysUntil===1?t.dashTomorrow:item.pd+' '+t.tDays;
              return (
                <div key={item.s.id} className="flex items-center gap-3 px-4 py-3"
                  style={{borderBottom:i<payList.length-1?'1px solid var(--border)':'none'}}>
                  <div className="rounded-full flex items-center justify-center text-white font-bold shrink-0"
                    style={{width:36,height:36,background:avatarBg(item.s.role),fontSize:fsr(13)}}>
                    {(item.s.name[0]||'?').toUpperCase()}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p style={{fontSize:fsr(14),fontWeight:800,color:'var(--ink)',margin:0}} className="truncate">{item.s.name}</p>
                    <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}}>{dueTxt}</p>
                  </div>
                  {item.isPaid
                    ? <span className="pill pill-ok" style={{fontSize:fsr(10)}}>{t.tPaidBadge}</span>
                    : <button onClick={function(){onNavigate('salary',item.s.id);}}
                        style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:10,padding:'7px 14px',fontSize:fsr(13),fontWeight:800,cursor:'pointer',fontFamily:'Nunito,sans-serif',minHeight:36,whiteSpace:'nowrap'}}>
                        {t.dashPayBtn}
                      </button>
                  }
                </div>
              );
            })
        }
      </div>

      {/* Recent Entries */}
      <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:8}}>{t.dashRecent}</p>
      <div className="rounded-2xl mb-4 overflow-hidden" style={{background:'var(--surface)',border:'1px solid var(--border)',boxShadow:'0 1px 4px rgba(26,46,42,.06)'}}>
        {recent.length===0
          ? <p className="p-4 text-center" style={{color:'var(--muted)',fontSize:fsr(13)}}>{t.dashNoRecent}</p>
          : recent.map(function(e,i){
              var s=staff.find(function(x){return x.id===e.staffId;})||{name:'?'};
              var tc=TC[e.type]||{icon:'•',bg:'var(--surface2)'};
              return (
                <div key={e.id} className="flex items-center gap-3 px-4 py-3"
                  style={{background:tc.bg,borderBottom:i<recent.length-1?'1px solid var(--border)':'none'}}>
                  <span style={{fontSize:fsr(20),width:28,textAlign:'center'}}>{tc.icon}</span>
                  <div className="flex-1 min-w-0">
                    <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink)',margin:0}} className="truncate">{s.name}</p>
                    <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}}>{e.reason||''} · {fmtD(e.date)}</p>
                  </div>
                  <p style={{fontSize:fsr(14),fontWeight:800,color:'var(--ink)',margin:0,flexShrink:0}}>{fmt(e.amount)}</p>
                </div>
              );
            })
        }
      </div>

      {/* Monthly Spend */}
      <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:8}}>{t.dashSpend}</p>
      <div className="card">
        <div className="flex justify-between items-center mb-3">
          <span style={{fontSize:fsr(13),color:'var(--muted)',fontWeight:700}}>{t.dashPaid}</span>
          <span style={{fontSize:fsr(20),fontWeight:800,color:'var(--ok)'}}>{fmt(paidAmt)}</span>
        </div>
        <div style={{height:10,background:'var(--surface2)',borderRadius:6,overflow:'hidden'}}>
          <div style={{height:'100%',width:paidPct+'%',background:'var(--ok)',borderRadius:6,transition:'width .5s ease'}} />
        </div>
        <div className="flex justify-between items-center mt-2">
          <span style={{fontSize:fsr(11),color:'var(--muted)'}}>{t.dashOf} {fmt(totalSal)}</span>
          <span style={{fontSize:fsr(11),fontWeight:800,color:paidPct===100?'var(--ok)':'var(--muted)'}}>{paidPct}%</span>
        </div>
      </div>

      <div style={{height:16}} />
    </div>
  );
}

/* ── STAFF TAB ──────────────────────────────────────────────── */
function StaffTab({lang,homeId,homes,workingDays,onStaffChange,syncKey}){
  var t=T[lang];
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [payments,setPayments]=useState([]);
  var [showAdd,setShowAdd]=useState(false);
  var [editing,setEditing]=useState(null);
  var [selectedStaff,setSelectedStaff]=useState(null);
  var now=new Date();
  var curYear=now.getFullYear(), curMonth=now.getMonth()+1;

  useEffect(function(){
    setStaff(getStaff(homeId));setLedger(getLedger(homeId));
    setPayments(getPayments(homeId));
    setShowAdd(false);setEditing(null);setSelectedStaff(null);
  },[homeId,syncKey]);

  function save(s){
    var idx=staff.findIndex(function(x){return x.id===s.id;});
    var next=idx>=0?staff.map(function(x,i){return i===idx?s:x;}):[...staff,s];
    setStaff(next); fbSaveStaff(homeId,next);
    setShowAdd(false); setEditing(null);
    onStaffChange && onStaffChange();
  }
  function del(id){
    var next=staff.filter(function(x){return x.id!==id;});
    setStaff(next); fbSaveStaff(homeId,next);
    lsKeys().filter(function(k){return k.startsWith('gs_lv_'+id+'_');}).forEach(lsDel);
    fbDeleteStaffCascade(homeId,id);
    var nextLedger=getLedger(homeId).filter(function(e){return e.staffId!==id;});
    fbSaveLedger(homeId,nextLedger);
    setSelectedStaff(null);
    onStaffChange && onStaffChange();
  }

  if(selectedStaff){
    return <StaffProfile
      staff={selectedStaff} lang={lang} homeId={homeId} homes={homes||[]} workingDays={workingDays||30}
      onBack={function(){setSelectedStaff(null);setStaff(getStaff(homeId));setLedger(getLedger(homeId));}}
      onStaffChange={function(){
        setStaff(getStaff(homeId));setLedger(getLedger(homeId));
        onStaffChange&&onStaffChange();
      }}
    />;
  }

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <div className="p-4 shrink-0" style={{background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
        <PrimaryBtn onClick={function(){setShowAdd(true);}} full={true} tut="add-staff">{t.addStaff}</PrimaryBtn>
      </div>
      <div className="p-4 scroll-area flex-1">
        {staff.length===0
          ? <p className="text-center mt-16 text-base whitespace-pre-line" style={{color:'var(--muted)'}}>{t.noStaff}</p>
          : staff.map(function(s){
              var isPaid=payments.some(function(p){return p.staffId===s.id&&Number(p.year)===curYear&&Number(p.month)===curMonth;});
              return (
                <StaffCard key={s.id} staff={s} lang={lang}
                  loanBal={getLoanBal(s.id,ledger)}
                  isPaid={isPaid}
                  onView={function(){setSelectedStaff(s);}}
                  onEdit={function(){setEditing(s);}}
                  onDelete={function(){del(s.id);}} />
              );
            })
        }
      </div>
      {showAdd && <StaffModal lang={lang} onClose={function(){setShowAdd(false);}} onSave={save} />}
      {editing && <StaffModal lang={lang} onClose={function(){setEditing(null);}} onSave={save} existing={editing} />}
    </div>
  );
}

/* ── SALARY TAB ─────────────────────────────────────────────── */
function SalaryTab({lang,homeId,homes,refreshKey,workingDays,defaultStaffId,syncKey}){
  var t=T[lang];
  var now=new Date();
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showPaidBy=!mc.guestMode&&memberIds.length>0;
  var [payer,setPayer]=useState(mc.uid||'');
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [payments,setPayments]=useState([]);
  var [selStaff,setSelStaff]=useState(defaultStaffId||'');
  var [selMonth,setSelMonth]=useState(now.getMonth()+1);
  var [selYear,setSelYear]=useState(now.getFullYear());
  var [calc,setCalc]=useState(null);
  var [waMsg,setWAMsg]=useState('');
  var [toast,setToast]=useState('');

  useEffect(function(){
    var s=getStaff(homeId);
    setStaff(s); setLedger(getLedger(homeId)); setPayments(getPayments(homeId));
    setSelStaff(defaultStaffId||''); setCalc(null); setWAMsg('');
  },[homeId,refreshKey,syncKey]);

  function doCalc(){
    var s=staff.find(function(x){return x.id===selStaff;});
    if(!s) return;
    setCalc(calcSalary(s,selYear,selMonth,ledger,workingDays));
    setWAMsg('');
  }

  function doMarkPaid(){
    var s=staff.find(function(x){return x.id===selStaff;});
    if(!s||!calc) return;
    var key=selStaff+'_'+selYear+'_'+selMonth;
    if(payments.find(function(p){return p.key===key;})) return;
    var pDate=todayStr();
    var home=homes.find(function(h){return h.id===homeId;})||{name:''};
    var rec={key:key,staffId:selStaff,year:selYear,month:selMonth,amount:calc.netPayable,date:pDate};
    if(showPaidBy&&payer) rec.paidBy=payer;
    var newPays=[...payments,rec];
    var newLed=ledger.map(function(e){
      if(e.staffId===selStaff&&e.type==='loan'&&e.status==='active'){
        var paid=(e.paidInstallments||0)+1;
        return Object.assign({},e,{paidInstallments:paid,status:paid>=(e.totalInstallments||Infinity)?'closed':'active'});
      }
      return e;
    });
    fbSavePayments(homeId,newPays); setPayments(newPays);
    fbSaveLedger(homeId,newLed); setLedger(newLed);
    setToast(t.paidOk);
    setWAMsg(waTemplate('salary',s,calc.netPayable,pDate,home.name,lang));
  }

  var s=staff.find(function(x){return x.id===selStaff;});
  var payKey=selStaff+'_'+selYear+'_'+selMonth;
  var paidRec=payments.find(function(p){return p.key===payKey;});
  var years=[now.getFullYear()-1,now.getFullYear()];

  return (
    <div className="p-4 scroll-area flex-1">
      {toast && <Toast msg={toast} onDone={function(){setToast('');}} />}

      <div className="rounded-2xl p-4 mb-4" style={{background:'var(--surface2)'}}>
        <FLabel label={t.selStaff}>
          <FSelect tut="salary-staff" value={selStaff} onChange={function(v){setSelStaff(v);setCalc(null);setWAMsg('');}}>
            <option value="">{t.selStaff}</option>
            {staff.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
          </FSelect>
        </FLabel>
        <div className="flex gap-3">
          <FLabel label={t.selMonth}>
            <FSelect value={selMonth} onChange={function(v){setSelMonth(Number(v));}}>
              {t.mFull.map(function(m,i){return <option key={i} value={i+1}>{m}</option>;})}
            </FSelect>
          </FLabel>
          <FLabel label={t.selYear}>
            <FSelect value={selYear} onChange={function(v){setSelYear(Number(v));}}>
              {years.map(function(y){return <option key={y} value={y}>{y}</option>;})}
            </FSelect>
          </FLabel>
        </div>
        <PrimaryBtn onClick={doCalc} full={true} disabled={!selStaff} tut="salary-calc">{t.calcBtn}</PrimaryBtn>
      </div>

      {!calc && <p className="text-center text-base mt-8" style={{color:'var(--muted)'}}>{t.noCalc}</p>}

      {calc && s && (
        <div className="fade-in">
          <div className="flex items-center gap-3 mb-3">
            <div className="w-11 h-11 rounded-full flex items-center justify-center text-white font-bold text-lg" style={{background:avatarBg(s.role)}}>
              {(s.name[0]||'?').toUpperCase()}
            </div>
            <div>
              <p style={{fontWeight:800,color:'var(--ink)',fontSize:fsr(18),margin:0}}>{s.name}</p>
              <p style={{fontSize:fsr(12),color:'var(--muted)',margin:0}}>{t.mFull[selMonth-1]} {selYear}</p>
            </div>
          </div>

          <div className="rounded-2xl overflow-hidden mb-4" style={{border:'1px solid var(--border)'}}>
            {[
              {label:t.rBase, val:calc.baseSalary, sign:0},
              {label:t.rLeave+' ('+calc.leaveDays+' '+t.tDays+')', val:calc.leaveDeduction, sign:-1},
              {label:t.rAdv, val:calc.advances, sign:-1},
              {label:t.rLoan, val:calc.loanInst, sign:-1},
              {label:t.rExp, val:calc.expenses, sign:-1},
              {label:t.rBonus, val:calc.bonuses, sign:1},
              {label:t.rExtraWork, val:calc.extraWork, sign:1},
              {label:t.rShortHours, val:calc.shortHours, sign:-1},
            ].map(function(row){
              var color=row.sign===-1&&row.val>0?'var(--danger)':row.sign===1&&row.val>0?'var(--ok)':'var(--ink)';
              return (
                <div key={row.label} className="flex justify-between items-center py-3 px-4" style={{borderBottom:'1px solid var(--border)',background:'var(--surface)'}}>
                  <span style={{fontSize:fsr(15),color:'var(--ink2)'}}>{row.label}</span>
                  <span style={{fontSize:fsr(15),fontWeight:700,color:color}}>
                    {row.sign===-1&&row.val>0?'− ':row.sign===1&&row.val>0?'+ ':''}{fmt(row.val)}
                  </span>
                </div>
              );
            })}
            <div className="flex justify-between items-center py-4 px-4" style={{background:'var(--accent)'}}>
              <span style={{color:'#fff',fontWeight:700,fontSize:fsr(18)}}>{t.rNet}</span>
              <span style={{color:'#fff',fontWeight:800,fontSize:fsr(24)}}>{fmt(calc.netPayable)}</span>
            </div>
          </div>

          {calc.loanBal>0 && (
            <div className="flex justify-between items-center px-4 py-2 mb-3 rounded-2xl" style={{background:'#EAE4F5',border:'1px solid var(--purple)'}}>
              <span style={{fontSize:fsr(13),fontWeight:700,color:'var(--purple)'}}>🏦 {t.rLoanBal}</span>
              <span style={{fontSize:fsr(15),fontWeight:800,color:'var(--purple)'}}>{fmt(calc.loanBal)}</span>
            </div>
          )}
          <p style={{fontSize:fsr(12),color:'var(--muted)',textAlign:'center',marginBottom:16}}>{t.wdays} {workingDays}</p>

          {paidRec
            ? <div className="rounded-2xl p-4 text-center" style={{background:'#D5EEE8',border:'1px solid #A8D4C4'}}>
                <p style={{color:'var(--ok)',fontWeight:700,fontSize:fsr(15)}}>✅ {t.paidOn} {fmtD(paidRec.date)}</p>
                <p style={{color:'var(--ok)',fontSize:fsr(13),marginTop:4}}>{fmt(paidRec.amount)}</p>
                {showPaidBy&&paidRec.paidBy&&(
                  <p style={{fontSize:fsr(13),color:'var(--ink2)',marginTop:6}}>
                    {t.paidBy}: <b>{memberLabel(paidRec.paidBy,mc.members,t)}</b>
                  </p>
                )}
              </div>
            : <div>
                {showPaidBy&&(
                  <FLabel label={t.paidBy} hint={t.paidByHint}>
                    <FSelect value={payer} onChange={setPayer}>
                      {memberIds.map(function(id){
                        return <option key={id} value={id}>{mc.members[id].name}{id===mc.uid?' ('+t.paidByYou+')':''}</option>;
                      })}
                    </FSelect>
                  </FLabel>
                )}
                <PrimaryBtn onClick={doMarkPaid} color="green" full={true}>{t.markPaid}</PrimaryBtn>
              </div>
          }

          {waMsg && <WACard message={waMsg} phone={s.phone} t={t} />}
        </div>
      )}
    </div>
  );
}

/* ── LEAVE CALENDAR ─────────────────────────────────────────── */
function LeaveCalendar({staffId,staffSalary,lang,year,month,workingDays,homeId,syncKey}){
  var t=T[lang];
  var ym=padYM(year,month);
  var [lv,setLv]=useState({});
  var [flash,setFlash]=useState('');
  var today=new Date();

  useEffect(function(){setLv(getLeaves(staffId,ym));},[staffId,ym,syncKey]);

  function toggle(day){
    var date=new Date(year,month-1,day);
    if(date>today) return;
    var key=ym+'-'+String(day).padStart(2,'0');
    var cur=lv[key];
    var next=cur==='leave'?'holiday':cur==='holiday'?null:'leave';
    var updated=Object.assign({},lv);
    if(next) updated[key]=next; else delete updated[key];
    setLv(updated); fbSaveLeaves(homeId||_activeHomeId,staffId,ym,updated);
  }

  function markToday(status){
    var isCurrentMonth=year===today.getFullYear()&&month===today.getMonth()+1;
    if(!isCurrentMonth) return;
    var key=ym+'-'+String(today.getDate()).padStart(2,'0');
    var updated=Object.assign({},lv);
    if(status===null) delete updated[key]; else updated[key]=status;
    setLv(updated); fbSaveLeaves(homeId||_activeHomeId,staffId,ym,updated);
    setFlash(status||'present');
    setTimeout(function(){setFlash('');},1200);
  }

  var isCurrentMonth=year===today.getFullYear()&&month===today.getMonth()+1;

  var firstDay=new Date(year,month-1,1).getDay();
  var daysInMonth=new Date(year,month,0).getDate();
  var leaveDays=Object.values(lv).filter(function(v){return v==='leave';}).length;
  var deduction=Math.round((staffSalary/(workingDays||30))*leaveDays);

  var cells=[];
  for(var i=0;i<firstDay;i++) cells.push(null);
  for(var d=1;d<=daysInMonth;d++) cells.push(d);

  function dayStatus(day){
    if(!day) return null;
    var k=ym+'-'+String(day).padStart(2,'0');
    return lv[k]||'present';
  }

  function dayCls(st){
    if(st==='leave')   return {background:'#FCE8E8',color:'var(--danger)',fontWeight:700};
    if(st==='holiday') return {background:'#F5EBC0',color:'var(--warn)',fontWeight:700};
    return {background:'var(--surface2)',color:'var(--ink2)'};
  }
  function dayLbl(st){
    if(st==='leave')   return t.Ls;
    if(st==='holiday') return t.Hs;
    return t.Ps;
  }

  return (
    <div>
      {isCurrentMonth && (
        <div className="mb-4" data-tut="mark-today">
          <p style={{fontSize:fsr(11),fontWeight:800,color:'var(--muted)',textAlign:'center',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.06em'}}>{t.markToday}</p>
          <div className="flex gap-2">
            {[
              {status:null,   icon:'✓', label:t.tPresent, cls:'pill-ok',   bg:'#CCEADC', c:'#1A5E35'},
              {status:'leave',    icon:'🗓', label:t.tLeave,   bg:'#FCE8E8', c:'var(--danger)'},
              {status:'holiday',  icon:'🏖', label:t.tHoliday, bg:'#F5EBC0', c:'var(--warn)'},
            ].map(function(item){
              var active=flash===( item.status||'present');
              return (
                <button key={item.label} onClick={function(){markToday(item.status);}}
                  style={{flex:1,padding:'10px 4px',borderRadius:14,border:'2px solid '+(active?item.c:'transparent'),
                    background:active?item.bg:item.bg+'99',color:item.c,fontWeight:800,
                    fontSize:fsr(13),cursor:'pointer',fontFamily:'Nunito,sans-serif',
                    display:'flex',flexDirection:'column',alignItems:'center',gap:2,
                    transition:'all .15s',minHeight:60}}>
                  <span style={{fontSize:fsr(18),lineHeight:1}}>{active?'✓':item.icon}</span>
                  <span style={{fontSize:fsr(11)}}>{active?t.markTodayDone:item.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
      <p style={{fontSize:fsr(12),color:'var(--muted)',textAlign:'center',marginBottom:12}}>{t.calHint}</p>
      <div className="grid grid-cols-7 mb-1">
        {t.days.map(function(d,i){return <div key={i} style={{textAlign:'center',fontSize:fsr(11),fontWeight:700,paddingTop:4,paddingBottom:4,color:i===0?'var(--danger)':'var(--ink2)'}}>{d}</div>;})}
      </div>
      <div className="grid grid-cols-7 gap-0.5">
        {cells.map(function(day,idx){
          if(!day) return <div key={'e'+idx} />;
          var st=dayStatus(day);
          var td=new Date(year,month-1,day);
          var isToday=td.toDateString()===today.toDateString();
          var isFuture=td>today&&!isToday;
          var stStyle=dayCls(st);
          return (
            <button key={day} onClick={function(){toggle(day);}} disabled={!!isFuture}
              className="cal-btn flex flex-col items-center justify-center rounded-lg text-xs transition-all"
              style={Object.assign({},stStyle,{outline:'none',border:isToday?'2px solid var(--accent)':'none',cursor:isFuture?'default':'pointer',opacity:isFuture?0.5:1})}>
              <span style={{fontSize:fsr(13),fontWeight:600,lineHeight:1}}>{day}</span>
              <span style={{fontSize:fsr(11),lineHeight:1,marginTop:2,opacity:.8}}>{dayLbl(st)}</span>
            </button>
          );
        })}
      </div>
      <div className="mt-4 flex gap-3">
        <div className="flex-1 rounded-2xl p-3 text-center" style={{background:'#FCE8E8',border:'1px solid #F5C6C6'}}>
          <p style={{fontSize:fsr(12),fontWeight:600,color:'var(--danger)'}}>{t.tlLeave}</p>
          <p style={{fontSize:fsr(28),fontWeight:800,color:'var(--danger)'}}>{leaveDays}</p>
        </div>
        <div className="flex-1 rounded-2xl p-3 text-center" style={{background:'var(--surface2)',border:'1px solid var(--border)'}}>
          <p style={{fontSize:fsr(12),fontWeight:600,color:'var(--ink2)'}}>{t.tlDed}</p>
          <p style={{fontSize:fsr(22),fontWeight:800,color:'var(--ink)'}}>{fmt(deduction)}</p>
        </div>
      </div>
      <div className="mt-3 flex flex-wrap gap-2 justify-center">
        {[[{background:'var(--surface2)',color:'var(--ink2)'},t.Ps,t.tPresent],[{background:'#FCE8E8',color:'var(--danger)'},t.Ls,t.tLeave],[{background:'#F5EBC0',color:'var(--warn)'},t.Hs,t.tHoliday]].map(function(item){
          return <span key={item[2]} className="rounded-lg px-2 py-1 text-xs font-bold" style={item[0]}>{item[1]} = {item[2]}</span>;
        })}
      </div>
    </div>
  );
}

function LeavesTab({lang,homeId,workingDays,syncKey}){
  var t=T[lang];
  var now=new Date();
  var [staff,setStaff]=useState([]);
  var [selStaff,setSelStaff]=useState('');
  var [month,setMonth]=useState(now.getMonth()+1);
  var [year,setYear]=useState(now.getFullYear());

  useEffect(function(){
    var s=getStaff(homeId);
    setStaff(s); setSelStaff(s.length>0?s[0].id:'');
  },[homeId,syncKey]);

  function prevM(){if(month===1){setMonth(12);setYear(function(y){return y-1;});}else setMonth(function(m){return m-1;});}
  function nextM(){
    var nm=month===12?1:month+1, ny=month===12?year+1:year;
    if(ny>now.getFullYear()||(ny===now.getFullYear()&&nm>now.getMonth()+1)) return;
    setMonth(nm); if(month===12)setYear(function(y){return y+1;});
  }

  var s=staff.find(function(x){return x.id===selStaff;});

  return (
    <div className="p-4 scroll-area flex-1">
      <FLabel label={t.selStaff}>
        <FSelect value={selStaff} onChange={setSelStaff}>
          {staff.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
        </FSelect>
      </FLabel>

      {s ? (
        <div className="fade-in">
          <div className="flex items-center justify-between mb-4 rounded-2xl p-3" style={{background:'var(--surface2)'}}>
            <button onClick={prevM} className="w-10 h-10 rounded-full flex items-center justify-center text-xl" style={{background:'var(--surface)',border:'1px solid var(--border)',cursor:'pointer'}}>‹</button>
            <span style={{fontWeight:800,color:'var(--ink)',fontSize:fsr(15)}}>{t.mFull[month-1]} {year}</span>
            <button onClick={nextM} className="w-10 h-10 rounded-full flex items-center justify-center text-xl" style={{background:'var(--surface)',border:'1px solid var(--border)',cursor:'pointer'}}>›</button>
          </div>
          <LeaveCalendar staffId={s.id} staffSalary={s.salary} lang={lang} year={year} month={month} workingDays={workingDays} homeId={homeId} syncKey={syncKey} />
        </div>
      ) : <p className="text-center mt-16" style={{color:'var(--muted)'}}>{t.noStaff}</p>}
    </div>
  );
}

/* ── ADD ENTRY MODAL ────────────────────────────────────────── */
function EntryModal({lang,staffList,onClose,onSave,ledger,workingDays,prefillStaffId,prefillType}){
  var t=T[lang];
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  /* only for money actually leaving someone's hand, and only once signed in */
  var CASH_OUT=['advance','loan','expense','bonus','extra_work'];
  var [form,setForm]=useState({staffId:prefillStaffId||'',type:prefillType||'advance',amount:'',date:todayStr(),reason:'',installment:'',totalInstallments:'',targetLoanId:'',hours:'',rate:'',paidBy:mc.uid||''});
  function set(k,v){setForm(function(f){return Object.assign({},f,{[k]:v});});}
  var showPaidBy=!mc.guestMode&&memberIds.length>0&&CASH_OUT.indexOf(form.type)>-1;

  var isTimeBased=form.type==='extra_work';
  var isHalfDay=form.type==='short_hours';
  var selStaff=staffList.find(function(x){return x.id===form.staffId;});
  var dailyRate=selStaff?Math.round(selStaff.salary/(workingDays||30)):0;
  var defaultRate=selStaff?Math.round(dailyRate/8):0;
  var halfDayAmt=selStaff?Math.round(dailyRate/2):0;
  var effectiveRate=Number(form.rate)||defaultRate;
  var computedAmount=isTimeBased&&form.hours?Math.round(Number(form.hours)*effectiveRate):0;

  useEffect(function(){
    if(isTimeBased&&form.staffId&&defaultRate) set('rate',String(defaultRate));
    if(isHalfDay&&form.staffId&&halfDayAmt) set('amount',String(halfDayAmt));
  },[form.staffId,form.type]);

  var activeLoans=(ledger||[]).filter(function(e){return e.staffId===form.staffId&&e.type==='loan'&&e.status==='active';});

  var [errMsg,setErrMsg]=useState('');
  var [confirmEntry,setConfirmEntry]=useState(null);

  function buildEntry(){
    var finalAmount=isTimeBased?computedAmount:Number(form.amount);
    var entry={id:uid(),staffId:form.staffId,type:form.type,amount:finalAmount,date:form.date,reason:form.reason};
    if(form.type==='loan'){entry.installment=Number(form.installment)||0;entry.totalInstallments=Number(form.totalInstallments)||0;entry.paidInstallments=0;entry.status='active';}
    if(form.type==='loan_repay') entry.targetLoanId=form.targetLoanId;
    if(isTimeBased){entry.hours=Number(form.hours);entry.rate=effectiveRate;}
    if(showPaidBy&&form.paidBy) entry.paidBy=form.paidBy;
    return entry;
  }

  function handleSave(){
    if(!form.staffId){setErrMsg(t.errStaff);return;}
    if(!form.date) return;
    if(isTimeBased&&(!form.hours||computedAmount<=0)){setErrMsg(t.errAmount);return;}
    if(!isTimeBased&&form.type!=='loan_repay'&&!form.amount){setErrMsg(t.errAmount);return;}
    if(form.type==='loan_repay'&&(!form.amount||!form.targetLoanId)){setErrMsg(t.errAmount);return;}
    var finalAmount=isTimeBased?computedAmount:Number(form.amount);
    var needsConfirm=(form.type==='advance'||form.type==='loan')&&finalAmount>=1000;
    if(needsConfirm){
      var sName=(staffList.find(function(s){return s.id===form.staffId;})||{}).name||'';
      setConfirmEntry({type:typeLabels[form.type]||form.type,amount:finalAmount,name:sName});
      return;
    }
    onSave(buildEntry());
  }

  var inactive={border:'2px solid var(--border)',color:'var(--ink2)',background:'var(--surface2)'};
  var typeStyles={
    advance:    {active:{background:'#FDF3DC',border:'2px solid var(--warn)',color:'#8B5E08'},inactive:inactive},
    loan:       {active:{background:'#EAE4F5',border:'2px solid var(--purple)',color:'#3A2E7A'},inactive:inactive},
    expense:    {active:{background:'#D8EEE8',border:'2px solid var(--accent)',color:'var(--accent)'},inactive:inactive},
    bonus:      {active:{background:'#D8EEE2',border:'2px solid var(--ok)',color:'var(--ok)'},inactive:inactive},
    loan_repay: {active:{background:'#D8EEE2',border:'2px solid var(--ok)',color:'var(--ok)'},inactive:inactive},
    extra_work: {active:{background:'#D8EEE2',border:'2px solid var(--ok)',color:'var(--ok)'},inactive:inactive},
    short_hours:{active:{background:'#FDF3DC',border:'2px solid var(--warn)',color:'#8B5E08'},inactive:inactive},
  };
  var otherTypes=['loan','expense','short_hours','bonus','extra_work','loan_repay'];
  var typeLabels={advance:t.tAdv,loan:t.tLoan,expense:t.tExp,bonus:t.tBonus,loan_repay:t.tLoanRepay,extra_work:t.tExtraWork,short_hours:t.tShortHours};

  function typeBtn(key,full){
    var active=form.type===key;
    var st=Object.assign({},active?typeStyles[key].active:typeStyles[key].inactive,{borderRadius:12,padding:full?'14px 12px':'10px 8px',cursor:'pointer',fontWeight:700,fontFamily:'Nunito,sans-serif',fontSize:fsr(full?15:13),transition:'all .15s',textAlign:'center',width:'100%',display:'block'});
    return <button key={key} onClick={function(){set('type',key);}} style={st}>{TC[key]?TC[key].icon+' ':''}{typeLabels[key]}</button>;
  }

  return (
    <Modal onClose={onClose} title={t.addEntry}>
      {errMsg&&<Toast msg={errMsg} onDone={function(){setErrMsg('');}} />}
      <FLabel label={t.selStaff}>
        <FSelect value={form.staffId} onChange={function(v){set('staffId',v);}}>
          <option value="">{t.selStaff}</option>
          {staffList.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
        </FSelect>
      </FLabel>

      <div className="mb-4">
        <div className="mb-2">{typeBtn('advance',true)}</div>
        <div className="grid grid-cols-3 gap-2">
          {otherTypes.map(function(key){return typeBtn(key,false);})}
        </div>
      </div>

      {isTimeBased ? (
        <div>
          <div className="flex gap-3">
            <FLabel label={t.fhours} style={{flex:1}}><FInput type="number" value={form.hours} onChange={function(v){set('hours',v);}} placeholder="e.g. 2.5" /></FLabel>
            <FLabel label={t.frate} style={{flex:1}}><FInput type="number" value={form.rate} onChange={function(v){set('rate',v);}} placeholder={String(defaultRate)} /></FLabel>
          </div>
          {computedAmount>0 && (
            <div className="mb-4 px-3 py-2 rounded-xl flex justify-between items-center" style={{background:form.type==='extra_work'?'#D8EEE2':'#FDF3DC'}}>
              <span style={{fontSize:fsr(13),color:'var(--ink2)'}}>{t.famount}</span>
              <span style={{fontSize:fsr(18),fontWeight:800,color:form.type==='extra_work'?'var(--ok)':'var(--warn)'}}>{fmt(computedAmount)}</span>
            </div>
          )}
        </div>
      ) : (
        <div>
          <FLabel label={t.famount}><FInput type="number" value={form.amount} onChange={function(v){set('amount',v);}} placeholder="0" /></FLabel>
          {isHalfDay&&dailyRate>0&&(
            <div className="mb-4 px-3 py-2 rounded-xl flex justify-between items-center" style={{background:'#FDF3DC',marginTop:-8}}>
              <span style={{fontSize:fsr(13),fontWeight:700,color:'#8B5E08'}}>{t.perDayCost}</span>
              <span style={{fontSize:fsr(16),fontWeight:800,color:'#8B5E08'}}>{fmt(dailyRate)}</span>
            </div>
          )}
        </div>
      )}
      <FLabel label={t.fdate}><FInput type="date" value={form.date} onChange={function(v){set('date',v);}} /></FLabel>
      {showPaidBy && (
        <FLabel label={t.paidBy} hint={t.paidByHint}>
          <FSelect value={form.paidBy} onChange={function(v){set('paidBy',v);}}>
            {memberIds.map(function(id){
              return <option key={id} value={id}>{mc.members[id].name}{id===mc.uid?' ('+t.paidByYou+')':''}</option>;
            })}
          </FSelect>
        </FLabel>
      )}
      <FLabel label={t.freason}><FInput value={form.reason} onChange={function(v){set('reason',v);}} placeholder={t.freasonPh} /></FLabel>

      {form.type==='loan' && (
        <div>
          <FLabel label={t.finst} hint={t.hintEMI}><FInput type="number" value={form.installment} onChange={function(v){set('installment',v);}} placeholder="0" /></FLabel>
          <FLabel label={t.ftotinst} hint={t.hintTotInst}><FInput type="number" value={form.totalInstallments} onChange={function(v){set('totalInstallments',v);}} placeholder="e.g. 5" /></FLabel>
        </div>
      )}

      {form.type==='loan_repay' && (
        <FLabel label={t.fApplyLoan}>
          {activeLoans.length===0
            ? <p style={{fontSize:fsr(13),color:'var(--muted)',padding:'8px 0'}}>{t.noActiveLoans}</p>
            : <FSelect value={form.targetLoanId} onChange={function(v){set('targetLoanId',v);}}>
                <option value="">{t.selStaff}</option>
                {activeLoans.map(function(ln){
                  var bal=Math.max(0,ln.amount-(ln.paidInstallments||0)*(ln.installment||0)-(ln.manualRepaid||0));
                  return <option key={ln.id} value={ln.id}>{fmtD(ln.date)} — {fmt(ln.amount)} (bal: {fmt(bal)})</option>;
                })}
              </FSelect>
          }
        </FLabel>
      )}

      {confirmEntry && (
        <div className="fade-in" style={{position:'fixed',inset:0,zIndex:60,display:'flex',alignItems:'flex-end',justifyContent:'center',background:'rgba(26,46,42,0.6)'}}>
          <div style={{background:'var(--surface)',borderRadius:'24px 24px 0 0',padding:24,width:'100%',maxWidth:480}}>
            <p style={{fontSize:fsr(18),fontWeight:800,color:'var(--ink)',marginBottom:6,textAlign:'center'}}>
              {confirmEntry.type} — {fmt(confirmEntry.amount)}
            </p>
            <p style={{fontSize:fsr(14),color:'var(--ink2)',textAlign:'center',marginBottom:20}}>
              {confirmEntry.name}
            </p>
            <div className="flex gap-3">
              <PrimaryBtn onClick={function(){setConfirmEntry(null);}} color="gray" full={true}>{t.confCancel}</PrimaryBtn>
              <PrimaryBtn onClick={function(){setConfirmEntry(null);onSave(buildEntry());}} full={true}>{t.confYes}</PrimaryBtn>
            </div>
          </div>
        </div>
      )}

      <div className="flex gap-3 mt-4">
        <PrimaryBtn onClick={onClose} color="gray" full={true}>{t.cancel}</PrimaryBtn>
        <PrimaryBtn onClick={handleSave} full={true}>{t.save}</PrimaryBtn>
      </div>
    </Modal>
  );
}

/* ── ADVANCES TAB ───────────────────────────────────────────── */
function AdvancesTab({lang,homeId,homes,workingDays,syncKey}){
  var t=T[lang];
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [showAdd,setShowAdd]=useState(false);
  var [filter,setFilter]=useState('all');
  var [filterStaff,setFilterStaff]=useState('all');
  var [filterMember,setFilterMember]=useState('all');
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showMembers=!mc.guestMode&&memberIds.length>0;
  var [toast,setToast]=useState('');
  var [activeWA,setActiveWA]=useState(null);
  var [confirmDel,setConfirmDel]=useState(null);

  useEffect(function(){setStaff(getStaff(homeId));setLedger(getLedger(homeId));},[homeId,syncKey]);

  function onSave(entry){
    var next=[...ledger,entry];
    if(entry.type==='loan_repay'&&entry.targetLoanId){
      next=next.map(function(e){
        if(e.id===entry.targetLoanId){
          var newRepaid=(e.manualRepaid||0)+entry.amount;
          var totalPaid=(e.paidInstallments||0)*(e.installment||0)+newRepaid;
          return Object.assign({},e,{manualRepaid:newRepaid,status:totalPaid>=e.amount?'closed':'active'});
        }
        return e;
      });
    }
    setLedger(next); fbSaveLedger(homeId,next);
    setShowAdd(false); setToast(t.savedOk);
  }
  function onDelete(id){
    var next=ledger.filter(function(e){return e.id!==id;});
    setLedger(next); fbSaveLedger(homeId,next); setConfirmDel(null);
  }

  var filtered=ledger
    .filter(function(e){return filter==='all'||e.type===filter;})
    .filter(function(e){return filterStaff==='all'||e.staffId===filterStaff;})
    .filter(function(e){
      if(filterMember==='all') return true;
      if(filterMember==='none') return !e.paidBy;
      return e.paidBy===filterMember;
    })
    .sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});

  var home=homes.find(function(h){return h.id===homeId;})||{name:''};
  var typeLabels={advance:t.tAdv,loan:t.tLoan,expense:t.tExp,bonus:t.tBonus,loan_repay:t.tLoanRepay,extra_work:t.tExtraWork,short_hours:t.tShortHours};

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      {toast && <Toast msg={toast} onDone={function(){setToast('');}} />}
      <div className="p-4 shrink-0" style={{background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
        <PrimaryBtn onClick={function(){setShowAdd(true);}} full={true} tut="add-entry">{t.addEntry}</PrimaryBtn>
      </div>

      <div className="px-4 pt-3 shrink-0">
        <div className="flex gap-2 overflow-x-auto pb-2">
          {['all','advance','loan','loan_repay','expense','bonus','extra_work','short_hours'].map(function(f){
            var labels={all:t.filterAll,advance:t.tAdv,loan:t.tLoan,loan_repay:t.tLoanRepay,expense:t.tExp,bonus:t.tBonus,extra_work:t.tExtraWork,short_hours:t.tShortHours};
            var active=filter===f;
            var tc=TC[f];
            var pillCls='pill '+(active?(tc?tc.pillCls:'pill-accent'):'pill-muted');
            return (
              <button key={f} onClick={function(){setFilter(f);}}
                className={pillCls}
                style={{cursor:'pointer',border:'none',whiteSpace:'nowrap'}}>
                {labels[f]}
              </button>
            );
          })}
        </div>
        {staff.length>1 && (
          <div className="mb-2">
            <FSelect value={filterStaff} onChange={setFilterStaff}>
              <option value="all">{t.filterAll}</option>
              {staff.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
            </FSelect>
          </div>
        )}
        {showMembers && memberIds.length>1 && (
          <div className="flex gap-2 overflow-x-auto pb-2">
            {['all'].concat(memberIds,['none']).map(function(mid){
              var active=filterMember===mid;
              var label=mid==='all'?t.allMembers:mid==='none'?t.notRecorded:memberLabel(mid,mc.members,t);
              return (
                <button key={mid} onClick={function(){setFilterMember(mid);}}
                  className={'pill '+(active?'pill-accent':'pill-muted')}
                  style={{cursor:'pointer',border:'none',whiteSpace:'nowrap'}}>
                  {mid==='all'?'👥 ':mid==='none'?'':'💰 '}{label}
                </button>
              );
            })}
          </div>
        )}
      </div>

      <div className="p-4 pt-2 scroll-area flex-1">
        {filtered.length===0
          ? <p className="text-center mt-12 text-base" style={{color:'var(--muted)'}}>{t.noEntries}</p>
          : filtered.map(function(entry){
              var tc=TC[entry.type]||TC.advance;
              var sObj=staff.find(function(s){return s.id===entry.staffId;});
              var sName=sObj?sObj.name:'?';
              var loanBal=entry.type==='loan'?Math.max(0,entry.amount-(entry.paidInstallments||0)*(entry.installment||0)-(entry.manualRepaid||0)):null;
              return (
                <div key={entry.id} className="rounded-2xl p-3 mb-3 fade-in" style={{background:tc.bg,border:'1px solid var(--border)'}}>
                  <div className="flex items-start justify-between">
                    <div className="flex items-center gap-2">
                      <span style={{fontSize:fsr(20)}}>{tc.icon}</span>
                      <div>
                        <span className={'pill '+tc.pillCls}>{typeLabels[entry.type]}</span>
                        <p style={{fontWeight:800,color:'var(--ink)',marginTop:2}}>{sName}</p>
                      </div>
                    </div>
                    <div className="text-right shrink-0 ml-2">
                      <p style={{fontSize:fsr(20),fontWeight:800,color:'var(--ink)'}}>{fmt(entry.amount)}</p>
                      <p style={{fontSize:fsr(12),color:'var(--ink2)'}}>{fmtD(entry.date)}</p>
                      {showMembers&&entry.paidBy&&(
                        <span style={{display:'inline-flex',alignItems:'center',gap:4,marginTop:4,
                          fontSize:fsr(11),fontWeight:800,color:'var(--ink2)'}}>
                          <span style={{width:15,height:15,borderRadius:'50%',display:'inline-grid',placeItems:'center',
                            background:(mc.members[entry.paidBy]||{}).color||'var(--muted)',color:'#fff',fontSize:fsr(8)}}>
                            {memberLabel(entry.paidBy,mc.members,t).charAt(0).toUpperCase()}
                          </span>
                          {memberLabel(entry.paidBy,mc.members,t)}
                        </span>
                      )}
                    </div>
                  </div>
                  {entry.reason ? <p style={{fontSize:fsr(13),color:'var(--ink2)',marginTop:8,fontStyle:'italic'}}>"{entry.reason}"</p> : null}
                  {entry.type==='loan' && (
                    <div className="mt-2 flex flex-wrap gap-2">
                      <span className={'pill '+(entry.status==='active'?'pill-purple':'pill-muted')}>
                        {entry.status==='active'?t.loanActive:t.loanClosed}
                      </span>
                      <span className="pill pill-muted">{fmt(entry.installment)}/mo</span>
                      {loanBal!==null && <span className="pill pill-purple">{t.loanBal}: {fmt(loanBal)}</span>}
                    </div>
                  )}
                  <div className="mt-2 flex gap-2 flex-wrap">
                    {sObj && <button onClick={function(){setActiveWA(entry.id===activeWA?null:entry.id);}}
                      style={{fontSize:fsr(12),color:'#1A6E5E',border:'1px solid #A8D4C4',borderRadius:8,padding:'4px 10px',fontWeight:700,background:'transparent',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
                      📲 WhatsApp
                    </button>}
                    <button onClick={function(){setConfirmDel(entry.id===confirmDel?null:entry.id);}}
                      style={{fontSize:fsr(12),color:'var(--danger)',border:'1px solid #F5C6C6',borderRadius:8,padding:'4px 10px',fontWeight:700,background:'transparent',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
                      {t.del}
                    </button>
                  </div>
                  {confirmDel===entry.id && (
                    <div className="mt-2 flex gap-2">
                      <PrimaryBtn onClick={function(){setConfirmDel(null);}} color="gray" small={true} full={true}>{t.cancel}</PrimaryBtn>
                      <PrimaryBtn onClick={function(){onDelete(entry.id);}} color="red" small={true} full={true}>{t.del}</PrimaryBtn>
                    </div>
                  )}
                  {activeWA===entry.id && sObj && (
                    <WACard message={waTemplate(entry.type,sObj,entry.amount,entry.date,home.name,lang)} phone={sObj.phone} t={t} />
                  )}
                </div>
              );
            })
        }
      </div>

      {showAdd && <EntryModal lang={lang} staffList={staff} ledger={ledger} workingDays={workingDays} onClose={function(){setShowAdd(false);}} onSave={onSave} />}
    </div>
  );
}

/* ── ANNUAL TAB ─────────────────────────────────────────────── */
function AnnualTab({lang,homeId,workingDays,syncKey}){
  var t=T[lang];
  var now=new Date();
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [payments,setPayments]=useState([]);
  var [selYear,setSelYear]=useState(now.getFullYear());

  useEffect(function(){
    setStaff(getStaff(homeId));
    setLedger(getLedger(homeId));
    setPayments(getPayments(homeId));
  },[homeId,syncKey]);

  var monthlyData=useMemo(function(){
    var data=[];
    for(var i=0;i<12;i++) data.push(0);
    var yearPays=payments.filter(function(p){return p.year===selYear;});
    yearPays.forEach(function(p){if(p.month>=1&&p.month<=12) data[p.month-1]+=(p.amount||0);});
    if(data.every(function(v){return v===0;})){
      staff.forEach(function(s){
        for(var m=1;m<=12;m++){
          var first=new Date(selYear,m-1,1);
          if(first>now) return;
          var c=calcSalary(s,selYear,m,ledger,workingDays);
          data[m-1]+=c.netPayable;
        }
      });
    }
    return data;
  },[staff,ledger,payments,selYear,workingDays]);

  var yearTotal=monthlyData.reduce(function(a,b){return a+b;},0);
  var maxBar=Math.max.apply(Math,monthlyData.concat([1]));
  var W=330,H=120,barW=W/12-4;

  var staffSummary=staff.map(function(s){
    var sLed=ledger.filter(function(e){return e.staffId===s.id;});
    var yPfx=selYear+'-';
    var yLed=sLed.filter(function(e){return e.date&&e.date.startsWith(yPfx);});
    var tAdv  =yLed.filter(function(e){return e.type==='advance';    }).reduce(function(a,e){return a+e.amount;},0);
    var tExp  =yLed.filter(function(e){return e.type==='expense';    }).reduce(function(a,e){return a+e.amount;},0);
    var tBon  =yLed.filter(function(e){return e.type==='bonus';      }).reduce(function(a,e){return a+e.amount;},0);
    var tExtra=yLed.filter(function(e){return e.type==='extra_work'; }).reduce(function(a,e){return a+e.amount;},0);
    var tShort=yLed.filter(function(e){return e.type==='short_hours';}).reduce(function(a,e){return a+e.amount;},0);
    var aLoan=sLed.filter(function(e){return e.type==='loan'&&e.status==='active';});
    var lBal=aLoan.reduce(function(a,e){return a+Math.max(0,e.amount-(e.paidInstallments||0)*(e.installment||0)-(e.manualRepaid||0));},0);
    var paid=payments.filter(function(p){return p.staffId===s.id&&p.year===selYear;}).reduce(function(a,p){return a+p.amount;},0);
    return {id:s.id,name:s.name,role:s.role,tSal:paid||s.salary*12,tAdv:tAdv,tExp:tExp,tBon:tBon,lBal:lBal,tExtra:tExtra,tShort:tShort};
  });

  /* ── who in the household actually paid for what ──
     Counts money that left someone's hand: salary payments plus cash-out
     ledger entries. Loan repayments and short-hour deductions are money
     coming back, so they are left out. */
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showMembers=!mc.guestMode&&memberIds.length>0;
  var spendSummary=useMemo(function(){
    if(!showMembers) return null;
    var CASH_OUT=['advance','loan','expense','bonus','extra_work'];
    var yPfx=selYear+'-';
    var buckets={};
    memberIds.forEach(function(id){ buckets[id]={uid:id,salary:0,records:0,total:0}; });
    buckets.none={uid:'none',salary:0,records:0,total:0};
    function bucket(id){ return buckets[id]||buckets.none; }
    payments.filter(function(p){return p.year===selYear;}).forEach(function(p){
      var b=bucket(p.paidBy); b.salary+=(p.amount||0); b.total+=(p.amount||0);
    });
    ledger.filter(function(e){
      return e.date&&e.date.startsWith(yPfx)&&CASH_OUT.indexOf(e.type)>-1;
    }).forEach(function(e){
      var b=bucket(e.paidBy); b.records+=(e.amount||0); b.total+=(e.amount||0);
    });
    var rows=Object.keys(buckets).map(function(k){return buckets[k];})
      .filter(function(b){return b.total>0||b.uid!=='none';})
      .sort(function(a,b){return b.total-a.total;});
    var grand=rows.reduce(function(a,b){return a+b.total;},0);
    return {rows:rows,grand:grand};
  },[payments,ledger,selYear,memberIds.join(','),showMembers]);
