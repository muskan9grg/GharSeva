          </div>
        </div>
      )}

      <div className="flex gap-3 mt-4">
        <PrimaryBtn onClick={onClose} color="gray" full={true}>{t.cancel}</PrimaryBtn>
        <PrimaryBtn onClick={handleSave} full={true}>{t.save}</PrimaryBtn>
      </div>

      {existing&&onDelete&&(
        <div className="mt-4" style={{borderTop:'1px solid var(--border)',paddingTop:14}}>
          {confirmDelete ? (
            <div>
              <p style={{fontSize:fsr(14),fontWeight:700,color:'var(--ink)',marginBottom:10,textAlign:'center'}}>{t.delEntry}</p>
              <div className="flex gap-3">
                <PrimaryBtn onClick={function(){setConfirmDelete(false);}} color="gray" full={true}>{t.cancel}</PrimaryBtn>
                <PrimaryBtn onClick={function(){onDelete(existing.id);}} color="red" full={true}>{t.del}</PrimaryBtn>
              </div>
            </div>
          ) : (
            <button onClick={function(){setConfirmDelete(true);}}
              style={{width:'100%',padding:'10px',background:'none',border:'none',color:'var(--danger)',
                fontSize:fsr(14),fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
              <Icon name="trash" size={17} style={{display:'inline-block',verticalAlign:'-3px',marginRight:6}} />{t.del}
            </button>
          )}
        </div>
      )}
    </Modal>
  );
}

/* ── ADVANCES TAB ───────────────────────────────────────────── */
function AdvancesTab({lang,homeId,homes,workingDays,syncKey}){
  var t=T[lang];
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [showAdd,setShowAdd]=useState(false);
  var [filter,setFilter]=useState('all');
  var [filterStaff,setFilterStaff]=useState('all');
  var [filterMember,setFilterMember]=useState('all');
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showMembers=!mc.guestMode&&memberIds.length>0;
  var [toast,setToast]=useState('');
  var [activeWA,setActiveWA]=useState(null);
  var [editing,setEditing]=useState(null);

  useEffect(function(){setStaff(getStaff(homeId));setLedger(getLedger(homeId));},[homeId,syncKey]);

  /* A repayment doesn't just sit in the ledger — it moves the loan it points
     at. So any time one is added, changed or removed, the loan it targets has
     to be adjusted by the same delta, and its closed/active state recomputed.
     Without this, deleting a repayment left the loan permanently looking more
     repaid than it was. */
  function applyRepayDelta(list, loanId, delta){
    if(!loanId||!delta) return list;
    return list.map(function(e){
      if(e.id!==loanId) return e;
      var repaid=Math.max(0,(e.manualRepaid||0)+delta);
      var totalPaid=(e.paidInstallments||0)*(e.installment||0)+repaid;
      return Object.assign({},e,{manualRepaid:repaid,status:totalPaid>=e.amount?'closed':'active'});
    });
  }

  function onSave(entry){
    var prev=editing;
    var next=prev
      ? ledger.map(function(e){return e.id===entry.id?entry:e;})
      : ledger.concat([entry]);
    /* undo whatever the previous version contributed, then apply the new one */
    if(prev&&prev.type==='loan_repay') next=applyRepayDelta(next,prev.targetLoanId,-(prev.amount||0));
    if(entry.type==='loan_repay')      next=applyRepayDelta(next,entry.targetLoanId, (entry.amount||0));
    setLedger(next); fbSaveLedger(homeId,next);
    setShowAdd(false); setEditing(null); setToast(t.savedOk);
  }

  function onDelete(id){
    var gone=ledger.find(function(e){return e.id===id;});
    var next=ledger.filter(function(e){return e.id!==id;});
    if(gone&&gone.type==='loan_repay') next=applyRepayDelta(next,gone.targetLoanId,-(gone.amount||0));
    setLedger(next); fbSaveLedger(homeId,next);
    setEditing(null);
  }

  var filtered=ledger
    .filter(function(e){return filter==='all'||e.type===filter;})
    .filter(function(e){return filterStaff==='all'||e.staffId===filterStaff;})
    .filter(function(e){
      if(filterMember==='all') return true;
      if(filterMember==='none') return !e.paidBy;
      if(filterMember==='other') return e.paidBy==='other';
      return e.paidBy===filterMember;
    })
    .sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});

  var home=homes.find(function(h){return h.id===homeId;})||{name:''};
  var typeLabels={advance:t.tAdv,loan:t.tLoan,expense:t.tExp,bonus:t.tBonus,loan_repay:t.tLoanRepay,extra_work:t.tExtraWork,short_hours:t.tShortHours,extra_help:t.tExtraHelp};

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      {toast && <Toast msg={toast} onDone={function(){setToast('');}} />}
      <div className="p-4 shrink-0" style={{background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
        <PrimaryBtn onClick={function(){setShowAdd(true);}} full={true} tut="add-entry">{t.addEntry}</PrimaryBtn>
      </div>

      <div className="px-4 pt-3 shrink-0">
        <div className="flex gap-2 chip-row pb-2">
          {['all','advance','loan','loan_repay','expense','bonus','extra_work','short_hours','extra_help'].map(function(f){
            /* Three filters sat one above another and two of them said only
               "All", so the screen showed the same word twice with nothing to
               say what each one filtered. Each now names its own subject. */
            var labels={all:t.filterAllTypes,advance:t.tAdv,loan:t.tLoan,loan_repay:t.tLoanRepay,expense:t.tExp,bonus:t.tBonus,extra_work:t.tExtraWork,short_hours:t.tShortHours,extra_help:t.tExtraHelp};
            var active=filter===f;
            var tc=TC[f];
            var pillCls='pill '+(active?(tc?tc.pillCls:'pill-accent'):'pill-muted');
            return (
              <button key={f} onClick={function(){setFilter(f);}}
                className={pillCls}
                style={{cursor:'pointer',border:'none',whiteSpace:'nowrap'}}>
                {labels[f]}
              </button>
            );
          })}
        </div>
        {staff.length>1 && (
          <div className="mb-2">
            <FSelect value={filterStaff} onChange={setFilterStaff}>
              <option value="all">{t.filterAllStaff}</option>
              {staff.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
            </FSelect>
          </div>
        )}
        {showMembers && memberIds.length>1 && (
          <div className="flex gap-2 chip-row pb-2">
            {['all'].concat(memberIds,['other','none']).map(function(mid){
              var active=filterMember===mid;
              var label=mid==='all'?t.allMembers:mid==='none'?t.notRecorded:mid==='other'?t.paidBySomeoneElse:memberLabel(mid,mc.members,t);
              return (
                <button key={mid} onClick={function(){setFilterMember(mid);}}
                  className={'pill '+(active?'pill-accent':'pill-muted')}
                  style={{cursor:'pointer',border:'none',whiteSpace:'nowrap'}}>
                  {label}
                </button>
              );
            })}
          </div>
        )}
      </div>

      <div className="p-4 pt-2 scroll-area flex-1">
        {filtered.length===0
          ? <p className="text-center mt-12 text-base" style={{color:'var(--muted)'}}>{t.noEntries}</p>
          : filtered.map(function(entry){
              var tc=TC[entry.type]||TC.advance;
              var sObj=staff.find(function(s){return s.id===entry.staffId;});
              var sName=sObj?sObj.name:(entry.type==='extra_help'?t.generalNoStaff:'?');
              var loanBal=entry.type==='loan'?Math.max(0,entry.amount-(entry.paidInstallments||0)*(entry.installment||0)-(entry.manualRepaid||0)):null;
              return (
                <div key={entry.id} onClick={function(){setEditing(entry);}}
                  className="rounded-2xl p-3 mb-3 fade-in" style={{background:tc.bg,border:'1px solid var(--border)',cursor:'pointer'}}>
                  <div className="flex items-start justify-between">
                    <div className="flex items-center gap-2">
                      <span style={{color:tc.ink||'var(--ink2)'}}><Icon name={tc.icon} size={22} /></span>
                      <div>
                        <span className={'pill '+tc.pillCls}>{typeLabels[entry.type]}</span>
                        <p style={{fontWeight:800,color:'var(--ink)',marginTop:2}}>{sName}</p>
                      </div>
                    </div>
                    <div className="text-right shrink-0 ml-2">
                      <p style={{fontSize:fsr(20),fontWeight:800,color:'var(--ink)'}}>{fmt(entry.amount)}</p>
                      <p style={{fontSize:fsr(12),color:'var(--ink2)'}}>{fmtD(entry.date)}</p>
                      {showMembers&&entry.paidBy&&(
                        <span style={{display:'inline-flex',alignItems:'center',gap:4,marginTop:4,
                          fontSize:fsr(11),fontWeight:800,color:'var(--ink2)'}}>
                          <span style={{width:15,height:15,borderRadius:'50%',display:'inline-grid',placeItems:'center',
                            background:entry.paidBy==='other'?'var(--muted)':(mc.members[entry.paidBy]||{}).color||'var(--muted)',color:'#fff',fontSize:fsr(8)}}>
                            {entry.paidBy==='other'?<Icon name="person" size={14} />:payerLabel(entry,mc.members,t).charAt(0).toUpperCase()}
                          </span>
                          {payerLabel(entry,mc.members,t)}
                        </span>
                      )}
                    </div>
                  </div>
                  {entry.type==='extra_help'&&entry.helperName&&(
                    <p style={{fontSize:fsr(13),color:'var(--ink2)',marginTop:8,fontWeight:700}} className="flex items-center gap-2"><Icon name="extrahelp" size={15} />{t.fHelperName}: {entry.helperName}</p>
                  )}
                  {entry.reason ? <p style={{fontSize:fsr(13),color:'var(--ink2)',marginTop:8,fontStyle:'italic'}}>"{entry.reason}"</p> : null}
                  {entry.type==='loan' && (
                    <div className="mt-2 flex flex-wrap gap-2">
                      <span className={'pill '+(entry.status==='active'?'pill-purple':'pill-muted')}>
                        {entry.status==='active'?t.loanActive:t.loanClosed}
                      </span>
                      <span className="pill pill-muted">{fmt(entry.installment)}/mo</span>
                      {loanBal!==null && <span className="pill pill-purple">{t.loanBal}: {fmt(loanBal)}</span>}
                    </div>
                  )}
                  {/* stopPropagation so these don't also open the editor */}
                  <div className="mt-2 flex gap-2 flex-wrap" onClick={function(e){e.stopPropagation();}}>
                    {sObj && <button onClick={function(){setActiveWA(entry.id===activeWA?null:entry.id);}}
                      style={{fontSize:fsr(12),color:'#1A6E5E',border:'1px solid #A8D4C4',borderRadius:8,padding:'4px 10px',fontWeight:700,background:'transparent',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
                      <Icon name="share" size={15} style={{display:'inline-block',verticalAlign:'-2px',marginRight:6}} />WhatsApp
                    </button>}
                  </div>
                  {activeWA===entry.id && sObj && (
                    <div onClick={function(e){e.stopPropagation();}}>
                      <WACard message={waTemplate(entry.type,sObj,entry.amount,entry.date,home.name,lang)} phone={sObj.phone} t={t} />
                    </div>
                  )}
                </div>
              );
            })
        }
      </div>

      {showAdd && <EntryModal lang={lang} staffList={staff} ledger={ledger} workingDays={workingDays} onClose={function(){setShowAdd(false);}} onSave={onSave} />}
      {editing && <EntryModal lang={lang} staffList={staff} ledger={ledger} workingDays={workingDays}
        existing={editing} onClose={function(){setEditing(null);}} onSave={onSave} onDelete={onDelete} />}
    </div>
  );
}

/* ── ANNUAL TAB ─────────────────────────────────────────────── */
function AnnualTab({lang,homeId,workingDays,syncKey}){
  var t=T[lang];
  var now=new Date();
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [payments,setPayments]=useState([]);
  var [selYear,setSelYear]=useState(now.getFullYear());

  useEffect(function(){
    setStaff(getStaff(homeId));
    setLedger(getLedger(homeId));
    setPayments(getPayments(homeId));
  },[homeId,syncKey]);

  /* Per month, not per year: a real payment recorded for THIS month uses that
     amount; otherwise (if the month isn't in the future) fall back to an
     estimate. The old version gated on the whole year at once, so recording
     one single payment anywhere made every OTHER month silently show ₹0
     instead of an estimate. */
  var monthlyData=useMemo(function(){
    var data=[];
    for(var m=1;m<=12;m++){
      var real=payments.filter(function(p){return p.year===selYear&&p.month===m;})
                        .reduce(function(a,p){return a+(p.amount||0);},0);
      if(real>0){ data.push(real); continue; }
      var first=new Date(selYear,m-1,1);
      if(first>now){ data.push(0); continue; }
      var est=0;
      staff.forEach(function(s){ est+=calcSalary(s,selYear,m,ledger,workingDays,homeId).netPayable; });
      data.push(est);
    }
    return data;
  },[staff,ledger,payments,selYear,workingDays]);

  var yearTotal=monthlyData.reduce(function(a,b){return a+b;},0);
  var maxBar=Math.max.apply(Math,monthlyData.concat([1]));
  var W=330,H=120,barW=W/12-4;

  var staffSummary=staff.map(function(s){
    var sLed=ledger.filter(function(e){return e.staffId===s.id;});
    var yPfx=selYear+'-';
    var yLed=sLed.filter(function(e){return e.date&&e.date.startsWith(yPfx);});
    var tAdv  =yLed.filter(function(e){return e.type==='advance';    }).reduce(function(a,e){return a+e.amount;},0);
    var tExp  =yLed.filter(function(e){return e.type==='expense';    }).reduce(function(a,e){return a+e.amount;},0);
    var tBon  =yLed.filter(function(e){return e.type==='bonus';      }).reduce(function(a,e){return a+e.amount;},0);
    var tExtra=yLed.filter(function(e){return e.type==='extra_work'; }).reduce(function(a,e){return a+e.amount;},0);
    var tShort=yLed.filter(function(e){return e.type==='short_hours';}).reduce(function(a,e){return a+e.amount;},0);
    /* informational only — never subtracted from this staff member's own
       pay; extra_help can also carry no staffId at all (see calcSalary's
       filter, which only ever matches by staffId so this never applies) */
    var tExtraHelp=yLed.filter(function(e){return e.type==='extra_help';}).reduce(function(a,e){return a+e.amount;},0);
    var aLoan=sLed.filter(function(e){return e.type==='loan'&&e.status==='active';});
    var lBal=aLoan.reduce(function(a,e){return a+Math.max(0,e.amount-(e.paidInstallments||0)*(e.installment||0)-(e.manualRepaid||0));},0);
    var paid=payments.filter(function(p){return p.staffId===s.id&&p.year===selYear;}).reduce(function(a,p){return a+p.amount;},0);
    /* Twelve times the current salary would misreport any year containing a
       raise, so the estimate adds up each month at the rate in force then. */
    var estYear=0; for(var em=1;em<=12;em++) estYear+=salaryFor(s,selYear,em);
    return {id:s.id,name:s.name,role:s.role,tSal:paid||estYear,tAdv:tAdv,tExp:tExp,tBon:tBon,lBal:lBal,tExtra:tExtra,tShort:tShort,tExtraHelp:tExtraHelp};
  });

  /* Extra Help entries not tied to any current staff member (no staffId, or
     one that no longer matches — e.g. that staff member was later deleted)
     never get counted in any card above, so they'd otherwise be invisible
     as a category. One combined card covers them all, broken down by
     helper name when more than one has been used. */
  var unlinkedExtraHelp=useMemo(function(){
    var yPfx=selYear+'-';
    var staffIds=staff.map(function(s){return s.id;});
    var entries=ledger.filter(function(e){
      return e.type==='extra_help'&&e.date&&e.date.startsWith(yPfx)
        &&(!e.staffId||staffIds.indexOf(e.staffId)===-1);
    });
    if(entries.length===0) return null;
    var total=entries.reduce(function(a,e){return a+(e.amount||0);},0);
    var buckets={};
    entries.forEach(function(e){
      var raw=(e.helperName&&e.helperName.trim())||null;
      var key=raw?raw.toLowerCase():'__unnamed__';
      if(!buckets[key]) buckets[key]={name:raw||t.generalNoStaff,total:0};
      buckets[key].total+=(e.amount||0);
    });
    var names=Object.keys(buckets).map(function(k){return buckets[k];}).sort(function(a,b){return b.total-a.total;});
    return {total:total,count:entries.length,names:names};
  },[ledger,staff,selYear]);

  /* ── who in the household actually paid for what ──
     Counts money that left someone's hand: salary payments plus cash-out
     ledger entries. Loan repayments and short-hour deductions are money
     coming back, so they are left out. */
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showMembers=!mc.guestMode&&memberIds.length>0;
  var spendSummary=useMemo(function(){
    if(!showMembers) return null;
    var CASH_OUT=['advance','loan','expense','bonus','extra_work','extra_help'];
    var yPfx=selYear+'-';
    var buckets={};
    memberIds.forEach(function(id){ buckets[id]={uid:id,salary:0,records:0,total:0}; });
    buckets.none={uid:'none',salary:0,records:0,total:0};
    /* External payers are grouped by name, case/space-insensitively, so
       "Rita" and "rita" land in one bucket even without perfectly consistent
       typing — the autocomplete on the input is the first line of defence,
       this is the safety net. The first-seen casing is kept for display. */
    function bucket(rec){
      var paidBy=rec.paidBy;
      if(paidBy&&paidBy!=='other'&&buckets[paidBy]) return buckets[paidBy];
      if(paidBy==='other'&&rec.paidByName&&rec.paidByName.trim()){
        var trimmed=rec.paidByName.trim();
        var key='ext:'+trimmed.toLowerCase();
        if(!buckets[key]) buckets[key]={uid:key,displayName:trimmed,isExternal:true,salary:0,records:0,total:0};
        return buckets[key];
      }
      return buckets.none;
    }
    payments.filter(function(p){return p.year===selYear;}).forEach(function(p){
      var b=bucket(p); b.salary+=(p.amount||0); b.total+=(p.amount||0);
    });
    ledger.filter(function(e){
      return e.date&&e.date.startsWith(yPfx)&&CASH_OUT.indexOf(e.type)>-1;
    }).forEach(function(e){
      var b=bucket(e); b.records+=(e.amount||0); b.total+=(e.amount||0);
    });
    var rows=Object.keys(buckets).map(function(k){return buckets[k];})
      .filter(function(b){return b.total>0||b.uid!=='none';})
      .sort(function(a,b){return b.total-a.total;});
    var grand=rows.reduce(function(a,b){return a+b.total;},0);
    return {rows:rows,grand:grand};
  },[payments,ledger,selYear,memberIds.join(','),showMembers]);

  var years=[now.getFullYear()-1,now.getFullYear()];
  var statColors={tSal:'var(--accent)',tAdv:'var(--warn)',tExp:'var(--ink2)',tBon:'var(--ok)',lBal:'var(--purple)',tExtra:'var(--ok)',tShort:'var(--warn)',tExtraHelp:'var(--purple)'};

  return (
    <div className="p-4 scroll-area flex-1">
      <div className="flex items-center gap-3 mb-4">
        <label style={{fontSize:fsr(13),fontWeight:700,color:'var(--ink2)',whiteSpace:'nowrap'}}>{t.annYear}</label>
        <FSelect value={selYear} onChange={function(v){setSelYear(Number(v));}}>
          {years.map(function(y){return <option key={y} value={y}>{y}</option>;})}
        </FSelect>
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{background:'var(--surface)',border:'1px solid var(--border)'}}>
        <p style={{fontSize:fsr(12),color:'var(--ink2)',fontWeight:700,marginBottom:4}}>{t.annEstTotal}</p>
        <p style={{fontSize:fsr(30),fontWeight:800,color:'var(--ink)',marginBottom:16}}>{fmt(yearTotal)}</p>
        <svg viewBox={'-2 0 '+(W+4)+' '+(H+28)} className="w-full">
          {monthlyData.map(function(val,i){
            var bh=maxBar>0?Math.round((val/maxBar)*H):0;
            var x=i*(W/12)+2;
            var y=H-bh;
            return (
              <g key={i}>
                <rect x={x} y={y} width={barW} height={bh} fill={bh>0?'#1A6E5E':'#C4D4C6'} rx="3" />
                {bh>4 ? <text x={x+barW/2} y={y-2} fontSize="7" textAnchor="middle" fill="#3D5E55">{val>=1000?Math.round(val/1000)+'k':val}</text> : null}
                <text x={x+barW/2} y={H+14} fontSize="8" textAnchor="middle" fill="#7A998C">{t.months[i]}</text>
              </g>
            );
          })}
        </svg>
      </div>

      {spendSummary&&spendSummary.grand>0&&(
        <div className="rounded-2xl p-4 mb-4" style={{background:'var(--surface)',border:'1px solid var(--border)'}}>
          <p style={{fontSize:fsr(15),fontWeight:800,color:'var(--ink)',marginBottom:2}}>{t.whoPaid}</p>
          <p style={{fontSize:fsr(12),color:'var(--ink2)',marginBottom:14}}>{t.whoPaidHint}</p>
          {spendSummary.rows.map(function(r){
            var isNone=r.uid==='none';
            var isExternal=!!r.isExternal;
            var name=isNone?t.notRecorded:isExternal?r.displayName:memberLabel(r.uid,mc.members,t);
            var col=isNone||isExternal?'var(--muted)':((mc.members[r.uid]||{}).color||'var(--accent)');
            var pct=spendSummary.grand>0?Math.round(r.total/spendSummary.grand*100):0;
            return (
              <div key={r.uid} style={{marginBottom:14}}>
                <div className="flex items-center gap-2" style={{marginBottom:6}}>
                  <span style={{width:26,height:26,borderRadius:'50%',display:'grid',placeItems:'center',
                    background:col,color:'#fff',fontWeight:800,fontSize:fsr(11),flex:'none'}}>
                    {isNone?'?':isExternal?<Icon name="person" size={14} />:name.charAt(0).toUpperCase()}
                  </span>
                  <span style={{fontWeight:800,color:'var(--ink)',fontSize:fsr(14),flex:1}}>
                    {name}{r.uid===mc.uid?' ('+t.paidByYou+')':''}
                  </span>
                  <span style={{fontWeight:800,color:'var(--ink)',fontSize:fsr(15)}}>{fmt(r.total)}</span>
                </div>
                <div style={{height:8,background:'var(--surface2)',borderRadius:5,overflow:'hidden'}}>
                  <div style={{height:'100%',width:pct+'%',background:col,borderRadius:5,transition:'width .3s'}} />
                </div>
                <div className="flex gap-3" style={{marginTop:5,fontSize:fsr(11),color:'var(--ink2)',fontWeight:700}}>
                  <span>{pct}%</span>
                  <span className="inline-flex items-center gap-1"><Icon name="card" size={13} />{t.aTotSal}: {fmt(r.salary)}</span>
                  <span className="inline-flex items-center gap-1"><Icon name="records" size={13} />{fmt(r.records)}</span>
                </div>
              </div>
            );
          })}
          <div className="flex justify-between" style={{borderTop:'2px dashed var(--border)',paddingTop:11,marginTop:4}}>
            <span style={{fontWeight:800,color:'var(--ink2)',fontSize:fsr(13)}}>{t.annTotal}</span>
            <span style={{fontWeight:800,color:'var(--accent)',fontSize:fsr(17)}}>{fmt(spendSummary.grand)}</span>
          </div>
        </div>
      )}

      <p style={{fontSize:fsr(13),fontWeight:700,color:'var(--ink)',marginBottom:12}}>{t.annPer}</p>
      {staffSummary.map(function(s){
        return (
          <div key={s.id} className="rounded-2xl p-4 mb-3" style={{background:'var(--surface)',border:'1px solid var(--border)'}}>
            <div className="flex items-center gap-2 mb-3">
              <Avatar staff={s} size={40} />
              <div>
                <p style={{fontWeight:800,color:'var(--ink)',margin:0}}>{s.name}</p>
                <p style={{fontSize:fsr(12),color:'var(--ink2)',margin:0}}>{roleLabel(s.role,lang)}</p>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              {[
                {l:t.aTotSal,   v:s.tSal,   k:'tSal'},
                {l:t.aTotAdv,   v:s.tAdv,   k:'tAdv'},
                {l:t.aTotExp,   v:s.tExp,   k:'tExp'},
                {l:t.aTotBon,   v:s.tBon,   k:'tBon'},
                {l:t.aTotLoan,  v:s.lBal,   k:'lBal'},
                {l:t.aTotExtra, v:s.tExtra, k:'tExtra'},
                {l:t.aTotShort, v:s.tShort, k:'tShort'},
                {l:t.aTotExtraHelp, v:s.tExtraHelp, k:'tExtraHelp'},
              ].map(function(row){
                return (
                  <div key={row.l} className="rounded-xl p-2" style={{background:'var(--surface2)'}}>
                    <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}}>{row.l}</p>
                    <p style={{fontSize:fsr(15),fontWeight:700,color:statColors[row.k],margin:0}}>{fmt(row.v)}</p>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
      {unlinkedExtraHelp && (
        <div className="rounded-2xl p-4 mb-3" style={{background:'var(--surface)',border:'1px solid var(--border)'}}>
          <div className="flex items-center gap-2 mb-3">
            <div className="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white" style={{background:'var(--purple)'}}>
              <Icon name="extrahelp" size={22} />
            </div>
            <div>
              <p style={{fontWeight:800,color:'var(--ink)',margin:0}}>{t.extraHelpCardTitle}</p>
              <p style={{fontSize:fsr(12),color:'var(--ink2)',margin:0}}>{unlinkedExtraHelp.count+' '+t.extraHelpCardSubtitle}</p>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-xl p-2" style={{background:'var(--surface2)'}}>
              <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}}>{t.aTotExtraHelp}</p>
              <p style={{fontSize:fsr(15),fontWeight:700,color:statColors.tExtraHelp,margin:0}}>{fmt(unlinkedExtraHelp.total)}</p>
            </div>
            <div className="rounded-xl p-2" style={{background:'var(--surface2)'}}>
              <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}}>{t.extraHelpEntryCount}</p>
              <p style={{fontSize:fsr(15),fontWeight:700,color:'var(--ink)',margin:0}}>{unlinkedExtraHelp.count}</p>
            </div>
          </div>
          {unlinkedExtraHelp.names.length>1 && (
            <div style={{marginTop:10,borderTop:'1px dashed var(--border)',paddingTop:8}}>
              {unlinkedExtraHelp.names.map(function(n){
                return (
                  <div key={n.name} className="flex justify-between" style={{fontSize:fsr(12),color:'var(--ink2)',fontWeight:700,marginBottom:4}}>
                    <span>{n.name}</span><span>{fmt(n.total)}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
      {staffSummary.length===0 && <p className="text-center mt-8" style={{color:'var(--muted)'}}>{t.noStaff}</p>}
    </div>
  );
}

/* ── VOICE PARTIAL ENTRY ────────────────────────────────────── */
function VoicePartialEntry({parsed,staffList,lang,workingDays,onSave,onRerecord}){
  var t=T[lang];
  var [staffId,setStaffId]=useState(parsed.foundStaff?parsed.foundStaff.id:'');
  var [selAction,setSelAction]=useState(parsed.action||'');
  var [amount,setAmount]=useState(parsed.amount?String(parsed.amount):'');
  var [hours,setHours]=useState(parsed.hours?String(parsed.hours):'');
  var [date,setDate]=useState(todayStr());
  var [reason,setReason]=useState('');
  var [showStaffPicker,setShowStaffPicker]=useState(!parsed.foundStaff);

  var selStaff=staffList.find(function(x){return x.id===staffId;});
  var dailyRate=selStaff?Math.round(selStaff.salary/(workingDays||30)):0;
  var hourlyRate=selStaff?Math.round(selStaff.salary/(workingDays||30)/8):0;
  var halfDayAmt=Math.round(dailyRate/2);

  useEffect(function(){
    if(selAction==='short_hours'&&dailyRate) setAmount(String(halfDayAmt));
    if(selAction==='extra_work'&&hours&&hourlyRate) setAmount(String(Math.round(Number(hours)*hourlyRate)));
  },[staffId,selAction,hours]);

  var isTimeBased=selAction==='extra_work';
  var isLeave=selAction==='leave';
  var needsAmount=!isLeave;

  function handleSave(){
    if(!staffId||!selAction) return;
    if(isTimeBased&&!hours) return;
    if(needsAmount&&!amount) return;
    onSave({staffId:staffId,action:selAction,amount:needsAmount?Number(amount):null,hours:hours?Number(hours):null,date:date,reason:reason});
  }

  var typeConf=[
    {key:'leave',   label:t.tLeave},
    {key:'advance', label:t.tAdv},
    {key:'loan',    label:t.tLoan},
    {key:'expense', label:t.tExp},
    {key:'bonus',   label:t.tBonus},
    {key:'extra_work',  label:t.tExtraWork},
    {key:'short_hours', label:t.tShortHours},
  ];
  var inactSt={border:'1.5px solid var(--border)',color:'var(--ink2)',background:'transparent',borderRadius:10,padding:'8px 10px',cursor:'pointer',fontWeight:700,fontFamily:'Nunito,sans-serif',fontSize:fsr(14)};
  var actSt={border:'2px solid var(--accent)',color:'var(--accent)',background:'#D8EEE8',borderRadius:10,padding:'8px 10px',cursor:'pointer',fontWeight:800,fontFamily:'Nunito,sans-serif',fontSize:fsr(14)};

  return (
    <div className="rounded-2xl p-4 mb-4 fade-in" style={{border:'2px solid var(--warn)',background:'#FDF8E3'}}>
      <div className="flex items-center justify-between mb-3">
        <p style={{fontWeight:800,fontSize:fsr(16),color:'#8B5E08',margin:0}} className="flex items-center gap-2"><Icon name="warning" size={17} />{t.voiceCompleteEntry}</p>
        <button onClick={onRerecord} className="btn btn-ghost btn-sm">{t.voiceRerecord}</button>
      </div>

      {/* Staff */}
      {parsed.foundStaff&&!showStaffPicker ? (
        <div className="flex items-center gap-2 mb-4 p-3 rounded-xl" style={{background:'rgba(0,0,0,0.05)'}}>
          <span style={{fontSize:fsr(14),color:'var(--ink2)',fontWeight:700}}>{t.voiceStaffIs}</span>
          <span style={{fontSize:fsr(15),fontWeight:800,color:'var(--ink)',flex:1}}>{parsed.foundStaff.name}</span>
          <button onClick={function(){setShowStaffPicker(true);setStaffId('');}}
            style={{fontSize:fsr(13),color:'var(--accent)',border:'1px solid var(--accent)',borderRadius:8,padding:'3px 10px',background:'transparent',cursor:'pointer',fontWeight:800,fontFamily:'Nunito,sans-serif'}}>
            {t.voiceStaffChange}
          </button>
        </div>
      ) : (
        <FLabel label={t.selStaff}>
          <FSelect value={staffId} onChange={setStaffId}>
            <option value="">{t.selStaffPh}</option>
            {staffList.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
          </FSelect>
        </FLabel>
      )}

      {/* Action type */}
      <div className="mb-4">
        <label style={{display:'block',fontSize:fsr(15),fontWeight:800,color:'var(--ink2)',marginBottom:6}}>{t.tAction}</label>
        <div className="grid grid-cols-2 gap-2">
          {typeConf.map(function(tc){
            var isLast=typeConf.indexOf(tc)===typeConf.length-1&&typeConf.length%2!==0;
            return (
              <button key={tc.key} onClick={function(){setSelAction(tc.key);}}
                style={Object.assign({},selAction===tc.key?actSt:inactSt,isLast?{gridColumn:'1/-1'}:{})}>
                {tc.label}
              </button>
            );
          })}
        </div>
      </div>

      {/* Amount / Hours */}
      {isTimeBased && (
        <FLabel label={t.fhours}>
          <FInput type="number" value={hours} onChange={setHours} placeholder="e.g. 2" />
        </FLabel>
      )}
      {needsAmount && (
        <FLabel label={t.famount}>
          <FInput type="number" value={amount} onChange={setAmount} placeholder={t.amountPh} />
        </FLabel>
      )}

      <FLabel label={t.fdate}><FInput type="date" value={date} onChange={setDate} /></FLabel>
      <FLabel label={t.freason}><FInput value={reason} onChange={setReason} placeholder={t.freasonPh} /></FLabel>

      <PrimaryBtn onClick={handleSave} color="green" full={true}
        disabled={!staffId||!selAction||(needsAmount&&!amount)||(isTimeBased&&!hours)}>
        {t.voiceSaveEntry}
      </PrimaryBtn>
    </div>
  );
}

/* ── VOICE TAB ──────────────────────────────────────────────── */
function VoiceTab({lang,homeId,homes,workingDays,syncKey,compact,onSaved}){
  var t=T[lang];
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [listening,setListening]=useState(false);
  var [transcript,setTranscript]=useState('');
  var [parsed,setParsed]=useState(null);
  var [confirmed,setConfirmed]=useState(false);
  var [savedStaff,setSavedStaff]=useState(null);
  var [toast,setToast]=useState('');
  var [waMsg,setWAMsg]=useState('');
  var [showExamples,setShowExamples]=useState(false);
  var recRef=useRef(null);
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  useEffect(function(){
    setStaff(getStaff(homeId)); setLedger(getLedger(homeId));
    setTranscript(''); setParsed(null); setConfirmed(false); setWAMsg(''); setSavedStaff(null);
  },[homeId,syncKey]);

  function startListen(){
    if(!SR) return;
    var rec=new SR();
    rec.lang=lang==='hi'?'hi-IN':'en-IN';
    rec.interimResults=false; rec.maxAlternatives=1;
    rec.onresult=function(e){
      var tr=e.results[0][0].transcript;
      setTranscript(tr); setParsed(parseVoice(tr,staff));
      setConfirmed(false); setWAMsg(''); setSavedStaff(null);
    };
    rec.onerror=function(){setListening(false);};
    rec.onend=function(){setListening(false);};
    rec.start(); recRef.current=rec; setListening(true);
    setTranscript(''); setParsed(null); setConfirmed(false);
  }
  function stopListen(){if(recRef.current){recRef.current.stop();}setListening(false);}

  function doSave(staffObj,action,amount,date,reason,extra){
    var home=homes.find(function(h){return h.id===homeId;})||{name:''};
    if(action==='leave'){
      var ym=date.slice(0,7);
      var cur=getLeaves(staffObj.id,ym);
      cur[date]='leave'; fbSaveLeaves(homeId,staffObj.id,ym,cur);
      setWAMsg(waTemplate('leave',staffObj,null,date,home.name,lang));
    } else {
      var entry=Object.assign({id:uid(),staffId:staffObj.id,type:action,amount:amount,date:date,reason:reason},extra||{});
      if(action==='loan'){entry.installment=0;entry.totalInstallments=0;entry.paidInstallments=0;entry.status='active';}
      var next=[...ledger,entry];
      setLedger(next); fbSaveLedger(homeId,next);
      setWAMsg(waTemplate(action,staffObj,amount,date,home.name,lang));
    }
    setSavedStaff(staffObj); setToast(t.savedOk); setConfirmed(true);
    /* The screen underneath is showing the very list this just added to, so it
       has to be told; otherwise the entry appears only after a tab change. */
    onSaved&&onSaved();
  }

  function confirmEntry(){
    if(!parsed||!parsed.foundStaff||!parsed.action) return;
    if(parsed.action!=='leave'&&!parsed.amount) return;
    doSave(parsed.foundStaff,parsed.action,parsed.amount,todayStr(),transcript,null);
  }

  function saveFromPartial(fields){
    var staffObj=staff.find(function(x){return x.id===fields.staffId;});
    if(!staffObj) return;
    var extra=fields.action==='extra_work'&&fields.hours?{hours:fields.hours,rate:fields.amount/(fields.hours||1)}:null;
    doSave(staffObj,fields.action,fields.amount,fields.date,fields.reason,extra);
    setParsed(null);
  }

  var isComplete=parsed&&parsed.foundStaff&&parsed.action&&(parsed.action==='leave'||parsed.amount);
  var isPartial=parsed&&!isComplete&&!confirmed;
  var typeLabels={advance:t.tAdv,loan:t.tLoan,expense:t.tExp,bonus:t.tBonus,
    extra_work:t.tExtraWork,short_hours:t.tShortHours,leave:t.tLeave};

  return (
    <div className="p-4 scroll-area flex-1">
      {toast && <Toast msg={toast} onDone={function(){setToast('');}} />}

      {/* In the sheet the title is already on the handle bar above. */}
      {!compact&&<h2 style={{fontSize:fsr(22),fontWeight:800,color:'var(--ink)',marginBottom:4}}>{t.voiceTitle}</h2>}
      <p style={{fontSize:fsr(15),color:'var(--ink2)',marginBottom:20}}>{t.voiceHint}</p>

      {!SR && <div className="rounded-2xl p-4 mb-4" style={{background:'#FCE8E8',border:'1px solid #F5C6C6'}}><p style={{color:'var(--danger)',fontWeight:800}}>{t.voiceNoSupport}</p></div>}
      {staff.length===0 && <div className="rounded-2xl p-4 mb-4" style={{background:'#FDF3DC',border:'1px solid var(--warn)'}}><p style={{color:'#8B5E08',fontWeight:800}}>{t.voiceNoStaff}</p></div>}

      {SR && (
        <div className="flex justify-center mb-5">
          <div style={{position:'relative',display:'inline-block'}}>
            <button onClick={listening?stopListen:startListen}
              className={'w-32 h-32 rounded-full flex flex-col items-center justify-center text-white font-bold shadow-xl transition-all '+(listening?'mic-pulse-danger':'mic-pulse')}
              style={{position:'relative',zIndex:1,background:listening?'var(--danger)':'var(--accent)',border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif',transform:listening?'scale(1.08)':'scale(1)'}}>
              <span style={{marginBottom:4}}><Icon name="mic" size={42} /></span>
              <span style={{fontSize:fsr(14),fontWeight:800}}>{listening?t.micStop:t.micSpeak}</span>
            </button>
          </div>
        </div>
      )}

      {listening && <p style={{textAlign:'center',color:'var(--danger)',fontWeight:800,fontSize:fsr(17),marginBottom:16}}>{t.voiceListening}</p>}

      {transcript && !listening && (
        <div className="rounded-2xl p-3 mb-3 fade-in" style={{background:'var(--surface2)',borderLeft:'4px solid var(--accent2)'}}>
          <p style={{fontSize:fsr(11),fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>{t.voiceHeard}</p>
          <p style={{fontSize:fsr(16),color:'var(--ink)',fontStyle:'italic',margin:0}}>"{transcript}"</p>
        </div>
      )}

      {/* Partial entry card — fill in missing fields */}
      {isPartial && (
        <VoicePartialEntry
          parsed={parsed} staffList={staff} lang={lang} workingDays={workingDays}
          onSave={saveFromPartial}
          onRerecord={function(){setParsed(null);setTranscript('');setConfirmed(false);}}
        />
      )}

      {/* Complete entry confirm card */}
      {parsed&&isComplete&&!confirmed && (
        <div className="rounded-2xl p-4 mb-3 fade-in" style={{background:'#D8EEE8',border:'2px solid var(--accent2)'}}>
          <p style={{fontSize:fsr(12),fontWeight:800,color:'var(--accent)',marginBottom:10,textTransform:'uppercase',letterSpacing:'.06em'}}>{t.voiceUnderstood}</p>
          <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:14}}>
            <div className="flex justify-between items-center">
              <span style={{fontSize:fsr(14),color:'var(--ink2)',fontWeight:600}}>{t.navStaff}</span>
              <span style={{fontSize:fsr(16),fontWeight:800,color:'var(--ink)'}}>{parsed.foundStaff.name}</span>
            </div>
            <div className="flex justify-between items-center">
              <span style={{fontSize:fsr(14),color:'var(--ink2)',fontWeight:600}}>{t.tAction}</span>
              <span style={{fontSize:fsr(16),fontWeight:800,color:'var(--ink)'}}>{typeLabels[parsed.action]||parsed.action}</span>
            </div>
            {parsed.amount&&<div className="flex justify-between items-center">
              <span style={{fontSize:fsr(14),color:'var(--ink2)',fontWeight:600}}>{t.famount}</span>
              <span style={{fontSize:fsr(18),fontWeight:800,color:'var(--ink)'}}>{fmt(parsed.amount)}</span>
            </div>}
          </div>
          <PrimaryBtn onClick={confirmEntry} color="green" full={true}>{t.voiceConfirm}</PrimaryBtn>
        </div>
      )}

      <div className="mt-4 text-center">
        <button onClick={function(){setShowExamples(function(v){return !v;});}}
          style={{background:'none',border:'none',color:'var(--ink2)',fontSize:fsr(13),fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',padding:'6px 12px'}}>
          {showExamples?t.voiceHideEx:t.voiceShowEx}
        </button>
      </div>
      {showExamples && (
        <div className="rounded-2xl p-3 mt-2 fade-in" style={{background:'var(--surface2)'}}>
          {t.voiceExamples.map(function(ex,i){return <p key={i} style={{fontSize:fsr(14),color:'var(--ink2)',paddingTop:3,paddingBottom:3,margin:0}}>{ex}</p>;})}
        </div>
      )}

      {confirmed && (
        <div className="rounded-2xl p-4 mb-3 fade-in text-center" style={{background:'#D8EEE2',border:'1px solid var(--ok)'}}>
          <p style={{fontSize:fsr(20),fontWeight:800,color:'var(--ok)'}} className="flex items-center justify-center gap-2"><Icon name="check" size={20} strokeWidth={2.6} />{t.savedOk}</p>
          {savedStaff&&<p style={{fontSize:fsr(14),color:'var(--ok)',marginTop:4}}>{savedStaff.name}</p>}
        </div>
      )}

      {waMsg&&savedStaff&&<WACard message={waMsg} phone={savedStaff.phone} t={t} />}
    </div>
  );
}

/* ── SETTINGS TAB ───────────────────────────────────────────── */
function SettingsTab({lang,setLang,homes,onHomesChange,workingDays,onWorkingDaysChange,homeId,guestMode,user,onSignOut,onReplayTutorial,onCloudHomeAdded,onLayoutChange}){
  var t=T[lang];
  var [allRoles,setAllRoles]=useState(function(){return getRoles();});
  var [newRoleName,setNewRoleName]=useState('');
  var [confirmDelRole,setConfirmDelRole]=useState(null);
  var [newHomeName,setNewHomeName]=useState('');
  var [confirmDelHome,setConfirmDelHome]=useState(null);
  /* Joining an existing household by code needs the cloud — there is
     nothing to join in guest mode, where households are local only. */
  var cloudHomes=!guestMode&&!!user&&FIREBASE_ENABLED&&!!fbDb;
  var [homeMode,setHomeMode]=useState('create');   /* 'create' | 'join' */
  var [joinCode,setJoinCode]=useState('');
  var [homeBusy,setHomeBusy]=useState(false);
  var [homeErr,setHomeErr]=useState('');
  var [wdInput,setWdInput]=useState(String(workingDays));
  var [wdSaved,setWdSaved]=useState(false);
  var [waLangSel,setWaLangSel]=useState(getSettings().waLang||'both');
  var [layoutSel,setLayoutSel]=useState(getSettings().layout||'classic');
  var [restoreConfirm,setRestoreConfirm]=useState(null);
  var [restoreMsg,setRestoreMsg]=useState('');
  var restoreRef=useRef(null);

  function handleRestoreFile(e){
    var file=e.target.files[0]; if(!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{JSON.parse(ev.target.result);setRestoreConfirm(ev.target.result);}
      catch(err){setRestoreMsg(t.hmRestoreErr);}
    };
    reader.readAsText(file); e.target.value='';
  }
  function doRestore(){
    try{applyBackup(restoreConfirm);setRestoreConfirm(null);setRestoreMsg(t.hmRestoreOk);setTimeout(function(){window.location.reload();},1200);}
    catch(err){setRestoreConfirm(null);setRestoreMsg(t.hmRestoreErr);}
  }

  function addRole(){
    if(!newRoleName.trim()) return;
    var key='custom_'+Date.now();
    var nr={key:key,en:newRoleName.trim(),hi:newRoleName.trim(),isDefault:false};
    saveCustomRoles([...getCustomRoles(),nr]);
    setAllRoles(getRoles());
    setNewRoleName('');
  }

  function tryDeleteRole(roleKey){
    var usageCount=0;
    homes.forEach(function(h){
      var s=getStaff(h.id);
      usageCount+=s.filter(function(x){return x.role===roleKey;}).length;
    });
    if(usageCount>0){setConfirmDelRole({key:roleKey,count:usageCount});}
    else{doDeleteRole(roleKey);}
  }

  function doDeleteRole(roleKey){
    saveCustomRoles(getCustomRoles().filter(function(r){return r.key!==roleKey;}));
    setAllRoles(getRoles());
    setConfirmDelRole(null);
  }

  function addHome(){
    if(!newHomeName.trim()||homeBusy) return;
    if(!cloudHomes){
      /* guest mode: households live only on this device */
      onHomesChange([...homes,{id:uid(),name:newHomeName.trim()}]);
      setNewHomeName('');
      return;
    }
    /* Signed in, so the household has to be created in Firestore too —
       a local-only one would have no invite code, would never sync, and
       the rules would reject every write into it. */
    setHomeBusy(true); setHomeErr('');
    cloudCreateHome(user,newHomeName,lang)
      .then(function(entry){
        onCloudHomeAdded(entry);
        setNewHomeName(''); setHomeBusy(false);
      })
      .catch(function(e){ setHomeErr((e&&e.message)||''); setHomeBusy(false); });
  }

  function joinByCode(){
    if(joinCode.length!==6||homeBusy) return;
    setHomeBusy(true); setHomeErr('');
    cloudJoinHome(user,joinCode)
      .then(function(entry){
        onCloudHomeAdded(entry);   /* switches to it; ignores a duplicate */
        setJoinCode(''); setHomeBusy(false);
      })
      .catch(function(e){
        var notFound=e&&e.message==='__notfound';
        setHomeErr(notFound?t.codeNotFound:((e&&e.message)||t.codeNotFound));
        setHomeBusy(false);
      });
  }

  function delHome(id){
    var st=getStaff(id);
    st.forEach(function(s){lsKeys().filter(function(k){return k.startsWith('gs_lv_'+s.id+'_');}).forEach(lsDel);});
    lsDel(SK.staff(id)); lsDel(SK.ledger(id)); lsDel(SK.payments(id));
    /* For a cloud household this means "leave", not "destroy" — drop it from
       your own list so it stops coming back on the next sign-in. The
       household itself and everyone else's access are untouched, and your
       name stays in its members map so past entries still say who paid. */
    if(cloudHomes){
      fbDb.collection('users').doc(user.uid).set(
        {homeIds:firebase.firestore.FieldValue.arrayRemove(id)},{merge:true}).catch(function(){});
    }
    onHomesChange(homes.filter(function(h){return h.id!==id;}));
    setConfirmDelHome(null);
  }

  function saveWD(){
    var n=Math.min(31,Math.max(1,Number(wdInput)||30));
    saveSettings(Object.assign({},getSettings(),{workingDays:n}));
    onWorkingDaysChange(n);
    setWdInput(String(n));
    setWdSaved(true);
    setTimeout(function(){setWdSaved(false);},2000);
  }

  function toggleLang(){
    var nl=lang==='en'?'hi':'en';
    setLang(nl);
    saveSettings(Object.assign({},getSettings(),{lang:nl}));
  }

  return (
    <div className="p-4 scroll-area flex-1">
      <h2 style={{fontSize:fsr(20),fontWeight:800,color:'var(--ink)',marginBottom:16}}>{t.navSettingsTitle}</h2>

      {/* Household invite code (cloud mode only) */}
      {!guestMode&&<InviteCard lang={lang} homeId={homeId} homes={homes} />}

      {/* Section A: Roles */}
      <div className="card mb-4">
        <p style={{fontSize:fsr(15),fontWeight:800,color:'var(--ink)',marginBottom:12}}>{t.roleManagement}</p>
        {allRoles.map(function(r){
          var label=lang==='hi'?r.hi:r.en;
          return (
            <div key={r.key} className="flex items-center justify-between py-2" style={{borderBottom:'1px solid var(--border)'}}>
              <div className="flex items-center gap-2">
                <span style={{width:10,height:10,borderRadius:'50%',background:avatarBg(r.key),display:'inline-block',flexShrink:0}} />
                <span style={{fontSize:fsr(14),color:'var(--ink)',fontWeight:600}}>{label}</span>
              </div>
              {r.isDefault
                ? <span className="pill pill-muted" style={{fontSize:fsr(11)}}>{t.defaultRole}</span>
                : <button onClick={function(){tryDeleteRole(r.key);}}
                    style={{background:'transparent',border:'none',cursor:'pointer',padding:'2px 6px',color:'var(--danger)'}} aria-label="Delete"><Icon name="trash" size={17} /></button>
              }
            </div>
          );
        })}
        {confirmDelRole && (
          <div className="mt-3 p-3 rounded-xl" style={{background:'#FDF3DC',border:'1px solid var(--warn)'}}>
            <p style={{fontSize:fsr(13),color:'#8B5E08',fontWeight:700,marginBottom:8}}>
              {lang==='hi'
                ?'यह भूमिका '+confirmDelRole.count+' स्टाफ सदस्यों को दी गई है। फिर भी हटाएं?'
                :'This role is assigned to '+confirmDelRole.count+' staff member(s). Delete anyway?'}
            </p>
            <div className="flex gap-2">
              <PrimaryBtn onClick={function(){setConfirmDelRole(null);}} color="gray" small={true} full={true}>{t.cancel}</PrimaryBtn>
              <PrimaryBtn onClick={function(){doDeleteRole(confirmDelRole.key);}} color="red" small={true} full={true}>{t.del}</PrimaryBtn>
            </div>
          </div>
        )}
        <div className="flex gap-2 mt-3">
          <input value={newRoleName} onChange={function(e){setNewRoleName(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')addRole();}}
            placeholder={t.addRolePh} className="inp" style={{flex:1}} />
          <button onClick={addRole} className="btn btn-accent btn-sm" style={{whiteSpace:'nowrap'}}>{t.addRoleBtn}</button>
        </div>
      </div>

      {/* Section B: Homes */}
      <div className="card mb-4">
        <p style={{fontSize:fsr(15),fontWeight:800,color:'var(--ink)',marginBottom:12}}>{t.manageHomes}</p>

        {cloudHomes && (
          <div className="flex gap-2 mb-3">
            {[{k:'create',icon:'plus',label:t.createHome},{k:'join',icon:'key',label:t.joinHome}].map(function(o){
              var on=homeMode===o.k;
              return (
                <button key={o.k} onClick={function(){setHomeMode(o.k);setHomeErr('');}}
                  style={{flex:1,padding:'10px 6px',borderRadius:12,cursor:'pointer',
                    border:'2px solid '+(on?'var(--accent)':'var(--border)'),
                    background:on?'#D8EEE8':'var(--surface2)',
                    color:on?'var(--accent)':'var(--ink2)',fontWeight:800,fontSize:fsr(13),
                    fontFamily:'Nunito,sans-serif',minHeight:44,
                    display:'flex',alignItems:'center',justifyContent:'center',gap:7}}>
                  <Icon name={o.icon} size={17} />{o.label}
                </button>
              );
            })}
          </div>
        )}

        {homeErr && <p style={{fontSize:fsr(13),color:'var(--danger)',fontWeight:700,marginBottom:8}}>{homeErr}</p>}

        {(!cloudHomes||homeMode==='create') ? (
          <div className="flex gap-2 mb-3">
            <input value={newHomeName} onChange={function(e){setNewHomeName(e.target.value);}}
              onKeyDown={function(e){if(e.key==='Enter')addHome();}}
              placeholder={t.homeEx} className="inp" style={{flex:1}} />
            <button onClick={addHome} disabled={homeBusy} className="btn btn-accent btn-sm" style={{whiteSpace:'nowrap'}}>
              {homeBusy?t.creating:t.addHome}
            </button>
          </div>
        ) : (
          <div className="mb-3">
            <p style={{fontSize:fsr(13),color:'var(--ink2)',marginBottom:6}}>{t.enterCode}</p>
            <div className="flex gap-2">
              <input value={joinCode} maxLength={6}
                onChange={function(e){setJoinCode(e.target.value.toUpperCase());}}
                onKeyDown={function(e){if(e.key==='Enter')joinByCode();}}
                placeholder="ABC123" className="inp"
                style={{flex:1,textTransform:'uppercase',letterSpacing:'0.18em',textAlign:'center',fontSize:fsr(18)}} />
              <button onClick={joinByCode} disabled={joinCode.length!==6||homeBusy}
                className="btn btn-accent btn-sm" style={{whiteSpace:'nowrap'}}>
                {homeBusy?t.joining:t.joinHome}
              </button>
            </div>
          </div>
        )}
        {homes.length===0 && <p style={{textAlign:'center',color:'var(--muted)',fontSize:fsr(13)}}>{t.noHomes}</p>}
        {homes.map(function(h){return (
          <div key={h.id} className="flex items-center justify-between p-3 rounded-xl mb-2" style={{background:'var(--surface2)'}}>
            <span className="flex items-center gap-2" style={{fontWeight:600,color:'var(--ink)',fontSize:fsr(14)}}><Icon name="home" size={15} />{h.name}</span>
            {confirmDelHome===h.id ? (
              <div className="flex gap-2">
                <button onClick={function(){setConfirmDelHome(null);}} className="btn btn-ghost btn-sm">{t.cancel}</button>
                <button onClick={function(){delHome(h.id);}} className="btn btn-danger btn-sm">{t.del}</button>
              </div>
            ) : (
              <button onClick={function(){setConfirmDelHome(h.id);}} className="btn btn-danger btn-sm">{t.del}</button>
            )}
          </div>
        );})}
      </div>

      {/* Section C: App Preferences */}
      <div className="card mb-4">
        <p style={{fontSize:fsr(15),fontWeight:800,color:'var(--ink)',marginBottom:12}}>{t.langLabel}</p>
        <button onClick={toggleLang} className="btn btn-ghost btn-sm mb-5">
          {lang==='en'?'🇮🇳 हिंदी में बदलें':'🇬🇧 Switch to English'}
        </button>

        <div className="flex items-center gap-2 flex-wrap" style={{marginBottom:6}}><label style={{fontWeight:700,color:'var(--ink2)',fontSize:fsr(13),flex:1}}>{t.workingDaysLabel}</label><Help text={t.workingDaysHelp} label={t.workingDaysLabel} /></div>
        
        <div className="flex gap-2 items-center">
          <input type="number" min="1" max="31" value={wdInput}
            onChange={function(e){setWdInput(e.target.value);}}
            className="inp" style={{width:80}} />
          <button onClick={saveWD} className="btn btn-ok btn-sm">
            {wdSaved?t.save:t.save}
          </button>
        </div>

        <label style={{display:'block',fontWeight:700,color:'var(--ink2)',fontSize:fsr(13),marginTop:20,marginBottom:4}}>{t.layoutLabel}</label>
        <p style={{fontSize:fsr(12),color:'var(--muted)',marginBottom:8}}>{t.layoutHint}</p>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {[['classic',t.layoutClassic,t.layoutClassicDesc],['simple',t.layoutSimple,t.layoutSimpleDesc]].map(function(o){
            var on=layoutSel===o[0];
            return (
              <button key={o[0]} onClick={function(){ setLayoutSel(o[0]); onLayoutChange&&onLayoutChange(o[0]); }}
                style={{width:'100%',padding:'11px 14px',borderRadius:12,cursor:'pointer',textAlign:'left',
                  fontFamily:'Nunito,sans-serif',
                  border:on?'2px solid var(--accent)':'2px solid var(--border)',
                  background:on?'var(--accent)':'none',color:on?'#fff':'var(--ink2)'}}>
                <span className="flex items-center gap-2" style={{fontWeight:800,fontSize:fsr(14)}}>{on&&<Icon name="check" size={15} strokeWidth={2.6} />}{o[1]}</span>
                <span style={{fontSize:fsr(12),opacity:on?0.85:0.7,display:'block',marginTop:2}}>{o[2]}</span>
              </button>
            );
          })}
        </div>

        <div className="flex items-center gap-2 flex-wrap" style={{marginTop:20,marginBottom:6}}><label style={{fontWeight:700,color:'var(--ink2)',fontSize:fsr(13),flex:1}}>{t.waLangLabel}</label><Help text={t.waLangHelp} label={t.waLangLabel} /></div>
        <p style={{fontSize:fsr(12),color:'var(--muted)',marginBottom:8}}>{t.waLangHint}</p>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {[['both',t.waLangBoth],['hi',t.waLangHi],['en',t.waLangEn]].map(function(o){
            var on=waLangSel===o[0];
            return (
              <button key={o[0]} onClick={function(){
                  setWaLangSel(o[0]);
                  saveSettings(Object.assign({},getSettings(),{waLang:o[0]}));
                }}
                style={{width:'100%',padding:'11px 14px',borderRadius:12,cursor:'pointer',
                  fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:fsr(14),
                  border:on?'2px solid var(--accent)':'2px solid var(--border)',
                  background:on?'var(--accent)':'none',color:on?'#fff':'var(--ink2)'}}>
                <span className="flex items-center justify-center gap-2">{on&&<Icon name="check" size={15} strokeWidth={2.6} />}{o[1]}</span>
              </button>
            );
          })}
        </div>
        <pre style={{marginTop:10,padding:'10px 12px',borderRadius:12,background:'var(--bg)',
          border:'1px solid var(--border)',color:'var(--ink2)',fontSize:fsr(12),
          fontFamily:'Nunito,sans-serif',whiteSpace:'pre-wrap',lineHeight:1.5}}>
          {waTemplate('salary',{name:lang==='hi'?'कमला':'Kamala'},5000,todayStr(),'',lang,waLangSel)}
        </pre>

        <button onClick={onReplayTutorial} className="btn btn-ghost btn-full" style={{marginTop:16}}>
          <Icon name="refresh" size={18} style={{display:'inline-block',verticalAlign:'-3px',marginRight:8}} />{t.tutReplayBtn}
        </button>
      </div>

      <div className="card mb-4">
        <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:12}}>{t.hmData}</p>
        {restoreMsg&&<p style={{fontSize:fsr(13),color:'var(--ok)',fontWeight:700,marginBottom:10}}>{restoreMsg}</p>}
        {restoreConfirm ? (
          <div>
            <p style={{fontSize:fsr(14),fontWeight:700,color:'var(--ink)',marginBottom:12}}>{t.hmRestoreConfirm}</p>
            <div className="flex gap-3">
              <button onClick={function(){setRestoreConfirm(null);}} style={{flex:1,padding:'11px',borderRadius:12,border:'2px solid var(--border)',background:'none',color:'var(--ink2)',fontWeight:800,fontSize:fsr(14),cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>{t.cancel}</button>
              <button onClick={doRestore} style={{flex:1,padding:'11px',borderRadius:12,border:'none',background:'var(--danger)',color:'#fff',fontWeight:800,fontSize:fsr(14),cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>{t.confYes}</button>
            </div>
          </div>
        ) : (
          <div className="flex gap-3">
            <button onClick={function(){downloadBackup();}} style={{flex:1,padding:'12px',borderRadius:12,border:'2px solid var(--border)',background:'var(--surface2)',color:'var(--ink)',fontWeight:700,fontSize:fsr(14),cursor:'pointer',fontFamily:'Nunito,sans-serif'}}><Icon name="download" size={17} style={{display:'inline-block',verticalAlign:'-3px',marginRight:6}} />{t.hmBackup}</button>
            <button onClick={function(){restoreRef.current&&restoreRef.current.click();}} style={{flex:1,padding:'12px',borderRadius:12,border:'2px solid var(--border)',background:'var(--surface2)',color:'var(--ink)',fontWeight:700,fontSize:fsr(14),cursor:'pointer',fontFamily:'Nunito,sans-serif'}}><Icon name="folder" size={17} style={{display:'inline-block',verticalAlign:'-3px',marginRight:6}} />{t.hmRestore}</button>
          </div>
        )}
        <input type="file" accept=".json" onChange={handleRestoreFile} className="hidden" ref={restoreRef} />
      </div>

      {/* Sign Out (cloud mode only) */}
      {!guestMode&&user&&(
        <div className="card mb-4" style={{textAlign:'center'}}>
          <p style={{fontSize:fsr(13),color:'var(--ink2)',marginBottom:12}}>
            {user.phoneNumber||user.email||user.displayName||'Signed in'}
          </p>
          <button className="btn btn-danger btn-full" onClick={onSignOut}>
            <Icon name="signout" size={18} style={{display:'inline-block',verticalAlign:'-3px',marginRight:8}} />{t.signOut}
          </button>
        </div>
      )}
    </div>
  );
}

/* ── FEEDBACK TAB ───────────────────────────────────────────────
   Feedback is about the app, not about one household, so it lives in a
   top-level /feedback collection rather than under /homes — the first thing
   in the app that crosses the household boundary.

   Sending needs a signed-in account. An open write path on a global
   collection would be a spam target with no way to reply, so guests are
   shown an explanation instead. You can read back only your own messages;
   the rules keep everyone else's private. */
function FeedbackTab({lang,guestMode,user}){
  var t=T[lang];
  var TYPES=[
    {key:'idea',    icon:'bulb',    label:t.fbIdea},
    {key:'problem', icon:'warning', label:t.fbProblem},
    {key:'other',   icon:'chat',    label:t.fbOther},
  ];
  var [type,setType]=useState('idea');
  var [msg,setMsg]=useState('');
  var [sending,setSending]=useState(false);
  var [sent,setSent]=useState('');          /* '' | 'ok' | 'queued' */
  var [err,setErr]=useState('');
  var [mine,setMine]=useState(null);        /* null while loading */
  var [confirmDel,setConfirmDel]=useState(null);

  var canSend=!!(FIREBASE_ENABLED&&fbDb&&!guestMode&&user);

  function loadMine(){
    if(!canSend){ setMine([]); return; }
    fbDb.collection('feedback').where('authorId','==',user.uid).get()
      .then(function(snap){
        var rows=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
        rows.sort(function(a,b){ return (b.createdAtMs||0)-(a.createdAtMs||0); });
        setMine(rows);
      })
      .catch(function(){ setMine([]); });
  }
  useEffect(loadMine,[canSend]);

  function send(){
    if(!msg.trim()||sending) return;
    setSending(true); setErr(''); setSent('');
    var rec={
      type:type,
      message:msg.trim().slice(0,2000),
      authorId:user.uid,
      authorName:displayNameOf(user),
      lang:lang,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      createdAtMs:Date.now(),
      pinned:false           /* reserved — upvoting lands here in a later version */
    };
    /* Offline, the add() promise stays pending until the network returns.
       Firestore has already stored it durably, so after a short wait say so
       rather than leaving the button spinning forever. */
    var settled=false;
    var timer=setTimeout(function(){
      if(settled) return;
      settled=true; setSending(false); setSent('queued'); setMsg('');
    },4000);
    fbDb.collection('feedback').add(rec)
      .then(function(){
        if(settled) return;
        settled=true; clearTimeout(timer);
        setSending(false); setSent('ok'); setMsg(''); loadMine();
      })
      .catch(function(e){
        if(settled) return;
        settled=true; clearTimeout(timer);
        setSending(false); setErr((e&&e.message)||t.fbError);
      });
  }

  function del(id){
    fbDb.collection('feedback').doc(id).delete()
      .then(function(){
        setMine(function(r){ return (r||[]).filter(function(x){ return x.id!==id; }); });
        setConfirmDel(null);
      })
      .catch(function(){ setConfirmDel(null); });
  }

  function typeOf(k){ return TYPES.find(function(x){return x.key===k;})||TYPES[2]; }

  return (
    <div className="p-4 scroll-area flex-1">
      <div className="card mb-4">
        <p style={{fontSize:fsr(19),fontWeight:800,color:'var(--ink)',marginBottom:6}}>{t.fbTitle}</p>
        <p style={{fontSize:fsr(14),color:'var(--ink2)',lineHeight:1.55}}>{t.fbIntro}</p>
      </div>

      {!canSend ? (
        <div className="card mb-4" style={{textAlign:'center'}}>
          <div style={{display:'flex',justifyContent:'center',color:'var(--muted)',marginBottom:10}}><Icon name="lock" size={30} /></div>
          <p style={{fontSize:fsr(15),fontWeight:800,color:'var(--ink)',marginBottom:8}}>{t.fbNeedAccount}</p>
          <p style={{fontSize:fsr(13),color:'var(--ink2)',lineHeight:1.55}}>{t.fbNeedAccountWhy}</p>
        </div>
      ) : (
        <div className="card mb-4">
          {sent==='ok'&&(
            <div className="mb-4" style={{background:'#D8EEE2',border:'1px solid var(--ok)',borderRadius:12,padding:'12px 14px'}}>
              <p style={{fontSize:fsr(14),fontWeight:800,color:'var(--ok)'}} className="flex items-center gap-2"><Icon name="check" size={16} strokeWidth={2.6} />{t.fbThanks}</p>
            </div>
          )}
          {sent==='queued'&&(
            <div className="mb-4" style={{background:'#FDF3DC',border:'1px solid var(--warn)',borderRadius:12,padding:'12px 14px'}}>
              <p style={{fontSize:fsr(14),fontWeight:800,color:'#8B5E08'}} className="flex items-center gap-2"><Icon name="sync" size={16} />{t.fbQueued}</p>
            </div>
          )}
          {err&&<p style={{fontSize:fsr(13),color:'var(--danger)',fontWeight:700,marginBottom:10}}>{err}</p>}

          <label style={{display:'block',fontSize:fsr(15),fontWeight:800,color:'var(--ink2)',marginBottom:8}}>{t.fbWhatKind}</label>
          <div className="flex gap-2 mb-4">
            {TYPES.map(function(o){
              var on=type===o.key;
              return (
                <button key={o.key} onClick={function(){setType(o.key);}}
                  style={{flex:1,padding:'12px 6px',borderRadius:12,cursor:'pointer',
                    border:'2px solid '+(on?'var(--accent)':'var(--border)'),
                    background:on?'#D8EEE8':'var(--surface2)',
                    color:on?'var(--accent)':'var(--ink2)',fontWeight:800,fontSize:fsr(13),
                    fontFamily:'Nunito,sans-serif',display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                  <Icon name={o.icon} size={20} />
                  <span>{o.label}</span>
                </button>
              );
            })}
          </div>

          <FLabel label={t.fbYourMessage} hint={t.fbMessageHint} req={true}>
            <textarea value={msg} onChange={function(e){setMsg(e.target.value);}}
              placeholder={t.fbPlaceholder} className="ta" style={{height:130}} maxLength={2000} />
          </FLabel>
          <p style={{fontSize:fsr(12),color:'var(--muted)',textAlign:'right',marginBottom:12}}>{msg.length}/2000</p>

          <PrimaryBtn onClick={send} full={true} disabled={!msg.trim()||sending}>
            {sending?t.fbSending:t.fbSend}
          </PrimaryBtn>
        </div>
      )}

      {canSend&&mine&&mine.length>0&&(
        <div>
          <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink)',marginBottom:12}}>{t.fbYours}</p>
          {mine.map(function(f){
            var ty=typeOf(f.type);
            return (
              <div key={f.id} className="card mb-3">
                <div className="flex items-start justify-between gap-2 mb-2">
                  <span className="pill pill-accent inline-flex items-center gap-1"><Icon name={ty.icon} size={13} />{ty.label}</span>
                  <span style={{fontSize:fsr(12),color:'var(--muted)',fontWeight:700,whiteSpace:'nowrap'}}>
                    {f.createdAtMs?fmtD(toISODate(new Date(f.createdAtMs))):''}
                  </span>
                </div>
                <p style={{fontSize:fsr(14),color:'var(--ink)',lineHeight:1.55,whiteSpace:'pre-wrap'}}>{f.message}</p>
                {confirmDel===f.id ? (
                  <div className="flex gap-2 mt-3">
                    <PrimaryBtn onClick={function(){setConfirmDel(null);}} color="gray" small={true} full={true}>{t.cancel}</PrimaryBtn>
                    <PrimaryBtn onClick={function(){del(f.id);}} color="red" small={true} full={true}>{t.del}</PrimaryBtn>
                  </div>
                ) : (
                  <button onClick={function(){setConfirmDel(f.id);}}
                    style={{marginTop:10,fontSize:fsr(12),color:'var(--danger)',border:'1px solid #F5C6C6',
                      borderRadius:8,padding:'4px 10px',fontWeight:700,background:'transparent',
                      cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
                    {t.fbWithdraw}
                  </button>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ── HAMBURGER MENU ─────────────────────────────────────────── */
function HamburgerMenu({open,onClose,setTab,lang,homeId,workingDays,layout}){
  var t=T[lang];
  var mc=React.useContext(MembersCtx);
  var [showExport,setShowExport]=useState(false);
  var [busy,setBusy]=useState('');
  var fileRef=useRef(null);

  if(!open) return null;

  function go(tabKey){ setTab(tabKey); onClose(); }

  var menuItems=[
    {icon:'reports', label:t.hmAnnual,   action:function(){go('annual');}},
    {icon:'mic',     label:t.hmVoice,    action:function(){go('voice');}},
    {icon:'upload',  label:t.hmExportMonth, action:function(){setShowExport(function(v){return !v;});}},
    {icon:'chat',    label:t.hmFeedback, action:function(){go('feedback');}},
    {icon:'settings',label:t.hmSettings, action:function(){go('settings');}},
  ];
  /* Attendance has no bar of its own in the simple layout, so it is listed
     here — nothing the classic layout can reach may become unreachable. */
  if(layout==='simple') menuItems.unshift({icon:'calendar',label:t.navLeaves,action:function(){go('leaves');}});

  function rowBtn(item){
    return (
      <button key={item.label} onClick={item.action}
        style={{display:'flex',alignItems:'center',gap:14,width:'100%',minHeight:56,padding:'0 20px',background:'none',border:'none',borderBottom:'1px solid var(--border)',cursor:'pointer',fontFamily:'Nunito,sans-serif',color:'var(--ink)',fontSize:fsr(16),fontWeight:700,textAlign:'left'}}>
        <span style={{width:34,display:'flex',justifyContent:'center',color:'var(--accent)'}}><Icon name={item.icon} size={24} /></span>
        <span style={{flex:1}}>{item.label}</span>
        <span style={{color:'var(--ink2)',fontSize:fsr(18)}}>›</span>
      </button>
    );
  }

  return (
    <div style={{position:'fixed',inset:0,zIndex:50,display:'flex',flexDirection:'column',justifyContent:'flex-end',alignItems:'center'}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(26,46,42,0.45)'}} />
      <div className="fade-in" style={{position:'relative',width:'100%',maxWidth:480,background:'var(--surface)',borderRadius:'24px 24px 0 0',paddingBottom:8,boxShadow:'0 -4px 24px rgba(26,46,42,.18)'}}>
        <div style={{display:'flex',justifyContent:'center',paddingTop:14,paddingBottom:4}}>
          <div style={{width:44,height:4,background:'var(--border)',borderRadius:4}} />
        </div>
        {menuItems.map(function(item){
          var isExport=item.icon==='upload';
          return (
            <div key={item.label}>
              {rowBtn(item)}
              {isExport&&showExport&&(
                <div className="fade-in flex gap-3 px-4 py-3" style={{background:'var(--surface2)',borderBottom:'1px solid var(--border)'}}>
                  {/* the spreadsheet library is fetched on first use, so show
                      progress rather than letting the button look dead */}
                  <button disabled={!!busy} onClick={function(){
                      setBusy('month');
                      exportReport(homeId,'month',lang,mc.members,workingDays,function(st){
                        setBusy(''); if(st!=='working') onClose();
                      });
                    }}
                    style={{flex:1,padding:'10px',borderRadius:12,border:'2px solid var(--accent)',background:'var(--surface)',color:'var(--accent)',fontWeight:800,fontSize:fsr(13),cursor:busy?'wait':'pointer',opacity:busy?.6:1,fontFamily:'Nunito,sans-serif'}}>
                    {busy==='month'?t.exportWorking:t.hmExportMonth}
                  </button>
                  <button disabled={!!busy} onClick={function(){
                      setBusy('year');
                      exportReport(homeId,'year',lang,mc.members,workingDays,function(st){
                        setBusy(''); if(st!=='working') onClose();
                      });
                    }}
                    style={{flex:1,padding:'10px',borderRadius:12,border:'2px solid var(--border)',background:'var(--surface)',color:'var(--ink2)',fontWeight:800,fontSize:fsr(13),cursor:busy?'wait':'pointer',opacity:busy?.6:1,fontFamily:'Nunito,sans-serif'}}>
                    {busy==='year'?t.exportWorking:t.hmExportYear}
                  </button>
                </div>
              )}
            </div>
          );
        })}
        <button onClick={onClose}
          style={{width:'100%',padding:'16px',background:'none',border:'none',color:'var(--ink2)',fontSize:fsr(14),fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',marginTop:4}}>
          {t.cancel}
        </button>
      </div>
    </div>
  );
}

/* ── FIRST-RUN TUTORIAL (interactive coach) ────────────────────
   Spotlights the exact control to press and dims everything else,
   so only the highlighted element stays tappable. Steps marked
   `action` wait for the user to really do it (open the form, save
   the staff member, switch tab) before moving on. */
function TutorialOverlay({lang,tab,onNavigate,onDone}){
  var t=T[lang];
  var [step,setStep]=useState(0);
  var [rect,setRect]=useState(null);

  function q(name){ return document.querySelector('[data-tut="'+name+'"]'); }

  /* `open` = spotlight the control but leave the screen usable, for steps
     where the card describes something the user needs to see or try.
     Only the pure "press this one button" step dims and blocks. */
  var steps=[
    {tab:'staff', open:true, title:t.tutWelcomeT, body:t.tutWelcomeB},
    {tab:'staff', target:'add-staff', action:true, title:t.tutAddT, hint:t.tutAddHint,
     domDone:function(){ return !!q('staff-name'); }},
    /* No target and no scroll: the whole form is the subject, so the card
       drops to the bottom edge and the form sits at its natural top. */
    {open:true, title:t.tutFormT, body:t.tutFormB},
    {target:'staff-save', action:true, open:true, title:t.tutSaveT, hint:t.tutSaveHint,
     domDone:function(){ return !q('staff-name'); }},
    {tab:'staff',  target:'nav-leaves', action:true, open:true, doneTab:'leaves',
     title:t.tutSavedT,   body:t.tutSavedB,   hint:t.tutSavedHint},
    {tab:'leaves', target:'nav-adv',    action:true, open:true, doneTab:'adv', look:'mark-today',
     title:t.tutAttendT,  body:t.tutAttendB,  hint:t.tutAttendHint},
    {tab:'adv',    target:'nav-salary', action:true, open:true, doneTab:'salary', look:'add-entry',
     title:t.tutRecordsT, body:t.tutRecordsB, hint:t.tutRecordsHint},
    {tab:'salary', target:'salary-calc', open:true, title:t.tutPayT, body:t.tutPayB},
  ];
  var cur=steps[step];
  var last=step===steps.length-1;

  /* drive the tab for steps that declare one */
  useEffect(function(){ if(cur.tab) onNavigate(cur.tab); },[step]);

  /* Keep the spotlight glued to its target. Driven by DOM mutations and
     scroll/resize rather than rAF, so it still tracks when the page is
     backgrounded (rAF stops entirely in a hidden tab). */
  useEffect(function(){
    if(!cur.target){ setRect(null); return; }
    function measure(){
      var el=q(cur.target);
      if(!el){ setRect(null); return; }
      var r=el.getBoundingClientRect();
      if(!r.width&&!r.height){ setRect(null); return; }
      setRect(function(p){
        if(p&&p.t===r.top&&p.l===r.left&&p.w===r.width&&p.h===r.height) return p; /* keep identity */
        return {t:r.top,l:r.left,w:r.width,h:r.height};
      });
    }
    measure();
    var mo=new MutationObserver(measure);
    mo.observe(document.body,{childList:true,subtree:true,attributes:true});
    var iv=setInterval(measure,150);
    window.addEventListener('scroll',measure,true);
    window.addEventListener('resize',measure);
    return function(){
      mo.disconnect(); clearInterval(iv);
      window.removeEventListener('scroll',measure,true);
      window.removeEventListener('resize',measure);
    };
  },[step,cur.target]);

  /* Bring the relevant thing on screen when the step opens. `look` is the
     content the card is talking about (scrolled to the top so it sits in
     the clear band above the card); otherwise centre the target itself. */
  useEffect(function(){
    var sel=cur.look||cur.target;
    if(!sel) return;
    var n=0;
    var iv=setInterval(function(){
      var el=q(sel);
      /* instant, not smooth: smooth scrolling is driven by animation frames,
         which never run while the page is backgrounded */
      if(el){ el.scrollIntoView({block:cur.look?'start':'center'}); clearInterval(iv); }
      if(++n>25) clearInterval(iv);
    },100);
    return function(){ clearInterval(iv); };
  },[step]);

  /* Steps completed by opening/closing the staff form. MutationObserver
     fires off the DOM change itself, so this stays responsive even when
     timer throttling would delay a poll. */
  useEffect(function(){
    if(!cur.domDone) return;
    var fired=false;
    function check(){
      if(fired||!cur.domDone()) return;
      fired=true; setStep(function(s){return s+1;});
    }
    check();
    var mo=new MutationObserver(check);
    mo.observe(document.body,{childList:true,subtree:true});
    var iv=setInterval(check,300);
    return function(){ mo.disconnect(); clearInterval(iv); };
  },[step]);

  /* Steps completed by switching tab — read straight off the prop. */
  useEffect(function(){
    if(cur.doneTab&&tab===cur.doneTab) setStep(function(s){return s+1;});
  },[tab,step]);

  function back(){ if(step>0) setStep(step-1); }
  function next(){ if(last) onDone(); else setStep(step+1); }

  var pad=6;
  var dim='rgba(26,46,42,0.62)';
  var vh=typeof window!=='undefined'?window.innerHeight:800;

  /* Sit the card directly beside the highlighted control — below it when
     there is room, otherwise above. Keeping it adjacent (rather than pinned
     to the far edge) puts the words next to the button they describe and
     leaves the rest of the screen visible, so the card never hides the
     content it is explaining. */
  var cardRef=useRef(null);
  var [cardH,setCardH]=useState(260);
  useEffect(function(){
    if(cardRef.current){
      var h=cardRef.current.offsetHeight;
      if(h&&h!==cardH) setCardH(h);
    }
  });
  var m=12, cardY;
  if(!rect) cardY=Math.max(m,vh-cardH-m);
  else {
    var below=rect.t+rect.h+pad+m;
    var above=rect.t-pad-m-cardH;
    if(below+cardH+m<=vh) cardY=below;
    else if(above>=m) cardY=above;
    else cardY=Math.max(m,vh-cardH-m);
  }

  return (
    <div style={{position:'fixed',inset:0,zIndex:70,pointerEvents:'none'}}>
      {rect && !cur.open && (
        <React.Fragment>
          <div style={{position:'fixed',left:0,right:0,top:0,height:Math.max(0,rect.t-pad),background:dim,pointerEvents:'auto'}} />
          <div style={{position:'fixed',left:0,right:0,top:rect.t+rect.h+pad,bottom:0,background:dim,pointerEvents:'auto'}} />
          <div style={{position:'fixed',left:0,top:rect.t-pad,width:Math.max(0,rect.l-pad),height:rect.h+pad*2,background:dim,pointerEvents:'auto'}} />
          <div style={{position:'fixed',left:rect.l+rect.w+pad,right:0,top:rect.t-pad,height:rect.h+pad*2,background:dim,pointerEvents:'auto'}} />
        </React.Fragment>
      )}
      {rect && (
        <div style={{position:'fixed',left:rect.l-pad,top:rect.t-pad,width:rect.w+pad*2,height:rect.h+pad*2,
          border:'3px solid var(--accent2)',borderRadius:14,pointerEvents:'none',
          boxShadow:'0 0 0 3px rgba(62,160,138,.35), 0 0 0 6px rgba(255,255,255,.55)',
          animation:'tutPulse 1.6s ease-in-out infinite'}} />
      )}
      {!rect && !cur.open && (
        <div style={{position:'fixed',inset:0,background:dim,pointerEvents:'auto'}} />
      )}

      {/* Centred with auto margins, not translateX: the .fade-in keyframe ends
          on `transform:none`, which wipes out an inline transform. */}
      <div ref={cardRef} className="fade-in" style={{position:'fixed',left:12,right:12,margin:'0 auto',
        top:cardY,maxWidth:456,
        background:'var(--surface)',borderRadius:20,padding:'13px 16px 14px',
        boxShadow:'0 8px 32px rgba(26,46,42,.35)',pointerEvents:'auto'}}>

        <div className="flex items-center gap-3" style={{marginBottom:8}}>
          <div style={{flex:1,height:6,background:'var(--surface2)',borderRadius:4,overflow:'hidden'}}>
