<!-- Error display (hidden unless window.onerror fires before React mounts) -->
<div id="err" style="display:none;padding:20px;color:#dc2626;font-size:14px;background:#fef2f2;border:1px solid #fca5a5;margin:16px;border-radius:12px;"></div>

<script>
window.onerror = function(msg,_,line){
  var el=document.getElementById('err');
  if(el){el.style.display='block';el.textContent='JS Error at line '+line+': '+msg;}
};
</script>

const {useState,useEffect,useRef,useMemo} = React;

/* ── FIREBASE INIT ──────────────────────────────────────────── */
/* Config comes from config.js (see config.example.js). On Netlify it is
   generated at build time from environment variables; locally you create
   it by hand. No config.js → app runs in guest mode, localStorage only. */
const FIREBASE_CONFIG = window.GHARSEVA_CONFIG || { apiKey: 'YOUR_API_KEY' };
var fbAuth = null, fbDb = null, FIREBASE_ENABLED = false;
(function(){
  try {
    if (typeof firebase === 'undefined') return;
    if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') return;
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb   = firebase.firestore();
    fbDb.enablePersistence({synchronizeTabs:true}).catch(function(){});
    FIREBASE_ENABLED = true;
  } catch(e){ console.warn('Firebase init skipped:', e.message); }
})();

/* Shared sync counter — tabs subscribe via React.useContext(SyncCtx)
   and add it to their useEffect deps so remote writes trigger re-fetch. */
var SyncCtx = React.createContext(0);

/* Household members, for attributing who actually paid for something.
   {uid, members:{uid:{name,color}}, guestMode}. Names live on the home doc
   because Firestore rules keep /users/{uid} readable only by that user, so
   one member can never look another's display name up directly. */
var MembersCtx = React.createContext({uid:'',members:{},guestMode:true});
var MEMBER_COLORS=['#1A6E5E','#5B4A9B','#B45309','#1C7A48','#C0393B','#3EA08A'];
function memberColor(uid){
  var h=0; for(var i=0;i<(uid||'').length;i++) h=(h*31+uid.charCodeAt(i))>>>0;
  return MEMBER_COLORS[h%MEMBER_COLORS.length];
}
function memberLabel(uid,members,t){
  if(!uid) return t?t.notRecorded:'—';
  var m=members&&members[uid];
  return (m&&m.name)||(t?t.memberUnknown:'Member');
}
/* Resolves who paid, including someone outside the household's member list
   (paidBy:'other' + a free-text paidByName). Prefer this over memberLabel
   directly wherever the full record (not just a uid) is available. */
function payerLabel(rec,members,t){
  if(!rec||!rec.paidBy) return t?t.notRecorded:'—';
  if(rec.paidBy==='other') return (rec.paidByName&&rec.paidByName.trim())||(t?t.paidBySomeoneElse:'Someone else');
  return memberLabel(rec.paidBy,members,t);
}
function displayNameOf(user){
  if(!user) return '';
  return user.displayName||user.phoneNumber||user.email||'Member';
}

/* Phone numbers pasted from a contacts app carry a country code, spaces,
   dashes or a leading +. Strip everything but digits as the user types
   (native maxLength would otherwise truncate a paste before this ever runs),
   then collapse the common Indian prefixes down to a bare 10-digit number
   at save time so the rest of the app (WhatsApp links, display) stays
   consistent with what it already assumes. Anything that doesn't match
   is kept as typed rather than mangled. */
function cleanPhoneDigits(raw){ return (raw||'').replace(/\D/g,'').slice(0,15); }
function normalizePhone(digits){
  if(digits.length===12&&digits.slice(0,2)==='91') return digits.slice(2);
  if(digits.length===11&&digits.charAt(0)==='0') return digits.slice(1);
  return digits;
}

/* Names typed for "someone else" paid this, offered back as suggestions so
   the same person doesn't end up spelled three different ways. */
function getExternalPayerNames(homeId){
  var names={};
  getLedger(homeId).forEach(function(e){ if(e.paidBy==='other'&&e.paidByName) names[e.paidByName.trim()]=true; });
  getPayments(homeId).forEach(function(p){ if(p.paidBy==='other'&&p.paidByName) names[p.paidByName.trim()]=true; });
  return Object.keys(names).sort();
}

/* ── FONT SCALE HELPER ──────────────────────────────────────── */
/* fsr(px): convert a design-px value to a rem string so all text
   scales when html font-size changes (Normal 16→Large 20→XL 24). */
function fsr(n){ return (n/16).toFixed(4)+'rem'; }
function applyFontSz(sz){
  document.documentElement.style.fontSize=sz==='xlarge'?'24px':sz==='large'?'20px':'16px';
}

/* ExcelJS is only needed when someone actually exports, and it is far bigger
   than anything else here — so it is fetched on first use rather than on
   every app load. Resolves to window.ExcelJS. */
var _exceljsPromise=null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(_exceljsPromise) return _exceljsPromise;
  _exceljsPromise=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload=function(){ window.ExcelJS?resolve(window.ExcelJS):reject(new Error('ExcelJS did not load')); };
    s.onerror=function(){ _exceljsPromise=null; reject(new Error('offline')); };
    document.head.appendChild(s);
  });
  return _exceljsPromise;
}

function downloadBlob(content,mime,filename){
  var blob=content instanceof Blob?content:new Blob([content],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},200);
}
/* Quotes on comma, quote, OR newline — the old inline version only checked
   for comma/quote, so a reason containing a line break silently corrupted
   the row structure. */
function csvCell(v){
  var s=String(v==null?'':v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
/* A single CSV, five sections separated by a blank line, covering
   everything the old flat ledger dump left out: staff details, actual
   salary payments, attendance, and who paid for what — not just raw
   ledger rows. Headers and type labels run through T[lang] so the export
   matches whatever language the app is currently in. */
/* Everything the report needs, gathered once so the spreadsheet and the
   plain-text fallback can never disagree about the numbers. */
function buildReportData(homeId,period,lang,members,workingDays){
  var t=T[lang]||T.en;
  var staff=getStaff(homeId);
  var ledger=getLedger(homeId);
  var payments=getPayments(homeId);
  var home=getHomes().find(function(h){return h.id===homeId;})||{name:''};
  var now=new Date();
  var year=now.getFullYear(), month=now.getMonth()+1;
  function inPeriod(dateStr){
    if(!dateStr) return false;
    return period==='month' ? dateStr.startsWith(year+'-'+String(month).padStart(2,'0'))
                            : dateStr.startsWith(String(year));
  }
  /* months that have actually happened — padding the rest with zeroes just
     filled the old report with meaningless rows */
  var allMonths = period==='month' ? [month] : Array.from({length:12},function(_,i){return i+1;});
  var monthsInPeriod=allMonths.filter(function(m){ return new Date(year,m-1,1)<=now; });
  var label = period==='month' ? (year+'-'+String(month).padStart(2,'0')) : String(year);
  var typeLabels={advance:t.tAdv,loan:t.tLoan,expense:t.tExp,bonus:t.tBonus,loan_repay:t.tLoanRepay,
    extra_work:t.tExtraWork,short_hours:t.tShortHours,extra_help:t.tExtraHelp};
  function toDate(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }

  var periodLedger=ledger.filter(function(e){return inPeriod(e.date);});
  var periodPayments=payments.filter(function(p){
    return period==='year' ? p.year===year : (p.year===year&&p.month===month);
  });
  var CASH_OUT=['advance','loan','expense','bonus','extra_work','extra_help'];
  var totalSpend=periodPayments.reduce(function(a,p){return a+(p.amount||0);},0)
    +periodLedger.filter(function(e){return CASH_OUT.indexOf(e.type)>-1;}).reduce(function(a,e){return a+(e.amount||0);},0);

  function monthSalary(s,m){
    var real=payments.filter(function(p){return p.staffId===s.id&&p.year===year&&p.month===m;})
                      .reduce(function(a,p){return a+(p.amount||0);},0);
    if(real>0) return real;
    return new Date(year,m-1,1)>now ? 0 : calcSalary(s,year,m,ledger,workingDays).netPayable;
  }
  function monthAttendance(staffId,m){
    var lv=getLeaves(staffId,padYM(year,m));
    var vals=Object.keys(lv).map(function(k){return lv[k];});
    var leaveD=vals.filter(function(v){return v==='leave';}).length;
    var holidayD=vals.filter(function(v){return v==='holiday';}).length;
    var daysInMonth=new Date(year,m,0).getDate();
    var considered = year===now.getFullYear()&&m===now.getMonth()+1 ? now.getDate() : daysInMonth;
    return {present:Math.max(0,considered-leaveD-holidayD),leave:leaveD,holiday:holidayD};
  }

  var staffRows=staff.map(function(s){
    var paidSum=0,present=0,leave=0,holiday=0;
    monthsInPeriod.forEach(function(m){
      paidSum+=monthSalary(s,m);
      var att=monthAttendance(s.id,m);
      present+=att.present; leave+=att.leave; holiday+=att.holiday;
    });
    var sLed=ledger.filter(function(e){return e.staffId===s.id&&inPeriod(e.date);});
    function sum(type){return sLed.filter(function(e){return e.type===type;}).reduce(function(a,e){return a+(e.amount||0);},0);}
    var spend=paidSum+sum('advance')+sum('expense')+sum('bonus')+sum('extra_work');
    return {name:s.name,role:roleLabel(s.role,lang),salary:paidSum,advances:sum('advance'),
      expenses:sum('expense'),bonuses:sum('bonus'),overtime:sum('extra_work'),halfDays:sum('short_hours'),
      loanBal:getLoanBal(s.id,ledger),present:present,leave:leave,holiday:holiday,spend:spend};
  });

  var payRows=periodPayments.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');})
    .map(function(p){
      var s=staff.find(function(x){return x.id===p.staffId;});
      return {date:toDate(p.date),name:s?s.name:t.generalNoStaff,amount:p.amount||0,paidBy:payerLabel(p,members,t)};
    });

  var entryRows=periodLedger.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');})
    .map(function(e){
      var s=staff.find(function(x){return x.id===e.staffId;});
      var name=s?s.name:(e.type==='extra_help'?t.generalNoStaff:'—');
      if(e.type==='extra_help'&&e.helperName) name+=' ('+e.helperName+')';
      return {date:toDate(e.date),name:name,typeKey:e.type,type:typeLabels[e.type]||e.type,
        amount:e.amount||0,paidBy:payerLabel(e,members,t),reason:e.reason||''};
    });

  var attRows=[];
  staff.forEach(function(s){
    monthsInPeriod.forEach(function(m){
      var att=monthAttendance(s.id,m);
      attRows.push({name:s.name,month:t.months[m-1]+' '+year,present:att.present,leave:att.leave,holiday:att.holiday});
    });
  });

  /* chart series: monthly totals across a year, per-person for a single month */
  var chart = period==='year'
    ? {title:t.annEstTotal,
       labels:monthsInPeriod.map(function(m){return t.months[m-1];}),
       values:monthsInPeriod.map(function(m){
         return staff.reduce(function(a,s){return a+monthSalary(s,m);},0);
       })}
    : {title:t.annTotal,
       labels:staffRows.map(function(r){return r.name;}),
       values:staffRows.map(function(r){return r.spend;})};

  return {t:t,lang:lang,home:home,label:label,period:period,year:year,
    generatedOn:todayStr(),staffCount:staff.length,totalSpend:totalSpend,
    staffRows:staffRows,payRows:payRows,entryRows:entryRows,attRows:attRows,chart:chart};
}

/* Bar chart drawn to a canvas and embedded as a picture — ExcelJS cannot
   write native chart objects, and hand-building the chart XML is far more
   fragile than it is worth here. The in-cell data bars stay live; this is
   for the at-a-glance view on the Summary tab. */
function renderChartPNG(chart){
  var W=1040,H=520,padL=110,padR=30,padT=70,padB=90;
  var c=document.createElement('canvas'); c.width=W; c.height=H;
  var x=c.getContext('2d');
  x.fillStyle='#FFFFFF'; x.fillRect(0,0,W,H);
  x.fillStyle='#1A2E2A'; x.font='bold 30px Nunito, Arial, sans-serif';
  x.fillText(chart.title,padL,46);
  var vals=chart.values, labels=chart.labels;
  var max=Math.max.apply(Math,vals.concat([1]));
  var plotW=W-padL-padR, plotH=H-padT-padB;
  /* gridlines + axis labels */
  x.strokeStyle='#E5EDE6'; x.fillStyle='#7A998C'; x.font='16px Nunito, Arial, sans-serif'; x.lineWidth=1;
  for(var g=0;g<=4;g++){
    var gy=padT+plotH-(plotH*g/4);
    x.beginPath(); x.moveTo(padL,gy); x.lineTo(W-padR,gy); x.stroke();
    var gv=Math.round(max*g/4);
    x.textAlign='right';
    x.fillText(gv>=1000?Math.round(gv/1000)+'k':String(gv),padL-12,gy+5);
  }
  var slot=plotW/vals.length, bw=Math.min(64,slot*0.6);
  vals.forEach(function(v,i){
    var bh=max>0?Math.round(plotH*v/max):0;
    var bx=padL+slot*i+(slot-bw)/2, by=padT+plotH-bh;
    var grad=x.createLinearGradient(0,by,0,padT+plotH);
    grad.addColorStop(0,'#3EA08A'); grad.addColorStop(1,'#1A6E5E');
    x.fillStyle=grad; x.fillRect(bx,by,bw,bh);
    x.fillStyle='#7A998C'; x.font='16px Nunito, Arial, sans-serif'; x.textAlign='center';
    x.fillText(labels[i],bx+bw/2,padT+plotH+26);
    if(v>0){
      x.fillStyle='#1A2E2A'; x.font='bold 15px Nunito, Arial, sans-serif';
      x.fillText(v>=1000?Math.round(v/1000)+'k':String(v),bx+bw/2,by-9);
    }
  });
  x.strokeStyle='#C4D4C6'; x.beginPath(); x.moveTo(padL,padT+plotH); x.lineTo(W-padR,padT+plotH); x.stroke();
  return c.toDataURL('image/png');
}

/* ── Styled Excel workbook ───────────────────────────────────── */
function exportExcel(homeId,period,lang,members,workingDays){
  var d=buildReportData(homeId,period,lang,members,workingDays);
  var t=d.t;
  return loadExcelJS().then(function(ExcelJS){
    var wb=new ExcelJS.Workbook();
    wb.creator='GharSeva'; wb.created=new Date();

    var GREEN='FF1A6E5E', MINT='FFE5EDE6', LINE='FFC4D4C6', INK='FF1A2E2A';
    var MONEY='"₹"#,##0', DATEF='dd/mm/yyyy';

    function headerRow(ws,rowNo){
      var row=ws.getRow(rowNo);
      row.height=24;
      row.eachCell(function(cell){
        cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:GREEN}};
        cell.font={bold:true,color:{argb:'FFFFFFFF'},size:11,name:'Calibri'};
        cell.alignment={vertical:'middle',horizontal:'left'};
        cell.border={bottom:{style:'thin',color:{argb:GREEN}}};
      });
    }
    /* zebra striping + borders, so long lists stay readable */
    function dressBody(ws,firstRow){
      for(var r=firstRow;r<=ws.rowCount;r++){
        var row=ws.getRow(r);
        row.eachCell(function(cell){
          cell.border={bottom:{style:'hair',color:{argb:LINE}}};
          cell.alignment=Object.assign({vertical:'middle'},cell.alignment||{});
          if((r-firstRow)%2===1) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:MINT}};
        });
      }
    }
    function sheet(name,columns){
      var ws=wb.addWorksheet(name,{views:[{state:'frozen',ySplit:1}]});
      ws.columns=columns;
      headerRow(ws,1);
      return ws;
    }
    /* in-cell proportional bars. cfvo (the min/max bounds) is required —
       without it ExcelJS throws while writing the rule. */
    function dataBar(ws,ref,argb,priority){
      ws.addConditionalFormatting({ref:ref,rules:[{
        type:'dataBar',cfvo:[{type:'min'},{type:'max'}],color:{argb:argb},priority:priority
      }]});
    }

    /* ── Summary ── */
    var sum=wb.addWorksheet(t.exportSummaryTitle);
    sum.columns=[{width:28},{width:34}];
    sum.mergeCells('A1:B1');
    var title=sum.getCell('A1');
    title.value='GharSeva — '+d.home.name;
    title.font={bold:true,size:18,color:{argb:'FFFFFFFF'},name:'Calibri'};
    title.fill={type:'pattern',pattern:'solid',fgColor:{argb:GREEN}};
    title.alignment={vertical:'middle',horizontal:'center'};
    sum.getRow(1).height=38;
    [[t.annYear,d.label],[t.exportGeneratedOn,d.generatedOn],
     [t.exportStaffCount,d.staffCount],[t.annTotal,d.totalSpend]].forEach(function(pair,i){
      var r=sum.addRow(pair); r.height=22;
      r.getCell(1).font={bold:true,color:{argb:INK}};
      r.getCell(2).alignment={horizontal:'left'};
      if(i===3){ r.getCell(2).numFmt=MONEY; r.getCell(2).font={bold:true,size:13,color:{argb:GREEN}}; }
      r.eachCell(function(c){ c.border={bottom:{style:'hair',color:{argb:LINE}}}; });
    });

    /* ── Staff ── */
    var st=sheet(t.annPer,[
      {header:t.fname,key:'name',width:22},{header:t.frole,key:'role',width:16},
      {header:t.aTotSal,key:'salary',width:14,style:{numFmt:MONEY}},
      {header:t.aTotAdv,key:'advances',width:13,style:{numFmt:MONEY}},
      {header:t.aTotExp,key:'expenses',width:13,style:{numFmt:MONEY}},
      {header:t.aTotBon,key:'bonuses',width:13,style:{numFmt:MONEY}},
      {header:t.aTotExtra,key:'overtime',width:13,style:{numFmt:MONEY}},
      {header:t.aTotShort,key:'halfDays',width:13,style:{numFmt:MONEY}},
      {header:t.aTotLoan,key:'loanBal',width:14,style:{numFmt:MONEY}},
      {header:t.tPresent,key:'present',width:11},{header:t.tLeave,key:'leave',width:10},
      {header:t.tHoliday,key:'holiday',width:11}
    ]);
    d.staffRows.forEach(function(r){ st.addRow(r); });
    dressBody(st,2);
    if(d.staffRows.length){
      /* bars make each person's share of the salary bill obvious at a glance */
      dataBar(st,'C2:C'+st.rowCount,'FF3EA08A',1);
      dataBar(st,'I2:I'+st.rowCount,'FF5B4A9B',2);
    }

    /* ── Payments ── */
    var pay=sheet(t.exportSheetPayments,[
      {header:t.fdate,key:'date',width:14,style:{numFmt:DATEF}},
      {header:t.fname,key:'name',width:22},
      {header:t.famount,key:'amount',width:15,style:{numFmt:MONEY}},
      {header:t.paidBy,key:'paidBy',width:20}
    ]);
    d.payRows.forEach(function(r){ pay.addRow(r); });
    if(!d.payRows.length){ pay.addRow([t.exportNone]).getCell(1).font={italic:true,color:{argb:'FF7A998C'}}; }
    dressBody(pay,2);
    if(d.payRows.length) dataBar(pay,'C2:C'+pay.rowCount,'FF3EA08A',1);

    /* ── Entries ── */
    var TYPE_TINT={advance:'FFFDF3DC',loan:'FFEAE4F5',expense:'FFD8EEE8',bonus:'FFD8EEE2',
      loan_repay:'FFD8EEE2',extra_work:'FFD8EEE2',short_hours:'FFFDF3DC',extra_help:'FFEAE4F5'};
    var ent=sheet(t.exportSheetEntries,[
      {header:t.fdate,key:'date',width:14,style:{numFmt:DATEF}},
      {header:t.fname,key:'name',width:24},
      {header:t.tType,key:'type',width:17},
      {header:t.famount,key:'amount',width:15,style:{numFmt:MONEY}},
      {header:t.paidBy,key:'paidBy',width:18},
      {header:t.freason,key:'reason',width:40}
    ]);
    d.entryRows.forEach(function(r){
      var row=ent.addRow(r);
      /* tint the Type cell to match the colour the app uses for it */
      var tint=TYPE_TINT[r.typeKey];
      if(tint) row.getCell(3).fill={type:'pattern',pattern:'solid',fgColor:{argb:tint}};
    });
    if(!d.entryRows.length){ ent.addRow([t.exportNone]).getCell(1).font={italic:true,color:{argb:'FF7A998C'}}; }
    for(var er=2;er<=ent.rowCount;er++){
      ent.getRow(er).eachCell(function(cell,cn){
        cell.border={bottom:{style:'hair',color:{argb:LINE}}};
        if(cn===6) cell.alignment={wrapText:true,vertical:'middle'};
      });
    }

    /* ── Attendance ── */
    var att=sheet(t.profAttend,[
      {header:t.fname,key:'name',width:22},{header:t.exportMonthCol,key:'month',width:16},
      {header:t.tPresent,key:'present',width:12},{header:t.tLeave,key:'leave',width:11},
      {header:t.tHoliday,key:'holiday',width:12}
    ]);
    d.attRows.forEach(function(r){ att.addRow(r); });
    if(!d.attRows.length){ att.addRow([t.exportNone]).getCell(1).font={italic:true,color:{argb:'FF7A998C'}}; }
    dressBody(att,2);
    if(d.attRows.length){
      dataBar(att,'C2:C'+att.rowCount,'FF1C7A48',1);
      dataBar(att,'D2:D'+att.rowCount,'FFC0393B',2);
    }

    /* chart last, so a canvas failure can't cost us the whole workbook */
    try{
      if(d.chart.values.some(function(v){return v>0;})){
        var png=renderChartPNG(d.chart);
        var imgId=wb.addImage({base64:png.split(',')[1],extension:'png'});
        sum.addImage(imgId,{tl:{col:0,row:6},ext:{width:660,height:330}});
      }
    }catch(e){ console.warn('chart skipped:',e); }

    return wb.xlsx.writeBuffer();
  }).then(function(buf){
    downloadBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
      null,'GharSeva_'+d.label+'.xlsx');
  });
}

/* Plain-text fallback, used when the spreadsheet library can't be fetched

function exportCSV(homeId,period,lang,members,workingDays){

    out.push([[title]].concat(rows).map(function(r){return r.map(csvCell).join(',');}).join('\n'));
  }
  section(t.exportSummaryTitle,[
    [t.homeName,d.home.name],[t.annYear,d.label],[t.exportGeneratedOn,d.generatedOn],
    [t.exportStaffCount,d.staffCount],[t.annTotal,d.totalSpend]
  ]);
  section(t.annPer,[[t.fname,t.frole,t.aTotSal,t.aTotAdv,t.aTotExp,t.aTotBon,t.aTotExtra,t.aTotShort,
    t.aTotLoan,t.tPresent,t.tLeave,t.tHoliday]].concat(
    d.staffRows.map(function(r){return [r.name,r.role,r.salary,r.advances,r.expenses,r.bonuses,
      r.overtime,r.halfDays,r.loanBal,r.present,r.leave,r.holiday];})));
  section(t.exportSheetPayments,[[t.fdate,t.fname,t.famount,t.paidBy]].concat(
    d.payRows.length?d.payRows.map(function(r){return [fmtD(r.date?r.date.toISOString().slice(0,10):''),r.name,r.amount,r.paidBy];})
                    :[[t.exportNone]]));
  section(t.exportSheetEntries,[[t.fdate,t.fname,t.tType,t.famount,t.paidBy,t.freason]].concat(
    d.entryRows.length?d.entryRows.map(function(r){return [fmtD(r.date?r.date.toISOString().slice(0,10):''),r.name,r.type,r.amount,r.paidBy,r.reason];})
                      :[[t.exportNone]]));
  section(t.profAttend,[[t.fname,t.exportMonthCol,t.tPresent,t.tLeave,t.tHoliday]].concat(

/* ── FIRESTORE WRITE WRAPPERS ─────────────────────────────────
   Each wrapper writes to localStorage first (instant UI update),
   then syncs to Firestore. Guest mode (FIREBASE_ENABLED=false)
   just does the localStorage write — no Firestore calls.         */
function fbSaveStaff(homeId, newStaff){
  var old=getStaff(homeId);
  saveStaff(homeId,newStaff);
  if(!FIREBASE_ENABLED||!fbDb) return;
  var batch=fbDb.batch();
  newStaff.forEach(function(s){ batch.set(fbDb.doc('homes/'+homeId+'/staff/'+s.id),s); });
  var newIds=newStaff.map(function(s){return s.id;});
  old.forEach(function(s){ if(!newIds.includes(s.id)) batch.delete(fbDb.doc('homes/'+homeId+'/staff/'+s.id)); });
  batch.commit().catch(function(e){console.warn('fbSaveStaff:',e);});
}
function fbDeleteStaffCascade(homeId, staffId){

  if(!FIREBASE_ENABLED||!fbDb) return;
  fbDb.collection('homes/'+homeId+'/leaves').get().then(function(snap){
    var b=fbDb.batch();
    snap.docs.forEach(function(d){ if(d.id.startsWith(staffId+'_')) b.delete(d.ref); });
    return b.commit();
  }).catch(function(){});

/* Migration: move existing localStorage data into the cloud household */
/* Households on this device must stay separate in the cloud. The previous
   version looped over every local household and wrote all of them into the
   single target household, so unrelated staff ended up merged together —
   and because leaves are keyed by staff member rather than by household,
   they were dumped in the same way.

   Now the household that was open goes into the one just set up, and every
   other local household carrying data gets a cloud household of its own.
   Resolves to the list of households newly created, so the caller can add
   them to the switcher. */
function migrateFromLocalStorage(targetHomeId, user, lang){
  if(!FIREBASE_ENABLED||!fbDb) return Promise.resolve([]);
  function hasData(h){
    return lsGet(SK.staff(h.id),[]).length>0
        || lsGet(SK.ledger(h.id),[]).length>0
        || lsGet(SK.payments(h.id),[]).length>0;
  }
  /* an empty household is not worth recreating in the cloud */
  var source=lsGet(SK.homes,[]).filter(hasData);
  if(source.length===0) return Promise.resolve([]);

  var active=getSettings().lastHomeId;
  var primary=source.find(function(h){return h.id===active;})||source[0];

  function copyInto(localId, cloudId){
    var batch=fbDb.batch();
    var staff=lsGet(SK.staff(localId),[]);
    staff.forEach(function(s){ batch.set(fbDb.doc('homes/'+cloudId+'/staff/'+s.id),s); });
    lsGet(SK.ledger(localId),[]).forEach(function(e){ batch.set(fbDb.doc('homes/'+cloudId+'/ledger/'+e.id),e); });
    lsGet(SK.payments(localId),[]).forEach(function(p){ batch.set(fbDb.doc('homes/'+cloudId+'/payments/'+p.key),p); });
    /* leaves carry no household of their own, so route each by its owner */
    staff.forEach(function(s){
      lsKeys().filter(function(k){return k.indexOf('gs_lv_'+s.id+'_')===0;}).forEach(function(k){
        batch.set(fbDb.doc('homes/'+cloudId+'/leaves/'+k.slice(6)),{dates:lsGet(k,{})});
      });
    });
    return batch.commit();
  }

  var created=[];
  return copyInto(primary.id,targetHomeId)
    .then(function(){
      return source.filter(function(h){return h.id!==primary.id;})
        .reduce(function(chain,h){
          return chain.then(function(){
            return cloudCreateHome(user,h.name,lang).then(function(entry){
              created.push({id:entry.id,name:entry.name});
              return copyInto(h.id,entry.id);
            });
          });
        },Promise.resolve());
    })
    .then(function(){
      /* creating those moved currentHomeId onto the last one; put it back
         on the household the user actually signed in to */
      if(created.length&&user){
        return fbDb.collection('users').doc(user.uid)
          .set({currentHomeId:targetHomeId},{merge:true}).catch(function(){});
      }
    })
    .then(function(){ return created; })
    .catch(function(e){ console.warn('Migration error:',e); return created; });
}

/* The sample records seeded above are demo content, so they should follow the
   interface language. Older builds seeded them in Hindi regardless of the
   chosen language, which left English users looking at Hindi names.
   A field is rewritten only when it still exactly matches the other
   language's seeded value — the moment the user edits anything, it stops
   matching and is left alone. Local data only: a cloud household is shared,
   and one member's language must not rewrite what the others see. */
function localizeDemoData(lang){
  var want=buildDemoData(lang), other=buildDemoData(lang==='hi'?'en':'hi');
  function relocalize(list, otherList, wantList, fields){
    var changed=false;
    list.forEach(function(rec){
      var o=otherList.find(function(x){return x.id===rec.id;});
      var w=wantList.find(function(x){return x.id===rec.id;});
      if(!o||!w) return;                       /* not a seeded record */
      fields.forEach(function(f){
        if(o[f]!==undefined && rec[f]===o[f] && rec[f]!==w[f]){ rec[f]=w[f]; changed=true; }
      });
    });
    return changed;
  }
  var homes=getHomes(), staff=getStaff(SH1), ledger=getLedger(SH1);
  var hDone=relocalize(homes, other.homes, want.homes, ['name']);
  var sDone=relocalize(staff, other.staff, want.staff, ['name','nickname','notes']);
  var lDone=relocalize(ledger, other.ledger, want.ledger, ['reason']);
  if(hDone) saveHomes(homes);
  if(sDone) saveStaff(SH1,staff);
  if(lDone) saveLedger(SH1,ledger);
  return hDone||sDone||lDone;
}

/* ── CLOUD HOUSEHOLD CREATE / JOIN ─────────────────────────────
   The Firestore half only — resolving to the new {id,name,workingDays}.
   Saving to localStorage and switching the active household is left to
   the caller, because first-time setup replaces the whole list while
   adding a second household from Settings appends to it.

   homeIds uses arrayUnion in both: a plain array with {merge:true} would
   overwrite, so creating a second household would drop the first. */
function cloudCreateHome(user, name, lang){
  var homeId='hm_'+uid();
  var inviteCode=Math.random().toString(36).slice(2,8).toUpperCase();
  var myName=displayNameOf(user);
  var homeDoc={name:name.trim(),ownerId:user.uid,memberIds:[user.uid],
    members:{[user.uid]:{name:myName,color:memberColor(user.uid)}},
    inviteCode:inviteCode,workingDays:26,roles:[],lang:lang};
  return fbDb.collection('homes').doc(homeId).set(homeDoc)
    .then(function(){
      /* Publish the code to its own lookup document. Joiners read this
         instead of searching /homes, which they have no permission to do
         until they are already a member. */
      return fbDb.collection('invites').doc(inviteCode).set({homeId:homeId});
    })
    .then(function(){
      return fbDb.collection('users').doc(user.uid).set(
        {displayName:myName,
         homeIds:firebase.firestore.FieldValue.arrayUnion(homeId),
         currentHomeId:homeId},{merge:true});
    })
    .then(function(){ return {id:homeId,name:homeDoc.name,workingDays:26}; });
}

/* Joining cannot search /homes: the rules only permit reading a household
   you already belong to, which is the very thing you are trying to become.
   So resolve the code through /invites/{CODE} — a single known document that
   reveals nothing but a household id — then append yourself. Reading the
   household itself is deferred until after that, when it is permitted. */
function cloudJoinHome(user, code){
  var CODE=(code||'').toUpperCase(), homeId='';
  return fbDb.collection('invites').doc(CODE).get()
    .then(function(inv){
      if(!inv.exists||!inv.data().homeId) throw new Error('__notfound');
      homeId=inv.data().homeId;
      /* arrayUnion so we never have to read memberIds first */
      var patch={memberIds:firebase.firestore.FieldValue.arrayUnion(user.uid)};
      patch['members.'+user.uid]={name:displayNameOf(user),color:memberColor(user.uid)};
      return fbDb.collection('homes').doc(homeId).update(patch);
    })
    .then(function(){
      return fbDb.collection('homes').doc(homeId).get();   /* now a member */
    })
    .then(function(doc){
      var hd=(doc.exists&&doc.data())||{};
      return fbDb.collection('users').doc(user.uid).set(
        {displayName:displayNameOf(user),
         homeIds:firebase.firestore.FieldValue.arrayUnion(homeId),
         currentHomeId:homeId},{merge:true}).then(function(){ return hd; });
    })
    .then(function(hd){ return {id:homeId,name:hd.name||'',workingDays:hd.workingDays||26}; });
}

/* ── UTILS ──────────────────────────────────────────────────── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function fmt(n){return '₹'+Number(n||0).toLocaleString('en-IN');}
function fmtD(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function todayStr(){return new Date().toISOString().slice(0,10);}
function padYM(y,m){return y+'-'+String(m).padStart(2,'0');}
function maskAadhaar(n){if(!n)return '—';var c=n.replace(/\D/g,'');return c.length>=4?'****-****-'+c.slice(-4):'****';}
function maskAccount(n){if(!n)return '—';return n.length<=4?n:'*'.repeat(Math.max(0,n.length-4))+n.slice(-4);}
function roleLabel(key,lang){var r=getRoles().find(function(r){return r.key===key;});return r?(lang==='hi'?r.hi:r.en):key;}

function getLoanBal(staffId,ledger){
  return (ledger||[])
    .filter(function(e){return e.staffId===staffId&&e.type==='loan'&&e.status==='active';})
    .reduce(function(s,e){
      return s+Math.max(0,e.amount-(e.paidInstallments||0)*(e.installment||0)-(e.manualRepaid||0));
    },0);
}

function calcSalary(staff,year,month,ledger,workingDays){
  var ym=padYM(year,month);
  var lv=getLeaves(staff.id,ym);
  var leaveDays=0;
  Object.entries(lv).forEach(function(e){
    if(e[1]==='leave') leaveDays++;
  });
  var daily=staff.salary/(workingDays||30);
  var leaveDeduction=Math.round(daily*leaveDays);
  var items=(ledger||[]).filter(function(e){return e.staffId===staff.id && e.date && e.date.startsWith(ym);});
  var advances  =items.filter(function(e){return e.type==='advance';   }).reduce(function(s,e){return s+(e.amount||0);},0);
  var expenses  =items.filter(function(e){return e.type==='expense';   }).reduce(function(s,e){return s+(e.amount||0);},0);
  var bonuses   =items.filter(function(e){return e.type==='bonus';     }).reduce(function(s,e){return s+(e.amount||0);},0);
  var extraWork =items.filter(function(e){return e.type==='extra_work';}).reduce(function(s,e){return s+(e.amount||0);},0);
  var shortHours=items.filter(function(e){return e.type==='short_hours';}).reduce(function(s,e){return s+(e.amount||0);},0);
  var loanInst=(ledger||[]).filter(function(e){return e.staffId===staff.id&&e.type==='loan'&&e.status==='active';})
               .reduce(function(s,e){return s+(e.installment||0);},0);
  var loanBal=getLoanBal(staff.id,ledger);
  var net=staff.salary-leaveDeduction-advances-expenses-loanInst+bonuses+extraWork-shortHours;
  return {baseSalary:staff.salary,leaveDays:leaveDays,leaveDeduction:leaveDeduction,
          advances:advances,expenses:expenses,loanInst:loanInst,bonuses:bonuses,
          extraWork:extraWork,shortHours:shortHours,loanBal:loanBal,netPayable:Math.max(0,net)};
}

/* The message goes to the staff member, so its language is about THEM — not

function waTemplate(type,staff,amount,date,homeName,lang,waLang){

    short_hours:n+' के कम घंटों की '+amt+' कटौती '+d+' को दर्ज हुई।',
    extra_help: (n?n+' की ':'')+'अतिरिक्त मदद का '+amt+' '+d+' को दर्ज हुआ।'
  };
  var en={
    advance:    'Advance of '+amt+' given to '+n+' on '+d+'.',
    loan:       'Loan of '+amt+' given to '+n+' on '+d+'.',
    leave:      'Leave recorded for '+n+' on '+d+'.',
    bonus:      'Bonus of '+amt+' given to '+n+' on '+d+'. 🎉',
    expense:    'Expense of '+amt+' recorded for '+n+' on '+d+'.',
    salary:     'Salary of '+amt+' paid to '+n+' on '+d+'. ✅',
    loan_repay: 'Loan repayment of '+amt+' received from '+n+' on '+d+'.',
    extra_work: 'Extra work pay of '+amt+' recorded for '+n+' on '+d+'.',
    short_hours:'Short hours deduction of '+amt+' recorded for '+n+' on '+d+'.',
    extra_help: 'Extra help of '+amt+(n?' by '+n:'')+' recorded on '+d+'.'
  };
  if(!hi[type]&&!en[type]) return '';
  var mode=waLang||getSettings().waLang||'both';

  if(mode!=='en') lines.push('नमस्ते! 🙏\n'+hi[type]);
  if(mode!=='hi') lines.push((mode==='en'?'Hello! 🙏\n':'')+en[type]);
  var sign=mode==='hi'?'— घरसेवा':mode==='en'?'— GharSeva':'— घरसेवा · GharSeva';
  return lines.join('\n\n')+'\n\n'+sign+(h?' · '+h:'');
}

function parseVoice(transcript,staffList){
  var t=transcript.toLowerCase();
  var foundStaff=null;
  for(var i=0;i<staffList.length;i++){
    var s=staffList[i];
    var terms=[];
    (s.name||'').split(' ').forEach(function(p){if(p.length>1) terms.push(p.toLowerCase());});
    if(s.nickname){s.nickname.split(' ').forEach(function(p){if(p.length>0) terms.push(p.toLowerCase());});}
    if(terms.some(function(p){return t.includes(p);})){foundStaff=s;break;}
  }

  var WORD_NUMS=[
    ['panch sau',500],['paanch sau',500],['पाँच सौ',500],['पांच सौ',500],
    ['ek hazaar',1000],['ek hazar',1000],['एक हज़ार',1000],['एक हजार',1000],
    ['do hazaar',2000],['दो हज़ार',2000],
    ['teen hazaar',3000],['तीन हज़ार',3000],
    ['char hazaar',4000],['चार हज़ार',4000],
    ['paanch hazaar',5000],['panch hazaar',5000],['पाँच हज़ार',5000],
    ['das hazaar',10000],['dus hazaar',10000],['दस हज़ार',10000],
    ['bees hazaar',20000],['बीस हज़ार',20000],
  ];
  var amount=null;
  for(var w=0;w<WORD_NUMS.length;w++){
    if(t.includes(WORD_NUMS[w][0])){amount=WORD_NUMS[w][1];break;}
  }
  if(amount===null){var amtM=t.match(/(\d+)/);if(amtM)amount=parseInt(amtM[1]);}

  var action=null;
  if(/took leave|was absent|absent|chutti|छुट्टी|nahi aayi|nahi aaya|chhutti|गैरहाज़िर|अनुपस्थित|नहीं आई|नहीं आया/.test(t)) action='leave';
  else if(/half.?day|half day|adha din|aadha din|आधा दिन|अधा दिन/.test(t)) action='short_hours';
  else if(/overtime|over.?time|extra.*(hours?|kaam|work)|ओवरटाइम|अतिरिक्त/.test(t)) action='extra_work';
  else if(/advance|peshgi|agrim|अग्रिम|पेशगी|एडवांस/.test(t)) action='advance';
  else if(/\bloan\b|udhar diya|udhaar|कर्ज़|उधार|लोन/.test(t)) action='loan';
  else if(/bonus|inaam|बोनस|इनाम/.test(t)) action='bonus';
  else if(/expense|kharcha|खर्च|खर्चा/.test(t)) action='expense';

  var hours=null;
  var hoursM=t.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|घंटे?)/);
  if(hoursM) hours=parseFloat(hoursM[1]);

  return {foundStaff:foundStaff,action:action,amount:amount,hours:hours,transcript:transcript};
}

/* ── MIC BUTTON ─────────────────────────────────────────────── */
function MicButton({lang,onResult,style}){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var [listening,setListening]=useState(false);
  var recRef=useRef(null);
  var t=T[lang];
  if(!SR) return null;
  function toggle(){
    if(listening){
      recRef.current&&recRef.current.stop();
      setListening(false);
    } else {
      var rec=new SR();
      rec.lang=lang==='hi'?'hi-IN':'en-IN';
      rec.interimResults=false;
      rec.onresult=function(e){
        var tr=e.results[0][0].transcript;
        setListening(false);
        onResult(tr);
      };
      rec.onerror=function(){setListening(false);};
      rec.onend=function(){setListening(false);};
      rec.start(); recRef.current=rec; setListening(true);
    }
  }
  return (
    <button onClick={toggle} title={t.micSpeak}
      style={Object.assign({},{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:12,border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:fsr(13),
        background:listening?'var(--danger)':'var(--accent)',color:'#fff',transition:'all .15s',whiteSpace:'nowrap'},style||{})}>
      <span style={{fontSize:fsr(17),lineHeight:1}}>{listening?'■':'🎤'}</span>
      <span>{listening?t.micStop:t.micSpeak}</span>
      {listening&&<span style={{fontSize:fsr(11),opacity:.85}}>{t.micListening}</span>}
    </button>
  );
}

/* Shared by every "who paid this" picker (entries, salary payments): a
   household member, or "Someone else" with a free-text name suggested from
   names already used in this household, so the same person doesn't end up
   spelled three different ways across records. */
function PaidBySelector({t,mc,memberIds,value,nameValue,onChange,onNameChange,suggestions,idSuffix}){
  var listId='ext-payer-names-'+(idSuffix||'x');
  /* Native <datalist> barely works on the phones this app targets — iOS
     Safari doesn't show it at all, mobile Chrome shows at most one inline
     hint above the keyboard. Tappable pills are the real suggestion UI;
     the datalist stays too, harmless for anyone typing on a desktop. */
  var filtered=useMemo(function(){
    var q=(nameValue||'').trim().toLowerCase();
    var list=suggestions||[];
    return q?list.filter(function(n){return n.toLowerCase().indexOf(q)>-1;}):list;
  },[suggestions,nameValue]);
  return (
    <div>
      <FLabel label={t.paidBy} hint={t.paidByHint}>
        <FSelect value={value} onChange={onChange}>
          {memberIds.map(function(id){
            return <option key={id} value={id}>{mc.members[id].name}{id===mc.uid?' ('+t.paidByYou+')':''}</option>;
          })}
          <option value="other">{t.paidBySomeoneElse}</option>
        </FSelect>
      </FLabel>
      {value==='other' && (
        <FLabel label={t.paidByNameLabel} hint={t.paidByNameHint} req={true}>
          <input list={listId} value={nameValue||''} onChange={function(e){onNameChange(e.target.value);}}
            placeholder={t.paidByNamePh} className="inp" maxLength={60} />
          <datalist id={listId}>
            {(suggestions||[]).map(function(n){return <option key={n} value={n} />;})}
          </datalist>
          {filtered.length>0 && (
            <div className="flex flex-wrap gap-2" style={{marginTop:8}}>
              {filtered.map(function(n){
                return (
                  <button key={n} type="button" onClick={function(){onNameChange(n);}}
                    className="pill pill-muted"
                    style={{border:'1px solid var(--border)',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
                    {n}
                  </button>
                );
              })}
            </div>
          )}
        </FLabel>
      )}
    </div>
  );
}

function Toast({msg,onDone}){
  useEffect(function(){var t=setTimeout(onDone,2500);return function(){clearTimeout(t);};},[]);
  return <div className="fixed z-50 bottom-24 left-1/2 -translate-x-1/2 rounded-2xl px-5 py-3 text-sm font-bold shadow-xl fade-in whitespace-nowrap" style={{background:'var(--ink)',color:'#fff'}}>{msg}</div>;
}

function WACard({message,phone,t}){
  var [copied,setCopied]=useState(false);
  function doCopy(){
    try{
      navigator.clipboard.writeText(message).then(function(){setCopied(true);setTimeout(function(){setCopied(false);},2000);});
    }catch(e){
      var ta=document.createElement('textarea');
      ta.value=message; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); setCopied(true); setTimeout(function(){setCopied(false);},2000);
    }
  }
  function doWA(){
    /* phone is stored normalized to a bare 10-digit number where possible
       (see normalizePhone), but older records or a foreign number may still
       be longer — don't blindly prepend 91 on top of an existing code. */
    var digits=(phone||'').replace(/\D/g,'');
    var ph=digits.length===10?'91'+digits:digits.length>10?digits:'';
    window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(message),'_blank');
  }
  return (
    <div className="mt-4 rounded-2xl p-3" style={{border:'2px solid #A8D4C4',background:'#D5EEE8'}}>
      <p style={{fontSize:fsr(12),fontWeight:700,color:'#1A6E5E',marginBottom:8}}>{t.waTitle}</p>
      <pre style={{fontSize:fsr(12),color:'var(--ink)',whiteSpace:'pre-wrap',fontFamily:'inherit',marginBottom:12,lineHeight:1.6}}>{message}</pre>
      <div className="flex gap-2">
        <button onClick={doCopy} className="flex-1 rounded-xl font-bold text-sm" style={{padding:'10px',border:'2px solid #1A6E5E',color:'#1A6E5E',background:'#fff',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
          {copied?'✓ '+t.waCopied:t.waCopy}
        </button>
        <button onClick={doWA} className="flex-1 rounded-xl text-sm font-bold" style={{padding:'10px',background:'#1A6E5E',color:'#fff',border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
          {t.waOpen}
        </button>
      </div>
    </div>
  );
}

              <button key={opt.v} onClick={function(){setStatus(opt.v);}}
                style={{padding:'14px 8px',borderRadius:12,fontWeight:800,fontSize:fsr(15),fontFamily:'Nunito,sans-serif',cursor:'pointer',
                  border:active?'2px solid '+opt.color:'2px solid var(--border)',
                  background:active?opt.bg:'var(--surface2)',color:active?opt.color:'var(--ink2)',
                  display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                <span style={{fontSize:fsr(24)}}>{opt.icon}</span>
                <span>{opt.label}</span>
              </button>
            );
          })}
        </div>
      </div>
      <PrimaryBtn onClick={handleSave} full={true}>{t.save}</PrimaryBtn>
    </Modal>
  );
}

/* ── SALARY PAY MODAL ───────────────────────────────────────── */
function SalaryPayModal({staff,lang,homeId,homes,workingDays,onClose,onPaid}){
  var t=T[lang];
  var now=new Date();
  var month=now.getMonth()+1;
  var year=now.getFullYear();
  var [ledger,setLedger]=useState(function(){return getLedger(homeId);});
  var [payments,setPayments]=useState(function(){return getPayments(homeId);});
  var [done,setDone]=useState(false);
  var [waMsg,setWAMsg]=useState('');
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showPaidBy=!mc.guestMode&&memberIds.length>0;
  var [payer,setPayer]=useState(mc.uid||'');
  var [payerName,setPayerName]=useState('');
  var payerSuggestions=useMemo(function(){ return showPaidBy?getExternalPayerNames(homeId):[]; },[showPaidBy,homeId]);
  var [payerErr,setPayerErr]=useState('');
  var payKey=staff.id+'_'+year+'_'+month;
  var paidRec=payments.find(function(p){return p.key===payKey;});
  var calc=calcSalary(staff,year,month,ledger,workingDays);
  var rows=[{label:t.rBase,val:calc.baseSalary,color:'var(--ink)'}];
  if(calc.leaveDays>0) rows.push({label:t.rLeave+' ('+calc.leaveDays+' '+t.tDays+')',val:-calc.leaveDeduction,color:'var(--danger)'});
  if(calc.advances>0) rows.push({label:t.rAdv,val:-calc.advances,color:'var(--warn)'});
  if(calc.expenses>0) rows.push({label:t.rExp,val:-calc.expenses,color:'var(--warn)'});
  if(calc.loanInst>0) rows.push({label:t.rLoan,val:-calc.loanInst,color:'var(--purple)'});
  if(calc.bonuses>0) rows.push({label:t.rBonus,val:calc.bonuses,color:'var(--ok)'});
  if(calc.extraWork>0) rows.push({label:t.rExtraWork,val:calc.extraWork,color:'var(--ok)'});
  if(calc.shortHours>0) rows.push({label:t.rShortHours,val:-calc.shortHours,color:'var(--warn)'});
  function doConfirm(){
    if(paidRec||done) return;
    if(showPaidBy&&payer==='other'&&!payerName.trim()){setPayerErr(t.errPayerName);return;}
    setPayerErr('');
    var pDate=todayStr();
    var home=homes.find(function(h){return h.id===homeId;})||{name:''};
    var rec={key:payKey,staffId:staff.id,year:year,month:month,amount:calc.netPayable,date:pDate};
    if(showPaidBy&&payer){
      rec.paidBy=payer;
      if(payer==='other'&&payerName.trim()) rec.paidByName=payerName.trim();
    }
    var newPays=payments.concat([rec]);
    var newLed=ledger.map(function(e){
      if(e.staffId===staff.id&&e.type==='loan'&&e.status==='active'){
        var p=(e.paidInstallments||0)+1;
        return Object.assign({},e,{paidInstallments:p,status:p>=(e.totalInstallments||Infinity)?'closed':'active'});
      }
      return e;
    });
    fbSavePayments(homeId,newPays); fbSaveLedger(homeId,newLed);
    setDone(true);
    setWAMsg(waTemplate('salary',staff,calc.netPayable,pDate,home.name,lang));
    onPaid&&onPaid();
  }
  return (
    <Modal onClose={onClose} title={t.profPaySalary}>
      <div className="flex items-center gap-3 mb-4 p-3 rounded-2xl" style={{background:'var(--surface2)'}}>
        <div className="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-lg shrink-0" style={{background:avatarBg(staff.role)}}>{(staff.name[0]||'?').toUpperCase()}</div>
        <div>
          <p style={{fontWeight:800,fontSize:fsr(17),color:'var(--ink)',margin:0}}>{staff.name}</p>
          <p style={{fontSize:fsr(13),color:'var(--ink2)',margin:0}}>{t.mFull[month-1]} {year}</p>
        </div>
      </div>
      <div className="rounded-2xl overflow-hidden mb-4" style={{border:'1px solid var(--border)'}}>
        {rows.map(function(row,i){
          return (
            <div key={i} className="flex items-center justify-between px-4 py-3" style={{borderBottom:'1px solid var(--border)',background:i%2===0?'var(--surface)':'var(--surface2)'}}>
              <span style={{fontSize:fsr(15),color:'var(--ink2)'}}>{row.label}</span>
              <span style={{fontSize:fsr(15),fontWeight:700,color:row.color}}>{row.val>0?'+':''}{fmt(Math.abs(row.val))}</span>
            </div>
          );
        })}
        <div className="flex items-center justify-between px-4 py-4" style={{background:'var(--accent)'}}>
          <span style={{color:'#fff',fontWeight:700,fontSize:fsr(18)}}>{t.rNet}</span>
          <span style={{color:'#fff',fontWeight:800,fontSize:fsr(24)}}>{fmt(calc.netPayable)}</span>
        </div>
      </div>
      {!(done||paidRec)&&showPaidBy&&(
        <div>
          {payerErr&&<p style={{fontSize:fsr(13),color:'var(--danger)',fontWeight:700,marginBottom:8}}>{payerErr}</p>}
          <PaidBySelector t={t} mc={mc} memberIds={memberIds} idSuffix="salarypay"
            value={payer} nameValue={payerName} suggestions={payerSuggestions}
            onChange={setPayer} onNameChange={setPayerName} />
        </div>
      )}
      {(done||paidRec)
        ? <div className="text-center">
            <p style={{color:'var(--ok)',fontSize:fsr(18),fontWeight:800,padding:'8px 0'}}>✅ {t.paidOk}</p>
            {paidRec&&paidRec.paidBy&&(
              <p style={{fontSize:fsr(13),color:'var(--ink2)',marginBottom:8}}>
                {t.paidBy}: <b>{payerLabel(paidRec,mc.members,t)}</b>
              </p>
            )}
            {waMsg&&<WACard message={waMsg} phone={staff.phone} t={t} />}
          </div>
        : <PrimaryBtn onClick={doConfirm} color="green" full={true}>{t.profConfirmPay}</PrimaryBtn>
      }
    </Modal>
  );
}

/* ── STAFF PROFILE PAGE ─────────────────────────────────────── */
function StaffProfile({staff,lang,homeId,homes,workingDays,onBack,onStaffChange}){
  var t=T[lang];

  var month=now.getMonth()+1;
  var year=now.getFullYear();
  var ym=padYM(year,month);

  var leaveMap=getLeaves(staff.id,ym);
  var leaveCount=0,holidayCount=0;
  Object.values(leaveMap).forEach(function(v){if(v==='leave')leaveCount++;else if(v==='holiday')holidayCount++;});
  var thisMonthAdv=ledger.filter(function(e){return e.staffId===staff.id&&e.date&&e.date.startsWith(ym)&&e.type==='advance';});

  var payKey=staff.id+'_'+year+'_'+month;

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      {toast&&<Toast msg={toast} onDone={function(){setToast('');}} />}

        <button onClick={onBack}
          style={{background:'var(--surface2)',border:'none',cursor:'pointer',borderRadius:10,padding:'8px 14px',fontWeight:800,fontSize:fsr(14),color:'var(--ink)',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'}}>
          ← {t.profBack}
        </button>
        <p style={{flex:1,fontWeight:800,fontSize:fsr(17),color:'var(--ink)',margin:0}} className="truncate">{staff.name}</p>
      </div>
      <div className="scroll-area flex-1 p-4" style={{display:'flex',flexDirection:'column',gap:16}}>

        {/* ① Personal Info */}
        <div className="card fade-in">
          <div className="flex items-center gap-4 mb-4">
            {staff.photo
              ? <img src={staff.photo} className="rounded-full object-cover shrink-0" style={{width:64,height:64,border:'2px solid var(--border)'}} />
              : <div className="rounded-full flex items-center justify-center text-white font-bold shrink-0" style={{width:64,height:64,background:avatarBg(staff.role),fontSize:fsr(22)}}>{initials}</div>
            }
            <div>
              <p style={{fontSize:fsr(22),fontWeight:800,color:'var(--ink)',margin:0}}>{staff.name}</p>
              {staff.nickname&&<p style={{fontSize:fsr(13),color:'var(--muted)',margin:'2px 0 0'}}>{staff.nickname}</p>}
              <span className="pill pill-muted" style={{marginTop:6,display:'inline-block'}}>{roleLabel(staff.role,lang)}</span>
            </div>

                <p style={{fontSize:fsr(14),color:'var(--ink)',fontWeight:700,margin:0}}>{fmtD(staff.joiningDate)}</p>

/* ── DASHBOARD TAB ──────────────────────────────────────────── */
function DashboardTab({lang,homeId,homes,workingDays,onNavigate,syncKey}){
  var t=T[lang];
  var [staff,setStaff]=useState(function(){return getStaff(homeId);});
  var [ledger,setLedger]=useState(function(){return getLedger(homeId);});
  var [payments,setPayments]=useState(function(){return getPayments(homeId);});

  useEffect(function(){
    setStaff(getStaff(homeId));
    setLedger(getLedger(homeId));
    setPayments(getPayments(homeId));
  },[homeId,syncKey]);

  var now=new Date();
  var today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var curYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var curYear=now.getFullYear(),curMonth=now.getMonth()+1,todayDate=now.getDate();

  /* attendance */
  var presentCount=0,absentCount=0,holidayCount=0;
  staff.forEach(function(s){
    var st=getLeaves(s.id,curYM)[today];
    if(st==='leave') absentCount++;
    else if(st==='holiday') holidayCount++;
    else presentCount++;
  });

  /* upcoming pay days sorted by closeness */
  var payList=staff.map(function(s){
    var pd=Number(s.payDay)||1;
    var daysUntil=pd>=todayDate?pd-todayDate:(30-todayDate+pd);
    var isPaid=payments.some(function(p){return p.staffId===s.id&&Number(p.year)===curYear&&Number(p.month)===curMonth;});
    return {s:s,daysUntil:daysUntil,isPaid:isPaid,pd:pd};
  }).sort(function(a,b){return a.daysUntil-b.daysUntil;});

  /* recent ledger entries */
  var recent=[...ledger].sort(function(a,b){return b.date>a.date?1:-1;}).slice(0,3);

  /* monthly spend */
  var totalSal=staff.reduce(function(s,x){return s+(x.salary||0);},0);
  var paidAmt=payments.filter(function(p){return Number(p.year)===curYear&&Number(p.month)===curMonth;}).reduce(function(s,p){return s+(p.amount||0);},0);
  var paidPct=totalSal>0?Math.min(100,Math.round(paidAmt/totalSal*100)):0;

  var dayLabel=t.days[now.getDay()]+', '+now.getDate()+' '+t.mFull[now.getMonth()];

  return (
    <div className="flex-1 scroll-area p-4">
      <p style={{fontSize:fsr(12),fontWeight:800,color:'var(--muted)',marginBottom:14,textTransform:'uppercase',letterSpacing:'0.07em'}}>
        {t.dash} · {dayLabel}
      </p>

      {/* Attendance */}
      {staff.length===0

      <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:8}}>{t.dashPay}</p>

        {payList.length===0
          ? <p className="p-4 text-center" style={{color:'var(--muted)',fontSize:fsr(13)}}>{t.dashNoStaff}</p>
          : payList.map(function(item,i){
              var dueTxt=item.daysUntil===0?t.dashToday:item.daysUntil===1?t.dashTomorrow:item.pd+' '+t.tDays;
              return (
                <div key={item.s.id} className="flex items-center gap-3 px-4 py-3"
                  style={{borderBottom:i<payList.length-1?'1px solid var(--border)':'none'}}>

                    style={{width:36,height:36,background:avatarBg(item.s.role),fontSize:fsr(13)}}>
                    {(item.s.name[0]||'?').toUpperCase()}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p style={{fontSize:fsr(14),fontWeight:800,color:'var(--ink)',margin:0}} className="truncate">{item.s.name}</p>
                    <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}}>{dueTxt}</p>

                  {item.isPaid

      {/* Recent Entries */}
      <p style={{fontSize:fsr(13),fontWeight:800,color:'var(--ink2)',marginBottom:8}}>{t.dashRecent}</p>
      <div className="rounded-2xl mb-4 overflow-hidden" style={{background:'var(--surface)',border:'1px solid var(--border)',boxShadow:'0 1px 4px rgba(26,46,42,.06)'}}>
        {recent.length===0
          ? <p className="p-4 text-center" style={{color:'var(--muted)',fontSize:fsr(13)}}>{t.dashNoRecent}</p>
          : recent.map(function(e,i){
              var s=staff.find(function(x){return x.id===e.staffId;})||{name:'?'};
              var tc=TC[e.type]||{icon:'•',bg:'var(--surface2)'};
              return (
                <div key={e.id} className="flex items-center gap-3 px-4 py-3"

                    <p style={{fontSize:fsr(11),color:'var(--muted)',margin:0}}>{e.reason||''} · {fmtD(e.date)}</p>

                  <p style={{fontSize:fsr(14),fontWeight:800,color:'var(--ink)',margin:0,flexShrink:0}}>{fmt(e.amount)}</p>

      {/* Monthly Spend */}

          <div style={{height:'100%',width:paidPct+'%',background:'var(--ok)',borderRadius:6,transition:'width .5s ease'}} />

        <div className="flex justify-between items-center mt-2">
          <span style={{fontSize:fsr(11),color:'var(--muted)'}}>{t.dashOf} {fmt(totalSal)}</span>
          <span style={{fontSize:fsr(11),fontWeight:800,color:paidPct===100?'var(--ok)':'var(--muted)'}}>{paidPct}%</span>
        </div>

    </div>
  );

/* ── STAFF TAB ──────────────────────────────────────────────── */
function StaffTab({lang,homeId,homes,workingDays,onStaffChange,syncKey}){
  var t=T[lang];
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [payments,setPayments]=useState([]);
  var [showAdd,setShowAdd]=useState(false);
  var [editing,setEditing]=useState(null);
  var [selectedStaff,setSelectedStaff]=useState(null);
  var now=new Date();
  var curYear=now.getFullYear(), curMonth=now.getMonth()+1;

  useEffect(function(){
    setStaff(getStaff(homeId));setLedger(getLedger(homeId));
    setPayments(getPayments(homeId));
    setShowAdd(false);setEditing(null);setSelectedStaff(null);
  },[homeId,syncKey]);

  function save(s){
    var idx=staff.findIndex(function(x){return x.id===s.id;});
    var next=idx>=0?staff.map(function(x,i){return i===idx?s:x;}):[...staff,s];
    setStaff(next); fbSaveStaff(homeId,next);
    setShowAdd(false); setEditing(null);
    onStaffChange && onStaffChange();
  }
  function del(id){
    var next=staff.filter(function(x){return x.id!==id;});
    setStaff(next); fbSaveStaff(homeId,next);
    lsKeys().filter(function(k){return k.startsWith('gs_lv_'+id+'_');}).forEach(lsDel);
    fbDeleteStaffCascade(homeId,id);
    var nextLedger=getLedger(homeId).filter(function(e){return e.staffId!==id;});
    fbSaveLedger(homeId,nextLedger);
    /* salary payment history for this staff member, so no trace of them
       lingers in Annual Summary totals after deletion */
    var nextPayments=getPayments(homeId).filter(function(p){return p.staffId!==id;});
    fbSavePayments(homeId,nextPayments);
    setSelectedStaff(null);
    onStaffChange && onStaffChange();
  }

  if(selectedStaff){
    return <StaffProfile
      staff={selectedStaff} lang={lang} homeId={homeId} homes={homes||[]} workingDays={workingDays||30}
      onBack={function(){setSelectedStaff(null);setStaff(getStaff(homeId));setLedger(getLedger(homeId));}}
      onStaffChange={function(){
        setStaff(getStaff(homeId));setLedger(getLedger(homeId));
        onStaffChange&&onStaffChange();
      }}
    />;
  }

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <div className="p-4 shrink-0" style={{background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
        <PrimaryBtn onClick={function(){setShowAdd(true);}} full={true} tut="add-staff">{t.addStaff}</PrimaryBtn>
      </div>
      <div className="p-4 scroll-area flex-1">
        {staff.length===0
          ? <p className="text-center mt-16 text-base whitespace-pre-line" style={{color:'var(--muted)'}}>{t.noStaff}</p>
          : staff.map(function(s){
              var isPaid=payments.some(function(p){return p.staffId===s.id&&Number(p.year)===curYear&&Number(p.month)===curMonth;});
              return (
                <StaffCard key={s.id} staff={s} lang={lang}
                  loanBal={getLoanBal(s.id,ledger)}
                  isPaid={isPaid}
                  onView={function(){setSelectedStaff(s);}}
                  onEdit={function(){setEditing(s);}}
                  onDelete={function(){del(s.id);}} />
              );
            })
        }
      </div>
      {showAdd && <StaffModal lang={lang} onClose={function(){setShowAdd(false);}} onSave={save} />}
      {editing && <StaffModal lang={lang} onClose={function(){setEditing(null);}} onSave={save} existing={editing} />}
    </div>
  );
}

/* ── SALARY TAB ─────────────────────────────────────────────── */
function SalaryTab({lang,homeId,homes,refreshKey,workingDays,defaultStaffId,syncKey}){
  var t=T[lang];
  var now=new Date();
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  var showPaidBy=!mc.guestMode&&memberIds.length>0;
  var [payer,setPayer]=useState(mc.uid||'');
  var [payerName,setPayerName]=useState('');
  var [payerErr,setPayerErr]=useState('');
  var payerSuggestions=useMemo(function(){ return showPaidBy?getExternalPayerNames(homeId):[]; },[showPaidBy,homeId]);
  var [staff,setStaff]=useState([]);
  var [ledger,setLedger]=useState([]);
  var [payments,setPayments]=useState([]);
  var [selStaff,setSelStaff]=useState(defaultStaffId||'');
  var [selMonth,setSelMonth]=useState(now.getMonth()+1);
  var [selYear,setSelYear]=useState(now.getFullYear());
  var [calc,setCalc]=useState(null);
  var [waMsg,setWAMsg]=useState('');
  var [toast,setToast]=useState('');

  useEffect(function(){
    var s=getStaff(homeId);
    setStaff(s); setLedger(getLedger(homeId)); setPayments(getPayments(homeId));
    setSelStaff(defaultStaffId||''); setCalc(null); setWAMsg('');
  },[homeId,refreshKey,syncKey]);

  function doCalc(){
    var s=staff.find(function(x){return x.id===selStaff;});
    if(!s) return;
    setCalc(calcSalary(s,selYear,selMonth,ledger,workingDays));
    setWAMsg('');
  }

  function doMarkPaid(){
    var s=staff.find(function(x){return x.id===selStaff;});
    if(!s||!calc) return;
    if(showPaidBy&&payer==='other'&&!payerName.trim()){setPayerErr(t.errPayerName);return;}
    setPayerErr('');
    var key=selStaff+'_'+selYear+'_'+selMonth;
    if(payments.find(function(p){return p.key===key;})) return;
    var pDate=todayStr();
    var home=homes.find(function(h){return h.id===homeId;})||{name:''};
    var rec={key:key,staffId:selStaff,year:selYear,month:selMonth,amount:calc.netPayable,date:pDate};
    if(showPaidBy&&payer){
      rec.paidBy=payer;
      if(payer==='other'&&payerName.trim()) rec.paidByName=payerName.trim();
    }
    var newPays=[...payments,rec];
    var newLed=ledger.map(function(e){
      if(e.staffId===selStaff&&e.type==='loan'&&e.status==='active'){
        var paid=(e.paidInstallments||0)+1;
        return Object.assign({},e,{paidInstallments:paid,status:paid>=(e.totalInstallments||Infinity)?'closed':'active'});
      }
      return e;
    });
    fbSavePayments(homeId,newPays); setPayments(newPays);
    fbSaveLedger(homeId,newLed); setLedger(newLed);
    setToast(t.paidOk);
    setWAMsg(waTemplate('salary',s,calc.netPayable,pDate,home.name,lang));
  }

  var s=staff.find(function(x){return x.id===selStaff;});
  var payKey=selStaff+'_'+selYear+'_'+selMonth;
  var paidRec=payments.find(function(p){return p.key===payKey;});
  var years=[now.getFullYear()-1,now.getFullYear()];

  return (
    <div className="p-4 scroll-area flex-1">
      {toast && <Toast msg={toast} onDone={function(){setToast('');}} />}

      <div className="rounded-2xl p-4 mb-4" style={{background:'var(--surface2)'}}>
        <FLabel label={t.selStaff} req={true}>
          <FSelect tut="salary-staff" value={selStaff} onChange={function(v){setSelStaff(v);setCalc(null);setWAMsg('');}}>
            <option value="">{t.selStaff}</option>
            {staff.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
          </FSelect>
        </FLabel>
        <div className="flex gap-3">
          <FLabel label={t.selMonth}>
            <FSelect value={selMonth} onChange={function(v){setSelMonth(Number(v));}}>
              {t.mFull.map(function(m,i){return <option key={i} value={i+1}>{m}</option>;})}
            </FSelect>
          </FLabel>
          <FLabel label={t.selYear}>
            <FSelect value={selYear} onChange={function(v){setSelYear(Number(v));}}>
              {years.map(function(y){return <option key={y} value={y}>{y}</option>;})}
            </FSelect>
          </FLabel>
        </div>
        <PrimaryBtn onClick={doCalc} full={true} disabled={!selStaff} tut="salary-calc">{t.calcBtn}</PrimaryBtn>
      </div>

      {!calc && <p className="text-center text-base mt-8" style={{color:'var(--muted)'}}>{t.noCalc}</p>}

      {calc && s && (
        <div className="fade-in">
          <div className="flex items-center gap-3 mb-3">
            <div className="w-11 h-11 rounded-full flex items-center justify-center text-white font-bold text-lg" style={{background:avatarBg(s.role)}}>
              {(s.name[0]||'?').toUpperCase()}
            </div>
            <div>
              <p style={{fontWeight:800,color:'var(--ink)',fontSize:fsr(18),margin:0}}>{s.name}</p>
              <p style={{fontSize:fsr(12),color:'var(--muted)',margin:0}}>{t.mFull[selMonth-1]} {selYear}</p>
            </div>
          </div>

          <div className="rounded-2xl overflow-hidden mb-4" style={{border:'1px solid var(--border)'}}>
            {[
              {label:t.rBase, val:calc.baseSalary, sign:0},
              {label:t.rLeave+' ('+calc.leaveDays+' '+t.tDays+')', val:calc.leaveDeduction, sign:-1},
              {label:t.rAdv, val:calc.advances, sign:-1},
              {label:t.rLoan, val:calc.loanInst, sign:-1},
              {label:t.rExp, val:calc.expenses, sign:-1},
              {label:t.rBonus, val:calc.bonuses, sign:1},
              {label:t.rExtraWork, val:calc.extraWork, sign:1},
              {label:t.rShortHours, val:calc.shortHours, sign:-1},
            ].map(function(row){
              var color=row.sign===-1&&row.val>0?'var(--danger)':row.sign===1&&row.val>0?'var(--ok)':'var(--ink)';
              return (
                <div key={row.label} className="flex justify-between items-center py-3 px-4" style={{borderBottom:'1px solid var(--border)',background:'var(--surface)'}}>
                  <span style={{fontSize:fsr(15),color:'var(--ink2)'}}>{row.label}</span>
                  <span style={{fontSize:fsr(15),fontWeight:700,color:color}}>
                    {row.sign===-1&&row.val>0?'− ':row.sign===1&&row.val>0?'+ ':''}{fmt(row.val)}
                  </span>
                </div>
              );
            })}
            <div className="flex justify-between items-center py-4 px-4" style={{background:'var(--accent)'}}>
              <span style={{color:'#fff',fontWeight:700,fontSize:fsr(18)}}>{t.rNet}</span>
              <span style={{color:'#fff',fontWeight:800,fontSize:fsr(24)}}>{fmt(calc.netPayable)}</span>
            </div>
          </div>

          {calc.loanBal>0 && (
            <div className="flex justify-between items-center px-4 py-2 mb-3 rounded-2xl" style={{background:'#EAE4F5',border:'1px solid var(--purple)'}}>
              <span style={{fontSize:fsr(13),fontWeight:700,color:'var(--purple)'}}>🏦 {t.rLoanBal}</span>
              <span style={{fontSize:fsr(15),fontWeight:800,color:'var(--purple)'}}>{fmt(calc.loanBal)}</span>
            </div>
          )}
          <p style={{fontSize:fsr(12),color:'var(--muted)',textAlign:'center',marginBottom:16}}>{t.wdays} {workingDays}</p>

          {paidRec
            ? <div className="rounded-2xl p-4 text-center" style={{background:'#D5EEE8',border:'1px solid #A8D4C4'}}>
                <p style={{color:'var(--ok)',fontWeight:700,fontSize:fsr(15)}}>✅ {t.paidOn} {fmtD(paidRec.date)}</p>
                <p style={{color:'var(--ok)',fontSize:fsr(13),marginTop:4}}>{fmt(paidRec.amount)}</p>
                {showPaidBy&&paidRec.paidBy&&(
                  <p style={{fontSize:fsr(13),color:'var(--ink2)',marginTop:6}}>
                    {t.paidBy}: <b>{payerLabel(paidRec,mc.members,t)}</b>
                  </p>
                )}
              </div>
            : <div>
                {showPaidBy&&(
                  <div>
                    {payerErr&&<p style={{fontSize:fsr(13),color:'var(--danger)',fontWeight:700,marginBottom:8}}>{payerErr}</p>}
                    <PaidBySelector t={t} mc={mc} memberIds={memberIds} idSuffix="salarytab"
                      value={payer} nameValue={payerName} suggestions={payerSuggestions}
                      onChange={setPayer} onNameChange={setPayerName} />
                  </div>
                )}
                <PrimaryBtn onClick={doMarkPaid} color="green" full={true}>{t.markPaid}</PrimaryBtn>
              </div>
          }

          {waMsg && <WACard message={waMsg} phone={s.phone} t={t} />}
        </div>
      )}
    </div>
  );
}

/* ── LEAVE CALENDAR ─────────────────────────────────────────── */
function LeaveCalendar({staffId,staffSalary,lang,year,month,workingDays,homeId,syncKey}){
  var t=T[lang];
  var ym=padYM(year,month);
  var [lv,setLv]=useState({});
  var [flash,setFlash]=useState('');
  var today=new Date();

  useEffect(function(){setLv(getLeaves(staffId,ym));},[staffId,ym,syncKey]);

  function toggle(day){
    var date=new Date(year,month-1,day);
    if(date>today) return;
    var key=ym+'-'+String(day).padStart(2,'0');
    var cur=lv[key];
    var next=cur==='leave'?'holiday':cur==='holiday'?null:'leave';
    var updated=Object.assign({},lv);
    if(next) updated[key]=next; else delete updated[key];
    setLv(updated); fbSaveLeaves(homeId||_activeHomeId,staffId,ym,updated);
  }

  function markToday(status){
    var isCurrentMonth=year===today.getFullYear()&&month===today.getMonth()+1;
    if(!isCurrentMonth) return;
    var key=ym+'-'+String(today.getDate()).padStart(2,'0');
    var updated=Object.assign({},lv);
    if(status===null) delete updated[key]; else updated[key]=status;
    setLv(updated); fbSaveLeaves(homeId||_activeHomeId,staffId,ym,updated);
    setFlash(status||'present');
    setTimeout(function(){setFlash('');},1200);
  }

  var isCurrentMonth=year===today.getFullYear()&&month===today.getMonth()+1;

  var firstDay=new Date(year,month-1,1).getDay();
  var daysInMonth=new Date(year,month,0).getDate();
  var leaveDays=Object.values(lv).filter(function(v){return v==='leave';}).length;
  var deduction=Math.round((staffSalary/(workingDays||30))*leaveDays);

  var cells=[];
  for(var i=0;i<firstDay;i++) cells.push(null);
  for(var d=1;d<=daysInMonth;d++) cells.push(d);

  function dayStatus(day){
    if(!day) return null;
    var k=ym+'-'+String(day).padStart(2,'0');
    return lv[k]||'present';
  }

  function dayCls(st){
    if(st==='leave')   return {background:'#FCE8E8',color:'var(--danger)',fontWeight:700};
    if(st==='holiday') return {background:'#F5EBC0',color:'var(--warn)',fontWeight:700};
    return {background:'var(--surface2)',color:'var(--ink2)'};
  }
  function dayLbl(st){
    if(st==='leave')   return t.Ls;
    if(st==='holiday') return t.Hs;
    return t.Ps;
  }

  return (
    <div>
      {isCurrentMonth && (
        <div className="mb-4" data-tut="mark-today">
          <p style={{fontSize:fsr(11),fontWeight:800,color:'var(--muted)',textAlign:'center',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.06em'}}>{t.markToday}</p>
          <div className="flex gap-2">
            {[
              {status:null,   icon:'✓', label:t.tPresent, cls:'pill-ok',   bg:'#CCEADC', c:'#1A5E35'},
              {status:'leave',    icon:'🗓', label:t.tLeave,   bg:'#FCE8E8', c:'var(--danger)'},
              {status:'holiday',  icon:'🏖', label:t.tHoliday, bg:'#F5EBC0', c:'var(--warn)'},
            ].map(function(item){
              var active=flash===( item.status||'present');
              return (
                <button key={item.label} onClick={function(){markToday(item.status);}}
                  style={{flex:1,padding:'10px 4px',borderRadius:14,border:'2px solid '+(active?item.c:'transparent'),
                    background:active?item.bg:item.bg+'99',color:item.c,fontWeight:800,
                    fontSize:fsr(13),cursor:'pointer',fontFamily:'Nunito,sans-serif',
                    display:'flex',flexDirection:'column',alignItems:'center',gap:2,
                    transition:'all .15s',minHeight:60}}>
                  <span style={{fontSize:fsr(18),lineHeight:1}}>{active?'✓':item.icon}</span>
                  <span style={{fontSize:fsr(11)}}>{active?t.markTodayDone:item.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
      <p style={{fontSize:fsr(12),color:'var(--muted)',textAlign:'center',marginBottom:12}}>{t.calHint}</p>
      <div className="grid grid-cols-7 mb-1">
        {t.days.map(function(d,i){return <div key={i} style={{textAlign:'center',fontSize:fsr(11),fontWeight:700,paddingTop:4,paddingBottom:4,color:i===0?'var(--danger)':'var(--ink2)'}}>{d}</div>;})}
      </div>
      <div className="grid grid-cols-7 gap-0.5">
        {cells.map(function(day,idx){
          if(!day) return <div key={'e'+idx} />;
          var st=dayStatus(day);
          var td=new Date(year,month-1,day);
          var isToday=td.toDateString()===today.toDateString();
          var isFuture=td>today&&!isToday;
          var stStyle=dayCls(st);
          return (
            <button key={day} onClick={function(){toggle(day);}} disabled={!!isFuture}
              className="cal-btn flex flex-col items-center justify-center rounded-lg text-xs transition-all"
              style={Object.assign({},stStyle,{outline:'none',border:isToday?'2px solid var(--accent)':'none',cursor:isFuture?'default':'pointer',opacity:isFuture?0.5:1})}>
              <span style={{fontSize:fsr(13),fontWeight:600,lineHeight:1}}>{day}</span>
              <span style={{fontSize:fsr(11),lineHeight:1,marginTop:2,opacity:.8}}>{dayLbl(st)}</span>
            </button>
          );
        })}
      </div>
      <div className="mt-4 flex gap-3">
        <div className="flex-1 rounded-2xl p-3 text-center" style={{background:'#FCE8E8',border:'1px solid #F5C6C6'}}>
          <p style={{fontSize:fsr(12),fontWeight:600,color:'var(--danger)'}}>{t.tlLeave}</p>
          <p style={{fontSize:fsr(28),fontWeight:800,color:'var(--danger)'}}>{leaveDays}</p>
        </div>
        <div className="flex-1 rounded-2xl p-3 text-center" style={{background:'var(--surface2)',border:'1px solid var(--border)'}}>
          <p style={{fontSize:fsr(12),fontWeight:600,color:'var(--ink2)'}}>{t.tlDed}</p>
          <p style={{fontSize:fsr(22),fontWeight:800,color:'var(--ink)'}}>{fmt(deduction)}</p>
        </div>
      </div>
      <div className="mt-3 flex flex-wrap gap-2 justify-center">
        {[[{background:'var(--surface2)',color:'var(--ink2)'},t.Ps,t.tPresent],[{background:'#FCE8E8',color:'var(--danger)'},t.Ls,t.tLeave],[{background:'#F5EBC0',color:'var(--warn)'},t.Hs,t.tHoliday]].map(function(item){
          return <span key={item[2]} className="rounded-lg px-2 py-1 text-xs font-bold" style={item[0]}>{item[1]} = {item[2]}</span>;
        })}
      </div>
    </div>
  );
}

function LeavesTab({lang,homeId,workingDays,syncKey}){
  var t=T[lang];
  var now=new Date();
  var [staff,setStaff]=useState([]);
  var [selStaff,setSelStaff]=useState('');
  var [month,setMonth]=useState(now.getMonth()+1);
  var [year,setYear]=useState(now.getFullYear());

  useEffect(function(){
    var s=getStaff(homeId);
    setStaff(s); setSelStaff(s.length>0?s[0].id:'');
  },[homeId,syncKey]);

  function prevM(){if(month===1){setMonth(12);setYear(function(y){return y-1;});}else setMonth(function(m){return m-1;});}
  function nextM(){
    var nm=month===12?1:month+1, ny=month===12?year+1:year;
    if(ny>now.getFullYear()||(ny===now.getFullYear()&&nm>now.getMonth()+1)) return;
    setMonth(nm); if(month===12)setYear(function(y){return y+1;});
  }

  var s=staff.find(function(x){return x.id===selStaff;});

  return (
    <div className="p-4 scroll-area flex-1">
      <FLabel label={t.selStaff}>
        <FSelect value={selStaff} onChange={setSelStaff}>
          {staff.map(function(s){return <option key={s.id} value={s.id}>{s.name}</option>;})}
        </FSelect>
      </FLabel>

      {s ? (
        <div className="fade-in">
          <div className="flex items-center justify-between mb-4 rounded-2xl p-3" style={{background:'var(--surface2)'}}>
            <button onClick={prevM} className="w-10 h-10 rounded-full flex items-center justify-center text-xl" style={{background:'var(--surface)',border:'1px solid var(--border)',cursor:'pointer'}}>‹</button>
            <span style={{fontWeight:800,color:'var(--ink)',fontSize:fsr(15)}}>{t.mFull[month-1]} {year}</span>
            <button onClick={nextM} className="w-10 h-10 rounded-full flex items-center justify-center text-xl" style={{background:'var(--surface)',border:'1px solid var(--border)',cursor:'pointer'}}>›</button>
          </div>
          <LeaveCalendar staffId={s.id} staffSalary={s.salary} lang={lang} year={year} month={month} workingDays={workingDays} homeId={homeId} syncKey={syncKey} />
        </div>
      ) : <p className="text-center mt-16" style={{color:'var(--muted)'}}>{t.noStaff}</p>}
    </div>
  );
}

/* ── ADD ENTRY MODAL ────────────────────────────────────────── */
function EntryModal({lang,staffList,onClose,onSave,onDelete,ledger,workingDays,prefillStaffId,prefillType,existing}){
  var t=T[lang];
  var mc=React.useContext(MembersCtx);
  var memberIds=Object.keys(mc.members||{});
  /* only for money actually leaving someone's hand, and only once signed in */
  var CASH_OUT=['advance','loan','expense','bonus','extra_work','extra_help'];
  var blank={staffId:prefillStaffId||'',type:prefillType||'advance',amount:'',date:todayStr(),reason:'',installment:'',totalInstallments:'',targetLoanId:'',hours:'',rate:'',paidBy:mc.uid||'',paidByName:'',helperName:''};
  var [form,setForm]=useState(existing?{
    staffId:existing.staffId||'',type:existing.type,amount:String(existing.amount||''),
    date:existing.date||todayStr(),reason:existing.reason||'',
    installment:String(existing.installment||''),totalInstallments:String(existing.totalInstallments||''),
    targetLoanId:existing.targetLoanId||'',hours:String(existing.hours||''),rate:String(existing.rate||''),
    paidBy:existing.paidBy||'',paidByName:existing.paidByName||'',helperName:existing.helperName||''
  }:blank);
  function set(k,v){setForm(function(f){return Object.assign({},f,{[k]:v});});}
  /* Once a loan has been repaid against — by instalment or by hand — its
     amount and instalment lock, so the principal can't be edited below what
     has already come back and leave the balance impossible to reconcile.
     Date and reason stay editable. */
  var loanLocked=!!(existing&&existing.type==='loan'
    &&((existing.paidInstallments||0)>0||(existing.manualRepaid||0)>0));
  var showPaidBy=!mc.guestMode&&memberIds.length>0&&CASH_OUT.indexOf(form.type)>-1;
  var payerSuggestions=useMemo(function(){ return showPaidBy?getExternalPayerNames(_activeHomeId):[]; },[showPaidBy]);

  var isTimeBased=form.type==='extra_work';
  var isHalfDay=form.type==='short_hours';
  var selStaff=staffList.find(function(x){return x.id===form.staffId;});
  var dailyRate=selStaff?Math.round(selStaff.salary/(workingDays||30)):0;
  var defaultRate=selStaff?Math.round(dailyRate/8):0;
  var halfDayAmt=selStaff?Math.round(dailyRate/2):0;
  var effectiveRate=Number(form.rate)||defaultRate;
  var computedAmount=isTimeBased&&form.hours?Math.round(Number(form.hours)*effectiveRate):0;

  /* Skip on the first pass when editing, otherwise opening a saved overtime
     or half-day entry would immediately overwrite its rate/amount with the
     defaults and quietly discard what was actually recorded. */
  var autoFillReady=useRef(!existing);
  useEffect(function(){
    if(!autoFillReady.current){ autoFillReady.current=true; return; }
    if(isTimeBased&&form.staffId&&defaultRate) set('rate',String(defaultRate));
    if(isHalfDay&&form.staffId&&halfDayAmt) set('amount',String(halfDayAmt));
  },[form.staffId,form.type]);

  var activeLoans=(ledger||[]).filter(function(e){return e.staffId===form.staffId&&e.type==='loan'&&e.status==='active';});

  var [errMsg,setErrMsg]=useState('');
  var [confirmEntry,setConfirmEntry]=useState(null);
  var [confirmDelete,setConfirmDelete]=useState(false);

  function buildEntry(){
    var finalAmount=isTimeBased?computedAmount:Number(form.amount);
    var entry={id:existing?existing.id:uid(),staffId:form.staffId,type:form.type,amount:finalAmount,date:form.date,reason:form.reason};
    if(form.type==='loan'){
      entry.installment=Number(form.installment)||0;
      entry.totalInstallments=Number(form.totalInstallments)||0;
      /* editing a loan must not wipe how much has already been repaid */
      var wasLoan=existing&&existing.type==='loan';
